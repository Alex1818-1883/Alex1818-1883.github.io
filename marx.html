<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>马列箴言 - 青年共产主义小组</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", "Helvetica Neue", sans-serif;
            background-color: #F9F9F9;
            color: #A80000;
            line-height: 1.6;
            font-size: 18px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        /* 顶部导航栏 */
        header {
            position: absolute; top: 0; width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .logo {
            font-size: 26px; font-weight: 900; color: #CC0000; text-decoration: none; letter-spacing: 1px; display: flex; align-items: center;
            transform: scale(1) translateZ(0);
            will-change: transform;
            backface-visibility: hidden;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: left center;
        }
        .logo .star {
            display: inline-block;
            margin-right: 8px;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.3s ease;
        }
        .logo:hover { transform: scale(1.1) translateZ(0); }
        .logo:hover .star { transform: scale(1.3) rotate(36deg) translateZ(0); color: #FFD700; }
        .nav-links { display: flex; gap: 15px; }
        .nav-links a {
            color: #CC0000;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 8px 22px;
            border: 2px solid #CC0000;
            border-radius: 30px;
            transform: scale(1) translateZ(0);
            will-change: transform;
            backface-visibility: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .nav-links a:hover {
            color: #FFFFFF;
            background-color: #CC0000;
            transform: scale(1.1) translateY(-3px) translateZ(0);
        }
        .nav-links a:active { transform: scale(0.95) translateZ(0); }

        /* Hero */
        .hero {
            height: 45vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center;
            background-color: #FFFFFF;
            border-bottom: 3px solid #CC0000;
        }
        .hero h1 {
            font-size: 3rem;
            font-weight: 900;
            color: #DD0000;
            letter-spacing: 4px;
        }
        .hero p {
            font-size: 1.3rem;
            font-weight: bold;
            color: #A80000;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        /* 📖 箴言标题专属链接样式 */
        .book-link {
            color: #DD0000;
            text-decoration: none;
            display: inline-block;
            transform: scale(1) translateZ(0);
            will-change: transform;
            backface-visibility: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .book-link:hover {
            color: #FF1A1A;
            text-shadow: none;
transform: scale(1.05) translateZ(0);

        }

        /* 🚀 悬浮五角星：整体装甲 */
        .book-star {
            position: absolute;
            top: -65px;
            left: 50%;
            margin-left: -27.5px;
            width: 55px;
            height: 55px;
            opacity: 0;
            transform: scale(0.2) translateY(20px) translateZ(0);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            will-change: transform, opacity;
            backface-visibility: hidden;
        }
        .book-link:hover .book-star {
            opacity: 1;
            transform: scale(1) translateY(0) translateZ(0);
        }
        .book-star svg {
            width: 100%;
            height: 100%;
            animation: infinite-spin 6s linear infinite;
            will-change: transform;
            backface-visibility: hidden;
        }
        @keyframes infinite-spin {
            from { transform: rotate(0deg) translateZ(0); }
            to { transform: rotate(360deg) translateZ(0); }
        }

        /* 主体容器 */
        .content-container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
        }

        /* === 单条大字箴言舞台 === */
        .quote-stage {
            height: 440px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow: hidden;
        }
.quote-display {
            max-width: 900px;
            width: 100%;
            text-align: center;
            opacity: 0;
            
            /* 🚀 核心排雷 1：抛弃 translate3d 这种强制 3D 指令，回归纯正的 2D 下沉！ */
            transform: translateY(30px);
            
            transition: opacity 0.4s ease, transform 0.4s ease;
            contain: layout paint;
            
            /* 🚀 核心排雷 2：彻底删掉 will-change、backface-visibility 和 -webkit-font-smoothing！
               不再向显卡申请任何特殊图层！ */
        }
        
        .quote-display.visible {
            opacity: 1;
            /* 🚀 终极杀招：动画到位停稳的瞬间，立刻执行 none！
               把排版权 100% 交还给 CPU，彻底粉碎边缘的磨砂感！ */
            transform: none;
        }
     .quote-text {
    font-size: 52px;
    font-weight: 900;
    color: #CC0000;
    line-height: 1.6;
    letter-spacing: 2px;
    margin-bottom: 40px;
    display: inline-block;
    text-align: left;
    max-width: 100%;
}
.quote-text.medium { font-size: 42px; }
.quote-text.long { font-size: 34px; }
.quote-text.super-long { font-size: 28px; }



        /* 🚩 出处与红色虚线样式 */
        .quote-meta {
            text-align: right;
            padding-top: 20px;
            padding-bottom: 15px;
            margin-left: auto;
            margin-right: 40px;
        }
        .quote-source {
            display: inline-block;
            vertical-align: middle;
        }
.source-link {
    font-weight: bold;
    color: #A80000;
    font-size: 20px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    padding: 10px 20px 10px 20px;
    border-radius: 50px;
    cursor: pointer;

    transition:
        background-color 0.3s ease,
        color 0.3s ease;
}

.source-link:hover {
    color: #FFFFFF;
    background-color: #CC0000;
}

.source-link:active {
    color: #FFFFFF;
    background-color: #CC0000;
}
        .quote-dash {
            display: inline-block;
            width: 60px;
            border-top: 2px dashed #CC0000;
            vertical-align: middle;
            margin-right: 12px;
        }

   @media (max-width: 900px) {
    .quote-text { font-size: 36px; }
    .quote-text.medium { font-size: 32px; }
    .quote-text.long { font-size: 28px; }
    .quote-text.super-long { font-size: 24px; }
    .quote-stage { height: 420px; }
    .quote-meta { margin-right: 20px; }
}
     @media (max-width: 600px) {
    .quote-text { font-size: 28px; letter-spacing: 1px; }
    .quote-text.medium { font-size: 24px; }
    .quote-text.long { font-size: 22px; }
    .quote-text.super-long { font-size: 20px; }
}

        /* 底部控制按钮 */
        .quote-controls {
            text-align: center;
            margin-top: 50px;
            margin-bottom: 60px;
        }
        .btn-arrow {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background-color: #FFFFFF;
            color: #CC0000;
            border: 2px solid #CC0000;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            font-size: 48px;
            font-weight: bold;
            cursor: pointer;
            transform: scale(1) translateZ(0);
            will-change: transform;
            backface-visibility: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: none;
            padding: 0;
            line-height: 0;
            padding-bottom: 8px;
            padding-left: 4px;
        }
        .btn-arrow:hover {
            background-color: #CC0000;
            color: #FFFFFF;
            transform: scale(1.15) translateY(-3px) translateZ(0);
            box-shadow: none;
        }
        .btn-arrow:active {
            transform: scale(0.95) translateZ(0);
        }

        /* 页脚 */
        footer {
            background-color: #CC0000;
            text-align: center;
            padding: 40px 20px;
            color: white;
        }
        footer h3 {
            font-size: 26px;
            color: #FFFFFF;
            letter-spacing: 4px;
        }

/* === 交互元素禁止选中：电脑端 + 手机端 === */
.logo,
.logo *,
.nav-links a,
.book-link,
.book-link *,
.book-star,
.book-star *,
.source-link,
.source-link *,
.btn-arrow,
.btn-arrow *,
footer h3 {
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;

    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;

    -webkit-user-drag: none;
}

/* 防止拖选时出现蓝底高亮 */
.logo::selection,
.logo *::selection,
.nav-links a::selection,
.book-link::selection,
.book-link *::selection,
.book-star::selection,
.book-star *::selection,
.source-link::selection,
.source-link *::selection,
.btn-arrow::selection,
.btn-arrow *::selection,
footer h3::selection {
    background: transparent;
}


@media (max-width: 768px) {
    header {
        padding: 15px 20px;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
    }

    .logo {
        font-size: 22px;
    }

    .nav-links {
        display: flex;
        justify-content: center;
        gap: 0;
    }

    .nav-links a {
        margin-left: 0;
        margin: 0 8px;

        font-size: 16px;
        padding: 7px 18px;
    }

    .hero h1 {
        font-size: 2rem;
    }

    footer h3 {
        font-size: 20px;
    }


    /* === 手机端：下一条按钮取消 hover 残留，点击后自动回白底红箭头 === */
    .btn-arrow:hover {
        background-color: #FFFFFF;
        color: #CC0000;
        border-color: #CC0000;
        transform: scale(1) translateZ(0);
    }

    .btn-arrow:focus,
    .btn-arrow:focus-visible {
        outline: none;
        box-shadow: none;
    }

    .btn-arrow:focus:not(:active):not(.is-tapping),
    .btn-arrow:focus-visible:not(:active):not(.is-tapping) {
        background-color: #FFFFFF;
        color: #CC0000;
        border-color: #CC0000;
        transform: scale(1) translateZ(0);
    }

    .btn-arrow:active,
    .btn-arrow.is-tapping {
        background-color: #CC0000;
        color: #FFFFFF;
        border-color: #CC0000;
        transform: scale(0.95) translateZ(0);
    }
}
    </style>
</head>
<body>
    <header>
        <a href="classics.html" class="logo"><span class="star">★</span> 马列毛主义万岁！</a>
        <div class="nav-links">
            <a href="quotes.html">毛主席语录</a>
        </div>
    </header>

    <section class="hero">
        <h1>
            <a href="classics.html" class="book-link">
                <div class="book-star">
                    <svg viewBox="-50 -50 100 100">
                        <polygon points="0,-47 11,-14.5 45,-14.5 17.8,6 28.5,38.5 0,18.5 -28.5,38.5 -17.8,6 -45,-14.5 -11,-14.5" fill="#CC0000" stroke="#CC0000" stroke-width="3" stroke-linejoin="round"/>
                    </svg>
                </div>
                马恩列箴言
            </a>
        </h1>
        <p>批判的武器 · 武器的批判</p>
    </section>

    <div class="content-container">
        <div class="quote-stage">
            <div class="quote-display" id="quoteDisplay">
      
                <div class="quote-text" id="quoteText"></div>
                <div class="quote-meta">
                    <span class="quote-dash"></span><span class="quote-source" id="quoteSource"></span>
                </div>
            </div>
        </div>

        <div class="quote-controls">
            <button class="btn-arrow" id="moreBtn" onclick="nextQuote()">›</button>
        </div>
    </div>

    <footer>
        <h3>全世界无产者，联合起来！</h3>
    </footer>

    <script>
       // ======== 马列箴言数据库（扩充版） ========
        const QUOTES = [
            // ========== 马克思 ==========
            {
                author: "马克思",
                text: "哲学家们只是用不同的方式解释世界，问题在于改变世界。",
                source: "《关于费尔巴哈的提纲》",
                link: "books/《关于费尔巴哈的提纲》.html"
            },
            {
                author: "马克思",
                text: "社会生活在本质上是实践的。凡是把理论导致神秘主义的神秘东西，都能在人的实践中以及对这个实践的理解中得到合理的解决。",
                source: "《关于费尔巴哈的提纲》",
               link: "books/《关于费尔巴哈的提纲》.html"
            },
            {
                author: "马克思",
                text: "人的思维是否具有客观的真理性，这不是一个理论的问题，而是一个实践的问题。人应该在实践中证明自己思维的真理性。",
                source: "《关于费尔巴哈的提纲》",
                link: "books/《关于费尔巴哈的提纲》.html"
            },
            {
                author: "马克思",
                text: "人的本质不是单个人所固有的抽象物，在其现实性上，它是一切社会关系的总和。",
                source: "《关于费尔巴哈的提纲》",
               link: "books/《关于费尔巴哈的提纲》.html"
            },
            {
                author: "马克思",
                text: "一切划时代的体系的真正的内容都是由于产生这些体系的那个时期的需要而形成起来的。",
                source: "《德意志意识形态》",
                link: "books/《对各式各样先知所代表的德国社会主义的批判》.html"
            },
            {
                author: "马克思",
                text: "手工磨产生的是封建主为首的社会，蒸汽磨产生的是工业资本家为首的社会。",
                source: "《哲学的贫困》",
                link: "books/《哲学的贫困》.pdf"
            },
            {
                author: "马克思",
                text: "人们在自己生活的社会生产中发生一定的、必然的、不以他们的意志为转移的关系，即同他们的物质生产力的一定发展阶段相适合的生产关系。",
                source: "《〈政治经济学批判〉序言》",
                link: "books/《政治经济学批判序言》.html"
            },
            {
                author: "马克思",
                text: "物质生活的生产方式制约着整个社会生活、政治生活和精神生活的过程。不是人们的意识决定人们的存在，相反，是人们的社会存在决定人们的意识。",
                source: "《〈政治经济学批判〉序言》",
        link: "books/《政治经济学批判序言》.html"
            },
            {
                author: "马克思",
                text: "社会的物质生产力发展到一定阶段，便同它们一直在其中运动的现存生产关系或财产关系（这只是生产关系的法律用语）发生矛盾。于是这些关系便由生产力的发展形式变成生产力的桎梏。那时社会革命的时代就到来了。",
                source: "《〈政治经济学批判〉序言》",
            link: "books/《政治经济学批判序言》.html"
            },
            {
                author: "马克思",
                text: "无论哪一个社会形态，在它所能容纳的全部生产力发挥出来以前，是决不会灭亡的；而新的更高的生产关系，在它的物质存在条件在旧社会的胎胞里成熟以前，是决不会出现的。",
                source: "《〈政治经济学批判〉序言》",
          link: "books/《政治经济学批判序言》.html"
            },
            {
                author: "马克思",
                text: "随着经济基础的变更，全部庞大的上层建筑也或慢或快地发生变革。",
                source: "《〈政治经济学批判〉序言》",
        link: "books/《政治经济学批判序言》.html"
            },
            {
                author: "马克思",
                text: "资本来到世间，从头到脚，每个毛孔都滴着血和肮脏的东西。",
                source: "《资本论》第一卷",
                link: "books/《资本论第一卷》.pdf"
            },
            {
                author: "马克思",
                text: "在资本主义体系内部，一切提高社会劳动生产力的方法都是靠牺牲工人个人来实现的，一切发展生产的手段都变成统治和剥削生产者的手段，都使工人畸形发展，成为局部的人，把工人贬低为机器的附属品，使工人受劳动的折磨。",
                source: "《资本论》第一卷",
             link: "books/《资本论第一卷》.pdf"
            },
            {
                author: "马克思",
                text: "自由王国只是在由必需和外在目的规定要做的劳动终止的地方才开始；因而按照事物的本性来说，它存在于真正物质生产领域的彼岸。",
                source: "《资本论》第三卷",
                   link: "books/《资本论第三卷》.pdf"
            },
            {
                author: "马克思",
                text: "无产者在这个革命中失去的只是锁链，他们获得的将是整个世界。",
                source: "《共产党宣言》",
                link: "books/《共产党宣言》.html"
            },
            {
                author: "马克思",
                text: "一切等级的和固定的东西都烟消云散了，一切神圣的东西都被亵渎了。人们终于不得不用冷静的眼光来看他们的生活地位、他们的相互关系。",
                source: "《共产党宣言》",
                     link: "books/《共产党宣言》.html"
            },
            {
                author: "马克思",
                text: "至今一切社会的历史都是阶级斗争的历史。",
                source: "《共产党宣言》",
                   link: "books/《共产党宣言》.html"
            },
            {
                author: "马克思",
                text: "代替那存在着阶级和阶级对立的资产阶级旧社会的，将是这样一个联合体，在那里，每个人的自由发展是一切人的自由发展的条件。",
                source: "《共产党宣言》",
                     link: "books/《共产党宣言》.html"
            },
            {
                author: "马克思",
                text: "共产党人可以把自己的理论概括为一句话：消灭私有制。",
                source: "《共产党宣言》",
                     link: "books/《共产党宣言》.html"
            },
            {
                author: "马克思",
                text: "各尽所能，按需分配。",
                source: "《哥达纲领批判》",
                link: "Article ge da pipan.html"
            },
            {
                author: "马克思",
                text: "在资本主义社会和共产主义社会之间，有一个从前者变为后者的革命转变时期。同这个时期相适应的也有一个政治上的过渡时期，这个时期的国家只能是无产阶级的革命专政。",
                source: "《哥达纲领批判》",
                link: "Article ge da pipan.html"
            },
            {
                author: "马克思",
                text: "人们自己创造自己的历史，但是他们并不是随心所欲地创造，并不是在他们自己选定的条件下创造，而是在直接碰到的、既定的、从过去承继下来的条件下创造。",
                source: "《路易·波拿巴的雾月十八日》",
                link: "books/《路易·波拿巴的雾月十八日》.html"
            },
            {
                author: "马克思",
                text: "黑格尔在某个地方说过，一切伟大的世界历史事变和人物，可以说都出现两次。他忘记补充一点：第一次是作为悲剧出现，第二次是作为笑剧出现。",
                source: "《路易·波拿巴的雾月十八日》",
            link: "books/《路易·波拿巴的雾月十八日》.html"
            },
            {
                author: "马克思",
                text: "一切已死的先辈们的传统，像梦魇一样纠缠着活人的头脑。",
                source: "《路易·波拿巴的雾月十八日》",
         link: "books/《路易·波拿巴的雾月十八日》.html"
            },

        // ======== 状态 ========
        let shownIndexes = [];
        let currentIdx = -1;
        let transitionLock = null;

        // ======== 核心函数 ========
        function pickRandomUnshown() {
            const remaining = QUOTES
                .map((_, i) => i)
                .filter(i => !shownIndexes.includes(i) && i !== currentIdx);
            if (remaining.length === 0) return -1;
            return remaining[Math.floor(Math.random() * remaining.length)];
        }

        function renderQuote(quote) {
            const textElement = document.getElementById('quoteText');

            textElement.innerText = quote.text;
       

            const href = quote.link || "#";
            const target = quote.link ? ' target="_blank"' : '';
            document.getElementById('quoteSource').innerHTML = `<a href="${href}"${target} class="source-link">${quote.source}</a>`;

            // 字号自适应
            textElement.classList.remove('medium', 'long', 'super-long');
            if (quote.text.length >= 82) {
                textElement.classList.add('super-long');
            } else if (quote.text.length >= 42) {
                textElement.classList.add('long');
            } else if (quote.text.length >= 25) {
                textElement.classList.add('medium');
            }
        }

        function nextQuote() {
            if (transitionLock) return;

            const idx = pickRandomUnshown();
            if (idx === -1) {
                shownIndexes = currentIdx === -1 ? [] : [currentIdx];
                return nextQuote();
            }

            const display = document.getElementById('quoteDisplay');
            display.classList.remove('visible');

            transitionLock = setTimeout(() => {
                currentIdx = idx;
                shownIndexes.push(idx);
                renderQuote(QUOTES[idx]);

                void display.offsetHeight;

                requestAnimationFrame(() => {
                    display.classList.add('visible');
                    transitionLock = null;
                });
            }, 400);
        }

        // ======== 初始化 ========
        (function init() {
            const idx = Math.floor(Math.random() * QUOTES.length);
            currentIdx = idx;
            shownIndexes.push(idx);
            renderQuote(QUOTES[idx]);
            requestAnimationFrame(() => {
                document.getElementById('quoteDisplay').classList.add('visible');
            });
        })();
// === 手机端：下一条按钮点击反馈，防止 hover 残留 ===
(function fixMobileArrowTap() {
    const button = document.getElementById("moreBtn");

    if (!button) return;

    function isMobile() {
        return window.matchMedia("(max-width: 768px)").matches;
    }

    function pressButton() {
        if (!isMobile()) return;

        button.classList.add("is-tapping");
    }

    function releaseButton() {
        if (!isMobile()) return;

        setTimeout(() => {
            button.classList.remove("is-tapping");
            button.blur();
        }, 160);
    }

    button.addEventListener("pointerdown", pressButton);
    button.addEventListener("pointerup", releaseButton);
    button.addEventListener("pointercancel", releaseButton);
    button.addEventListener("pointerleave", releaseButton);
})();
