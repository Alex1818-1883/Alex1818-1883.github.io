<script>
(() => {
    const STORAGE_KEY =
        "revolution-art-refresh-position";

    /*
     * 禁止浏览器自己在不确定的时间恢复位置。
     * 页面将只在刷新时自行恢复一次。
     */
    if (
        "scrollRestoration" in history
    ) {
        history.scrollRestoration =
            "manual";
    }

    const navigationEntry =
        performance
            .getEntriesByType(
                "navigation"
            )[0];

    const isReload =
        navigationEntry
            ? navigationEntry.type ===
                "reload"
            : performance.navigation &&
              performance.navigation.type ===
                1;

    let savedState = null;

    if (isReload) {
        try {
            savedState =
                JSON.parse(
                    sessionStorage.getItem(
                        STORAGE_KEY
                    ) || "null"
                );
        } catch (error) {
            savedState = null;
        }
    }



    window.__ART_REFRESH_STATE__ =
        savedState;

    /*
     * 刷新或离开之前保存当前位置。
     */
    window.addEventListener(
        "pagehide",
        () => {
            const root =
                document.documentElement;

            const footer =
                document.querySelector(
                    "footer"
                );

            const footerVisible =
                Boolean(
                    footer &&
                    footer
                        .getBoundingClientRect()
                        .top <
                        window.innerHeight
                );

            const state = {
                y: window.scrollY,

                /*
                 * 当前视口距离整个页面底部多少像素。
                 * 页脚可见时使用这个值更稳定。
                 */
                bottomGap: Math.max(
                    0,
                    root.scrollHeight -
                    window.innerHeight -
                    window.scrollY
                ),

                footerVisible
            };

            try {
                sessionStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(
                        state
                    )
                );
            } catch (error) {
                /*
                 * 存储不可用时忽略。
                 */
            }
        }
    );
})();
</script>

    const promise =
        new Promise(
            (resolve, reject) => {

                image.onload =
                    async () => {

                        try {

                            if (
                                typeof image.decode ===
                                "function"
                            ) {
                                await image.decode();
                            }

                        } catch (error) {
                            /*
                             * onload 已经成功，
                             * decode 失败时不阻止使用。
                             */
                        }


                        resolve();
                    };


                image.onerror =
                    () => {

                        categoryImageCache
                            .delete(src);

                        reject(
                            new Error(
                                `SVG 加载失败：${src}`
                            )
                        );
                    };
            }
        );


    categoryImageCache.set(
        src,
        {
            image,
            promise
        }
    );


    image.src =
        src;


    return promise;
}


function preloadCategoryImages() {

    ART_CATEGORIES.forEach(
        category => {

            ensureImageReady(
                category.image
            ).catch(
                () => {}
            );

        }
    );
}


function waitForFigureFadeOut() {

    return new Promise(resolve => {

        let finished =
            false;


        const finish =
            () => {

                if (finished) {
                    return;
                }

                finished =
                    true;


                artFigure.removeEventListener(
                    "transitionend",
                    handleTransitionEnd
                );


                resolve();
            };


        const handleTransitionEnd =
            event => {

                if (
                    event.target ===
                        artFigure &&
                    event.propertyName ===
                        "opacity"
                ) {
                    finish();
                }
            };


        artFigure.addEventListener(
            "transitionend",
            handleTransitionEnd
        );


        window.setTimeout(
            finish,
            450
        );
    });
}


function applyFigureSize(category) {
    const scale =
        mobileMedia.matches
            ? category.mobileScale
            : category.desktopScale;

    const offsetY =
        mobileMedia.matches
            ? category.mobileOffsetY
            : category.offsetY;

    /*
     * 防止数据库漏写、写成0或者写成非数字。
     * 出现无效数据时自动恢复为1倍。
     */
    const safeScale =
        Number.isFinite(scale) &&
        scale > 0
            ? scale
            : 1;

    /*
     * 例如：
     * 1.35转换成135%
     * 1.2转换成120%
     */
    document.documentElement.style.setProperty(
        "--figure-height",
        `${safeScale * 100}%`
    );

    /*
     * 每张SVG仍然可以单独调整上下位置。
     */
    document.documentElement.style.setProperty(
        "--figure-offset-y",
        `${offsetY}px`
    );
}

/*
 * 刷新时立即恢复刷新前的位置。
 *
 * 不隐藏页面；
 * 不等待SVG；
 * 不使用动画；
 * 不使用requestAnimationFrame。
 */
function restoreRefreshPositionImmediately() {
    const state =
        window.__ART_REFRESH_STATE__;

    /*
     * 普通进入页面时不处理。
     * 只有刷新页面时才会存在state。
     */
    if (!state) {
        return;
    }

    const scrollingElement =
        document.scrollingElement ||
        document.documentElement;

    const maximumScrollY =
        Math.max(
            0,
            scrollingElement.scrollHeight -
            window.innerHeight
        );

    let targetY;

    /*
     * 刷新前页脚已经露出来时，
     * 保持刷新前距离页面底部的距离。
     */
    if (state.footerVisible) {
        targetY =
            maximumScrollY -
            state.bottomGap;
    } else {
        /*
         * 页脚没有露出来时，
         * 使用刷新前的普通纵向位置。
         */
        targetY =
            state.y;
    }

    /*
     * 防止目标位置超出页面范围。
     */
    targetY =
        Math.max(
            0,
            Math.min(
                maximumScrollY,
                targetY
            )
        );

    /*
     * 直接设置最终位置，
     * 没有平滑滚动过程。
     */
    scrollingElement.scrollTop =
        targetY;

    window.scrollTo(
        0,
        targetY
    );
}



function updateCategoryEntry(category) {
    const currentText =
        activeCategoryTextLayer === 0
            ? categoryEntryTextA
            : categoryEntryTextB;

    const nextText =
        activeCategoryTextLayer === 0
            ? categoryEntryTextB
            : categoryEntryTextA;

    /*
     * 先把下一分类名称放入当前隐藏层。
     */
    nextText.textContent =
        category.name;

    /*
     * 当前层淡出，下一层淡入。
     */
    currentText.classList.remove(
        "is-visible"
    );

    nextText.classList.add(
        "is-visible"
    );

    /*
     * 记录现在显示的是哪一层。
     */
    activeCategoryTextLayer =
        activeCategoryTextLayer === 0
            ? 1
            : 0;

    /*
     * 链接地址和无障碍名称立即同步。
     */
    categoryEntry.href =
        category.href;

    categoryEntry.setAttribute(
        "aria-label",
        `进入${category.name}分类`
    );
}

async function showCategory(
    nextIndex
) {

    const length =
        ART_CATEGORIES.length;


    currentCategoryIndex =
        (
            nextIndex +
            length
        ) %
        length;


    switchRequestId += 1;


    const requestId =
        switchRequestId;


    const targetCategory =
        ART_CATEGORIES[
            currentCategoryIndex
        ];


    /*
     * 分类按钮文字和链接
     * 立即开始切换。
     */
    updateCategoryEntry(
        targetCategory
    );


    /*
     * 下一张 SVG
     * 立即开始准备。
     *
     * 与当前图片淡出同时进行，
     * 不浪费时间。
     */
    let imageReady =
        true;


    const imageReadyPromise =
        ensureImageReady(
            targetCategory.image
        ).catch(
            () => {

                imageReady =
                    false;

            }
        );


    /*
     * 当前图片开始完整淡出。
     */
    artFigure.classList.add(
        "is-changing"
    );


    /*
     * 同时等待：
     *
     * 1. 当前图片完全淡出
     * 2. 下一张 SVG 真正加载完成
     */
    await Promise.all(
        [
            waitForFigureFadeOut(),
            imageReadyPromise
        ]
    );


    /*
     * 如果等待期间用户又点了箭头，
     * 旧请求直接作废。
     */
    if (
        requestId !==
        switchRequestId
    ) {
        return;
    }


    /*
     * 下一张图片加载失败。
     */
    if (!imageReady) {

        artFigure.style.display =
            "none";


        figurePlaceholder.textContent =
            targetCategory.name;


        figurePlaceholder.style.display =
            "flex";


        artFigure.classList.remove(
            "is-changing"
        );


        return;
    }


    /*
     * 新 SVG 已经准备完成，
     * 现在才真正更新尺寸和位置。
     */
    applyFigureSize(
        targetCategory
    );


    artFigure.alt =
        targetCategory.alt;


    figurePlaceholder.textContent =
        targetCategory.name;


    figurePlaceholder.style.display =
        "none";


    artFigure.style.display =
        "block";


    /*
     * 当前仍然 opacity: 0，
     * 所以此时换 src 用户完全看不到。
     */
    artFigure.src =
        targetCategory.image;


    /*
     * 再让真正显示用的 img
     * 完成一次 decode。
     *
     * 此时 SVG 已在缓存中，
     * 通常非常快。
     */
    try {

        if (
            typeof artFigure.decode ===
            "function"
        ) {
            await artFigure.decode();
        }

    } catch (error) {

    }


    if (
        requestId !==
        switchRequestId
    ) {
        return;
    }


    artFigure.classList.remove(
        "is-changing"
    );
}

        function showPreviousCategory() {
            showCategory(currentCategoryIndex - 1);
        }

        function showNextCategory() {
            showCategory(currentCategoryIndex + 1);
        }

/*
 * 手机端箭头触摸反馈：
 * 与书法页面完全相同。
 */
function fixMobileArrowTap() {
    const buttons =
        document.querySelectorAll(
            ".stage-arrow"
        );

    function isMobile() {
        return window
            .matchMedia(
                "(max-width: 768px)"
            )
            .matches;
    }

    buttons.forEach(button => {
        const release = () => {
            if (!isMobile()) {
                return;
            }

            window.setTimeout(() => {
                button.classList.remove(
                    "is-tapping"
                );

                /*
                 * 清除手机点击后遗留的焦点状态。
                 */
                button.blur();
            }, 160);
        };

        button.addEventListener(
            "pointerdown",
            () => {
                if (isMobile()) {
                    button.classList.add(
                        "is-tapping"
                    );
                }
            }
        );

        button.addEventListener(
            "pointerup",
            release
        );

        button.addEventListener(
            "pointercancel",
            release
        );

        button.addEventListener(
            "pointerleave",
            release
        );
    });
}


previousCategory.addEventListener("click", () => {
    showPreviousCategory();
});

nextCategory.addEventListener("click", () => {
    showNextCategory();
});

        window.addEventListener("keydown", event => {
            if (event.key === "ArrowLeft") {
                showPreviousCategory();
            }

            if (event.key === "ArrowRight") {
                showNextCategory();
            }
        });

        function handleViewportChange() {
            applyFigureSize(ART_CATEGORIES[currentCategoryIndex]);
        }

        if (typeof mobileMedia.addEventListener === "function") {
            mobileMedia.addEventListener("change", handleViewportChange);
        } else {
            mobileMedia.addListener(handleViewportChange);
        }



applyFigureSize(
    ART_CATEGORIES[0]
);

restoreRefreshPositionImmediately();

preloadCategoryImages();

fixMobileArrowTap();

    </script>
</body>
