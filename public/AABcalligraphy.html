<meta
    name="viewport"

>

<script>
    (() => {
        const scrollKey =
            `calligraphy-scroll:${location.pathname}`;

        const navigation =
            performance.getEntriesByType("navigation")[0];

        const isReload =
            navigation &&
            navigation.type === "reload";

        if (!isReload) return;

        let savedY = 0;

        try {
            savedY = Number(
                sessionStorage.getItem(scrollKey) || 0
            );
        } catch (error) {
            return;
        }


const heroHeight =
    window.innerHeight;


        if (savedY >= heroHeight - 4) {
            const root =
                document.documentElement;

            root.classList.add(
                "hide-hero-during-restore"
            );


            root.dataset.heroRestorePoint =
                String(heroHeight - 4);
        }
    })();
</script>

@keyframes heroBackgroundFade {
    from {
        opacity: 0;
    }

    to {
        opacity: 0.1;
    }
}

/*
 * 两个签名只做透明度渐显，
 * 不缩放、不移动、不旋转。
 */
@keyframes heroCalligraphyFade {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


.hero {

    z-index: 1;

    width: 100%;

    justify-content: center;

    background-color: #FFFFFF;

    overflow: hidden;
}

.hero::before {
    content: "";

    position: absolute;

    left: 0;
    right: 0;
    bottom: -45%;
    height: 175%;

    z-index: 0;

    background-image:
        url("zhuxione.svg");

    background-repeat:
        no-repeat;

    /*
     * 图片始终填满背景图层的高度。
     */
    background-size:
        auto
        100%;

    /*
     * 和index首页一样，图片直接锁定在底部。
     */
    background-position:
     center
        bottom;

    opacity: 0;

animation:
    heroBackgroundFade
    3.6s
    ease-out
    0.1s
    forwards;

    pointer-events: none;

    user-select: none;
    -webkit-user-select: none;
}

opacity: 1;

/* === 书法索引红星：革命之声同款悬停旋转 === */
@keyframes index-star-spin {
    from {
        transform:
            rotate(0deg)
            translateZ(0);
    }

    to {
        transform:
            rotate(360deg)
            translateZ(0);
    }
}

/* 红星按钮外层：负责悬停放大和缓慢归位 */
.index-star-trigger {
    appearance: none;
    -webkit-appearance: none;

    width: 60px;
    height: 60px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    margin: 0;
    padding: 0;

    border: none;
    background-color: transparent;

    line-height: 0;
    cursor: pointer;

    transform:
        scale(1)
        translateZ(0);

    transition:
        transform 0.3s;
}

/* 与 index 革命之声红星相同：悬停放大到 1.25 */
.index-star-trigger:hover {
    transform:
        scale(1.25)
        translateZ(0);

    transition:
        transform 0.3s
        cubic-bezier(
            0.175,
            0.885,
            0.32,
            1.275
        ) !important;
}

.index-star-trigger:focus,
.index-star-trigger:focus-visible {
    outline: none;
    box-shadow: none;
}

/* 红星内层：专门负责旋转 */
.index-star-icon {
    width: 60px;
    height: 60px;

    display: block;

    transform-origin: center center;
    will-change: transform;
    backface-visibility: hidden;
}

.index-star-icon svg {
    width: 60px;
    height: 60px;

    display: block;
}

/* 与 index 一样：每 6 秒旋转一整圈 */
.index-star-icon.spinning {
    animation:
        index-star-spin
        6s
        linear
        infinite;
}



/* === 三分类长条胶囊：与 poem 页面相同 === */
.category-buttons {
    --slider-x: -4px;
    --slider-y: -4px;
    --slider-width: 0px;
    --slider-height: 0px;

    position: relative;

    display: grid;
    grid-template-columns: repeat(3, 1fr);

    width: min(660px, 100%);
    margin: 34px auto 0;
    padding: 5px;

    border: 2px solid #CC0000;
    border-radius: 999px;
    background-color: #FFFFFF;
}

/* 红色滑块 */
.category-buttons::before {
    content: "";

    position: absolute;
    left: 0;
    top: 0;

    width: var(--slider-width);
    height: var(--slider-height);

    background-color: #CC0000;
    border-radius: 999px;

    opacity: 0;

    transform: translate3d(
        var(--slider-x),
        var(--slider-y),
        0
    );

    transition:
        transform 0.26s ease,
        opacity 0.18s ease;

    z-index: 0;
}

.category-buttons.no-slider-transition::before {
    transition: none !important;
}

.category-buttons.has-active::before {
    opacity: 1;
}

/* 三个分类按钮 */
.category-btn {
    position: relative;
    z-index: 1;

    height: 46px;

    border: none;
    border-radius: 999px;
    background-color: transparent;

    color: #CC0000;

    font-family: inherit;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 1px;

    cursor: pointer;

    transition: color 0.22s ease;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;

    isolation: isolate;
}

/* 鼠标悬停时的浅红背景 */
.category-btn::before {
    content: "";

    position: absolute;
    top: -5px;
    bottom: -5px;
    left: -5px;
    right: -5px;

    border-radius: 999px;
    background-color: rgba(204, 0, 0, 0.08);

    opacity: 0;
    pointer-events: none;

    z-index: -1;

    transition: opacity 0.22s ease;
}

.category-btn:hover::before {
    opacity: 1;
}

.category-btn.active::before,
.category-btn.active:hover::before {
    opacity: 0;
}

.category-btn:hover {
    color: #FF0000;
}

.category-btn.active,
.category-btn.active:hover {
    color: #FFFFFF;
}

.work-sheet {

    width: 100%;

    display: flex;

    justify-content: center;

    padding: 0;

    background: transparent;
    border: none;
    border-radius: 0;

}



.work-image {
    display: block;

    width: auto;
    height: auto;

    max-width: 100%;
    max-height: none;

    object-fit: contain;
    object-position: center;

    background: transparent;

    pointer-events: auto;
    touch-action: pan-x pan-y pinch-zoom;

    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;

    /*
     * 圆点切换图片时，
     * 只让书法图片渐隐渐显。
     * 标题、圆点和说明文字都不参与动画。
     */
    opacity: 1;
    transform: none;

    transition:
        opacity 0.4s ease,
        transform 0.4s ease;
}

/* 圆点切换过程中的图片退场状态 */
.work-image.is-page-changing {
    opacity: 0;

    transform:
        translateY(30px);
}

/*
 * 多页书法作品使用固定比例展示框。
 * 无论两张SVG自身比例是否相同，
 * 外部展示区域的高度始终不变。
 */
.work-sheet.has-fixed-page-frame {
    aspect-ratio:
        var(
            --work-page-ratio,
            1356 / 1655
        );

    align-items: stretch;
    overflow: hidden;
}

.work-sheet.has-fixed-page-frame
.work-image {
    width: 100%;
    height: 100%;

    max-width: 100%;
    max-height: 100%;

    object-fit: contain;

    object-position:
        center
        top;

    margin-top: 0 !important;
}

/* === 多页书法作品的小圆点分页 === */
.work-page-dots {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 14px;
    margin: 18px auto 0;

    min-height: 12px;

    user-select: none;
    -webkit-user-select: none;
}

/* 只有一张图片时不显示 */
.work-page-dots.is-hidden {
    display: none;
}

/* 默认：Saga页面同款粉红色圆点 */
.work-page-dot {
    appearance: none;
    -webkit-appearance: none;

    width: 12px;
    height: 12px;

    margin: 0;
    padding: 0;

    border: none;
    border-radius: 50%;

    background-color: #FFCCCC;

    cursor: pointer;

    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;

    transform:
        scale(1)
        translateZ(0);

transition:
    transform 0.3s
    cubic-bezier(
        0.175,
        0.885,
        0.32,
        1.275
    ),
    background-color 0.3s
    cubic-bezier(
        0.175,
        0.885,
        0.32,
        1.275
    );
}

/* 当前页：革命红 */
.work-page-dot.is-active {
    background-color: #CC0000;

    transform:
        scale(1.2)
        translateZ(0);
}

.work-page-dot:not(.is-active):hover {
    background-color: #CC0000;

    transform:
        scale(1.5)
        translateZ(0);
}

/* 粉色和红色圆点都保留点击缩小动画 */
.work-page-dot:not(.is-active):active,
.work-page-dot.is-active:active {
    transform:
        scale(0.9)
        translateZ(0);
}

.work-page-dot:focus {
    outline: none;
}

.work-page-dot:focus-visible {
    outline: none;

    box-shadow:
        0 0 0 3px
        rgba(204, 0, 0, 0.16);
}

/*
 * 有圆点时，说明文字与圆点之间不要隔得太远。
 */
.work-page-dots:not(.is-hidden)
+ .work-description {
    margin-top: 24px;
}

/* === 手迹释文折叠区 === */
.work-transcription {

/* 没有释文的作品完全隐藏 */
.work-transcription.is-hidden {

/* === 手迹释文：media页面“教员相集”同款胶囊按钮 === */
.transcription-toggle {
    appearance: none;
    -webkit-appearance: none;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    margin: 0;
    padding: 6px 40px;

    border: 2px solid #CC0000;
    border-radius: 999px;

    background-color: #CC0000;
    color: #FFFFFF;

    font-family: inherit;
    font-size: 15px;
    font-weight: bold;
    line-height: 1.6;

    cursor: pointer;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;

    transition:
        background-color 0.3s ease,
        border-color 0.3s ease;
}

/* 鼠标悬停：与“教员相集”一样变为深红色 */
.transcription-toggle:hover {
    background-color: #A80000;
    border-color: #A80000;
    color: #FFFFFF;
}

/* 鼠标按下：保持深红色 */
.transcription-toggle:active {
    background-color: #A80000;
    border-color: #A80000;
    color: #FFFFFF;
}

.transcription-toggle:focus,
.transcription-toggle:focus-visible {
    outline: none;
    box-shadow: none;
}

.transcription-toggle::selection {
    background: transparent;
}

/*
 * “展开 / 收起”文字叠放在同一个位置，
 * 避免切换文字时按钮宽度发生变化。
 */
.transcription-toggle-label {
    display: grid;
    place-items: center;
}

/*
 * 两层文字占据完全相同的位置。
 */
.transcription-toggle-text {
    grid-area: 1 / 1;

    display: block;

    opacity: 0;

    transition:
        opacity 0.24s ease;

    pointer-events: none;
}

/*
 * 默认未展开时显示“展开”。
 */
.transcription-toggle-expand {
    opacity: 1;
}

/*
 * 默认未展开时隐藏“收起”。
 */
.transcription-toggle-collapse {
    opacity: 0;
}

/*
 * 展开正文后：
 * “展开”淡出。
 */
.transcription-toggle[
    aria-expanded="true"
]
.transcription-toggle-expand {
    opacity: 0;
}

/*
 * 展开正文后：
 * “收起”淡入。
 */
.transcription-toggle[
    aria-expanded="true"
]
.transcription-toggle-collapse {
    opacity: 1;
}



/*
 * 释文展开动画。
 * 关闭时高度为0，不会留下空白。
 */
.transcription-panel {
    display: grid;
    grid-template-rows: 0fr;

    opacity: 0;

    transition:
        grid-template-rows 0.42s ease,
        opacity 0.28s ease;
}

.work-transcription.is-open
.transcription-panel {
    grid-template-rows: 1fr;
    opacity: 1;
}

/* 折叠动画需要的裁切层 */
.transcription-panel-inner {
    min-height: 0;
    overflow: hidden;
}

/* 释文正文公共样式 */
.transcription-content {
    padding: 40px 2px 2px;

    color: #222222;
    font-size: 16px;
    font-weight: 500;
    line-height: 2;
    text-align: left;

    user-select: text;
    -webkit-user-select: text;
    -webkit-touch-callout: default;
}

/* === 诗词释文 === */
.transcription-content.is-poem {
    width: min(660px, 100%);
    margin: 0 auto;
}

.transcription-poem-title {
    margin: 0 0 22px;

    color: #CC0000;
    font-size: 22px;
    font-weight: 900;
    line-height: 1.5;
    letter-spacing: 2px;
    text-align: center;
}

/*
 * 整个诗词正文块居中，
 * 但正文内部保持左对齐。
 */
.transcription-poem-body {
    width: fit-content;
    max-width: 100%;
    margin: 0 auto;

    text-align: left;
}

.transcription-poem-line {
    margin: 0 0 4px;
}

/* 数据库中空字符串表示诗词分节 */
.transcription-poem-line.is-gap {
    height: 16px;
    margin: 0;
}

/* === 书信释文 === */
.transcription-content.is-letter {
    width: min(760px, 100%);
    margin: 0 auto;
}

.transcription-letter-salutation {
    margin: 0 0 18px;

    text-align: left;
}

.transcription-letter-paragraph {
    margin: 0 0 16px;

    text-indent: 2em;
    text-align: justify;
}

.transcription-letter-closing {
    margin: 20px 0 0;
    padding-left: 2em;

    text-align: left;
}

/*
 * “敬礼”位于“此致”下一行，
 * 但保持完全顶格。
 */
.transcription-letter-respect {
    margin: 0;
    padding-left: 0;

    text-align: left;
}

.transcription-letter-signature {
    margin: 22px 2em 0 0;

    text-align: right;
}

.transcription-letter-date {
    margin: 4px 2em 0 0;

    text-align: right;
}

/*
 * 地点位于日期下一行，
 * 与署名和日期保持相同的右侧对齐线。
 */
.transcription-letter-location {
    margin: 4px 2em 0 0;

    text-align: right;
}

/*
 * 手机端书法位置修正：
 *
 * 1. 电脑端继续使用原来的 offsetY；
 * 2. 手机端只修正“题词”分类；
 * 3. 只有竖版题词才使用手机端偏移；
 * 4. 横版题词、诗词和书信保持原来的位置；
 * 5. 某一幅可以用 mobileOffsetY 单独微调。
 */
const mobileWorkMedia =
    window.matchMedia(
        "(max-width: 768px)"
    );

function applyWorkImageOffset(work) {
    if (!work) {
        workImage.style.marginTop =
            "0px";

        return;
    }

    /*
     * 电脑端原始偏移。
     */
    const desktopOffset =
        Number(work.offsetY) || 0;

    let finalOffset =
        desktopOffset;

    /*
     * 必须等图片加载完成后，
     * naturalWidth / naturalHeight 才能判断横竖版。
     */
    const hasRealSize =
        workImage.naturalWidth > 0 &&
        workImage.naturalHeight > 0;

    const isPortraitImage =
        hasRealSize &&
        workImage.naturalHeight >
            workImage.naturalWidth;

    /*
     * 只在手机端修正竖版题词。
     */
    if (
        mobileWorkMedia.matches &&
        work.type === "题词" &&
        isPortraitImage
    ) {
        const customMobileOffset =
            Number(work.mobileOffsetY);

        /*
         * 如果数据库中写了 mobileOffsetY，
         * 就使用单独设置的数值；
         * 否则默认向下留 24px。
         */
        finalOffset =
            Number.isFinite(
                customMobileOffset
            )
                ? customMobileOffset
                : 24;
    }

    workImage.style.marginTop =
        `${finalOffset}px`;
}

/*
 * 把字符串或字符串数组统一转换为数组。
 * 诗词中的空字符串会被保留，
 * 用来表示上下阕或段落之间的空行。
 */
function getTranscriptionTextList(value) {
    if (Array.isArray(value)) {
        return value.map(item =>
            item == null
                ? ""
                : String(item)
        );
    }

    if (
        typeof value === "string"
    ) {
        return [value];
    }

    return [];
}


/*
 * 创建一个纯文本元素。
 * 使用 textContent，避免把数据库文字当成HTML解析。
 */
function appendTranscriptionElement(
    parent,
    tagName,
    className,
    text
) {
    const element =
        document.createElement(
            tagName
        );

    element.className =
        className;

    element.textContent =
        text;

    parent.appendChild(
        element
    );

    return element;
}


/*
 * 每次切换作品时，
 * 先关闭并清空上一幅作品的释文。
 */
function resetWorkTranscription() {
    workTranscription.classList.add(
        "is-hidden"
    );

    workTranscription.classList.remove(
        "is-open"
    );

    transcriptionToggle.setAttribute(
        "aria-expanded",
        "false"
    );

transcriptionToggle.setAttribute(
    "aria-label",
    "展开手迹释文"
);

    transcriptionPanel.setAttribute(
        "aria-hidden",
        "true"
    );



    transcriptionContent.className =
        "transcription-content";

    transcriptionContent.replaceChildren();
}


/* 渲染诗词释文 */
function renderPoemTranscription(
    work,
    transcription
) {
    const lines =
        getTranscriptionTextList(
            transcription.lines
        );

    const hasText =
        lines.some(line =>
            line.trim() !== ""
        );

    if (!hasText) {
        return false;
    }

    transcriptionContent.classList.add(
        "is-poem"
    );

    appendTranscriptionElement(
        transcriptionContent,
        "h3",
        "transcription-poem-title",
        transcription.title ||
            work.title
    );

    const poemBody =
        document.createElement(
            "div"
        );

    poemBody.className =
        "transcription-poem-body";

    lines.forEach(line => {
        const lineElement =
            document.createElement(
                "p"
            );

        lineElement.className =
            "transcription-poem-line";

        /*
         * 空字符串表示诗词分节。
         */
        if (line.trim() === "") {
            lineElement.classList.add(
                "is-gap"
            );

            lineElement.setAttribute(
                "aria-hidden",
                "true"
            );
        } else {
            lineElement.textContent =
                line;
        }

        poemBody.appendChild(
            lineElement
        );
    });

    transcriptionContent.appendChild(
        poemBody
    );

    return true;
}


/* 渲染书信释文 */
function renderLetterTranscription(
    transcription
) {
    const salutations =
        getTranscriptionTextList(
            transcription.salutation
        ).filter(text =>
            text.trim() !== ""
        );

    const paragraphs =
        getTranscriptionTextList(
            transcription.paragraphs
        ).filter(text =>
            text.trim() !== ""
        );

    /*
     * “此致”：
     * 空两格显示。
     */
    const closing =
        getTranscriptionTextList(
            transcription.closing
        ).filter(text =>
            text.trim() !== ""
        );

    /*
     * “敬礼”：
     * 顶格显示在“此致”下一行。
     */
    const respects =
        getTranscriptionTextList(
            transcription.respect
        ).filter(text =>
            text.trim() !== ""
        );

    const signature =
        typeof transcription.signature ===
        "string"
            ? transcription.signature.trim()
            : "";

    const date =
        typeof transcription.date ===
        "string"
            ? transcription.date.trim()
            : "";

    const location =
        typeof transcription.location ===
        "string"
            ? transcription.location.trim()
            : "";

    const hasText =
        salutations.length > 0 ||
        paragraphs.length > 0 ||
        closing.length > 0 ||
        respects.length > 0 ||
        signature !== "" ||
        date !== "" ||
        location !== "";

    if (!hasText) {
        return false;
    }

    transcriptionContent.classList.add(
        "is-letter"
    );

    /* 称呼 */
    salutations.forEach(text => {
        appendTranscriptionElement(
            transcriptionContent,
            "p",
            "transcription-letter-salutation",
            text
        );
    });

    /* 正文段落 */
    paragraphs.forEach(text => {
        appendTranscriptionElement(
            transcriptionContent,
            "p",
            "transcription-letter-paragraph",
            text
        );
    });

    /* 此致：空两格 */
    closing.forEach(text => {
        appendTranscriptionElement(
            transcriptionContent,
            "p",
            "transcription-letter-closing",
            text
        );
    });

    /* 敬礼：顶格 */
    respects.forEach(text => {
        appendTranscriptionElement(
            transcriptionContent,
            "p",
            "transcription-letter-respect",
            text
        );
    });

    /* 署名 */
    if (signature !== "") {
        appendTranscriptionElement(
            transcriptionContent,
            "p",
            "transcription-letter-signature",
            signature
        );
    }

    /* 日期 */
    if (date !== "") {
        appendTranscriptionElement(
            transcriptionContent,
            "p",
            "transcription-letter-date",
            date
        );
    }

    /* 地点：放在日期下面 */
    if (location !== "") {
        appendTranscriptionElement(
            transcriptionContent,
            "p",
            "transcription-letter-location",
            location
        );
    }

    return true;
}

/*
 * 根据当前作品的 transcription 数据，
 * 自动选择诗词或书信排版。
 */
function renderWorkTranscription(work) {
    resetWorkTranscription();

    const transcription =
        work?.transcription;

    if (!transcription) {
        return;
    }

    let rendered = false;

    if (
        transcription.layout ===
        "poem"
    ) {
        rendered =
            renderPoemTranscription(
                work,
                transcription
            );
    }

    if (
        transcription.layout ===
        "letter"
    ) {
        rendered =
            renderLetterTranscription(
                transcription
            );
    }

    /*
     * 没有有效正文时继续隐藏，
     * 不留下空标题或空白。
     */
    if (!rendered) {
        resetWorkTranscription();
        return;
    }

    workTranscription.classList.remove(
        "is-hidden"
    );
}

let isWorkDisplayHeightLocked = false;
let workDisplayHeightLockId = 0;

function lockWorkDisplayHeight() {
    const currentHeight =
        Math.ceil(
            workDisplay.getBoundingClientRect().height
        );

    if (currentHeight <= 0) {
        return;
    }

    /*
     * 每次重新锁定都生成新的编号，
     * 让上一轮尚未执行的解锁任务失效。
     */
    workDisplayHeightLockId += 1;

    workDisplay.style.minHeight =
        `${currentHeight}px`;

    isWorkDisplayHeightLocked = true;
}

function releaseWorkDisplayHeight() {
    if (!isWorkDisplayHeightLocked) {
        return;
    }

    const releaseId =
        workDisplayHeightLockId;

    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            /*
             * 已经开始了新一轮切换时，
             * 旧解锁任务不能清除新高度。
             */
            if (
                releaseId !==
                workDisplayHeightLockId
            ) {
                return;
            }

            workDisplay.style.minHeight =
                "";

            isWorkDisplayHeightLocked =
                false;
        });
    });
}


const IMAGE_PAGE_FADE_DURATION =

let imagePageTransitionId =

function buildCurrentList() {

function getWorkImages(work) {
    if (!work) return [];

    if (
        Array.isArray(work.images) &&
        work.images.length > 0
    ) {
        return work.images.filter(Boolean);
    }

    if (work.image) {
        return [work.image];
    }

    return [];
}


function applyWorkPageFrame(work) {
    const images = getWorkImages(work);
    const frame = work?.pageFrame;

    const enabled =
        images.length > 1 &&
        Number(frame?.width) > 0 &&
        Number(frame?.height) > 0;

    workSheet.classList.toggle(
        "has-fixed-page-frame",
        enabled
    );

    if (enabled) {
        workSheet.style.setProperty(
            "--work-page-ratio",
            `${frame.width} / ${frame.height}`
        );
    } else {
        workSheet.style.removeProperty(
            "--work-page-ratio"
        );
    }
}

function preloadWorkPageImage(src) {
    return new Promise((resolve, reject) => {
        const image = new Image();

        image.onload = resolve;
        image.onerror = reject;
        image.src = src;
    });
}

function cancelWorkPageTransition() {
    imagePageTransitionId += 1;

    workImage.classList.remove(
        "is-page-changing"

}


/* 隐藏并清空分页圆点 */

function updateWorkPageDotState() {

/* 根据作品的图片数量生成圆点 */
function renderWorkPageDots(work) {

        getWorkImages(work);

     * 一张或没有图片时，
     * 不显示圆点。
     */
    if (images.length <= 1) {
        workPageDots.classList.add(
            "is-hidden"
        );

    workPageDots.classList.remove(

async function changeWorkImagePage(pageIndex) {
    const workIndex = currentIndex;
    const work = CALLIGRAPHY_WORKS[workIndex];

if (!work) {
    return;
}

    const images = getWorkImages(work);

    if (
        pageIndex < 0 ||
        pageIndex >= images.length ||
        pageIndex === currentImagePage
    ) {
        return;
    }

    const previousPage = currentImagePage;
    const targetSrc = images[pageIndex];
const transitionId =
    ++imagePageTransitionId;

workImage.classList.remove(
    "is-page-changing"
);

currentImagePage = pageIndex;
    updateWorkPageDotState();

    try {
        await preloadWorkPageImage(
            targetSrc
        );
    } catch (error) {
        if (
            transitionId === imagePageTransitionId &&
            currentIndex === workIndex
        ) {
            currentImagePage = previousPage;
            updateWorkPageDotState();
        }

        return;
    }

    if (
        transitionId !== imagePageTransitionId ||
        currentIndex !== workIndex
    ) {
        return;
    }

void workImage.offsetHeight;

workImage.classList.add(
    "is-page-changing"
);

    setTimeout(() => {
        if (
            transitionId !== imagePageTransitionId ||
            currentIndex !== workIndex
        ) {
            return;
        }

        workImage.src = targetSrc;

        workImage.alt =
            `毛泽东书法作品：${work.title}（第${pageIndex + 1}页）`;

requestAnimationFrame(() => {
    requestAnimationFrame(() => {
        if (
            transitionId !== imagePageTransitionId ||
            currentIndex !== workIndex
        ) {
            return;
        }

        workImage.classList.remove(
            "is-page-changing"
        );
    });
});
    }, IMAGE_PAGE_FADE_DURATION);
}

function switchWorkWithFade(callback) {
    if (transitionLock) return;

    /*
     * 渐隐以前记录当前完整高度。
     * 即使新SVG加载时暂时没有高度，
     * 展示区域也不会突然收缩。
     */
    lockWorkDisplayHeight();

    workDisplay.classList.remove(
        "visible"
    );

    transitionLock = setTimeout(() => {
        callback();

        /*
         * 强制浏览器确认隐藏状态。
         */
        void workDisplay.offsetHeight;

        requestAnimationFrame(() => {
            workDisplay.classList.add(
                "visible"
            );

            transitionLock = null;
        });
    }, 400);
}

function updateArrowState() {
    const hasMultipleWorks = currentList.length > 1;

    prevBtn.classList.toggle("hidden", !hasMultipleWorks);
    nextBtn.classList.toggle("hidden", !hasMultipleWorks);

function changeWork(step) {
    if (currentList.length < 2) return;

    switchWorkWithFade(() => {
        let currentPosition =
            currentList.indexOf(currentIndex);

        if (currentPosition < 0) {
            currentPosition = 0;
        }

        currentPosition = (
            currentPosition +
            step +
            currentList.length
        ) % currentList.length;

        currentIndex =
            currentList[currentPosition];

        showCurrentWork();
    });
}

const indexStarTrigger =

    );

/*
 * 与 index 革命之声红星相同：
 * 每一整圈持续 6000 毫秒。
 */
const INDEX_STAR_SPIN_DURATION = 6000;

let indexStarPendingStop = false;
let indexStarAnimationStartTime = 0;


/* 鼠标进入：开始旋转 */
function startIndexStarSpin() {
    indexStarPendingStop = false;

    /*
     * 清除上一次鼠标移出时设置的
     * 缓慢归位时间。
     */
    indexStarTrigger.style.transition = "";

    if (
        !indexStarIcon.classList.contains(
            "spinning"
        )
    ) {
        indexStarIcon.classList.add(
            "spinning"
        );

        indexStarAnimationStartTime =
            performance.now();
    }
}


/*
 * 鼠标移出：
 * 不立刻把红星硬停在半圈位置，
 * 而是等待当前这一圈转完。
 */
function stopIndexStarSpin() {
    if (
        indexStarTrigger.matches(
            ":hover"
        )
    ) {
        return;
    }

    indexStarPendingStop = true;

    const elapsed = (
        performance.now() -
        indexStarAnimationStartTime
    ) % INDEX_STAR_SPIN_DURATION;

    const remaining =
        INDEX_STAR_SPIN_DURATION -
        elapsed;

    /*
     * 与 index 页面一样，
     * 外层红星按照剩余旋转时间
     * 慢慢从 1.25 倍回到原尺寸。
     */
    indexStarTrigger.style.transition =
        `transform ${remaining}ms linear`;
}


indexStarTrigger.addEventListener(
    "mouseenter",
    startIndexStarSpin
);

indexStarTrigger.addEventListener(
    "mouseleave",
    stopIndexStarSpin
);


indexStarIcon.addEventListener(
    "animationiteration",
    () => {
        if (!indexStarPendingStop) {
            return;
        }

        indexStarIcon.classList.remove(
            "spinning"
        );

        indexStarPendingStop = false;

        indexStarTrigger.style.transition =
            "";
    }
);

/* === 首屏签名渐显结束后，彻底卸载动画层 === */
document
    .querySelectorAll(
        ".hero-mao-signature, .hero-shufa-signature"
    )
    .forEach(signature => {
        signature.addEventListener(
            "animationend",
            event => {
                /*
                 * 只处理签名的渐显动画，
                 * 避免其他动画事件误触发。
                 */
                if (
                    event.animationName !==
                    "heroCalligraphyFade"
                ) {
                    return;
                }

                signature.classList.add(
                    "is-crisp"
                );
            },
            {
                once: true
            }
        );
    });
/* === 记录当前页面滚动位置 === */
const HERO_SCROLL_STORAGE_KEY =
    `calligraphy-scroll:${location.pathname}`;

let scrollSaveFrame = null;

window.addEventListener(
    "scroll",
    () => {
        /*
         * 每一帧最多记录一次，
         * 避免滚动时频繁写入存储。
         */
        if (scrollSaveFrame !== null) {
            return;
        }

        scrollSaveFrame =
            requestAnimationFrame(() => {
                try {
                    sessionStorage.setItem(
                        HERO_SCROLL_STORAGE_KEY,
                        String(window.scrollY)
                    );
                } catch (error) {
                    /* 存储不可用时不影响页面功能 */
                }

                scrollSaveFrame = null;
            });
    },
    {
        passive: true
    }
);

window.addEventListener(
    "pagehide",
    () => {
        try {
            sessionStorage.setItem(
                HERO_SCROLL_STORAGE_KEY,
                String(window.scrollY)
            );
        } catch (error) {
            /* 存储不可用时不影响页面功能 */
        }
    }
);

/* === 浏览器恢复滚动位置后显示首屏 === */
function revealHeroAfterScrollRestore() {
    const root =
        document.documentElement;

    if (
        !root.classList.contains(
            "hide-hero-during-restore"
        )
    ) {
        return;
    }

    const restorePoint = Number(
        root.dataset.heroRestorePoint || 0
    );

function checkScrollPosition() {
    /*
     * 隐藏类已经被正常恢复逻辑或两秒保险删除，
     * 立即停止检测循环。
     */
    if (
        !root.classList.contains(
            "hide-hero-during-restore"
        )
    ) {
        return;
    }

    const hasRestored =
        window.scrollY >= restorePoint;

    /*
     * 浏览器已经恢复到首屏下面，
     * 解除隐藏并停止检测。
     */
    if (hasRestored) {
        root.classList.remove(
            "hide-hero-during-restore"
        );


        delete root.dataset.heroRestorePoint;

        return;
    }

    requestAnimationFrame(
        checkScrollPosition
    );
}

    requestAnimationFrame(
        checkScrollPosition
    );
}



window.addEventListener(
    "pageshow",
    revealHeroAfterScrollRestore,
    {
        once: true
    }
);

window.setTimeout(() => {
    const root =
        document.documentElement;

    root.classList.remove(
        "hide-hero-during-restore"
    );

    delete root.dataset.heroRestorePoint;
}, 2000);
    </script>
