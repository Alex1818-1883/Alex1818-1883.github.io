content: [
"<strong>唯心主义</strong>是同唯物主义根本对立的哲学世界观。它把意识、精神、观念、感觉、理念、神灵或某种超自然力量看作世界的本原，否认物质世界不依赖于人的意识而客观存在，或者把物质世界说成精神的产物、感觉的集合、理念的外化。唯心主义颠倒了物质和意识的真实关系，把由物质世界产生的意识反过来说成决定物质世界的根本力量。",
"唯心主义主要有两种基本形态：主观唯心主义和客观唯心主义。主观唯心主义把个人的感觉、经验、意识或自我看作世界的本原，认为事物的存在依赖于人的感知和主观经验。客观唯心主义则把某种超个人的“绝对精神”“世界理性”“理念”“天命”或神秘意志看作世界的本原，认为现实世界只是这种精神实体的体现或产物。二者形式不同，但共同点都是把精神放在第一位，把物质放在第二位。",
"唯心主义的根本错误，在于把认识中的主观因素绝对化，把人脑对客观世界的反映歪曲为客观世界的来源。意识不是凭空产生的独立实体，精神也不是世界之外的神秘力量。意识是物质世界长期发展的产物，是社会实践和人脑活动的结果。离开自然界、社会生活和人的实践活动，就没有任何意识、观念和思想。唯心主义把这种关系倒转过来，必然走向神秘主义、主观主义和宗教神学。",
"在社会历史领域，唯心主义表现为把历史发展归结为思想观念、道德原则、英雄人物、民族精神、天命神意或抽象理性的作用。它看不到社会生产方式的基础作用，看不到生产力和生产关系、经济基础和上层建筑的矛盾运动，看不到阶级斗争在阶级社会发展中的巨大推动作用。这样一来，现实的剥削关系和阶级压迫就被思想化、道德化、神秘化，人民群众创造历史的伟大作用也被遮蔽和抹杀。",
"唯心主义在阶级社会中从来不是单纯的哲学错误，它常常成为剥削阶级维护统治的思想工具。封建统治阶级用天命、神权和宗教教义证明等级压迫的合理性；资产阶级用自由意志、抽象人性、市场理性和个人奋斗掩盖资本统治和阶级剥削；现代反动思潮则用相对主义、不可知论和主观经验至上瓦解人民群众对客观真理和社会规律的认识。唯心主义越是把现实矛盾说成意识问题，就越是替旧制度掩盖罪责。",
"批判唯心主义，必须坚持辩证唯物主义和历史唯物主义。世界的本原是物质，意识是物质的反映；社会存在决定社会意识，人民群众是历史的创造者；真理不是主观任意的产物，而是在社会实践中得到检验和发展的客观认识。只有从客观实际出发，深入实践，调查研究，分析矛盾，才能粉碎唯心主义的迷雾，认识世界的真实规律。",
"无产阶级必须同唯心主义划清界限。唯心主义使人们脱离现实物质条件和阶级关系，把希望寄托在观念改变、道德劝说、神秘力量或少数人物身上；唯物主义则把被压迫群众引向现实斗争，引向对生产关系、国家机器和阶级统治的根本改造。坚持唯物主义，反对唯心主义，是无产阶级形成科学世界观、反对主观主义和修正主义、推动革命事业前进的思想前提。"
]
},

{
    term: "辩证法",
    content: [
        "<strong>辩证法</strong>是马克思主义哲学活的灵魂，是关于自然、社会和思维发展的最一般规律的科学，也是无产阶级及其政党认识世界和改造世界的根本方法。唯物辩证法把世界看作普遍联系和永恒发展的有机整体，认为一切事物内部都包含着矛盾，矛盾双方既对立又统一，由此推动事物的运动、变化和发展。",
        "马克思、恩格斯在批判地继承黑格尔唯心辩证法合理内核的基础上，创立了科学的唯物辩证法。它包含三个基本规律：对立统一规律、质量互变规律和否定之否定规律，其中对立统一规律是辩证法的实质与核心。此外，本质与现象、原因与结果、必然与偶然、可能与现实、形式与内容等一系列范畴，进一步揭示了客观世界联系和发展的不同侧面。",
        "毛主席在《矛盾论》中极大丰富和发展了马克思主义辩证法，深刻阐明了矛盾的普遍性与特殊性、主要矛盾与次要矛盾、矛盾的主要方面与次要方面、对抗性矛盾与非对抗性矛盾等关键范畴，并指出：“事物发展的根本原因，不是在事物的外部而是在事物的内部，在于事物内部的矛盾性。”辩证法要求我们反对孤立的、静止的、片面的形而上学世界观，坚持用全面的、发展的、矛盾的观点观察一切事物，善于从错综复杂的现象中把握本质，在对立统一中推动矛盾的正确解决，从而夺取无产阶级革命和社会主义建设事业的伟大胜利。"
    ]
},
{
    term: "物质",
    content: [
        "<strong>物质</strong>是标志着客观实在的哲学范畴。列宁给出了科学的物质定义：“物质是标志客观实在的哲学范畴，这种客观实在是人通过感觉感知的，它不依赖于我们的感觉而存在，为我们的感觉所复写、摄影、反映。”",
        "辩证唯物主义坚持世界的物质统一性，指出纷繁复杂的宇宙万物无一不是物质的具体形态，就连作为物质之反映的人类意识，其本质也是物质的属性和机能。承认物质第一性、精神第二性，是划分唯物主义与唯心主义的根本界限，也是无产阶级政党制定路线、方针、政策的哲学基石。"
    ]
},
{
term: "社会存在",
content: [
"<strong>社会存在</strong>是历史唯物主义的核心范畴，指社会生活的物质方面，即人们赖以生存和发展的社会物质生活条件的总和。它包括地理环境、人口因素、物质资料生产方式等内容，其中最根本、最决定性的，是物质资料的生产方式，也就是生产力和生产关系的统一。社会存在不是抽象观念的产物，而是人们在现实生产、生活和社会关系中形成的客观物质基础。",
"社会存在决定社会意识。人们的思想、政治观点、法律观念、道德观念、宗教信仰、哲学理论和文化形式，不是凭空产生的，也不是少数天才人物任意创造的，而是在一定社会存在基础上形成的。不同的生产方式、阶级地位和社会关系，必然产生不同的思想意识。奴隶社会、封建社会、资本主义社会和社会主义社会之所以具有不同的意识形态，根源就在于它们具有不同的社会存在。",
"物质资料的生产方式是社会存在中最根本的因素。人类首先必须吃、穿、住、行，必须生产生活资料，然后才能从事政治、法律、艺术、哲学、宗教等活动。生产力决定人们改造自然的能力，生产关系决定人们在生产过程中的相互关系。生产力和生产关系的矛盾运动，构成社会发展的基本动力，并进一步决定经济基础和上层建筑之间的矛盾运动。",
"地理环境和人口因素也是社会存在的重要内容，但它们不能脱离生产方式起决定作用。自然条件会影响社会发展速度和生产形式，人口数量和结构也会影响社会生活的组织方式，但它们本身不能决定社会制度的性质。决定社会性质和历史方向的，不是山川气候，也不是人口多少，而是人们怎样生产、谁占有生产资料、劳动成果由谁支配、哪个阶级掌握社会的经济和政治权力。",
"在阶级社会中，社会存在具有鲜明的阶级内容。剥削阶级和被剥削阶级处在不同的生产关系和生活条件中，因而形成不同的利益、观点和意识。资产阶级的社会存在决定了它必然把私有财产、雇佣劳动、市场竞争和资本利润说成天经地义；无产阶级的社会存在则使它能够在斗争中认识资本主义剥削的根源，形成推翻私有制、建立社会主义和共产主义的革命意识。",
"社会意识对社会存在具有反作用。社会存在决定社会意识，并不意味着意识只是消极反映现实。正确的革命理论一经掌握群众，就会转化为改造社会的巨大物质力量；反动的意识形态也会维护旧制度、麻痹群众、阻碍社会进步。关键在于，社会意识的作用必须放在社会存在的基础上理解。脱离物质条件和阶级关系，把思想观念说成历史发展的根本原因，就会滑向历史唯心主义。",
"把握社会存在这一范畴，就能粉碎一切把社会问题归结为道德、人性、观念或少数人物意志的唯心主义解释。贫富分化不是个人品德问题，而是生产资料占有关系问题；阶级压迫不是观念误会，而是社会生产关系问题；革命不是主观愿望的产物，而是社会基本矛盾发展到一定阶段的必然结果。只有从社会存在出发，才能真正认识社会意识、阶级斗争和历史发展的规律。"
]
},

{
    term: "意识",
    content: [
        "<strong>意识</strong>是物质世界长期发展的产物，是高度组织起来的物质——人脑——对客观存在的反映。它不是独立于物质之外的实体，而是移入人的头脑并在人的头脑中改造过的物质的东西。",
        "辩证唯物主义坚持物质第一性、意识第二性的根本原则，坚决反对一切唯心主义、唯我论和神学目的论。意识不仅是自然界长期进化的结果，更是社会实践的产物——劳动和在劳动中产生的语言，是人类意识形成和发展的决定性推动力。",
        "意识一经形成，便具有巨大的能动作用。毛主席指出：“思想等等是主观的东西，做或行动是主观见之于客观的东西。”正确的思想一旦被群众所掌握，就能转化为改造社会、改造世界的强大物质力量。无产阶级政党必须高度重视革命理论建设和意识形态斗争，用马克思主义的科学意识武装人民、战胜资产阶级腐朽思想的侵蚀。"
    ]
},
{
term: "马克思",
content: [
"<strong>马克思</strong>（Karl Marx，1818—1883），马克思主义的主要创立者，国际共产主义运动的伟大导师，全世界无产阶级和被压迫人民的革命理论家。马克思同恩格斯一起创立了科学社会主义，把无产阶级反对资产阶级的斗争从自发反抗提高到自觉革命，把社会主义从空想变成科学。马克思的名字同辩证唯物主义、历史唯物主义、剩余价值学说和无产阶级革命理论不可分割地联系在一起。",
"马克思生活的时代，是资本主义在欧洲迅速发展、机器大工业兴起、无产阶级形成并走上历史舞台的时代。资产阶级革命打碎了许多封建枷锁，却又建立起新的资本统治；工人被集中到工厂、矿山和城市中，在资本家的压榨下创造巨大财富，却陷入贫困、失业和异化。马克思正是在这种历史条件下，把无产阶级的现实斗争同科学理论结合起来，揭示资本主义社会的内在矛盾和灭亡趋势。",
"马克思最伟大的贡献之一，是创立历史唯物主义。历史唯物主义把唯物主义彻底贯彻到社会历史领域，揭示社会存在决定社会意识，生产力和生产关系、经济基础和上层建筑之间的矛盾运动，是社会发展的根本动力。人类历史不是少数英雄、帝王和思想家任意创造的，而是人民群众在一定生产方式和阶级关系中进行实践斗争的结果。阶级斗争是阶级社会发展的直接动力。",
"马克思对旧哲学进行了革命改造。他批判黑格尔唯心主义辩证法，吸收其中关于运动、矛盾和发展的合理内核；又批判费尔巴哈旧唯物主义的直观性和非历史性，把实践提到认识论和历史观的中心地位。马克思主义哲学不是解释世界的书斋哲学，而是改造世界的革命世界观和方法论。它公开申明自己的阶级性，服务于无产阶级和劳动人民的解放事业。",
"马克思在政治经济学上的伟大贡献，是创立剩余价值学说，彻底揭露资本主义剥削的秘密。资本主义表面上是自由平等的商品交换，工人把劳动力卖给资本家，资本家支付工资；实质上，工人在劳动过程中创造的价值超过劳动力价值，超过部分被资本家无偿占有，这就是剩余价值。利润、利息、地租和资本积累，都建立在无产阶级剩余劳动被剥夺的基础上。",
"《资本论》是马克思主义政治经济学的巅峰著作。马克思从商品这一资本主义经济的细胞入手，分析价值、货币、资本、剩余价值、工资、积累、利润、地租和危机，揭示资本主义生产方式的运动规律。资本主义不是永恒制度，而是历史形成的、充满内在矛盾的阶级社会。资本主义越发展，生产越社会化，资本越集中，无产阶级队伍越壮大，它自身灭亡的条件也越成熟。",
"马克思同恩格斯共同起草的《共产党宣言》，第一次以纲领形式宣告无产阶级革命的历史使命。宣言指出，至今一切社会的历史都是阶级斗争的历史；资产阶级曾经起过巨大的革命作用，但它也创造了自己的掘墓人——无产阶级。无产阶级只有推翻资产阶级统治，消灭资本主义私有制，建立自己的政权，才能解放自己，并最终解放全人类。",
"马克思的科学社会主义，同空想社会主义有根本区别。空想社会主义者同情劳动人民，批判资本主义罪恶，却不能科学揭示资本主义灭亡的规律，也找不到改造社会的现实力量。马克思从资本主义生产方式本身出发，指出无产阶级是最彻底、最革命的阶级，是社会主义革命的主体力量。社会主义不是善良愿望和道德劝说的结果，而是无产阶级阶级斗争发展的必然产物。",
"马克思高度重视无产阶级政权问题。巴黎公社的经验使马克思更加明确地指出，无产阶级不能简单夺取现成的资产阶级国家机器，而必须打碎旧国家机器，建立自己的政治统治。无产阶级专政不是少数人的专制，而是劳动人民镇压剥削阶级反抗、改造旧社会、向共产主义过渡的国家形式。没有无产阶级专政，就没有资本主义向共产主义的真正过渡。",
"马克思不仅是理论家，也是革命活动家。他参加和指导国际工人运动，推动共产主义者同盟和第一国际的发展，长期同各种机会主义、改良主义、无政府主义和资产阶级思想进行斗争。马克思主义从一开始就不是学院里的中立学说，而是无产阶级革命运动的理论武器。理论同工人运动结合，才使无产阶级从自在阶级变成自为阶级。",
"马克思的思想同恩格斯的贡献不可分割。恩格斯不仅在理论上同马克思共同创立科学社会主义，而且在实践、经济支持、著作整理和国际运动中作出巨大贡献。马克思主义不是孤立个人的思想体系，而是无产阶级革命实践、科学研究和国际工人运动共同发展的产物。马克思和恩格斯把德国古典哲学、英国古典政治经济学和法国空想社会主义批判地改造为无产阶级的科学理论。",
"马克思主义在马克思逝世后继续发展。列宁把马克思主义推进到帝国主义和无产阶级革命时代，创立列宁主义，领导十月革命建立世界上第一个社会主义国家。毛主席把马克思列宁主义同中国革命和社会主义建设实践相结合，发展了新民主主义革命、人民战争、群众路线、矛盾学说和无产阶级专政下继续革命理论。马克思主义的生命力，正在于它不是僵死教条，而是在革命实践中不断发展的科学。",
"资产阶级和修正主义者总是试图歪曲马克思。有的把马克思变成普通经济学家，有的把马克思变成人道主义改良家，有的只谈青年马克思而否定成熟马克思，有的只引用个别词句而取消阶级斗争和无产阶级专政。这些歪曲的共同目的，是阉割马克思主义的革命锋芒，使它不再威胁资本主义制度。真正的马克思，属于无产阶级革命，属于打碎旧世界、建设新世界的历史运动。",
"从马列毛主义立场看，马克思的伟大意义，在于他第一次科学地揭示了资本主义剥削的秘密和人类社会发展的规律，指出无产阶级推翻资产阶级、消灭私有制、建立共产主义社会的历史道路。马克思主义不是书本装饰，也不是抽象信仰，而是无产阶级认识世界和改造世界的武器。只要资本主义剥削和阶级压迫仍然存在，马克思主义就仍然是劳动人民争取解放的科学旗帜。"
]

        // === 🚀 2. 中枢控制逻辑 ===
        const dictInput = document.getElementById('dictInput');
        const dictBtn = document.getElementById('dictBtn');
        const entryContainer = document.getElementById('entryContainer');

        // 监听输入框：有字就让查询按钮浮现
        dictInput.addEventListener('input', function() {
            const keyword = this.value.trim();
            if (keyword.length > 0) {
                dictBtn.classList.add('show');
            } else {
                dictBtn.classList.remove('show');
            }
        });

        // 监听回车键查询
        dictInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                executeSearch();
            }
        });

        // 监听按钮点击查询
        dictBtn.addEventListener('click', executeSearch);

// 核心检索与渲染引擎 (升级版：智能多词条阵列)
        function executeSearch() {
            const keyword = dictInput.value.trim().toLowerCase();
            if (keyword === '') return;

            // 为了触发每次查询的入场动画，先隐藏容器，强迫浏览器重绘
            entryContainer.style.display = 'none';
            entryContainer.innerHTML = '';

            // 🚀 核心战术变革 1：从 find 改为 filter，把所有包含关键字的词条全捞出来！
            let results = DICTIONARY_DATA.filter(item => 
                item.term.toLowerCase().includes(keyword) || 
      (item.aliases && item.aliases.some(alias => alias.toLowerCase().includes(keyword)))
            );

// 🚀 核心战术变革 2：智能排序引擎
            results.sort((a, b) => {
                // 判断是否是完全精确匹配
                /* 🚀 同样加上 a.aliases && 和 b.aliases && 的容错装甲 */
                const exactA = a.term.toLowerCase() === keyword || (a.aliases && a.aliases.some(al => al.toLowerCase() === keyword));
                const exactB = b.term.toLowerCase() === keyword || (b.aliases && b.aliases.some(al => al.toLowerCase() === keyword));
                
                if (exactA && !exactB) return -1; 
                if (!exactA && exactB) return 1;
                
                return a.term.length - b.term.length;
            });

            // 🚀 核心战术变革 3：多卡片阵列生成
            if (results.length > 0) {
                let allCardsHtml = '';
                
                results.forEach((result, index) => {
                    const paragraphsHtml = result.content.map(p => `<p>${p}</p>`).join('');
                    // 🚀 瀑布流补丁：多张卡片同时出现时，给后面的卡片增加 0.15s 的梯次延迟，极具视觉冲击力！
                    const delay = index * 0.15; 
                    
                        allCardsHtml += `
                        <div class="entry-card" style="animation: entryFadeIn 1s ease ${delay}s backwards;">
                            <h2 class="entry-title">${result.term}</h2>
                            <div class="entry-line" aria-hidden="true">
                                <span></span>
                                <strong>★</strong>
                                <span></span>
                            </div>
                            <div class="entry-text">
                                ${paragraphsHtml}
                            </div>
                        </div>
                    `;
                });
                
                entryContainer.innerHTML = allCardsHtml;
            } else {
                // 未找到时的反馈
                entryContainer.innerHTML = `
                    <div class="not-found">
                        报告同志：辞典尚未收录“${dictInput.value.trim()}”相关条目。
                    </div>
                `;
            }

            // 重新显示容器，触发升空入场动画
            entryContainer.style.display = 'block';
            
            // 🚀 强制浏览器进行一次重绘！这是确保 CSS 动画 100% 触发的核心命令！
            void entryContainer.offsetWidth;
        }
            

        function initDefaultEntry() {

const defaultResult = DICTIONARY_DATA.find(item => item.term === "列宁");
            
   if (defaultResult) {
                const paragraphsHtml = defaultResult.content.map(p => `<p>${p}</p>`).join('');
                entryContainer.innerHTML = `
                    <div class="entry-card initial-delay">
                        <h2 class="entry-title">${defaultResult.term}</h2>
                        <div class="entry-line" aria-hidden="true">
                            <span></span>
                            <strong>★</strong>
                            <span></span>
                        </div>
                        <div class="entry-text">
                            ${paragraphsHtml}
                        </div>
                    </div>
                `;
                
                // 让卡片在开局瞬间展现，同样触发你之前写好的绝美升空动画
                entryContainer.style.display = 'block';
            }
        }

        // 🚀 引擎通电：一进页面立刻执行！
        initDefaultEntry();

    </script>
