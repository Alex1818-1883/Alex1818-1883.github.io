            text-decoration: none;
            font-size: 18px;
            font-weight: bold;

 padding: 80px 20px 60px;

         animation: fadeInUp 1s ease-out 0.1s forwards;

animation: entryFadeIn 1s ease;

     animation: entryFadeIn 1s ease 0.6s backwards !important;

animation: entryFadeIn 1s ease;

            .dict-search-input { font-size: 18px; padding: 18px 105px 18px 25px; }

            .entry-card { padding: 35px 25px; border-left-width: 5px; }
            .entry-title { font-size: 30px; }
            .entry-text p { font-size: 16px; line-height: 1.9; }
           footer h3 {

    </style>

"实践和认识的关系，是辩证统一的关系。实践产生认识，认识反过来指导实践；实践检验认识，认识又在实践中获得新的发展。毛主席概括的“实践、认识、再实践、再认识”，揭示了人类认识发展的基本道路。这个过程不是一次完成的，而是随着客观世界和社会斗争的发展，循环往复以至无穷，并且每一次都可能提高到新的水平。",
"实践观点同唯心主义认识论根本对立。唯心主义把认识说成主观精神、天赋观念或绝对理念的产物，割断认识同客观世界和社会实践的联系；不可知论怀疑人能否认识客观真理；教条主义把书本词句当成现成答案；经验主义则把局部经验当成普遍真理。这些错误都背离了实践是认识基础的唯物主义原则。",
"实践不是盲目的活动，而是有目的、有意识的社会活动。人不同于动物，就在于人能够在一定认识指导下改造对象，把主观目的转化为客观结果。但是，主观目的是否正确，必须接受客观实践检验。脱离客观条件的愿望，不能代替实践；脱离群众和现实矛盾的口号，也不能代替革命行动。",
"群众实践是历史发展的真正基础。人民群众在生产斗争、阶级斗争和科学实验中创造历史，积累经验，推动社会前进。无产阶级政党不能把自己凌驾于群众实践之上，不能靠少数干部关门制定路线，而必须深入群众，调查研究，总结群众经验，再把正确认识带回群众中去，化为改造世界的物质力量。",
"在革命和社会主义建设中，坚持实践观点，就是坚持实事求是。革命路线必须从本国社会实际、阶级关系、群众状况和斗争条件出发，不能照抄外国经验，不能迷信书本公式，也不能凭主观热情蛮干。马列毛主义不是僵死教条，而是行动指南；只有同具体实践结合，才能成为指导革命胜利的科学武器。",
"从马列毛主义立场看，实践是认识论、群众路线和革命路线的统一基础。无产阶级通过实践认识资本主义和一切剥削制度的本质，又通过实践组织群众、推翻旧世界、建设新社会。实践证明真理，也创造新的历史条件。离开实践，就没有真正的马克思主义；坚持实践观点，才能不断反对教条主义、经验主义、修正主义和一切脱离群众的错误路线。"
]
},

{
term: "货币",
content: [
"<strong>货币</strong>是商品交换发展到一定阶段的产物，是固定地充当一般等价物的特殊商品。它不是从来就有的自然物，也不是某个国家凭空创造出来的符号，而是商品生产和商品交换内部矛盾发展的结果。当商品世界需要一种共同尺度来表现各种商品的价值时，某一种特殊商品便从普通商品中分离出来，成为其他一切商品价值的共同表现形式，这就是货币。",
"货币的本质，是一般等价物。普通商品只能表现自身的使用价值和价值，而货币能够表现其他一切商品的价值，使各种不同商品能够按照一定比例相互交换。货币之所以具有社会力量，不是因为金银、纸币或数字本身神秘，而是因为它代表着一定社会关系。在商品社会中，人与人之间的劳动关系，必须通过商品和货币的关系表现出来。",
"货币产生以前，商品交换经历了从偶然交换到扩大的价值形式，再到一般价值形式的发展过程。最初是一种商品同另一种商品偶然交换，后来许多商品都同某一种商品交换，最后某一种商品固定地成为一般等价物。历史上，牲畜、盐、贝壳、金属等都曾在不同社会中充当过货币形式，其中金银由于质地均匀、易于分割、便于保存和单位价值较高，长期成为典型货币材料。",
"货币的第一种职能，是价值尺度。商品的价值必须通过一定数量的货币表现出来，表现为价格。货币作为价值尺度，并不是任意给商品贴标签，而是以社会必要劳动时间为基础，把商品价值转化为价格形式。价格可以受供求、竞争和货币流通条件影响而上下波动，但归根到底仍然围绕价值运动。价值尺度职能使商品世界获得统一的计算形式。",
"货币的第二种职能，是流通手段。在商品交换中，商品所有者先把商品卖出换成货币，再用货币购买其他商品，形成商品—货币—商品的运动。货币作为流通手段，把物物交换分裂为卖和买两个环节，扩大了商品交换范围，也使交换危机成为可能。卖和买一旦分离，商品可能卖不出去，货币可能滞留在购买者手中，商品生产的矛盾就会表现为市场危机。",
"货币还具有贮藏手段职能。商品所有者可以把货币从流通中取出保存起来，把社会财富的一般形式集中到自己手中。在金属货币条件下，货币贮藏表现为金银积累；在资本主义社会中，货币贮藏进一步同资本积累、银行存款、金融资产和信用制度结合起来。货币作为贮藏手段，表现出私人占有社会劳动成果的力量。",
"货币作为支付手段，是债务、信用和延期支付发展的结果。在这种情况下，商品可以先交付，货币以后支付，债权债务关系由此形成。支付手段的发展扩大了商品交换和资本运动，但也加深了经济联系的脆弱性。债务链条一旦断裂，支付危机就会迅速扩散。资本主义信用制度的发展，使货币的支付职能成为金融危机的重要环节。",
"货币还具有世界货币职能。在国际交换中，货币越出一国范围，充当世界市场上的支付手段、购买手段和财富代表。历史上金银长期充当世界货币，后来强国货币和金融体系在国际贸易、债务、投资和储备中占据重要地位。世界货币关系从来不是单纯技术问题，它反映着世界市场、国际分工、帝国主义霸权和被压迫国家经济依附关系。",
"在资本主义社会中，货币进一步转化为资本。简单商品流通的公式是商品—货币—商品，目的是取得使用价值；资本运动的公式则是货币—商品—更多货币，目的是价值增殖。货币本身不能创造价值，只有当货币购买劳动力和生产资料，并在生产过程中榨取工人的剩余劳动时，货币才转化为资本。因此，资本主义社会中货币增殖的秘密，不在流通领域，而在雇佣劳动剥削之中。",
"货币具有强烈的拜物教性质。在商品社会里，人们创造的社会关系反过来支配人，货币表现为支配一切商品、一切劳动和一切人的神秘力量。人们似乎不是通过自己的劳动和社会关系生活，而是受货币多少支配。资产阶级社会把人的能力、尊严、关系和生活条件都转化为货币问题，使货币成为资本主义异化的集中表现。",
"纸币、信用货币和数字货币的发展，改变的是货币形式，不改变货币所反映的商品关系和阶级关系。纸币不再像金属货币那样本身具有充分价值，而是依靠国家权力、信用体系和流通需要发挥货币职能。现代资本主义金融体系把货币、信用、债务、证券和虚拟资本结合起来，使资本运动更加庞大和复杂，也使危机更加集中和猛烈。货币形式越现代，越不能掩盖其背后的资本主义剥削关系。",
"社会主义社会在一定历史阶段仍然会保留货币和商品交换。这是因为社会生产力、所有制结构、集体经济之间的交换、个人消费品分配和资产阶级法权仍然没有完全消失。社会主义必须利用货币进行核算、交换和分配，但不能让货币支配社会，不能让利润和市场成为经济生活的统帅。社会主义条件下限制货币关系和资产阶级法权，是防止资本主义复辟的重要任务。",
"从历史唯物主义看，货币不是永恒制度，而是商品生产发展到一定阶段的历史产物。它在促进交换、扩大社会联系和发展生产力方面曾经具有重要作用，但在阶级社会中又成为剥削、债务、资本积累和社会异化的重要工具。无产阶级研究货币，不能停留在钱币、价格和金融表面，而要看到货币背后的商品关系、劳动关系和阶级关系。只有消灭资本主义私有制和商品生产的统治地位，货币对人的支配才能最终被扬弃。"
]
},

{
term: "君主立宪制",
content: [
"<strong>君主立宪制</strong>是资产阶级国家中保留君主作为国家元首，同时以宪法、议会、内阁和法律形式限制君主权力的一种政体形式。它通常表现为君主在形式上代表国家连续性和传统权威，实际政治权力则由议会、内阁、首相、政党和资产阶级国家机器掌握。君主立宪制不是封建君主专制的简单延续，也不是超阶级的民主制度，而是资产阶级同旧贵族力量妥协、改造并利用君主制度的一种国家形式。",
"君主立宪制产生的历史背景，是资产阶级反封建斗争和资本主义发展。资产阶级在上升时期需要打破封建专制、贵族特权和王权任意统治，但在许多国家又不能或不愿彻底废除君主制度，于是通过宪法、议会和责任内阁限制王权，把旧君主改造成资产阶级统治秩序的一部分。英国资产阶级革命后的政治发展，就是君主立宪制形成的重要典型。",
"君主立宪制的历史进步性，主要在于它削弱了封建专制王权，扩大了资产阶级参与国家管理的权力，推动了资本主义法律制度、议会政治和现代官僚体系的发展。它相对于绝对君主制具有反封建意义，因为国家权力不再完全以君主个人意志为转移，而是越来越受到资产阶级宪法、议会和法律程序的约束。但是，这种进步性始终限于资产阶级革命范围之内，没有也不可能消灭阶级压迫。",
"君主立宪制的阶级本质，是资产阶级专政。君主是否拥有实权，议会是否选举产生，内阁是否对议会负责，都不能改变国家机器服务哪个阶级的问题。在资本主义社会中，生产资料掌握在资产阶级手中，军队、警察、法院、监狱、官僚机构、媒体和教育体系服务资本主义秩序。君主立宪制只是资产阶级专政披上王冠、礼仪和宪法外衣的一种形式。",
"君主立宪制通常分为二元君主立宪制和议会君主立宪制。二元君主立宪制下，君主仍掌握较大行政权、军权和任命权，议会权力有限；议会君主立宪制下，君主多为象征性国家元首，政府由议会多数派组成并由首相领导。两者的区别在于君主和议会之间的权力分配不同，但只要资本主义私有制没有被推翻，它们都属于资产阶级国家形式。",
"君主立宪制保留君主，具有重要意识形态作用。君主、王室、加冕礼、国歌、勋章、宫廷礼仪和传统象征，被资产阶级用来制造国家共同体幻象，掩盖阶级对立，维护民族主义和国家忠诚。王室被包装成超越党派、代表全民和维系统一的象征，实际上它同土地贵族、大资本、军队、教会、殖民传统和国家机器有深厚联系，是资产阶级统治合法性的装饰物。",
"君主立宪制体现了资产阶级同旧贵族阶级的妥协。许多资本主义国家不是通过彻底摧毁封建贵族政治完成现代国家建设，而是把旧贵族、王室、地主阶级和高级军官集团纳入资产阶级统治联盟。旧贵族保留头衔、土地、社会声望和政治影响，资产阶级则取得经济统治和国家政策主导权。这种妥协说明，资产阶级革命本身具有不彻底性，只要能够保障资本积累，资产阶级完全可以同旧反动势力结合。",
"君主立宪制同议会制密切相关。在许多君主立宪国家，实际政治运转依靠议会、政党、内阁和首相，君主不直接管理日常政府事务。资产阶级把这种制度称为民主政治，实际上议会仍然受资本、媒体、政党机器、金融集团和官僚机构支配。劳动人民可以参加选举，却不能真正掌握生产资料和国家暴力机器。议会民主和王室象征共同维护资本主义统治秩序。",
"在帝国主义时代，君主立宪制并不妨碍殖民掠夺和对外侵略。许多君主立宪国家曾经或仍然参与殖民扩张、帝国主义战争、军事同盟和资本输出。王室传统、民族荣誉和国家仪式常常被用来美化帝国主义历史，遮蔽殖民地人民遭受的掠夺、奴役和屠杀。所谓文明君主制，并不能掩盖资本主义国家对外扩张和对内压迫的阶级本质。",
"君主立宪制在现代社会中常常以温和、稳定、传统和礼仪化的面貌出现，但这种稳定建立在阶级统治被日常化、制度化和文化化的基础上。资产阶级不一定需要君主直接行使暴力；只要军队、警察、法院和资本仍然掌握在统治阶级手中，王室就可以作为国家外观和精神装饰存在。当阶级斗争尖锐时，所谓温和制度也会动用国家机器镇压工人运动和群众反抗。",
"无产阶级评价君主立宪制，必须既看到它相对于封建专制的历史进步作用，也看到它作为资产阶级国家形式的反动本质。反对绝对君主制不能停留在要求宪法和议会，反对王室特权也不能局限于共和制改革。真正的人民解放，不是把王冠拿掉、把首相换成总统，而是打碎资产阶级国家机器，消灭资本主义私有制，建立劳动人民自己的政权。",
"从历史唯物主义看，君主立宪制是资本主义上升时期资产阶级国家建设的一种妥协形式。它用宪法限制君主，用议会代表资产阶级，用王室维持传统合法性，用国家机器维护资本统治。无产阶级研究君主立宪制，不能被王室礼仪、宪法条文和议会程序迷惑，而要抓住生产资料归谁所有、国家机器为谁服务、劳动人民是否真正掌握权力这个根本问题。君主立宪制的本质，仍然是资产阶级专政的一种政治外壳。"
]
},

{
term: "半总统制",
content: [
"<strong>半总统制</strong>是资产阶级共和国中介于总统制和议会制之间的一种政体形式。它通常表现为总统由选举产生，拥有较强政治权力，同时又设有总理和内阁，政府在一定程度上需要对议会负责。半总统制表面上把总统制的行政集中和议会制的内阁责任结合起来，实际上仍然是在资本主义私有制和资产阶级国家机器基础上形成的国家组织形式，归根到底服务资产阶级统治。",
"半总统制的基本特点，是国家行政权在总统和总理之间分配。总统通常掌握外交、国防、国家安全、任命总理、解散议会、主持国家重大政策等权力；总理和内阁则负责日常行政、经济管理和议会关系。在总统所属政治力量控制议会多数时，总统往往成为实际政治中心；在总统和议会多数派不一致时，则可能出现所谓“左右共治”或“共治”局面，总理权力上升，总统权力受到一定限制。",
"半总统制同总统制的区别，在于总统制下总统通常同时是国家元首和政府首脑，内阁对总统负责；半总统制下，总统虽然权力较大，但政府通常由总理领导，并同议会多数关系密切。半总统制同议会制的区别，在于议会制国家的国家元首多为象征性角色，而半总统制总统一般拥有实质政治权力。它把两种资产阶级政体形式结合起来，形成一种更复杂的权力结构。",
"资产阶级理论家常把半总统制说成权力平衡、政治稳定和民主调节的制度设计，好像总统、总理、议会、法院之间的相互牵制能够保障人民利益。实际上，这种平衡主要发生在资产阶级内部不同派别、政党集团、官僚体系和利益集团之间。无论总统和总理如何分权，资本主义国家的军队、警察、法院、官僚机构、金融体系、媒体机器和生产资料仍然掌握在资产阶级手中。",
"半总统制的阶级本质，不能从宪法条文和权力分配表面去理解，而必须从国家机器服务哪个阶级去理解。总统、总理和议会之间可以争夺政策主导权，但他们共同维护资本主义私有制、雇佣劳动制度和资产阶级国家秩序。劳动人民可以参加投票，却不能通过这种制度真正控制资本、军队、警察、司法和经济命脉。半总统制的民主外表掩盖不了资产阶级专政的实质。",
"半总统制常常在政治危机、阶级矛盾尖锐或国家权力需要重新组织时出现。资产阶级既希望通过议会和政党竞争吸收社会矛盾，又希望保留一个强总统来集中处理危机、维持秩序、稳定军队和对外政策。因此，半总统制往往带有双重功能：平时用议会民主和内阁政治制造合法性，危机时则依靠总统权力加强行政集中和国家强制力。",
"半总统制内部容易产生权力冲突。总统和总理可能属于不同政党或不同资产阶级集团，议会多数也可能同总统路线相矛盾。表面上这是民主多元和权力制衡，实质上往往是资产阶级各派围绕国家政策、财政分配、社会控制、外交路线和资本利益进行争斗。劳动人民在这种争斗中通常只是被动动员的选票力量，而不是国家权力的真正主人。",
"半总统制并不防止专断和强人政治。由于总统拥有直接选举产生的合法性，又掌握国防、外交、紧急权力和国家安全机构，在一定条件下可以绕过议会、压制反对派、强化行政命令和推动国家机器个人化。资产阶级民主制度一旦遇到深刻危机，总统权力就可能成为镇压群众、推行紧急状态和维护资本统治的集中工具。",
"在帝国主义国家中，半总统制同对外扩张和军事国家机器也可以紧密结合。总统掌握外交与国防权力，能够代表国家资本集团处理殖民利益、军事同盟、海外干涉和战略部署。议会和内阁的争论并不改变帝国主义国家服务垄断资本、金融资本和军工集团的根本方向。所谓国家利益，往往就是资产阶级整体利益和帝国主义战略利益的政治表达。",
"在依附国家和第三世界国家中，半总统制同样不能保证人民民主。许多国家虽然有总统、总理、议会、宪法和选举，但国家权力实际受军队、高级官僚、买办资产阶级、地主势力、外国资本和帝国主义压力控制。总统和总理的分权形式，不能改变社会经济基础中的阶级压迫和对外依附关系。判断一个国家是否民主，关键不是看是否半总统制，而是看劳动人民是否掌握生产资料和国家权力。",
"无产阶级对半总统制必须坚持阶级分析。它不是通向人民解放的中立技术，也不是比总统制或议会制更接近社会主义的制度。无产阶级可以在一定条件下利用选举、议会和合法政治空间进行宣传和斗争，但绝不能幻想通过半总统制框架和平改造资产阶级国家。只要旧国家机器存在，只要资本掌握经济命脉，劳动人民就不可能真正当家作主。",
"从历史唯物主义看，半总统制只是资产阶级国家政体形式的一种变体。它把总统制的行政集中和议会制的责任内阁结合起来，用复杂的权力分工调节资产阶级内部矛盾，维持资本主义统治秩序。无产阶级研究半总统制，不能停留在总统、总理、议会谁权力更大的制度比较上，而要透过政体形式，看清资产阶级国家的阶级本质。真正的人民民主，只能建立在打碎资产阶级国家机器、建立无产阶级专政和劳动群众掌握国家权力的基础上。"
]
},

{
term: "总统制",
content: [
"<strong>总统制</strong>是资产阶级共和国中一种以总统为国家元首和政府首脑，并由总统掌握行政权的政治制度。它通常同三权分立、定期选举、国会立法、司法审查和政党竞争结合在一起。资产阶级把总统制描绘成权力制衡、民主选举和人民授权的政治形式，实际上，在资本主义私有制和资产阶级国家机器存在的条件下，总统制归根到底仍然是资产阶级专政的一种国家形式。",
"总统制的典型特点，是行政权相对集中在总统手中。总统通常由选举产生，任期固定，不依赖议会多数直接维持职位，内阁成员由总统任命并对总统负责。总统可以领导政府、任命高级官员、指挥军队、制定行政政策、处理外交事务，并在一定条件下拥有否决立法、发布行政命令和宣布紧急状态等权力。总统制因此比一般议会制更突出行政权的集中性和个人化。",
"总统制同议会制既有联系又有区别。议会制下，政府通常由议会多数派产生，并对议会负责；总统制下，总统和议会一般分别产生，彼此具有相对独立的任期和权力来源。资产阶级把这种设计说成权力制衡，仿佛国家机关之间的相互牵制能够防止专制。实际上，这种制衡主要是在资产阶级内部不同派别、不同利益集团和不同国家机关之间分配权力，并不改变国家机器服务资产阶级统治的根本性质。",
"总统制的阶级基础，是资本主义生产资料私有制。无论总统怎样由选举产生，国家的经济命脉、金融体系、媒体机器、军队、警察、法院、官僚机构和教育制度仍然受资产阶级支配。选民可以在不同候选人之间作出选择，但他们不能通过普通投票废除资本主义私有制，不能真正控制垄断资本、军工集团、金融资本和国家暴力机器。总统制的民主形式掩盖着资本统治的实质。",
"总统选举是总统制最重要的合法性来源，但这种选举本身深受资本控制。竞选需要巨额资金、媒体宣传、政党机器、智库顾问、广告工业和利益集团支持。大资本通过政治献金、游说组织、媒体议程、社会舆论和政党制度筛选候选人，限制群众选择范围。劳动人民虽然有投票权，却很难真正决定国家路线。所谓全民选出的总统，往往只是资产阶级不同集团之间竞争和妥协的结果。",
"总统制容易强化行政集权和国家机器的独立化倾向。总统以全民授权名义掌握行政系统，能够绕过普通群众和议会程序，通过行政命令、国家安全机构、军事指挥和官僚体系推行政策。在阶级矛盾尖锐、战争危险加剧或经济危机爆发时，总统制往往更容易向强人政治、紧急状态、军事扩张和警察国家方向发展。资产阶级民主的外壳可以迅速转化为公开的国家暴力。",
"总统制同帝国主义战争机器密切相连。许多总统制国家，尤其是帝国主义国家，总统往往同时是武装力量最高统帅，掌握发动战争、部署军队、签署军事命令和指挥海外干涉的重要权力。资产阶级把这些权力说成保卫国家安全，实际上常常服务于垄断资本、军工集团、能源利益、地缘战略和对外霸权。总统制中的行政权集中，使帝国主义国家更便于快速发动军事行动和对外干涉。",
"总统制并不天然代表稳定和民主。总统同议会可能由不同资产阶级派别控制，形成政治僵局；总统也可能利用民粹宣传、民族主义情绪和危机动员扩大个人权力；军队、法院、情报机关和金融资本也可能在总统制框架内深度影响国家路线。资产阶级制度下的政治危机，根源不在于总统制设计是否完善，而在于资本主义社会内部不可调和的阶级矛盾和利益冲突。",
"在半殖民地、依附国家和第三世界国家中，总统制常常同军阀政治、买办资产阶级和帝国主义控制结合在一起。许多国家表面上有总统、宪法、议会和选举，实际政治却受军队、高级官僚、地主买办集团、外国资本和帝国主义大使馆支配。总统可能成为民族资产阶级改革的代表，也可能成为买办集团和军人独裁的工具。形式上的总统制不能说明国家性质，阶级基础和对外依附关系才是关键。",
"无产阶级不能把总统制同真正人民民主混为一谈。真正的人民民主不是把国家权力集中到一个定期选举的总统手中，而是劳动人民直接组织起来，掌握生产资料，管理国家事务，监督干部，改造社会关系。无产阶级政权要求打碎资产阶级国家机器，建立工人、农民和广大劳动群众自己的政权形式，而不是在资产阶级总统制框架内更换统治者。",
"修正主义者和改良主义者常常幻想通过总统选举和平取得政权，进而在不触动资产阶级国家机器的情况下实现社会主义。这种幻想忽视了军队、警察、法院、官僚体系、金融资本和媒体机器的阶级性质。即使左翼候选人在总统选举中获胜，如果不发动群众、不打碎旧国家机器、不剥夺资产阶级经济权力，也会被资本罢工、军事政变、司法围剿、外部干涉和官僚抵抗所限制，最终走向妥协或失败。",
"从历史唯物主义看，总统制不是超阶级的政治技术，而是资本主义国家在特定历史条件下形成的一种政权组织形式。它可以同资产阶级民主结合，也可以同强人政治、军国主义和帝国主义扩张结合；它可以表现为多党竞选，也可以沦为独裁外壳。判断总统制，不能看宪法条文和选举形式，而要看哪个阶级掌握国家机器，哪个阶级控制生产资料，国家权力服务于谁的利益。无产阶级必须透过总统制的民主外表，看清资产阶级专政的阶级本质。"

},

{
term: "议会制",
content: [
"<strong>议会制</strong>是资产阶级国家中以议会为主要政治舞台，通过选举产生议员、组成议会、制定法律、监督政府或组织政府的一种政治制度。它在不同国家有不同形式，既可以表现为君主立宪制下的议会政治，也可以表现为民主共和制下的议会制度。资产阶级把议会制吹捧为人民主权、民主政治和自由制度的典范，实际上，在资本主义私有制和资产阶级国家机器存在的条件下，议会制归根到底是资产阶级专政的一种政治形式。",
"议会制的历史进步性，主要体现在它反对封建专制、王权神授和贵族世袭统治的斗争中。资产阶级在上升时期利用议会、选举、宪法和代议制度，限制封建君主权力，扩大资产阶级参与国家管理的权利，推动资本主义制度取代封建制度。相对于赤裸裸的封建专制，议会制曾经具有一定反封建意义。但是，这种进步性始终服务于资产阶级夺取和巩固政权，而不是为了实现劳动人民的真正解放。",
"议会制的阶级基础，是资本主义生产资料私有制。议会中的法律、预算、税收、军费、贸易政策、社会政策和国家制度，最终都围绕维护资本主义私有财产和资产阶级统治展开。工人和劳动群众可以在形式上投票，可以把某些代表送进议会，但国家机器、经济命脉、新闻媒体、教育体系、军队、警察、法院和官僚机构仍然掌握在资产阶级手中。形式上的政治平等掩盖不了现实中的阶级不平等。",
"议会制的核心欺骗性，在于它把国家权力说成全体人民共同意志的体现。资本主义社会中，选举需要金钱、媒体、组织、宣传机器和社会资源，大资本能够控制政党、操纵舆论、影响政策、收买议员和塑造所谓公共意见。劳动人民虽然拥有一张选票，却无法真正控制资本、国家机器和议会决策。议会表面上代表全民，实质上是资产阶级各派利益进行谈判、妥协和分配的场所。",
"议会制同资产阶级政党制度密切结合。资产阶级政党表面上相互竞争，实际上大多承认资本主义私有制、雇佣劳动制度和资产阶级国家框架。不同政党可以在税率、福利、外交、文化和管理方式上争吵，却很少触动资本统治的根本。议会选举把群众不满周期性地吸收到投票、换届和政党轮替中，使劳动人民误以为更换一批议员或政府就能改变社会根本矛盾。",
"议会制不能消灭资产阶级国家的暴力本质。军队、警察、监狱、法院、情报机关和官僚机器并不因为议会存在而变成中立工具。只要无产阶级斗争没有威胁资本统治，资产阶级可以维持议会民主的外衣；一旦革命运动高涨，议会制就会让位于紧急状态、镇压法令、军事戒严甚至法西斯独裁。法西斯主义正是垄断资产阶级在议会民主无法维持统治时撕下民主面纱的公开恐怖专政。",
"无产阶级可以在一定历史条件下利用议会斗争，但不能迷信议会道路。革命政党参加选举、进入议会、利用合法讲坛揭露资产阶级统治，可以成为宣传群众、揭露敌人、积累力量的一种策略。但议会斗争不能代替群众斗争，不能代替革命组织，不能代替打碎旧国家机器。把议会道路当成社会主义革命的根本道路，就是典型的改良主义和机会主义。",
"议会制同无产阶级专政根本不同。无产阶级政权不是让劳动人民每隔几年投票选择压迫自己的代表，而是要打碎资产阶级国家机器，建立劳动人民自己的政权机关，使工人、农民和广大群众直接参加国家管理、监督干部、管理生产和改造社会。巴黎公社、苏维埃、革命委员会等历史形式，都体现了同资产阶级议会制不同的无产阶级民主方向。",
"议会制在帝国主义时代更加腐朽。垄断资本、金融资本、军工集团、媒体集团和跨国公司对议会政治的控制越来越深，所谓民主选举越来越依赖资本投入、舆论操纵和利益集团博弈。议会中的争论常常只是资产阶级内部不同集团之间的利益调整，而对外侵略、军费扩张、殖民压迫、经济危机转嫁和镇压工人运动等根本问题，仍然服从垄断资本和帝国主义国家利益。",
"修正主义者常常用议会制和议会道路阉割无产阶级革命。他们把合法斗争绝对化，把议会席位看得高于群众斗争，把阶级合作说成民主政治，把和平过渡说成社会主义道路。这样的路线必然使无产阶级政党丧失革命性，变成资产阶级议会政治的附属品。第二国际修正主义和后来的现代修正主义，都反复证明议会迷信会把工人运动引向失败和投降。",
"从历史唯物主义看，议会制不是超阶级的民主制度，而是资本主义国家在一定历史阶段形成的资产阶级政治形式。它曾经反对封建专制，但在资本主义确立以后，就成为维护资产阶级专政、欺骗劳动群众、调节资产阶级内部矛盾的重要工具。无产阶级必须揭穿议会制的阶级本质，既善于在必要时利用议会斗争，又绝不把议会道路当作革命道路。真正的人民民主，只能建立在无产阶级领导、生产资料公有制和劳动群众掌握国家权力的基础上。"
]
},

{
term: "第三次科技革命",
content: [
"<strong>第三次科技革命</strong>是20世纪中期以后兴起的一场以原子能、电子计算机、自动化、航天技术、生物工程、新材料、信息技术和现代通信技术为主要标志的科学技术革命。它不同于第一次工业革命以蒸汽机和机器大工业为中心，也不同于第二次工业革命以电力、钢铁、化学工业和内燃机为中心，而是把科学、技术、生产、军事、管理和社会生活更加紧密地结合起来，使人类生产力进入高度复杂化、系统化和信息化的新阶段。",
"第三次科技革命产生的背景，是第二次世界大战以后世界资本主义、社会主义阵营和民族解放运动之间的激烈斗争。战争推动了雷达、航空、火箭、核技术、通信和计算技术的发展，战后美苏争霸、军备竞赛、国家垄断资本主义扩张和社会主义建设需要，又进一步加速了科学技术同国家机器、军事体系和大工业生产的结合。科学不再只是实验室中的认识活动，而越来越直接成为国家力量和社会生产力的重要组成部分。",
"原子能技术是第三次科技革命的重要标志之一。核裂变和核能利用显示出人类认识自然、改造自然的巨大能力，但在资本主义和帝国主义条件下，它首先以原子弹、核威慑和军备竞赛的形式登上历史舞台。科学技术本身具有解放生产力的可能，但掌握在帝国主义和垄断资本手中，就会变成屠杀人民、威胁世界和维持霸权的工具。核技术的历史最鲜明地说明，技术的阶级归属决定技术的社会作用。",
"电子计算机和信息技术是第三次科技革命的核心内容。计算机把计算、存储、控制、通信和数据处理能力大规模提高，使生产管理、科学研究、军事指挥、金融流通、交通运输和社会组织发生深刻变化。信息技术的发展提高了社会化生产的协调能力，使资本主义生产过程更加依赖复杂系统、知识劳动和网络结构。生产越依赖全社会协作，生产成果却越被少数资本集团占有，资本主义基本矛盾就越尖锐。",
"自动化和控制技术改变了劳动过程。机器不再只是代替人的体力劳动，而是越来越多地代替部分脑力劳动、判断过程和管理流程。自动化能够减少必要劳动、提高效率、降低重复劳动强度，本来包含着缩短劳动时间和解放人的可能；但在资本主义制度下，它常常变成资本家排挤工人、提高劳动强度、压低工资、扩大失业后备军和榨取相对剩余价值的手段。",
"航天技术和现代通信技术扩大了人类活动空间。卫星、火箭、远程通信、导航系统和全球信息网络，把世界各地更加紧密地连接起来。它们可以服务科学探索、气象预报、交通通信和社会协作，也可以服务军事侦察、导弹制导、全球监控和帝国主义战争体系。第三次科技革命使世界联系更加密切，同时也使帝国主义国家控制世界、监视人民和发动战争的能力显著增强。",
"第三次科技革命推动了知识劳动和科研体系的社会化。现代科学研究越来越需要大学、研究机构、企业实验室、国家投入、国际合作和大规模设备。个人天才仍然重要，但科学技术发展越来越依靠集体劳动和社会组织。资本主义把这种社会化科研体系纳入专利、垄断、军工、金融和市场竞争之中，使全社会创造的知识成果被资本私人占有，成为垄断利润和技术霸权的来源。",
"第三次科技革命加深了垄断资本主义和国家垄断资本主义的发展。高科技产业需要巨额投资、长期研发、军事订单、国家补贴、知识产权保护和全球供应链，普通小资本无法与巨型垄断集团竞争。大型科技公司、军工集团、金融资本和国家机器结合得越来越紧密，形成新的垄断结构。所谓自由创新，实际上越来越依赖国家财政、军事需求、平台垄断和资本集中。",
"第三次科技革命也改变了帝国主义对第三世界的控制方式。帝国主义不仅依靠军事基地、金融债务和资源掠夺，也依靠技术标准、专利制度、数字平台、通信网络、芯片供应、数据控制和知识产权体系维持新殖民主义优势。被压迫国家如果不能建立独立的科学技术和工业体系，就会在关键设备、软件、能源、通信和军事技术上受制于人，国家独立也会受到严重限制。",
"社会主义条件下的第三次科技革命具有不同方向。社会主义需要发展科学技术，需要掌握原子能、计算机、自动化、航天、生物工程和现代工业体系，但这一切必须服务劳动人民、服务公有制、服务计划经济和国防独立。技术不能凌驾于政治路线和群众利益之上，专家不能凌驾于工农群众之上，生产力发展不能脱离生产关系和上层建筑改造。否则，技术进步就可能被修正主义和新资产阶级利用，变成资本主义复辟的工具。",
"第三次科技革命同唯生产力论有密切斗争关系。修正主义者常常用科学技术发展、现代化、效率和管理为名，否定阶级斗争，否定无产阶级专政，否定群众参加管理，把社会主义建设引向专家治国、技术崇拜、利润挂帅和市场化道路。真正的马克思主义态度，不是反对科学技术，而是反对资产阶级路线支配科学技术。技术必须由劳动人民掌握，必须接受无产阶级政治领导，必须服务社会主义方向。",
"第三次科技革命的历史意义，在于它进一步证明生产力已经具有高度社会化、全球化和知识化性质。现代科学技术的发展要求全社会协作、长期计划、公共投入和统一组织，这同资本主义私人占有、垄断竞争、利润支配和帝国主义霸权发生越来越尖锐的冲突。第三次科技革命没有消灭资本主义矛盾，而是把这些矛盾推进到新的高度。只有社会主义公有制和无产阶级领导下的计划经济，才能使现代科学技术真正摆脱资本统治，成为缩短劳动时间、提高人民生活、发展人的全面能力和迈向共产主义的强大力量。"
]
},

{
term: "第二次工业革命",
content: [
"<strong>第二次工业革命</strong>是19世纪后期到20世纪初发生的以电力、钢铁、化学工业、石油、内燃机、汽车、电话、电报和现代大企业组织为主要标志的工业技术变革。它不同于第一次工业革命以蒸汽机、纺织机械、煤炭和铁路为中心的阶段，而是把资本主义机器大工业推进到更高水平，使生产规模、技术复杂性、企业集中程度和世界市场联系都发生巨大变化。第二次工业革命是资本主义由自由竞争阶段走向垄断资本主义和帝国主义阶段的重要物质基础。",
"第二次工业革命的技术核心，是电力的广泛应用。发电机、电动机、电灯、电车、电报、电话和电力输送系统的发展，使工业动力摆脱了单纯依赖蒸汽机和煤炭地点的限制。电力能够更灵活地分配到机器、工厂、城市和交通系统中，推动生产过程更加连续、精密和大规模化。资本主义工业由此获得新的动力体系，工厂管理和劳动组织也随之发生变化。",
"钢铁工业和化学工业是第二次工业革命的重要支柱。炼钢技术进步使钢铁大量用于铁路、桥梁、军舰、机器、建筑和武器制造；化学工业则推动染料、化肥、炸药、药品、合成材料和工业原料发展。这些部门需要巨额固定资本、复杂技术、科研体系和大规模设备，不再适合小资本分散经营，必然推动大企业、大银行和国家力量更紧密地结合起来。",
"石油工业和内燃机的发展，开辟了新的能源和交通时代。石油成为重要战略资源，内燃机推动汽车、飞机、现代舰船和机械化运输发展。交通速度和军事机动能力大大提高，资本主义国家对石油产地、海上通道、殖民地和半殖民地的争夺更加激烈。能源技术的进步不是中立的，在帝国主义体系中，它直接转化为垄断资本扩张、军事竞争和殖民掠夺的新动力。",
"第二次工业革命推动了科学同生产的更紧密结合。第一次工业革命中的许多技术发明还带有经验工匠性质，第二次工业革命则越来越依靠实验科学、工程技术、大学研究、企业实验室和国家科研体系。科学知识被资本吸收到生产过程之中，成为提高劳动生产率和扩大剩余价值榨取的重要手段。资本主义把科学变成生产力，同时又把科学置于利润、军工和垄断竞争的支配之下。",
"第二次工业革命极大推动了生产社会化。电力系统、铁路网络、钢铁厂、化工厂、矿山、油田、汽车厂和军工企业都需要大量工人协作、大规模资本投入和复杂社会分工。单个工人的劳动越来越成为庞大社会劳动体系中的一个环节，生产资料越来越集中在少数资本集团手中。生产越来越社会化，成果却仍由资本家和垄断集团私人占有，资本主义基本矛盾因此更加尖锐。",
"第二次工业革命加速了资本集中和垄断组织形成。大工业部门投资巨大，技术门槛高，市场竞争激烈，小企业难以同大企业抗衡，资本不断向少数企业和金融集团集中。卡特尔、辛迪加、托拉斯、康采恩等垄断组织相继出现，银行资本同工业资本日益融合，金融资本逐步形成。自由竞争资本主义在自身发展中走向自己的反面，即垄断资本主义。",
"第二次工业革命推动资本主义进入帝国主义阶段。垄断组织为了取得原料、市场、投资场所和战略据点，加紧资本输出和殖民扩张。列强争夺非洲、亚洲、拉丁美洲和世界海上通道，把落后国家和被压迫民族更深地卷入世界资本主义体系。世界已经被少数帝国主义强国基本瓜分完毕，后起帝国主义国家要求重新瓜分世界，最终加剧帝国主义战争危险。",
"第二次工业革命改变了世界资本主义力量格局。英国在第一次工业革命中长期居于领先地位，但到第二次工业革命时期，德国和美国依靠钢铁、化工、电力、机械和大企业组织迅速崛起，逐步挑战英国霸权。资本主义世界内部发展不平衡更加突出，老牌帝国主义和新兴帝国主义之间的矛盾日益尖锐。这种不平衡发展，是帝国主义战争和世界重新瓜分的重要根源。",
"第二次工业革命也深刻改变了无产阶级状况。工厂规模扩大，产业工人队伍壮大，矿工、钢铁工人、铁路工人、电力工人、化工工人、机械工人和交通运输工人成为现代无产阶级的重要组成部分。劳动过程更加纪律化、标准化和机械化，工人被资本更严密地组织和控制。与此同时，大工业集中也为工人阶级组织工会、政党、罢工和革命斗争创造了更强的社会基础。",

{
term: "自由竞争资本主义",
content: [
"<strong>自由竞争资本主义</strong>是资本主义发展过程中早于垄断资本主义的历史阶段，其基本特征是大量资本家企业在市场上相互竞争，资本主要通过商品生产、商品交换、雇佣劳动和利润追逐进行积累。在这一阶段，垄断组织尚未成为经济生活中的决定力量，单个资本家或企业主要依靠降低成本、扩大生产、改进技术、压低工资和争夺市场来取得优势。自由竞争资本主义不是自由平等的社会，而是资产阶级私有制和雇佣劳动剥削已经确立的资本主义社会。",
"自由竞争资本主义的经济基础，是生产资料资本主义私人占有制和雇佣劳动制度。资本家占有工厂、机器、原料和货币资本，工人失去生产资料，只能把自己的劳动力作为商品卖给资本家。资本家购买劳动力以后，在生产过程中榨取工人的剩余劳动，把剩余价值转化为利润。所谓自由竞争的自由，首先是资本家自由地占有生产资料、自由地购买劳动力、自由地支配工人劳动成果的自由。",
"自由竞争资本主义打破了封建行会、等级特权、地方割据和自然经济的束缚，推动商品经济、机器大工业、世界市场和社会化生产迅速发展。资本家为了在竞争中生存，必须不断改良技术、扩大生产规模、提高劳动生产率、压低商品价格。这种竞争在一定历史时期推动了生产力发展，使资本主义比封建制度更能扩大社会生产和改造旧的社会关系。",
"但是，自由竞争资本主义的进步作用始终建立在无产阶级被剥削的基础上。资本家之间相互竞争，最终压力转嫁到工人阶级身上。为了降低成本和取得利润，资本家延长工作日、提高劳动强度、压低工资、雇佣妇女和儿童、制造失业后备军。工人表面上是自由劳动者，实际上在饥饿和失业压力下被迫出卖劳动力，成为资本增殖的工具。",
"自由竞争资本主义的运行机制，是价值规律和市场竞争。资本不断从利润率低的部门流向利润率高的部门，推动不同部门利润率趋于平均化，形成平均利润和生产价格。各个资本家看似按照个人意志进行生产，实际上都被市场竞争、利润率、价格波动和资本积累规律支配。资本主义生产不是为了直接满足社会需要，而是为了实现价值增殖。",
"自由竞争资本主义必然造成生产无政府状态。每个资本家都按照私人利润安排生产，但整个社会生产缺乏统一计划。资本家争相扩大生产，结果周期性地出现生产过剩、商品积压、企业破产、工人失业和经济危机。危机不是因为社会需要已经被满足，而是因为劳动人民没有足够购买力来购买自己创造的商品。资本主义越发展，生产社会化同私人占有之间的矛盾就越尖锐。",
"自由竞争还必然引起资本集中和资本积聚。竞争不是永远维持许多平等企业并存，而是强者吞并弱者，大资本打垮小资本，先进企业挤垮落后企业。破产的小资本家和手工业者不断落入无产阶级队伍，幸存的大资本则不断扩大生产规模、集中机器、劳动力和市场。自由竞争的结果，正是自由竞争自身的否定，即生产和资本集中发展到一定高度以后走向垄断。",
"自由竞争资本主义同垄断资本主义之间存在历史联系。垄断不是外部强加给资本主义的偶然现象，而是自由竞争发展的必然结果。资本家在竞争中不断扩大规模，银行资本和工业资本逐渐结合，少数大企业控制整个部门，卡特尔、辛迪加、托拉斯和康采恩等垄断组织随之形成。列宁揭示了这一历史规律：自由竞争产生生产集中，生产集中发展到一定阶段，就产生垄断。",
"自由竞争资本主义的资产阶级意识形态，是自由主义和市场神话。资产阶级把市场竞争说成自然、公平、自由的秩序，把资本家发财说成个人才能的结果，把工人贫困说成个人失败的后果。这种说法掩盖了生产资料占有的不平等，掩盖了资本对劳动的剥削，掩盖了市场背后的阶级强制。没有生产资料的人即使在法律上自由，也只能在经济上服从资本。",
"小资产阶级常常怀念自由竞争资本主义，把它想象成没有垄断、没有大资本压迫、人人凭劳动和本事竞争的黄金时代。这种幻想是反动和空想的。自由竞争本身就会产生大资本，资本主义私有制本身就会造成两极分化，市场竞争本身就会把小生产者卷入破产和无产阶级化。反对垄断资本，不能倒退到自由竞争资本主义，而必须向前走向社会主义。",
"从历史唯物主义看，自由竞争资本主义是资本主义上升时期的典型形态。它摧毁封建关系，发展机器大工业，形成现代无产阶级，同时也不断制造贫困、危机、两极分化和阶级对立。它的历史作用，是把生产社会化推进到资本主义私人占有制无法容纳的程度，为垄断资本主义和社会主义革命准备物质条件与阶级力量。",
"自由竞争资本主义的根本矛盾，是生产的社会化同生产资料资本主义私人占有之间的矛盾。这个矛盾在自由竞争阶段已经充分展开，并在垄断资本主义阶段进一步尖锐化。无产阶级不能把自由竞争资本主义当作可以恢复的理想社会，而要看到它只是资本主义剥削制度的一个阶段。自由竞争资本主义的发展，最终证明资本主义自身无法克服危机和剥削，只有消灭资本主义私有制、建立社会主义公有制和计划经济，才能解决社会化生产同私人占有之间的根本冲突。"

content: [
"<strong>科举制</strong>是中国封建社会通过分科考试选拔官吏的一种制度。它形成于隋唐时期，经过唐、宋、元、明、清等朝不断发展和变化，直到清末被废除。科举制表面上以考试成绩作为入仕标准，打破了部分门阀世族对官位的世袭垄断，实质上仍然是封建地主阶级国家选拔统治人才、巩固中央集权和维护封建秩序的重要工具。",
"科举制产生的历史背景，是门阀士族制度衰落和封建中央集权加强。魏晋南北朝时期，官僚选拔长期受门第、血缘和世族势力控制，九品中正制使高门大族垄断仕途。随着统一国家重建、地主经济发展和皇权加强，旧门阀政治越来越不适应中央集权需要。科举制通过考试选官，削弱世族门阀对官僚来源的控制，使皇权能够从更广泛的士人阶层中吸收统治人才。",
"科举制的阶级基础，是封建地主阶级和士人阶层。参加科举需要长期读书、脱离体力劳动、掌握经典文字和考试技巧，这本身就依赖一定的经济条件。贫苦农民虽然在名义上也可能通过读书应试改变地位，但在现实中，绝大多数劳动人民没有条件接受长期教育。科举制所谓公平竞争，始终建立在封建土地占有、家庭财富、宗族资源和文化特权的不平等基础上。",
"科举制的政治作用，是为封建国家培养和选拔官僚。通过科举，皇权把地方士绅、地主子弟和读书人吸收到国家机器中，使他们从地方社会的文化力量转化为维护封建国家的官僚力量。士人为了取得功名，必须学习统治阶级认可的经典、伦理和政治原则，从思想上接受君臣父子、纲常名教和封建秩序。科举制因此不仅选拔官员，也制造和再生产封建意识形态。",
"科举制同儒家思想密切结合。尤其在宋以后，科举考试越来越以儒家经典、程朱理学和经义文章为主要内容，明清时期八股文成为考试的重要形式。读书人为了应试，把大量精力耗费在章句训诂、程式文章和圣贤语录之中。科举制把儒家经典转化为官僚选拔标准，使儒家思想成为封建国家管理士人、塑造思想、维护等级秩序的重要工具。",
"科举制具有一定历史进步性。它相对于贵族世袭和门阀任官，扩大了封建官僚来源，削弱了血缘贵族对国家政权的直接垄断，使部分中小地主、富裕农民和普通士人有机会进入官僚体系。它有利于中央集权国家从地方社会吸收人才，也在一定程度上促进了文化教育普及和文字知识传播。但是，这种进步性始终局限在封建统治框架之内，没有改变地主阶级统治劳动人民的根本关系。",
"科举制的反动性也十分明显。它把无数读书人束缚在功名道路上，使知识同仕途、官位和封建国家机器紧密结合。许多士人不是为了认识社会、改造现实和服务人民而学习，而是为了科名、官禄、门第荣耀和个人升迁而学习。科举制把知识变成通向官僚特权的阶梯，把教育变成服从皇权和封建礼教的训练场。",
"科举制还强化了封建社会的等级流动幻象。它允许少数人通过考试进入统治阶层，从而制造一种朝为田舍郎、暮登天子堂的幻想，使广大士人和部分农民家庭相信个人苦读可以改变命运。实际上，这种有限流动并没有消灭阶级压迫，反而把社会不满导向个人功名竞争，使许多人把摆脱压迫的希望寄托在入仕和做官上，而不是寄托在反抗封建土地制度和阶级压迫上。",
"科举制同地方士绅阶层的形成密不可分。考取功名者即使未必都能做官，也能在地方社会取得身份、名望和特权，成为宗族、乡里和地主秩序的重要支柱。士绅阶层一方面协助国家征税、教化、调解和维持治安，另一方面又依靠土地、宗族和文化权威压迫农民。科举制把中央官僚体系和地方地主秩序连接起来，使封建统治能够深入乡村社会。",
"近代以后，科举制的腐朽性更加暴露。面对资本主义世界体系冲击、帝国主义侵略、现代科学技术和新式教育兴起，旧式科举内容已经无法适应社会变化。八股取士、尊经崇古和空疏文风严重束缚思想，培养不出解决国家危机和社会矛盾的新型人才。清末废除科举，不只是教育制度变化，也是封建官僚体制和旧意识形态危机的表现。",
"从历史唯物主义看，科举制不是抽象的公平考试制度，而是封建生产关系、地主阶级国家和儒家意识形态结合起来的官僚选拔机制。它曾经削弱门阀世族，服务中央集权，有一定历史进步作用；但它归根到底维护封建地主阶级统治，把知识分子纳入皇权和官僚体系，把劳动人民排除在国家权力之外。无产阶级研究科举制，必须透过考试公平的表面，看清它作为封建国家机器组成部分的阶级本质。"
]
},

{
term: "采邑制",
content: [
"<strong>采邑制</strong>是西欧封建社会早期一种以土地封赐和军事服役为核心的政治经济制度。国王或大贵族把土地及其附属收益赐给臣属，臣属以效忠、服兵役、提供贡赋和承担政治义务作为回报。采邑不是单纯的土地赏赐，而是把土地占有、军事义务、政治隶属和农民剥削结合起来的一种封建统治形式。",
"采邑制产生的历史背景，是西罗马帝国瓦解以后，西欧中央集权衰落、商品经济萎缩、城市衰败、战争频繁和地方武装贵族崛起。统治者缺乏稳定的货币收入和强大的官僚体系，难以直接供养军队和控制地方，于是通过分赐土地收益来维系武装随从和贵族忠诚。土地成为政治权力和军事力量的主要基础，采邑制正是在这种条件下发展起来的。",
"采邑制的基本关系，是封君和封臣之间的封建依附关系。封臣从封君那里取得采邑，必须宣誓效忠，承担骑士服役、军事出征、守卫城堡、参加封建法庭和提供财政援助等义务。封君则向封臣提供保护、土地收益和贵族身份保障。这种关系表面上带有契约和荣誉色彩，实质上是封建统治阶级内部围绕土地和武装力量建立起来的等级支配关系。",
"采邑制的经济基础，是封建土地所有制和农奴劳动。贵族获得采邑，并不是亲自劳动，而是通过控制土地上的农民、农奴和附属人口来取得地租、劳役、贡赋和各种封建特权。农民被束缚在土地上，为领主耕种自营地，缴纳实物地租、货币地租和劳役地租。采邑制的真正承担者不是贵族骑士，而是被压迫的农民群众。",
"采邑制同庄园制密切联系。采邑为封建贵族提供土地权力和政治身份，庄园则是这种权力在经济生活中的具体组织形式。领主在庄园内拥有土地、磨坊、森林、牧场、审判权和强制权，农民必须在领主控制下生产和生活。采邑制把政治统治和经济剥削结合起来，使领主在封地内成为事实上的地方统治者。",
"采邑制同中国古代分封制有相似之处，但不能简单等同。二者都把土地、人民和政治义务同贵族等级联系起来，都具有地方分权和贵族世袭倾向。但是，西欧采邑制更突出封君封臣之间的私人效忠、骑士军事服役和庄园农奴经济；中国分封制则同宗法血缘、礼乐秩序和早期王权结构联系更深。比较二者，必须从各自的生产关系、国家结构和阶级形态出发。",
"采邑制最初常常带有不完全世袭性质，封臣对采邑的权利依附于其服役和效忠义务。但随着封建贵族力量壮大，采邑逐渐世袭化，地方领主权力不断加强。土地、军队、司法和税收逐步被地方贵族控制，封建割据随之加深。采邑制因此既帮助早期封建统治者组织军事力量，也不断削弱中央权力，制造封建分裂和贵族混战。",
"采邑制反映了封建社会的阶级结构。国王、大贵族、小贵族和骑士通过层层封授形成统治等级，农奴和贫苦农民则处在最底层，承担全部生产劳动和封建负担。资产阶级史学常把采邑制描写成骑士荣誉、封建契约和贵族忠诚的制度，掩盖了农民被土地束缚、被领主剥削和被封建暴力压迫的现实。无产阶级必须透过贵族礼仪，看见土地制度背后的阶级压迫。",
"随着商品经济恢复、城市兴起、货币地租发展、王权集中和雇佣军出现，采邑制逐渐衰落。国王不再完全依靠封臣骑士服役，而是通过税收、官僚机构和常备军加强中央集权；农奴制也在阶级斗争、商品经济和社会变动中逐步瓦解。采邑制的衰落，反映了封建生产关系内部矛盾的发展，也为资本主义生产关系的萌芽创造了条件。",
"从历史唯物主义看，采邑制不是浪漫的骑士制度，而是封建土地所有制、军事等级制和农奴剥削结合起来的历史产物。它曾适应中世纪早期西欧生产力低下、地方割据和军事防卫的需要，但它也必然造成地方分裂、贵族特权和农民沉重压迫。研究采邑制，必须抓住土地、劳动和阶级统治这条主线，才能看清封建社会的真实结构。"
]
},

{
term: "债务奴隶制",
content: [
"<strong>债务奴隶制</strong>是指债务人因无力偿还债务，被债权人以债务名义剥夺人身自由、劳动自由和部分或全部人格权利，沦为债权人支配对象的一种剥削制度。它既可能表现为债务人本人被迫为债主劳动，也可能表现为妻子、子女、亲属被作为抵押和偿债对象。债务奴隶制不是普通借贷关系，而是债权关系同人身支配结合起来以后形成的赤裸裸压迫关系。",
"债务奴隶制的历史根源，在于私有制、商品交换、货币关系和阶级分化的发展。原始公社瓦解以后，土地、牲畜、工具、粮食和金属货币逐渐被少数人占有，贫苦劳动者在灾荒、战争、赋税、婚丧、失地和生活困难中不得不向富人借债。债务一旦不能偿还，就会变成人身依附和强制劳动的锁链，使贫苦农民、手工业者和小生产者被一步步推入奴役状态。",
"债务奴隶制常常出现在奴隶社会和早期阶级社会中。战争俘虏、买卖人口和债务沦陷，都是奴隶来源的重要形式。与单纯战俘奴隶不同，债务奴隶来自原本具有一定自由身份的贫苦成员，他们不是因为战败被俘，而是因为经济破产和债权压迫丧失自由。这说明阶级压迫不仅通过暴力征服产生，也通过财产差别、货币借贷和债权制度不断扩大。",
"债务奴隶制的实质，是剥削阶级把经济支配转化为人身支配。债权人表面上只是要求偿还本金和利息，实际上通过高利贷、复利、抵押、罚息和强制劳动，把债务人牢牢控制在自己手中。债务人越劳动，越难摆脱债务；越想偿还，越被利息和附加条件束缚。债务成为一种合法化的枷锁，把经济贫困变成长期奴役。",
"债务奴隶制同高利贷资本密切相连。高利贷资本不是通过组织社会化生产来获取利润，而是利用贫困者的急迫需要、自然灾害、赋税压力和小生产脆弱性榨取高额利息。它像吸血鬼一样寄生在小农经济和手工业经济上，使劳动者失去土地、工具、房屋、牲畜乃至自身自由。高利贷是古代和封建社会中瓦解小生产、加深阶级分化的重要力量。",
"在古代社会中，债务奴隶制经常引发尖锐阶级冲突。贫苦平民和小农因债务破产而丧失土地和自由，贵族、奴隶主和高利贷者则通过债务扩大财产和劳动力占有。许多古代改革和社会斗争，都同废除债务、限制高利贷、赎回债务奴隶、重新分配土地等问题有关。债务问题表面上是法律和信用问题，实质上是贫富分化、土地集中和阶级压迫问题。",
"债务奴隶制在形式上可能被法律承认，也可能以习惯、契约和地方权力维持。统治阶级把债务契约说成自愿交易，把债务劳动说成偿还义务，把债务人的人身束缚说成维护信用和秩序。可是，在贫富极端不平等的社会中，所谓自愿契约本身就是压迫关系的结果。饥饿的人向富人借粮，失地者向地主借种子，被税吏逼迫的人向放债者借钱，这种自愿只是一种被迫选择。",
"债务奴隶制同一般奴隶制既有联系又有区别。一般奴隶制以奴隶主完全占有奴隶为基础，奴隶被视为会说话的工具；债务奴隶制则往往以债务关系为入口，通过抵押、偿债劳动和人身依附逐渐剥夺债务人的自由。它可能是暂时性的，也可能实际上变成终身奴役；可能只支配劳动，也可能支配身体、家庭和后代。二者共同点在于，直接生产者都遭受剥削阶级对人身和劳动的强制支配。",
"进入封建社会以后，债务奴隶制的赤裸形式有所变化，但债务压迫仍然广泛存在。农民因租税、灾荒和生活困难向地主、商人、高利贷者借债，债务积累又导致土地丧失、劳役增加和人身依附加深。许多农民虽然名义上不是奴隶，却被债务、地租、赋税和宗法权力重重束缚，长期处在接近奴役的状态。这说明封建剥削并不只靠土地所有权，也常常借助债务关系加强统治。",
"资本主义社会废除了古代意义上的债务奴隶制，却发展出新的债务奴役形式。工人名义上有人身自由，但在失业、低工资、高房价、医疗教育负担、消费贷款和信用体系压力下，被迫长期出卖劳动力偿还债务。被压迫国家也常常被帝国主义金融机构、外债、援助条件和结构调整政策束缚，失去经济主权和政策空间。现代债务奴役不一定戴着锁链，却能通过利息、信用、合同和国家机器把劳动人民和弱小国家固定在资本统治之下。",
"从历史唯物主义看，债务奴隶制揭示了债务关系的阶级本质。债务不是超阶级的道德义务，也不是单纯个人信用问题；在阶级社会中，它往往是富人支配穷人、剥削阶级控制劳动者、强国压迫弱国的重要工具。无产阶级反对债务奴隶制，不只是反对个别高利贷者的贪婪，而是反对私有制、阶级压迫和资本对劳动的统治。只有消灭剥削制度，建立劳动人民掌握生产资料和社会财富的制度，债务才能不再成为奴役人的锁链。"
]
},

{
term: "家长制",
content: [
"<strong>家长制</strong>是以家庭、宗族、组织或社会共同体中的某个“家长式”权威为中心，要求成员服从其意志和命令的一种统治关系与意识形态。它最初同父权制家庭、私有财产继承和宗法等级制度密切联系，后来又扩展为政治、经济、社会组织中的一种权力形式。家长制的核心，不是平等协商和群众民主，而是把少数人的支配包装成“保护”“照管”“恩赐”和“天然权威”。",
"家长制的历史根源，在于私有制和父权制家庭的形成。原始公社瓦解以后，随着剩余产品、私有财产和继承关系的发展，男子在生产、战争和财产占有中的地位上升，父系血统和父权家庭逐步确立。家庭不再只是共同生活单位，而成为财产继承、劳动力控制和社会秩序再生产的基本场所。家长以家庭代表者和财产支配者的身份，取得对妻子、子女、奴仆和晚辈的权威。",
"家长制同妇女受压迫密切相连。在家长制家庭中，妇女往往被限制在生育、家务、照料和服从丈夫的地位上，婚姻关系也常常同财产、继承和宗族利益捆绑在一起。妻子和子女被看作家长权威下的附属物，个人意志服从家庭等级秩序。家长制把这种不平等说成自然秩序和伦理道德，从而掩盖其背后的财产关系和阶级关系。",
"家长制同宗法制相互支撑。宗法制把血缘、姓氏、嫡长继承和等级秩序固定下来，家长制则在家庭和宗族内部把这种等级秩序日常化。父亲、族长、宗族长老和地方士绅通过礼教、族规、家法、祭祀和舆论控制成员，维护男性长辈和财产所有者的权威。封建社会中的忠孝观念、三纲五常、尊卑长幼秩序，都是家长制意识形态的重要表现。",

"家长制在革命组织和社会主义建设中同样必须反对。无产阶级政党和群众组织必须依靠民主集中制、群众路线、批评和自我批评，而不能依靠个人恩威、长官意志和少数人包办。干部如果把群众看作被动对象，把自己看作天然领导者，就会滋生官僚主义和命令主义。社会主义条件下反对家长制，就是要反对脱离群众、压制批评、个人专断和把公共权力私人化的倾向。",
"家长制同群众民主根本对立。群众民主要求劳动人民参与管理、监督干部、表达意见、开展批评和决定自身事务；家长制则要求群众服从权威，把政治判断、经济管理和社会生活交给少数“懂事的人”“长辈”“专家”或“领导”包办。无产阶级革命必须打破这种支配关系，使被压迫者从家庭、社会和政治生活中的服从地位中解放出来。",

"从历史唯物主义看，家长制不是永恒的人类自然秩序，而是私有制、阶级社会和父权家庭发展到一定阶段的产物。它把财产支配、男性统治、长幼等级和政治服从结合起来，使家庭成为阶级社会再生产的重要环节。无产阶级反对家长制，不是反对家庭成员之间的互助和关怀，而是反对以亲情、道德和权威名义维持不平等支配。只有消灭私有制和阶级压迫，发展真正的男女平等和群众民主，家长制的社会根基才能被彻底铲除。"

{

content: [
"<strong>分封制</strong>是中国古代早期国家的重要政治制度，主要盛行于西周时期。它的基本形式，是周王把土地、人口和统治权分封给同姓宗族、功臣和古代贵族后裔，使他们在各自封地建立诸侯国，承担镇守疆土、缴纳贡赋、出兵从征、朝觐述职和维护周王室统治秩序的义务。分封制表面上是王室同诸侯之间的礼制关系，实质上是早期阶级国家在生产力水平有限、交通和行政能力不足条件下，对广大土地和人民实行间接统治的政治形式。",
"分封制的经济基础，同土地占有、井田制和贵族等级秩序密切联系。周王和各级贵族把土地与人口作为统治资源进行层层分配，广大劳动者则被束缚在贵族控制的土地和共同体关系之中，为贵族提供贡赋、劳役和军役。所谓“封土建国”，不是把土地交给普通劳动人民，而是把土地和人民的支配权交给贵族集团。它体现的是奴隶制和早期封建因素交织时期的阶级统治关系。",
"分封制同宗法制紧密结合。周王以天下共主自居，诸侯多由王族和功臣担任，诸侯国内部又继续分封卿大夫，卿大夫以下还有士等等级。宗法血缘关系、嫡长子继承、礼乐秩序和政治等级相互结合，使统治阶级内部形成由天子、诸侯、卿大夫、士构成的金字塔结构。宗法制为分封制提供血缘和礼制依据，分封制则把宗法等级转化为土地、人民和政权的现实支配。",
"分封制在西周初期具有巩固统治和扩大疆域的作用。周灭商以后，统治区域广大，直接行政能力有限，通过分封同姓亲族和功臣，可以在各地建立军事据点和政治据点，镇压旧势力，控制边远地区，维系统治秩序。它把王室、诸侯和地方贵族联系成一个等级网络，使西周国家能够在当时条件下维持相对统一的政治结构。",
"但是，分封制本身包含深刻矛盾。诸侯拥有封地、军队、赋税和地方统治权，随着经济发展和地方势力壮大，诸侯逐渐从王室屏障变成割据力量。王室对诸侯的控制依靠血缘、礼制和军事威望，一旦王室衰落，诸侯便不再服从中央。西周后期王权削弱、诸侯坐大，正是分封制内在分散性和贵族割据性的必然结果。",
"春秋战国时期，分封制逐步瓦解。诸侯争霸、兼并战争、土地私有和封建地主经济发展，冲击了旧的宗法贵族秩序。各国为了增强国家力量，纷纷推行郡县制、军功爵制、官僚制度和变法改革，用中央任免官吏代替世袭贵族封地，用直接行政统治代替层层分封。分封制的衰落，反映了社会经济基础变化和新兴地主阶级政治要求的上升。",
"分封制同后来的郡县制有根本区别。分封制下，诸侯和贵族在封地内具有相对独立的世袭权力，中央对地方控制较弱；郡县制下，地方官吏由中央任免，行政、赋税、司法和军事逐步纳入中央集权体系。郡县制更适合统一国家、地主经济和官僚政治的发展。因此，秦统一后推行郡县制，标志着旧贵族分封政治被更成熟的封建中央集权国家形式取代。",
"从历史唯物主义看，分封制不是抽象的道德制度，而是一定生产力和阶级关系的产物。它既曾在早期国家形成过程中起到组织统治、扩展疆域和稳定贵族联盟的作用，又由于它把地方政权、土地和武装交给世袭贵族，必然导致割据、争霸和王权衰落。制度的兴衰，归根到底取决于它是否适应当时社会经济结构和阶级力量变化。",
"分封制的历史意义，在于它集中反映了中国古代国家从部族联盟、宗法贵族统治向中央集权封建国家过渡的矛盾过程。它把血缘、土地、军事和政治权力结合在一起，形成早期统治阶级的等级秩序；它的瓦解又为郡县制、官僚制和统一封建国家的形成开辟道路。无产阶级研究分封制，不能停留在“礼乐秩序”“宗法亲情”的表面，而要看到其背后对土地、人口和劳动人民的阶级支配关系。"
]

{

"<strong>三个世界</strong>，又称三个世界划分，是毛主席在20世纪70年代根据当时国际阶级斗争、民族解放运动和美苏争霸格局提出的重要国际战略分析。它把当时世界力量大体划分为三个部分：第一世界是美国和苏联两个超级大国；第二世界是日本、欧洲、加拿大等发达资本主义国家；第三世界是亚洲、非洲、拉丁美洲以及其他受帝国主义、殖民主义、新殖民主义压迫的广大国家和民族。这一划分不是简单地理分类，而是对世界矛盾、霸权主义和被压迫民族斗争格局的政治分析。",

"三个世界划分不是否定阶级斗争，也不是用民族国家关系代替无产阶级国际主义。第三世界国家内部同样存在地主阶级、买办资产阶级、官僚资产阶级、民族资产阶级、无产阶级和农民之间的矛盾。支持第三世界反帝反霸斗争，不等于无原则支持第三世界国家的所有统治集团，更不等于放弃对本国反动阶级和资产阶级路线的批判。无产阶级必须把反帝民族斗争同国内阶级斗争结合起来。",

"列宁时期的苏维埃政权面对极端艰难的处境。国内白卫军叛乱、帝国主义武装干涉、经济崩溃、饥荒和旧国家机器破坏，使新生政权处在生死存亡边缘。战时共产主义、新经济政策、民族政策、建党原则和无产阶级专政理论，都是在这种严酷斗争中形成和发展的。列宁领导的苏维埃政权保卫了十月革命成果，为后来苏联社会主义建设奠定了政治基础。",
"斯大林时期的苏联完成了社会主义工业化和农业集体化，建立了以国有工业、集体农业和计划经济为主要特征的社会主义经济体系。苏联在短时间内从落后的农业国家变成强大的工业国，在教育、科学、医疗、妇女解放、民族地区建设和国防工业方面取得巨大成就。这些成就说明，生产资料公有制和计划经济能够集中社会力量，摆脱资本主义市场无政府状态，推动落后国家实现跨越式发展。",
"苏联在世界反法西斯战争中作出决定性贡献。德国法西斯入侵以后，苏联人民付出极其巨大牺牲，进行了伟大的卫国战争，最终攻克柏林，粉碎纳粹德国，为世界反法西斯战争胜利作出不可磨灭的贡献。苏联的胜利，不只是一个国家的军事胜利，也是社会主义制度、人民动员、计划经济和无产阶级政治领导在生死考验中的重大胜利。",
"苏联也存在严重错误和深刻教训。社会主义建设过程中出现过官僚主义、强迫命令、民族问题处理不当、肃反扩大化、群众民主不足、干部特权化和对社会主义社会阶级斗争认识不足等问题。这些错误不能抹杀苏联社会主义建设的伟大成就，但也不能被轻描淡写。真正的无产阶级立场，必须既反对资产阶级借苏联错误否定社会主义，也反对教条主义掩盖问题、拒绝总结教训。",
"赫鲁晓夫修正主义集团上台以后，苏联历史发生根本转折。赫鲁晓夫打着反对个人崇拜和改革社会主义的旗号，实质上否定斯大林，否定无产阶级专政，鼓吹“全民国家”“全民党”，削弱阶级斗争和社会主义方向。在经济上，苏联逐步强化利润原则、物质刺激和官僚管理；在政治上，党和国家越来越脱离群众；在国际上，大国沙文主义和社会帝国主义倾向不断发展。苏联由社会主义国家逐步蜕变为修正主义国家。",
"勃列日涅夫时期，苏联修正主义进一步发展为社会帝国主义。它一方面保留社会主义外壳、计划经济形式和红色词汇，另一方面在国内形成官僚特权阶层，在国外推行霸权主义和势力范围政策。对东欧的控制、对捷克斯洛伐克的武装干涉、同美国争夺世界霸权，都说明苏联已经严重背离无产阶级国际主义。社会主义国家一旦丧失无产阶级专政和群众路线，就可能在红旗外表下走向新的压迫形式。",
"苏联解体是修正主义路线长期发展的结果。到20世纪80年代末，苏联经济僵化、官僚腐败、民族矛盾加剧、群众信仰瓦解，戈尔巴乔夫改革进一步打开资本主义全面复辟的大门。1991年苏联解体，不是社会主义必然失败，而是修正主义背叛社会主义以后长期积累矛盾的总爆发。苏联的灭亡证明，放弃阶级斗争、放弃无产阶级专政、放弃继续革命，最终必然导致社会主义事业被葬送。",
"苏联的历史意义极其深远。它第一次把科学社会主义从理论变成现实国家制度，第一次在世界范围内建立起同资本主义阵营对立的社会主义阵营，极大鼓舞了各国无产阶级革命和被压迫民族解放运动。中国革命、东欧社会主义国家、亚洲和拉丁美洲革命运动、世界反殖民斗争，都深受十月革命和苏联经验影响。没有苏联，就没有20世纪世界革命格局的巨大改变。",
"评价苏联，必须坚持历史唯物主义和阶级分析方法。苏联不是单一不变的对象，而是有不同历史阶段：列宁和斯大林时期总体代表社会主义建设和无产阶级专政方向；赫鲁晓夫以后则逐步走向现代修正主义和资本主义复辟。把整个苏联历史一概否定，是资产阶级反共立场；把苏联所有阶段一概肯定，是教条主义和历史盲目性。正确态度是肯定社会主义时期的伟大成就，批判其中严重错误，更要彻底揭露修正主义导致复辟的历史教训。",
"苏联的最大教训，在于社会主义革命胜利以后，阶级斗争并没有结束。生产资料所有制改造完成以后，旧资产阶级思想、官僚特权、新资产阶级因素和资本主义复辟危险仍然存在。无产阶级必须坚持党的无产阶级性质，坚持群众路线，坚持无产阶级专政下继续革命，防止干部从社会公仆变成社会主人。苏联的兴起证明社会主义能够胜利，苏联的变质和解体则警告无产阶级：如果不继续革命，社会主义国家也会被修正主义断送。"
]
},

{
term: "铁木辛哥军改",
content: [
"<strong>铁木辛哥军改</strong>通常指1940年至1941年间，谢苗·康斯坦丁诺维奇·铁木辛哥出任苏联国防人民委员以后，对苏联红军进行的一系列整顿和改革。它发生在苏芬战争暴露红军严重问题之后，也发生在纳粹德国已经横扫欧洲、苏德战争危险日益迫近的背景下。铁木辛哥军改的核心任务，是纠正红军训练、纪律、指挥、装备、机械化和战备方面的缺陷，使红军尽快适应现代战争的需要。",
"铁木辛哥军改的直接背景，是苏芬战争中的惨重教训。苏联虽然最终迫使芬兰签订和约，取得战略目标，但红军在战争初期暴露出指挥僵硬、侦察不足、协同混乱、后勤薄弱、训练落后、基层干部能力不足和士兵战术素养不高等问题。小国芬兰能够给红军造成巨大困难，说明红军表面规模庞大，内部却存在严重虚弱。苏芬战争成为苏军高层不得不正视军事建设问题的警钟。",
"铁木辛哥接替伏罗希洛夫后，首先强调整顿军队纪律和提高指挥责任。红军不能依靠口号、热情和数量优势取胜，必须具备严格训练、明确指挥、统一行动和现代战术素养。改革试图纠正旧式内战经验残余和和平时期松散习气，要求部队按照实战条件训练，强化军官责任、士兵纪律、战场协同和战备检查。没有严密组织和真实训练，社会主义国家的军队也会在现代战争中付出沉重代价。",
"铁木辛哥军改的重要内容之一，是加强军事训练。苏芬战争证明，红军许多部队不会在严寒、森林、筑垒阵地和复杂地形中有效作战，也缺乏步兵、炮兵、坦克、工兵和航空兵之间的协同。改革要求改变形式主义训练，把演习、射击、侦察、通信、突破、防御、夜战和合成兵种协同同实际战争需要结合起来。训练必须服务于战场，而不是服务于检查表和宣传报告。",
"铁木辛哥军改还试图整顿指挥体系。苏联在1930年代后期经历严重干部损失，许多高级和中级指挥员经验不足，战役战术能力不强。铁木辛哥时期扩大军事院校和干部培养，强调军官专业能力，试图恢复指挥员在军事行动中的责任。1940年苏军废止基层部队双重指挥中的政治委员制度，恢复较明确的一长制，同时保留政治工作体系。这一做法的目的，是在战斗指挥中减少责任不清和命令冲突，提高军事行动效率。",
"铁木辛哥军改同红军机械化建设密切相关。德国闪击战在欧洲的胜利表明，现代战争已经不是单纯步兵推进和阵地消耗，而是坦克、航空兵、炮兵、摩托化步兵、通信和后勤高度协同的机动作战。苏联开始重建和扩充机械化军，增加坦克和摩托化部队，试图恢复并发展大纵深作战思想的物质基础。这一方向具有必要性，但执行中也存在编制过大、装备不足、车辆和无线电短缺、干部训练跟不上等问题。",
"铁木辛哥军改在战备方面也采取了一系列措施。苏军加强西部边境军区建设，调整动员部署，扩充部队数量，改善边境防御和作战计划。铁木辛哥和总参谋部在1940年至1941年间不断研究可能的战争部署问题，认识到德国威胁正在上升。但是，由于国际形势复杂、斯大林对战争时间判断存在迟疑、边境防御工程未完成、部队扩编过快，许多战备措施没有来得及转化为现实战斗力。",
"铁木辛哥军改的积极意义，在于它试图从苏芬战争失败教训中恢复实事求是精神。红军不能因为自己是社会主义国家军队，就自动拥有战斗力；也不能因为政治方向正确，就忽视军事科学、干部训练、技术装备和现代战争规律。铁木辛哥时期的整训、纪律建设、干部培养、机械化扩张和实战训练，都是红军在战争前夜进行自我纠错的重要努力。",
"铁木辛哥军改的局限也十分明显。改革开始太晚，距离德国入侵只有一年多时间；红军规模扩张过快，干部、装备、通信、后勤和训练都跟不上；大清洗造成的高级军事人才损失短期内难以弥补；机械化部队编制庞大却缺乏成熟指挥和保障；边境部署和战略判断也存在严重问题。因此，1941年德国发动巴巴罗萨行动时，红军仍然遭受巨大损失，说明改革方向虽有必要，但远未完成。",
"铁木辛哥军改的历史教训，在于社会主义军队建设必须把政治领导、群众基础和军事科学统一起来。党对军队的领导是根本原则，但政治领导不能代替专业训练；革命热情是重要力量，但热情不能代替装备、后勤、通信和战术；国家计划能够集中力量办大事，但计划不能脱离实际条件和基层能力。无产阶级军队既要反对旧军队的军阀主义和官僚主义，也要反对轻视现代军事科学的主观主义。",
"从历史上看，铁木辛哥军改是苏联红军在大战前夜进行的紧急补课。它揭示了一个严肃问题：社会主义国家面对帝国主义战争威胁，必须随时准备接受真实战争检验，不能沉溺于胜利宣传和纸面实力。只有坚持实事求是，总结失败教训，尊重现代战争规律，加强干部、技术、纪律、训练和人民动员，革命军队才能真正把政治优势转化为战场上的组织力和战斗力。"
]
},

{
term: "李森科主义",
content: [
"<strong>李森科主义</strong>是苏联生物学和农业科学史上一种以特罗菲姆·李森科为代表的错误思想和政治化科学路线。它打着“无产阶级科学”“米丘林生物学”“改造自然”的旗号，反对孟德尔遗传学和现代遗传学，宣扬获得性遗传、春化处理和环境直接改造遗传性质等观点，并借助国家权力和政治斗争压制不同科学意见。李森科主义不是科学同社会主义结合的典范，而是把科学问题简单政治化、把错误理论行政强制化的严重教训。",
"李森科主义产生的背景，是苏联在农业集体化、工业化和粮食压力下迫切需要提高农业产量。李森科以农艺实践者身份提出一系列看似能够迅速增加产量的方法，尤其强调春化处理和通过环境改变作物遗传性质。他的主张迎合了当时急于取得农业突破的政治需要，也迎合了一部分人希望用意志和行政动员迅速改造自然的心理。因此，李森科主义能够从一种有争议的农艺主张上升为官方支持的理论路线。",
"李森科主义的理论错误，首先在于否认现代遗传学的基本成果。它把孟德尔遗传学、染色体理论和基因学说斥为资产阶级科学，认为生物性状可以通过外部环境训练直接稳定遗传下去。这种观点把复杂的遗传规律简单化，把主观愿望当成自然规律，把未经严格检验的经验做法上升为普遍理论。科学不能靠政治标签判定真假，遗传规律也不会因为口号和行政命令而改变。",
"李森科主义的严重危害，不只在于某些具体科学结论错误，更在于它用政治权力压制科学争论。正常科学研究必须允许实验、证据、批评、重复验证和不同假说之间的斗争。李森科主义却把反对者扣上反动、资产阶级、破坏社会主义农业等政治帽子，使许多坚持遗传学研究的科学家受到排挤、打击甚至迫害。这样一来，科学问题不再由实践和实验检验，而由权力、路线标签和个人地位决定。",
"李森科主义表面上反对资产阶级科学，实际上背离了辩证唯物主义。辩证唯物主义要求从客观实际出发，尊重自然规律，通过实践检验真理。李森科主义则把愿望当现实，把个别经验当普遍规律，把政治忠诚当科学正确，把行政力量当认识标准。这不是唯物主义，而是主观主义；不是辩证法，而是把复杂生命现象粗暴简化为人为意志可以直接支配的形而上学。",
"李森科主义还表现出庸俗化理解阶级性的错误。科学确实具有社会条件和阶级影响，资产阶级科学体系中也会存在为资本服务的思想倾向；但是，自然科学中的客观规律不能简单分成无产阶级规律和资产阶级规律。遗传、物理、化学和数学规律不服从阶级口号。无产阶级科学的先进性，不在于拒绝客观证据，而在于更彻底地尊重事实、服务人民、反对垄断和迷信，用真实规律改造世界。",
"李森科主义同官僚主义有密切联系。官僚主义需要简单、快速、可宣传的成果，需要用上级命令代替复杂调查，用政治表态代替科学论证。李森科主义正好为这种官僚需要提供了理论外衣：只要宣布某种方法正确，动员群众执行，农业问题似乎就能被迅速解决。现实证明，农业生产不能靠神话和命令解决，必须尊重土壤、气候、品种、遗传、管理和群众经验的实际规律。",

term: "古田会议",
content: [
"<strong>古田会议</strong>是中国共产党和中国工农红军建设史上的一次具有决定意义的重要会议。它于1929年12月在福建上杭古田召开，正式名称是中国共产党红军第四军第九次代表大会。会议在毛主席领导下，总结红四军建军和党内斗争经验，批判各种非无产阶级思想，通过了著名的《古田会议决议》，确立了思想建党、政治建军、党对军队绝对领导的根本原则。",
"古田会议召开的背景，是中国革命处在土地革命战争初期，红军主要由农民、小资产阶级出身的士兵和旧军队转化而来的人员组成。由于中国革命长期在农村和战争环境中发展，党和军队内部不可避免地受到农民小生产思想、旧军队习气、军阀主义、个人主义、极端民主化、流寇思想和单纯军事观点的影响。如果不从思想上、政治上解决这些问题，红军就可能脱离无产阶级政党领导，变成普通农民武装或旧式军队。",
"古田会议的核心贡献，是明确红军不是单纯打仗的军事组织，而是执行革命政治任务的武装集团。红军必须服从无产阶级政党的政治领导，必须为土地革命、群众斗争和建立革命政权服务。枪杆子必须掌握在党和人民手中，而不能掌握在军阀、个人英雄或单纯军事干部手中。军队如果脱离政治、脱离群众、脱离党的领导，就会丧失无产阶级性质。",
"古田会议系统批判了单纯军事观点。单纯军事观点把军队看成脱离政治的独立力量，把军事胜利看成革命的全部内容，轻视党的领导、群众工作和政治教育。这种观点本质上是旧军队思想在红军中的反映。会议明确指出，军事必须服从政治，红军的一切行动必须服从革命路线和群众利益。政治路线正确，军队才有方向；群众基础牢固，武装斗争才有生命。",
"古田会议确立了思想建党的原则。无产阶级政党不能只靠组织形式维持自身性质，还必须不断用无产阶级思想克服各种非无产阶级思想。党员出身可以不同，但进入党以后必须接受无产阶级世界观、纪律、组织原则和群众路线的改造。党内存在错误思想并不可怕，关键在于是否敢于通过批评和自我批评、教育和斗争，把党建设成为真正的无产阶级先锋队。",
"古田会议确立了政治建军的原则。红军必须建立党的组织，必须加强政治工作，必须实行官兵一致、军民一致、瓦解敌军等政治原则。政治工作不是军事工作的附属品，而是保证军队性质、方向和战斗力的生命线。红军之所以不同于旧军队，不只是因为旗帜不同，更因为它有无产阶级政党的领导，有革命政治教育，有同人民群众血肉相连的阶级立场。",
"古田会议批判了极端民主化、非组织观点和个人主义。极端民主化表面上反对集中，实际上破坏党的统一意志和革命纪律；非组织观点把个人凌驾于组织之上，削弱党的集中领导；个人主义则把个人名利、个人情绪和小团体利益置于革命事业之上。这些错误思想如果任其发展，就会瓦解党的战斗力，使红军无法承担严肃的革命任务。",
"古田会议也批判了流寇思想和旧军队习气。流寇思想把红军看成到处流动作战、抢掠生存的武装集团，轻视根据地建设、群众组织和土地革命。旧军队习气则表现为军阀作风、打骂士兵、脱离群众、纪律松弛和官兵不平等。会议强调红军必须发动群众、宣传群众、组织群众，必须严格执行群众纪律，必须成为人民自己的军队，而不是凌驾于人民之上的武装力量。",
"古田会议的历史意义，在于它解决了在农民占多数、长期处于农村战争环境中的中国革命中，怎样建设无产阶级政党和人民军队的重大问题。它把党的思想建设、组织建设、政治路线和军队建设统一起来，保证了红军始终沿着无产阶级革命方向前进。没有古田会议确立的原则，农村包围城市、武装夺取政权的道路就难以长期坚持和发展。",
"古田会议的理论意义，超出了红四军本身。它说明，无产阶级革命军队的根本性质不取决于成员出身，而取决于党的领导、政治路线、阶级立场和群众关系。人民军队必须永远坚持党指挥枪，而不能枪指挥党；必须永远坚持政治工作，而不能陷入单纯军事观点；必须永远坚持群众路线，而不能脱离人民。古田会议为中国革命军队建设和无产阶级政党建设奠定了根本原则，是毛泽东思想形成和发展的重要里程碑。"
]
},

{
term: "内阁制度",
content: [
"<strong>内阁制度</strong>是资产阶级国家和近代国家机器中一种组织行政权力的政治制度形式，通常指由首相、总理或内阁首脑领导各部部长组成政府，负责国家行政管理、政策制定和法律执行。它在不同国家可以表现为议会内阁制、君主立宪制下的责任内阁、总统制国家中的部长会议等不同形式。内阁制度表面上是国家行政机关的技术安排，实质上是一定阶级通过国家机器组织政治统治和管理社会事务的制度形式。",
"内阁制度的形成，同近代资产阶级国家的发展密切相连。封建君主制下，国家行政权力往往直接集中在君主和宫廷顾问手中；随着资产阶级革命、议会制度和现代官僚机构的发展，行政权力逐渐从个人化的王权形式转变为制度化的政府机关形式。内阁作为行政中枢，承担财政、外交、军事、警察、教育、经济管理和公共事务等职能，成为现代国家机器的重要组成部分。",
"在议会内阁制中，内阁通常由议会多数党或多数派联盟组成，对议会负责，并通过议会信任维持执政地位。首相或总理一般是政府实际首脑，负责协调各部、制定政策和领导行政机关。表面上看，内阁由选举产生的议会多数决定，似乎体现人民意志；实际上，在资本主义社会中，议会选举、政党政治、媒体舆论和财政资源都受到资产阶级力量深刻控制，内阁政策归根到底服务于资产阶级统治和资本积累需要。",
"在君主立宪制中，内阁制度往往表现为责任内阁。君主保留国家元首地位，但实际行政权由内阁掌握，内阁对议会或资产阶级政党体系负责。这种制度把旧君主制形式同资产阶级议会政治结合起来，既保留王室、贵族和传统权威的象征作用，又把国家实际治理纳入资产阶级政党和官僚体系。所谓君主超然于党派之外，只是掩盖阶级国家本质的政治外衣。",
"内阁制度同现代官僚制度不可分割。部长、官僚、专家、顾问、情报机关、军警机关和行政部门共同构成庞大的国家管理体系。内阁表面上通过会议和法律程序进行决策，实际上许多重大政策往往由垄断资本、金融集团、军工集团、外交集团和高级官僚共同影响。资本主义国家的内阁不是站在社会之上的公共理性机关，而是资产阶级国家机器的行政中枢。",
"内阁制度在资本主义社会中的阶级性质，不能被民主形式所掩盖。无论内阁由哪个资产阶级政党组成，无论政府轮替怎样频繁，只要生产资料仍然由资产阶级占有，国家机器仍然维护资本主义私有制，内阁就只能在资产阶级统治框架内运转。它可以调整税收、福利、外交和经济政策，却不会触动资本对劳动的统治，不会消灭雇佣劳动制度和剩余价值剥削。",
"资产阶级内阁制度常常把政治责任说成技术管理问题。经济危机被说成财政管理失误，战争政策被说成国家安全需要，削减福利被说成预算平衡，镇压群众斗争被说成维护秩序。这样，阶级统治被包装成行政专业化，资本利益被包装成国家利益，资产阶级政治路线被包装成政府治理能力。内阁制度正是通过这种官僚化和程序化形式，把阶级国家的暴力和统治日常化。",
"内阁制度内部也存在资产阶级不同集团之间的矛盾。不同政党、不同资本集团、不同地区利益和不同政策路线，会围绕财政、产业、军事、贸易、外交和社会政策发生斗争。内阁改组、倒阁、组阁危机、联合政府破裂，表面上是政治程序变化，背后往往反映资产阶级内部力量重新组合和统治策略调整。劳动人民不能把这种资产阶级内部争斗误认为自己的解放道路。",
"无产阶级对内阁制度的态度，必须同资产阶级国家问题联系起来。无产阶级可以在一定条件下利用议会和政府危机揭露资产阶级统治，宣传革命真理，争取群众；但绝不能把夺取内阁职位、参加资产阶级政府或管理旧国家机器当成社会主义道路。旧国家机器的内阁、官僚、军队、警察、法院和财政机关，都是资产阶级统治的组成部分。无产阶级革命必须打碎旧的国家机器，建立劳动人民自己的政权形式。",
"内阁制度的历史意义，在于它体现了现代国家行政权力从个人王权向制度化资产阶级国家机器的发展。它比封建君主个人统治更适应资本主义社会化生产和现代行政管理，但并没有改变国家的阶级本质。判断内阁制度，不能只看政府怎样组成、部长怎样任命、议会怎样表决，而要看国家权力服务于哪个阶级，生产资料归谁占有，行政机器维护什么样的社会制度。只有消灭资本主义私有制和资产阶级国家机器，劳动人民才能摆脱少数人以内阁和官僚机关名义进行的统治，实现真正的社会管理权。"
]
},

{
term: "主体思想",
content: [
"<strong>主体思想</strong>是朝鲜劳动党和朝鲜民主主义人民共和国长期宣称的指导思想，通常以“自主”“自立”“自卫”和“人民群众是革命与建设的主人”为核心口号。它最初在反对教条主义、强调民族独立和自主路线的背景下形成，后来逐步发展为以金日成、金正日等领导人为中心的国家意识形态体系。主体思想表面上使用了一些革命、人民、独立和社会主义词汇，但它同马克思列宁主义和马列毛主义之间存在根本区别。",
"主体思想的基本内容，通常概括为思想上的主体、政治上的自主、经济上的自立和国防上的自卫。它强调一个国家和民族必须摆脱对大国的依附，独立决定自己的政治路线、经济建设和国防方针。从反对帝国主义控制和维护民族独立的角度看，这些口号具有一定反殖民、反依附色彩。但是，民族独立本身并不等于无产阶级革命路线，国家自主也不能代替阶级斗争和社会主义革命的原则。",
"主体思想的核心问题，在于它把“主体”解释为抽象的人民、民族和领袖领导下的国家共同体，而不是从生产关系、阶级矛盾和无产阶级专政出发分析社会。马克思主义的出发点是现实的阶级斗争，是生产资料所有制和国家政权的阶级性质；主体思想则常常把民族统一、国家独立和领袖权威置于阶级分析之上，从而削弱了无产阶级国际主义和阶级斗争原则。",
"主体思想在理论上强调“人是社会历史的主体”，但这种说法如果脱离物质生产、阶级关系和社会实践，就容易滑向抽象人本主义和主观主义。历史不是由抽象的人创造的，而是由处在一定生产关系和阶级关系中的现实群众创造的。人民群众当然是历史的创造者，但群众只有在正确路线、革命组织和实际斗争中才能发挥历史主动性；把群众主体性同领袖绝对权威绑定起来，就会把群众路线变成服从路线。",
"主体思想同个人崇拜和领袖绝对化密切结合。朝鲜政治实践中，主体思想逐渐不再只是关于民族独立和社会主义建设的理论，而成为维护最高领袖权威、家族继承和单一思想体系的意识形态工具。无产阶级政党需要领导核心，但领导核心不能凌驾于群众、党和阶级之上，更不能变成超历史、超阶级、不可批判的神圣存在。把领袖意志神圣化，必然损害群众路线和无产阶级民主。",
"主体思想在经济上强调自立经济，反对依附外国资本和帝国主义控制。维护经济独立对于被压迫民族确有重要意义，但社会主义经济不能停留在封闭的民族自足上。社会主义建设需要生产资料公有制、计划经济、群众管理、技术进步和无产阶级政治挂帅，也需要在国际无产阶级革命和社会主义国家互助中发展。把经济自立绝对化，容易把社会主义理解为一国孤立生存和行政命令式自给自足。",
"主体思想在政治上强调自主路线，却没有真正解决无产阶级专政下继续革命的问题。社会主义社会仍然存在阶级斗争，存在新资产阶级产生和资本主义复辟的危险。判断一个政权是否坚持社会主义，不能只看它是否反对外国干涉、是否使用社会主义名义，而要看生产资料归谁掌握，劳动群众是否真正参加国家和生产管理，是否坚持阶级斗争和反修防修，是否防止干部特权化和新资产阶级形成。",
"主体思想同马列毛主义的根本区别，在于它用民族国家中心和领袖中心替代了阶级斗争中心和无产阶级国际主义。马列毛主义坚持无产阶级解放必须同全世界被压迫人民的解放联系起来，坚持无产阶级专政下继续革命，坚持群众路线和阶级分析。主体思想则越来越强调本国特殊性、民族主体性和领袖体系，把社会主义问题从阶级斗争和国际革命中抽离出来，转化为国家主义和领袖政治问题。",
"主体思想的历史影响，必须放在朝鲜半岛被殖民、战争破坏、冷战对抗和帝国主义包围的具体条件下分析。朝鲜人民反抗日本殖民统治和维护民族独立的斗争具有正当性，反对帝国主义压迫也具有进步意义。但是，反帝立场不能自动证明一种思想就是科学社会主义。无产阶级评价任何思想体系，都必须看它是否坚持生产资料公有制的社会主义方向，是否坚持阶级斗争，是否坚持群众路线，是否反对修正主义和特权化。",
"从马列毛主义立场看，主体思想是一种带有民族主义、国家主义和领袖崇拜色彩的思想体系。它保留了反帝独立和社会主义词汇，却在理论核心上偏离了无产阶级国际主义、阶级斗争和群众路线。无产阶级不能把主体思想等同于马列毛主义，也不能把国家独立口号等同于社会主义路线。真正的革命理论必须坚持唯物史观，坚持无产阶级专政，坚持继续革命，坚持劳动群众自己解放自己的原则，而不是把群众的历史主体地位交给国家机器和领袖权威来代替。"
]
},

{
term: "三自一包",
content: [
"<strong>三自一包</strong>是中国社会主义建设时期农村两条道路斗争中出现的一种经济政策主张，通常指扩大自留地、开放自由市场、实行自负盈亏和包产到户。它表面上以调动农民积极性、恢复农业生产、增加收入为名，实质上是在农村集体经济内部扩大个体经营和商品交换，削弱社会主义集体所有制，助长小生产和资本主义自发倾向。",
"“三自”中的自留地，是指在集体经济之外扩大农户个人支配的小块土地；自由市场，是指允许农产品和副业产品脱离国家计划和集体统一安排而自由买卖；自负盈亏，是指把生产经营结果越来越多地交给单个农户或小单位承担。“一包”则是包产到户，把集体生产任务、产量和收益同一家一户直接绑定起来，使集体经营退回到分散的小农经营。",
"三自一包的社会基础，是小生产的自发资本主义倾向。农民小生产者既是劳动者，又容易受到小私有观念、个人经营和市场交换的影响。在社会主义改造以后，农村虽然建立了合作社和人民公社等集体经济形式，但小生产的旧习惯和自发势力并不会马上消失。三自一包正是利用这种基础，把农民重新引向一家一户的小私有经营道路。",
"三自一包同农业集体化方向相对立。农业集体化的任务，是把分散的小农经济组织起来，通过互助合作、集体劳动、统一经营、公共积累和群众管理，逐步克服贫富分化和资本主义自发势力。三自一包则把生产责任、收益分配和经营动力重新推回到个体农户身上，使集体经济变成外壳，使农民重新围绕个人利益和市场价格安排生产。",
"三自一包的危险，在于它会瓦解农村集体经济的共同基础。自留地扩大，会削弱集体土地和集体劳动；自由市场扩大，会使价格和利润压倒计划和公共需要；自负盈亏扩大，会使贫富差别重新发展；包产到户扩大，会使集体生产组织退化为个体经营的联合名义。这样发展下去，农村就会重新出现两极分化、雇工经营、土地实际集中和资本主义关系萌芽。",
"三自一包表面上能够在短期内刺激一部分农户的生产积极性，但这种积极性主要建立在个人占有、市场利润和小私有利益之上。它不能从根本上解决农业机械化、水利建设、公共福利、集体积累和城乡差别问题。分散经营也难以承担大规模农田改造、合作医疗、农村教育和公共事业建设。用个体利益代替集体道路，最终会削弱社会主义农业的长远基础。",
"三自一包在路线性质上属于农村中的资本主义道路。它不是单纯的技术调整，也不是中立的经济办法，而是关系到农村生产资料归谁支配、劳动成果怎样分配、农业向哪个方向发展的重大路线问题。坚持集体经济，就要依靠贫下中农，巩固工农联盟，限制和改造小生产的自发势力；推行三自一包，则会扩大私人经营和市场调节，使社会主义农村重新受到资本主义因素侵蚀。",
"三自一包同唯生产力论有密切联系。唯生产力论只看产量、效率和短期恢复，不看所有制方向、阶级关系和政治路线。它把社会主义集体经济中的困难说成集体化本身的问题，把个体经营中的短期增长说成万能灵药，从而掩盖小农经济重新导致贫富分化和资本主义复辟的趋势。生产力必须发展，但发展生产力不能以破坏社会主义生产关系为代价。",
"反对三自一包，不是反对改善农民生活，也不是反对调动农民积极性。真正的问题在于，用什么路线调动积极性。社会主义路线要求通过集体积累、民主办社、按劳分配、干部参加劳动、群众监督、农业机械化和公共事业建设来调动群众积极性；资本主义路线则用个人承包、自由市场和私人收益刺激农民，把农民重新分散为相互竞争的小生产者。",
"三自一包的历史意义，在于它集中反映了社会主义农村中两条道路的斗争：一条是巩固和发展集体经济、逐步走向共同富裕和农业现代化的社会主义道路；另一条是恢复小私有经营、扩大市场自发势力、重新走向两极分化的资本主义道路。无产阶级必须从所有制和阶级斗争高度认识三自一包，不能把它当成单纯经济政策。只有坚持社会主义集体经济，坚持群众路线和无产阶级政治领导，才能防止农村重新滑向资本主义。"
]
},

{
term: "世袭君主制",
content: [
"<strong>世袭君主制</strong>是阶级社会中最高国家权力由某一家族、血统或王朝世代继承的一种政治制度。它把国家最高统治权固定在君主及其家族手中，使王位按照血缘、长幼、宗法、贵族承认或王朝传统传递。世袭君主制不是人类社会从来就有的自然制度，而是在私有制、阶级分化、国家机器和统治阶级特权形成以后产生的政治形式。",
"世袭君主制的经济基础，是剥削阶级对生产资料和剩余劳动的占有。在奴隶社会和封建社会中，奴隶主贵族、封建地主和宗法贵族需要一种稳定的最高权力来维护土地、奴隶、农奴、贡赋和等级秩序。君主通过军队、官僚、法律、宗教和礼制把统治阶级的利益集中起来，以国家权力的形式镇压被压迫阶级，维护既定的剥削关系。",
"世袭君主制同原始社会的首领选举制有根本区别。原始社会的首领主要依靠经验、威望和共同体认可，不能依靠常备军、监狱、税收和官僚机构凌驾于群众之上。世袭君主则掌握国家机器，拥有制度化的强制权力，并把这种权力变成家族和王朝的特权。公共权力从社会共同事务中分离出来，变成少数统治者压迫多数劳动人民的工具。",
"世袭君主制常常同宗法制度、贵族等级和土地制度结合在一起。君主被说成天下、国家或领土的最高主人，贵族和官僚则通过分封、任命、采邑、爵位和土地占有同君主权力联系起来。政治权力、土地占有、血缘等级和军事义务互相交织，形成严密的统治体系。劳动人民被排除在国家权力之外，只能承担赋税、徭役、兵役和各种封建义务。",
"世袭君主制需要一整套意识形态来维护自身合法性。君权神授、天命论、血统神圣、祖宗法统、忠君思想、宗教权威和礼教秩序，都是为世袭权力服务的思想工具。统治阶级把某一家族的统治说成天意、神意、祖制或自然秩序，企图使劳动人民把剥削和压迫看成不可反抗的命运。意识形态的神圣化，掩盖的是国家权力的阶级本质。",
"在封建社会中，世袭君主制通常发展为封建专制君主制。君主集中立法、行政、司法、军事和财政大权，依靠官僚机构、军队、赋税制度和思想控制统治广大农民。封建君主表面上代表整个国家，实际上代表地主阶级和贵族集团的根本利益。皇帝、国王或沙皇的个人权力，不过是封建土地所有制和地主阶级统治在政治上的集中表现。",
"世袭君主制内部也充满矛盾。王位继承会引发宫廷斗争、贵族冲突、宗室内乱和地方割据；君主同贵族、官僚、地主和新兴资产阶级之间也会围绕权力和财富发生斗争。随着商品经济发展、城市兴起、资产阶级壮大和农民反抗加剧，封建世袭君主制越来越成为生产力发展的障碍，最终在资产阶级革命、农民战争和民族民主运动中受到沉重打击。",
"资产阶级反对封建世袭君主制，并不意味着它消灭了阶级统治。资产阶级革命在许多国家废除了绝对君主制，建立共和国、议会制或君主立宪制，用资产阶级法权和选举制度取代旧的王朝神权。但是，只要生产资料仍然由资产阶级占有，国家仍然是维护资本统治的机器。资产阶级政治形式可以不再世袭，却仍然保持剥削阶级对劳动人民的统治。",
"世袭君主制的历史意义，在于它集中表现了阶级国家从原始公共管理中分离出来以后，怎样被少数统治家族和剥削阶级垄断。它说明国家权力并不是超阶级的公共权力，而是建立在一定所有制和阶级关系之上的统治工具。王位世袭、贵族特权和君权神圣，都是私有制和阶级压迫在政治上层建筑中的表现。",
"无产阶级反对世袭君主制，不是为了停留在资产阶级共和国的形式民主上，而是为了揭露一切剥削阶级国家的本质。世袭君主制应当被推翻，封建等级和君权神授应当被扫进历史垃圾堆；但真正的解放还必须进一步消灭私有制和阶级压迫，打碎旧的国家机器，建立劳动人民掌握政权的制度。只有当阶级和国家逐步消亡，公共权力才能不再是少数人世代垄断的统治工具，而成为自由联合的劳动者共同管理社会事务的形式。"
]
},

{
term: "井田制",
content: [
"<strong>井田制</strong>是中国古代奴隶制和早期封建社会过渡时期的一种土地制度形式，传统上多同西周时期的土地占有和劳动组织联系在一起。所谓井田，是把土地划分成类似“井”字形的格局，周围田地由农民耕种，中间田地作为公田，由农民共同劳动，收获归贵族、领主或国家支配。井田制不是原始公有制，也不是社会主义公有制，而是建立在等级统治、土地支配和劳动贡纳基础上的古代剥削制度。",
"井田制的核心，是土地名义上归王室或国家掌握，实际由贵族、诸侯、卿大夫等统治阶级分级占有和支配。劳动者不能自由占有土地，而是在宗法等级和政治权力控制下耕种土地，向统治阶级承担劳役、贡赋和其他义务。它表面上带有共同耕作、公田私田并存的形式，实质上反映的是统治阶级对土地和劳动者剩余劳动的占有。",
"井田制同宗法制度和分封制度密切相连。周代国家权力通过天子、诸侯、卿大夫、士等等级层层分配土地和政治权力，土地关系与血缘等级、政治身份和军事义务结合在一起。土地不仅是生产资料，也是维持贵族等级秩序和国家统治的基础。井田制下的土地分配，不是劳动人民自由决定的结果，而是宗法贵族统治结构在经济上的表现。",
"井田制下的劳动关系具有明显的剥削性质。农民或依附劳动者在自己的份地上维持生活，同时还必须为统治阶级耕种公田、服徭役、纳贡赋。公田劳动体现了劳动者剩余劳动被统治阶级无偿占有的关系。它不像资本主义那样通过工资形式掩盖剥削，也不像成熟封建地租那样主要表现为租佃关系，而是以政治强制、等级身份和土地支配相结合的形式榨取劳动。",
"井田制在历史上具有过渡性质。它一方面保留了原始共同体和公社土地关系的某些残余形式，例如共同劳动、土地定期分配和公田观念；另一方面又已经同奴隶制、贵族等级和国家权力结合起来，成为统治阶级占有剩余劳动的制度工具。因此，不能把井田制简单理解为古代平均主义或公有制理想，它已经属于阶级社会的土地制度。",
"随着生产力发展、铁器和牛耕推广、人口增长、商品交换扩大和私田发展，井田制逐渐瓦解。私田开垦和土地实际占有不断突破旧有等级秩序，贵族和地主逐渐把土地变成可以控制、买卖和继承的私有财产。旧的公田劳役制度越来越难以维持，土地兼并、租佃关系和封建地主土地所有制逐步发展起来。井田制的瓦解，反映了中国古代社会生产关系的深刻变动。",
"春秋战国时期，各国变法加速了井田制的崩溃。随着赋税制度、军功授爵、土地私有和中央集权的发展，旧的宗法分封土地秩序被新兴地主阶级和封建国家制度冲破。土地不再主要按照贵族血缘等级分配，而越来越成为国家征税、地主兼并和农民租佃的对象。井田制的灭亡，是奴隶制贵族土地关系向封建地主土地关系转变的重要表现。",
"井田制的历史意义，在于它揭示了中国古代土地制度从原始公社残余向阶级社会土地占有制度转化的复杂过程。它说明土地制度不是单纯技术安排，而是社会生产关系和阶级关系的集中体现。谁占有土地，谁支配劳动，谁占有剩余产品，决定了土地制度的阶级性质。井田制的公田形式不能掩盖其服务于贵族统治和剩余劳动占有的本质。",
"研究井田制，必须反对把它美化为理想公有制的复古观点。古代公田和共同劳动并不等于劳动人民真正掌握生产资料，更不等于消灭剥削。只要土地支配权掌握在王室、贵族和统治阶级手中，只要劳动者必须向统治阶级提供无偿劳动和贡赋，这种制度就仍然是阶级压迫制度。真正的公有制，必须建立在劳动人民掌握生产资料和社会权力的基础上。",
"井田制作为古代土地制度的一种形态，说明生产关系总是随着生产力和阶级斗争的发展而变化。它曾经适应一定历史时期的宗法贵族统治和农业生产组织，后来又被私田发展、地主阶级兴起和封建国家制度所取代。无产阶级认识井田制，不是为了复古，而是为了把握土地制度、阶级统治和国家权力之间的联系，说明一切土地制度都必须从生产资料所有制和剩余劳动占有关系中加以分析。"
]
},

{
term: "父系氏族",
content: [
"<strong>父系氏族</strong>是原始社会后期以父系血缘为纽带形成的氏族组织形式。它的基本特点是氏族成员按照父亲一方来确认血统、亲属关系和氏族归属，子女属于父亲所在氏族，财产、身份和继承关系逐渐通过父系延续。父系氏族是在母系氏族衰落、私有财产发展、男子在生产和财产占有中地位上升的条件下形成的，是原始社会向阶级社会过渡的重要组织形态。",
"父系氏族的形成，根源于生产力发展和财产关系变化。随着畜牧业、农业、手工业和交换的发展，社会剩余产品逐渐增加，牲畜、工具、奴隶、金属器具和其他财富越来越多地被某些家庭和男子掌握。男子在畜牧、耕作、战争、交换和公共事务中的作用上升，原来以母系确认亲属关系的制度开始不能适应新的财产继承要求。确认父系血统，便成为男子把财产传给自己后代的重要条件。",
"父系氏族的产生，标志着母权制逐步让位于父权制。在母系氏族中，子女通常属于母亲氏族，妇女在氏族共同生活和血缘确认中具有较高地位。父系氏族确立以后，男子逐渐成为家庭财产、血统延续和氏族权威的中心，妇女在婚姻、家庭和社会中的地位开始下降。父系氏族不是单纯亲属称谓的变化，而是生产关系、财产关系和性别关系发生变化的表现。",
"父系氏族同专偶制家庭的发展密切相连。为了确认父亲身份和保证财产由父系后代继承，男子要求妇女在婚姻关系中受到更严格限制，对偶制逐渐向专偶制转化。婚姻不再只是较松散的男女结合，而越来越同财产、继承、身份和男性权威联系起来。这样，家庭逐步从原始共同体内部的生活单位，转变为维护父系血统和私人财产继承的社会单位。",
"父系氏族仍然保留着氏族制度的某些形式。它还没有完全等同于阶级国家，公共事务仍可能通过氏族会议、长老、首领和习惯来处理，社会管理还没有完全变成国家官僚和强制机关。但是，父系氏族内部已经孕育着私有制、等级分化和父权统治的因素。原始民主开始受到财产差别、军事首领权力和男性家长权威的侵蚀。",
"父系氏族的发展加速了私有制和阶级分化。随着财富越来越集中到少数家庭和男子手中，原始公社所有制受到破坏，贫富差别逐渐扩大。战争俘虏可能被变成奴隶，公共财富可能被首领和贵族据为己有，氏族成员之间的平等互助关系开始瓦解。父系氏族由此成为原始社会解体、奴隶制和国家产生的重要过渡环节。",

"氏族议事会具有原始民主性质。氏族内部重大事务通常需要经过共同商议，首领和长老不能像后来的国家官吏那样凭借暴力机关强制统治群众。他们的影响力主要来自经验、能力、年龄、战功、劳动贡献和群众认可。如果首领失去威望，氏族成员可以不再服从他。这种民主不是现代意义上的无产阶级民主，而是建立在低生产力和血缘共同体基础上的原始民主。",
"氏族议事会同国家机关有根本区别。国家是阶级矛盾不可调和的产物，是一个阶级压迫另一个阶级的暴力机器；氏族议事会则产生在阶级尚未形成、社会尚未分裂为剥削者和被剥削者的历史阶段。它没有脱离人民的官僚集团，没有常备军、监狱、警察和税收制度，也没有凌驾于社会之上的强制权力。它处理的是共同体内部事务，而不是维护一个剥削阶级对另一个阶级的统治。",
"氏族议事会的权威，主要依靠传统习惯和公共舆论。原始社会没有成文法律和国家审判机关，成员之间发生纠纷时，通常由氏族会议、长老调解和共同体舆论来处理。违反氏族习惯的人会受到批评、排斥、赔偿要求或其他集体制裁。这种制裁虽然也具有约束力，但还不是阶级国家那种制度化、专业化、暴力化的强制机关。",
"氏族议事会同血缘组织密切相连。氏族成员往往以共同祖先、共同图腾、共同居住和共同生产为纽带，公共事务也主要围绕氏族共同利益展开。由于社会范围狭小，生产和生活联系直接，氏族成员能够较直接地参加公共事务。这里的政治生活还没有从社会生活中分离出来，公共管理还没有变成少数人垄断的专门职业。",
"氏族议事会也有历史局限。它建立在血缘关系和狭小共同体基础上，不能适应复杂的大规模社会分工、广阔地域管理和阶级社会矛盾的发展。随着畜牧业、农业、手工业和交换的发展，剩余产品增加，私有财产出现，氏族内部贫富差别扩大，首领和军事头目逐渐可能把公共权力转化为个人权力，把公共财富转化为私人财富。氏族议事会的原始民主由此逐步瓦解。",
"私有制和阶级分化的发展，最终使氏族议事会让位于国家机关。当社会分裂为占有生产资料的剥削阶级和失去生产资料的被剥削阶级时，单靠氏族习惯和公共舆论已经不能维持旧秩序。新兴剥削阶级需要一种凌驾于社会之上的强制力量来维护私有财产、镇压反抗、征收赋税和组织战争，国家便在氏族制度瓦解的基础上产生。氏族议事会的衰落，标志着原始社会向阶级社会的过渡。",
"氏族议事会的历史意义，在于它说明公共管理并不从来就是国家统治，国家也不是人类社会永恒存在的自然机关。人类社会曾经长期通过氏族会议、习惯和共同体自治来处理公共事务，没有阶级国家和官僚机器。国家是在私有制和阶级矛盾发展到一定阶段以后才产生的，它也必将在阶级和剥削消灭以后逐步消亡。",
"研究氏族议事会，不是为了退回原始社会，而是为了认识国家、民主和公共权力的历史性。原始民主建立在落后生产力和血缘共同体基础上，不能成为现代社会的出路；无产阶级民主则建立在社会化大生产、生产资料公有制和劳动人民掌握政权的基础上。氏族议事会的历史存在说明，公共事务可以不由剥削阶级官僚机器垄断，随着私有制和阶级压迫的消灭，人类社会将能够在更高水平上实现劳动人民对社会事务的共同管理。"
]
},

{
term: "存在",
content: [
"<strong>存在</strong>是哲学中表示客观实在及其各种具体形态的基本范畴。它指不以人的主观意志为转移而存在的现实世界，包括自然界、人类社会以及它们的运动、联系和发展过程。存在不是空洞的抽象词，而是同物质、运动、时间、空间、实践和社会生活密切联系的范畴。承认存在的客观性，是唯物主义同唯心主义相区别的根本出发点。",
"唯物主义把存在理解为客观现实本身，认为世界不是由意识、观念、神灵或某种神秘精神创造出来的，而是在人的意识之外并先于人的意识而存在。山川河流、日月星辰、生命演化、社会生产、阶级斗争和历史发展，都不是因为人想到它们才存在，而是具有不依赖于主观意识的客观实在性。人的认识只能反映存在、把握存在、改造存在，不能凭空创造存在的根源。",
"唯心主义则颠倒存在和意识的关系。主观唯心主义把存在说成感觉、经验或自我的产物，似乎没有人的感知，事物就不存在；客观唯心主义把存在说成理念、绝对精神、天命或神意的外化，似乎现实世界只是某种精神实体的表现。这两种形式虽然不同，但共同点都是否认客观世界的独立性，把意识放在第一位，把存在放在第二位。",
"存在和意识的关系，是哲学基本问题的核心内容。物质存在决定意识，意识是存在在人脑中的反映。没有自然界和社会生活，就没有人的感性经验、语言、概念、思想和理论。意识不能离开存在而独立悬浮，思想不能脱离现实而自我生成。任何正确认识，都必须从客观存在出发，而不是从主观愿望、抽象原则或书本公式出发。",
"存在不是静止不变的实体，而是在运动和发展中存在。物质存在的根本方式是运动，任何事物都处在相互联系和矛盾发展之中。孤立的、永恒不变的存在只是形而上学的幻想。自然界不断变化，社会制度不断更替，阶级关系不断斗争，人的认识也在实践中不断发展。真正把握存在，就必须把它作为过程来理解，把它放在联系、运动、矛盾和发展中考察。",
"存在具有具体性。现实中没有脱离一切条件的抽象存在，任何事物都在一定时间、空间、条件和关系中存在。一个阶级的存在，不只是人口数量问题，而是它在生产关系中的地位问题；一种制度的存在，不只是法律名义问题，而是生产资料归谁占有、劳动成果由谁支配、国家权力服务于哪个阶级的问题。离开具体条件谈存在，就会把活生生的现实变成空洞概念。",

{
term: "专偶制",
content: [
"<strong>专偶制</strong>，又称专偶制家庭或一夫一妻制家庭，是从对偶制家庭发展而来、同私有制和父权制兴起密切联系的一种婚姻家庭形式。它表现为一个男子和一个女子组成较稳定、较排他的夫妻关系，并通过社会习俗、法律、宗教和财产制度加以固定。专偶制不是超历史、超阶级的自然制度，而是在一定生产力发展、私有财产积累和继承关系形成的条件下产生的历史产物。",
"专偶制产生的根本经济原因，是私有财产的发展和父系继承要求的确立。随着畜牧业、农业、手工业和交换的发展，剩余产品逐渐增加，牲畜、土地、奴隶、工具和其他财富越来越多地掌握在男子手中。男子为了把财产传给自己的亲生子女，便要求确认子女的父系血统，从而要求妇女在婚姻关系中受到更严格的限制。专偶制正是在这种财产继承需要中逐步巩固起来的。",
"专偶制同母权制的衰落和父权制的兴起密不可分。在对偶制家庭中，子女通常仍然属于母亲氏族，妇女在氏族社会中保持较高地位。随着父系继承和男性财产权力的发展，家庭关系逐步从母系转向父系，男子成为家庭财产和家庭权威的中心。专偶制的确立，意味着妇女在家庭和社会中的地位发生重大下降，家庭越来越成为男性财产继承和父权统治的制度工具。",
"专偶制不同于原始社会中相对稳定的配偶关系。对偶制中的男女结合仍然比较容易解除，婚姻关系还没有完全被国家法律和私人财产固定下来；专偶制则把婚姻同财产、继承、身份、宗教和国家权力结合起来，使家庭成为阶级社会的基本细胞。它不是简单的感情结合形式，而是私有制社会用来确认财产归属、维持父系血统和再生产社会秩序的制度安排。",
"在阶级社会中，专偶制具有鲜明的不平等性质。它表面上要求男女双方彼此专一，实际上在很长历史时期内主要是对妇女的严格约束。男子可以凭借财产、社会地位和法律权力支配妻子和子女，而妇女则被限制在家庭内部，承担生育、家务和服从丈夫的义务。所谓家庭伦理和贞操观念，常常成为维护男性统治、财产继承和妇女从属地位的意识形态工具。",
"专偶制在奴隶社会、封建社会和资本主义社会中具有不同表现。奴隶主和贵族家庭把婚姻用于维护血统、财产和政治联盟；封建家庭把婚姻同宗法等级、土地继承和家族秩序结合起来；资产阶级家庭则把婚姻同私人财产、个人继承、家庭消费和劳动力再生产结合起来。形式虽然变化，本质上都同私有制、阶级关系和性别压迫存在密切联系。",
"资本主义社会把专偶制包装成个人自由选择的婚姻形式，但它仍然受到阶级和财产关系的深刻支配。资产阶级家庭以私人财产和继承关系为基础，婚姻常常同财富、地位、职业和阶级再生产联系在一起；无产阶级家庭则在工资压迫、失业、住房、教育、医疗和生活成本压力下承担劳动力再生产任务。资本主义并没有真正解放家庭，而是把家庭变成再生产雇佣劳动者和承受社会危机的私人单位。",
"专偶制的历史进步性，在于它比更早的婚姻形态形成了较稳定的家庭关系，有利于子女抚养和社会生活的一定组织。但是，它的产生并不代表妇女解放，相反，它同私有制、父权制和阶级统治结合以后，成为妇女受压迫的重要制度形式。家庭内部的压迫不是单纯道德问题，而是同生产资料私有制、社会分工和财产继承关系相联系的社会问题。",
"社会主义必须改造专偶制遗留下来的旧内容。生产资料公有制、妇女参加社会劳动、公共教育、公共福利、婚姻自由和男女平等，为家庭关系的变革创造条件。但是，旧社会留下的父权观念、家长制、性别分工、财产观念和婚姻中的不平等不会自动消失，必须通过思想文化斗争、妇女解放运动、社会公共事业发展和劳动人民共同参与管理来不断克服。",
"专偶制的历史说明，家庭不是永恒不变的自然形式，而是随着生产方式、财产关系和社会制度变化而变化的。私有制和阶级社会把婚姻家庭变成财产继承、父权统治和社会秩序再生产的工具；共产主义社会将在消灭私有制和阶级压迫的基础上，使两性关系摆脱经济依附、财产算计和父权束缚。那时，家庭和婚姻关系将建立在真正平等、自由结合和人的全面发展基础之上。"
]
},

{
term: "对偶制",
content: [
"<strong>对偶制</strong>，又称对偶婚制或对偶制家庭，是原始社会后期从群婚制向专偶制过渡的一种婚姻家庭形式。它表现为一个男子和一个女子在一定时期内相对稳定地结合，共同生活和抚养子女，但这种结合还不像后来的专偶制那样具有严格、排他的、由私有财产和父权制支撑的法律形式。对偶制处在氏族制度仍然存在、私有制和阶级尚未完全形成的历史阶段，是家庭形态发展过程中的过渡环节。",
"对偶制是在群婚制逐步瓦解的基础上产生的。随着氏族外婚规则、血缘禁忌和婚姻限制不断增多，原先较为广泛的群婚关系越来越难以维持，较稳定的男女配偶关系逐渐发展起来。对偶制的出现，说明人类婚姻关系已经从较松散的群体结合向较固定的个体结合转变，但这种个体结合仍然保留着原始社会婚姻关系的许多痕迹。",
"对偶制不同于文明时代的一夫一妻制。对偶婚中的男女双方一般可以比较容易地解除关系，婚姻并没有被国家法律、宗教制度和私有财产继承关系牢固固定下来。子女通常仍然属于母亲所在的氏族，血统和亲属关系更多按照母系来确认。男子还没有取得后来父权制家庭中那种对妻子、子女和财产的绝对支配地位，妇女在氏族内部仍然保持较高地位。",

"对偶制的历史进步性，在于它比群婚制更有利于亲属关系的明确、子女抚育的稳定和家庭关系的发展。随着人类社会生产和生活日益复杂，较稳定的配偶关系能够在一定程度上适应子女抚养、劳动协作和氏族组织发展的需要。它表明家庭形式并不是一成不变的自然制度，而是随着生产力、亲属制度和社会组织的发展而变化的历史产物。",
"对偶制内部也孕育着向父权制和专偶制转化的条件。随着畜牧业、农业、手工业和交换的发展，剩余产品增加，私人占有的财富逐渐出现，男子在生产和财产积累中的地位上升。牲畜、奴隶、金属器具和其他财产越来越多地掌握在男子手中，男子便要求确认自己的亲生子女，以便把财产传给自己的后代。这种经济要求推动母权制逐步让位于父权制，也推动对偶制向专偶制转化。",

]

{
term: "左倾机会主义",
content: [
"<strong>左倾机会主义</strong>是工人运动和无产阶级政党内部一种披着革命外衣的机会主义路线，通常表现为脱离客观实际、脱离群众基础、脱离力量对比，片面追求激进口号和冒险行动。它表面上似乎比正确路线更加坚决、更革命，实际上用主观愿望代替客观分析，用空洞激进口号代替群众工作，用盲动冒险代替有准备、有步骤、有策略的革命斗争。",

{

content: [

"凯恩斯主义同新自由主义虽然在政策手段上不同，但阶级基础相同。凯恩斯主义主张国家干预和需求管理，新自由主义主张市场自由和资本放任；前者用国家支出和福利政策缓和矛盾，后者用资本进攻和市场纪律转嫁危机。二者都维护资本主义私有制，都以恢复资本积累和资产阶级统治为根本目的。它们的区别，是资产阶级在不同历史条件下采用的不同统治策略。",
"凯恩斯主义的根本问题，在于它把资本主义危机看成需求不足、投资不足和政策调节失误，而不是生产社会化同资本主义私人占有之间基本矛盾的必然结果。资本主义危机不是因为国家干预太少或市场调节不够完善，而是因为生产服从利润，劳动人民购买力受到剥削关系限制，资本积累不断制造过剩生产、失业和贫富分化。只要资本主义私有制存在，危机就会以不同形式反复爆发。",

content: [
"<strong>分工</strong>是社会生产过程中不同个人、群体、部门或地区之间按照一定方式承担不同劳动职能和生产任务的社会关系。它既包括生产过程内部的技术分工，也包括社会范围内农业、工业、商业、脑力劳动、体力劳动、城市、乡村等不同领域之间的社会分工。分工不是单纯的劳动安排问题，而是同生产力水平、生产资料所有制、阶级关系和社会制度密切联系在一起的历史范畴。",
"分工的产生，是生产力发展和社会需要扩大的结果。在原始社会早期，生产力低下，劳动分化较少，社会成员主要从事较为直接和简单的共同劳动。随着生产工具改进、剩余产品出现、交换发展和人口增加，狩猎、畜牧、农业、手工业、商业、管理、军事、宗教和思想活动逐步分离出来。分工提高了劳动熟练程度和社会生产效率，也使不同劳动形式之间形成了越来越复杂的联系。",

"资本主义社会分工表现为一种自发的、盲目的、受价值规律和资本增殖支配的分工。各部门、企业和地区之间的生产联系并不是按照人民需要有计划地组织起来，而是在市场竞争、价格波动和利润追逐中自发形成。资本流向利润更高的部门，劳动者被迫随资本运动而迁移、失业或改变劳动岗位。社会生产已经高度社会化，但生产资料仍然私人占有，这使社会分工不断造成危机、浪费、失衡和阶级压迫。",
"旧式分工造成劳动者的片面发展。一个人被终身固定在某种狭窄劳动中，体力劳动者被排斥在科学文化和管理活动之外，脑力劳动者又同直接生产和劳动群众相脱离。旧式分工把人的能力割裂开来，使一部分人专门从事指挥和管理，另一部分人长期服从命令和重复劳动。它不仅是生产组织形式，也是社会压迫和人的异化的重要来源。",
"社会主义必须改造旧式分工，但不能脱离生产力条件空谈立即消灭分工。社会主义社会仍然需要不同部门、岗位和专业之间的协作，需要计划安排、技术分工和组织管理。但是，社会主义分工的方向应当是逐步克服阶级社会遗留下来的固定化、等级化和特权化分工，使工人农民参加管理，使干部参加劳动，使知识分子同工农群众结合起来，使脑力劳动和体力劳动、城市和乡村、工业和农业之间的差别逐步缩小。",
"分工问题同三大差别密切相连。工农差别、城乡差别、脑力劳动和体力劳动差别，都是旧社会分工在社会主义条件下残留和再生产的重要表现。如果不加以限制和改造，这些差别就可能成为资产阶级法权、干部特权和新资产阶级滋生的土壤。社会主义建设必须通过教育革命、干部参加劳动、群众参加管理、工业支援农业、知识青年同工农结合、技术普及和共同劳动等方式，逐步缩小这些差别。",
"共产主义社会将克服旧式分工对人的奴役。那时，生产资料归自由联合的劳动者共同占有，社会生产按照共同需要有计划地组织起来，劳动不再是谋生负担，而成为人的自由全面发展的第一需要。分工不会以压迫人的固定身份和等级关系存在，而会转化为社会成员自由发展能力、轮换劳动形式、全面参与社会事务的自觉协作。人不再被某一狭窄职业终身束缚，而能够在共同体中全面发展自己的体力、智力和创造力。",
"分工的历史发展说明，生产力进步本身并不能自动带来人的解放。只有改变生产资料所有制和社会关系，只有消灭资本对劳动的统治，只有不断改造旧式分工造成的等级、特权和片面发展，社会劳动的组织才能从压迫人的力量转变为发展人的力量。无产阶级革命和社会主义建设的任务之一，就是把分工从阶级统治和资本支配中解放出来，使它逐步成为自由联合劳动者之间的自觉协作。"
]
},

{
term: "价格革命",
content: [
"<strong>价格革命</strong>通常指16世纪至17世纪初欧洲发生的长期物价上涨和货币价值下降现象，是封建社会向资本主义社会过渡时期的重要经济变动。它不是政治革命意义上的夺权斗争，而是由世界市场扩大、贵金属大量输入、商品经济发展和封建关系瓦解共同推动的价格体系剧烈变化。价格革命深刻影响了欧洲各阶级的财富分配和社会关系，加速了资本主义生产关系的成长。",
"价格革命的重要背景，是新航路开辟和殖民掠夺。西班牙、葡萄牙等殖民国家从美洲掠夺大量金银，贵金属源源不断流入欧洲，使货币数量迅速增加。货币数量扩大并不自动创造真实财富，如果商品生产和社会产品没有同等增长，货币购买力就会下降，表现为物价持续上涨。殖民掠夺带来的金银输入，成为欧洲价格革命的重要直接条件。",
"价格革命同世界市场的形成密切相连。新航路开辟以后，欧洲、非洲、美洲和亚洲之间的贸易联系迅速扩大，商业资本活动范围空前扩展。粮食、羊毛、布匹、香料、金银、奴隶和殖民地产品进入更广阔的交换体系，封闭的地方市场逐渐被世界市场打破。价格不再只是地方供求的结果，而越来越受到国际贸易、殖民掠夺和商业资本运动的影响。",
"价格革命对封建地主阶级造成复杂影响。那些依靠固定货币地租生活的封建地主，由于货币贬值和物价上涨，实际收入下降，旧式封建地租关系受到冲击。一些地主为了弥补损失，转而提高地租、驱逐农民、圈占土地、发展商品化农业，甚至把土地经营同市场利润联系起来。这样，价格革命既削弱了一部分传统封建贵族，也推动另一部分地主向资本主义化经营转变。",
"价格革命对农民和城市贫民造成沉重压力。物价上涨使粮食、燃料、住房和生活资料价格提高，而工资和小农收入往往追不上价格变化。许多农民因地租、债务和土地兼并而破产，城市手工业者和雇佣劳动者生活恶化，贫困和流民增加。价格革命表面上是物价变化，实质上是社会财富重新分配的过程，广大劳动群众承担了经济变动的主要痛苦。",
"价格革命有利于商业资产阶级和早期资本家积累财富。商人、投机者、放债者、出口商和经营商品化生产的资本家，能够利用价格上涨、市场扩大和货币流动获取高额利润。债务人也可能因货币贬值而减轻实际债务负担。物价上涨使固定收入者受损，却使掌握商品、货币和贸易渠道的阶级获得机会，从而加速财富向新兴资产阶级手中集中。",
"价格革命推动了资本主义原始积累。殖民掠夺、奴隶贸易、商业扩张、圈地运动和物价上涨相互作用，把大量农民从土地上排挤出去，把财富集中到商人、地主和早期资本家手中。一方面，失去土地和生产资料的农民逐渐变成雇佣劳动者；另一方面，掌握货币和生产资料的资产阶级获得扩大经营的条件。价格革命因此成为封建自然经济瓦解和资本主义生产关系发展的重要经济环节。",
"价格革命揭示了货币和价格并不是孤立的经济现象。货币数量、商品生产、世界贸易、殖民掠夺、阶级关系和国家政策都会影响价格运动。资产阶级经济学常把价格变化说成单纯市场现象，而历史事实表明，价格背后始终存在生产关系和阶级利益。谁掌握货币、商品、土地和贸易通道，谁就能在价格变动中获得优势；被剥夺生产资料的劳动群众，则往往成为物价上涨的承担者。",
"价格革命的历史意义，在于它从经济层面加速了欧洲封建制度的危机和资本主义的兴起。它削弱了旧封建地租关系，促进了商品生产和世界市场发展，加速了财富集中和无产阶级形成。价格革命不是资本主义产生的唯一原因，但它同殖民扩张、商业资本、圈地运动和国家权力结合起来，成为资本主义原始积累的重要组成部分，标志着欧洲社会从封建秩序向资本主义秩序转变的深刻动荡。"
]
},

{
term: "农奴制",
content: [
"<strong>农奴制</strong>是封建社会中一种以土地占有和人身依附为基础的剥削制度。农奴不同于完全失去人身自由的奴隶，也不同于具有形式上自由身份的资本主义雇佣工人；他们通常被束缚在地主或封建主占有的土地上，不能自由迁徙，必须向封建主承担劳役、实物、货币和各种附加义务。农奴制是封建生产关系的重要形态，是地主阶级对农民进行超经济强制和剩余劳动榨取的制度形式。",
"农奴制的经济基础，是封建土地所有制。封建主占有土地，农奴为了生存必须依附于土地和封建主，在自己的份地上生产生活，同时还要为封建主耕种领主土地、缴纳实物地租或货币地租。农奴虽然有家庭、工具和一定的独立小生产条件，但他们的劳动和生活受到封建主严重控制。土地不是农奴自由支配的生产资料，而是把农奴束缚在封建剥削关系中的物质锁链。",
"农奴制的核心特点，是人身依附。农奴不能像自由劳动者那样自由选择居住地和劳动对象，常常被限制婚姻、迁徙、继承、经营和诉讼权利。封建主不仅通过经济手段占有农奴的剩余劳动，还通过领主法庭、庄园权力、宗教权威、等级制度和国家暴力对农奴实行直接统治。这种超经济强制，是农奴制区别于资本主义雇佣劳动制度的重要特征。",
"农奴制比奴隶制具有一定历史进步性，但仍然是残酷的剥削制度。奴隶通常被当作会说话的工具，完全属于奴隶主；农奴则有家庭和一定份地，劳动积极性比奴隶有所提高，社会生产力也因此有一定发展。但是，农奴并没有摆脱剥削和压迫，他们创造的大量剩余产品和剩余劳动仍然被封建主占有，政治上仍然处于被统治、被束缚、被压迫的地位。",
"农奴制在欧洲中世纪广泛存在，在俄国等地延续时间尤其长。俄国农奴长期被地主阶级束缚在土地上，遭受沉重劳役和人身压迫，直到1861年农奴制改革才在法律上被废除。但这种改革并没有彻底解放农民，农民往往仍需支付赎买金，土地问题也没有得到根本解决。农奴制的废除为资本主义发展扫清了一部分障碍，却保留了大量封建残余，使俄国农村长期充满尖锐矛盾。",
"农奴制同封建国家和封建意识形态密不可分。封建国家用法律和暴力维护地主阶级对土地和农奴的统治，宗教和传统观念则把等级秩序、服从义务和领主权威说成天经地义。农奴的苦难不是个人命运造成的，而是封建生产关系和封建上层建筑共同作用的结果。只要土地集中在封建主手中，只要农民被束缚在土地上，农奴制压迫就不可能真正消失。",
"农奴反抗贯穿农奴制发展的全过程。逃亡、抗租、拒绝劳役、破坏庄园、武装起义和大规模农民战争，都是被压迫农奴反对封建统治的斗争形式。这些斗争沉重打击了封建制度，推动了社会矛盾的发展。但是，农民阶级由于小生产的分散性和历史局限，难以单独建立新的先进社会制度。封建制度的根本瓦解，最终要同商品经济发展、资产阶级革命和后来的无产阶级革命联系起来。",
"农奴制的历史意义，在于它集中表现了封建社会土地占有、人身依附和超经济强制相结合的剥削本质。它说明，剥削制度并不只有资本主义雇佣劳动一种形式，封建社会通过土地和身份关系同样能够榨取劳动人民的剩余劳动。消灭农奴制，必须打破封建土地所有制和封建等级关系；而要彻底消灭一切剥削，还必须进一步消灭私有制和阶级压迫，使土地和生产资料真正归劳动人民共同掌握。"
]
},

{
term: "农业集体化",
content: [
"<strong>农业集体化</strong>是无产阶级夺取政权以后，把分散的小农个体经济逐步改造为社会主义集体经济的历史过程。它通过互助组、合作社、集体农庄、人民公社等不同形式，把土地、农具、牲畜、水利设施和劳动力组织起来，克服小生产的分散性、落后性和自发资本主义倾向，使农业生产逐步走上集体劳动、共同经营、按劳分配和社会主义公有制的发展道路。",
"农业集体化的根源，在于小农经济同社会主义建设之间存在深刻矛盾。土地改革能够消灭封建地主土地所有制，使农民获得土地，但如果长期停留在个体小生产基础上，农村就会重新出现贫富分化、雇佣劳动、土地买卖、富农经济和资本主义自发势力。分散的小农经济难以支撑社会主义工业化，也难以实现农业机械化、水利建设和有计划的社会生产。因此，土地改革之后必须进一步引导农民组织起来，走集体化道路。",
"农业集体化不是简单地把农民土地和财产行政集中起来，而是一次深刻的农村生产关系变革。它要求在工人阶级领导下，通过政治教育、典型示范、国家帮助和群众自愿，把农民从分散经营逐步引向互助合作和集体经营。集体化的正确道路，必须把社会主义方向同农民切身利益结合起来，使农民在实践中看到组织起来的优越性，而不能用命令主义和强迫办法代替群众觉悟。",
"苏联农业集体化是世界社会主义历史上最早的大规模实践之一。20世纪20年代末以后，苏联在工业化、粮食供应和富农势力威胁的压力下，迅速推进集体农庄和国营农场建设，打击富农经济，把农业纳入社会主义计划经济体系。这一过程为苏联工业化提供了重要条件，也加强了国家对农业的组织能力；但在执行中也出现过急躁冒进、强迫命令、扩大化打击和损害中农利益等严重问题，给农村生产和工农关系带来沉重代价。",
"中国农业集体化主要表现为农业合作化运动。土地改革完成以后，中国农村仍然存在汪洋大海般的个体农民经济和富农资本主义倾向。农业合作化通过互助组、初级农业生产合作社、高级农业生产合作社等形式，由低级到高级逐步推进，把农民引上社会主义道路。到1956年底，中国基本完成对农业的社会主义改造，广大农民从个体经营进入集体经济，为社会主义工业化和农村公共事业建设奠定了基础。",
"农业集体化同农业机械化、水利建设和农村公共事业密切相连。个体农民很难独立承担大型水利工程、农业机械、农田改造、合作医疗、农村教育和公共福利建设。集体经济能够集中劳动力和资源，统一安排生产和建设，使农村社会从一家一户的狭小经营中走出来。农业集体化的真正意义，不只是改变土地关系，更是为农村社会的全面社会主义改造创造组织基础。",
"农业集体化必须正确处理国家、集体和个人之间的关系。国家需要粮食、原料和积累，集体需要扩大再生产和公共福利，农民个人也需要合理收入和生活改善。只强调国家征购而忽视农民利益，会损害群众积极性；只强调个人利益而削弱集体积累，又会使集体经济退化。正确的集体化道路，必须坚持按劳分配、集体积累、民主监督和群众管理，使农民真正成为集体经济的主人。",
"农业集体化的主要敌人，是农村资本主义自发势力和富农路线。富农和农村中的资本主义倾向主张个体单干、雇工剥削、自由买卖土地和自由竞争，最终必然造成两极分化，使一部分农民变成新的剥削者，另一部分农民重新沦为雇佣劳动者。社会主义农村建设必须限制和改造这种自发势力，防止小生产不断产生资本主义，巩固工农联盟和无产阶级专政的农村基础。",
"农业集体化也必须反对官僚主义和命令主义。集体经济如果没有群众民主和劳动者监督，就可能变成少数干部支配农民的行政机构；集体所有如果只是名义上的公有，而农民不能参与管理、监督分配和决定生产，就会削弱社会主义性质。集体化的巩固，不能只靠组织形式，更要靠群众路线、政治教育、生产民主和不断反对干部特权化。",
"农业集体化的历史意义，在于它把农村从私有制和小生产的旧轨道上推进到社会主义集体经济道路上。它为社会主义工业化、农村公共事业、共同富裕和缩小城乡差别创造了条件。它的经验说明，农民问题不能停留在分田和个体所有的阶段，必须在无产阶级领导下把农民组织起来；它的教训也说明，社会主义改造必须尊重群众、尊重实际、反对强迫命令。只有把集体所有制、群众民主、农业现代化和社会主义方向结合起来，农业集体化才能真正成为通向共产主义农村的历史桥梁。"
]

{

content: [
"<strong>工会</strong>是工人阶级为维护自身利益、组织集体斗争、反抗资本压迫而建立的群众组织。它产生于资本主义雇佣劳动制度发展过程中，是工人从分散个人反抗走向集体行动的重要形式。工会最初主要围绕工资、工时、劳动条件、失业保障、劳动保护和组织权利展开斗争，是工人阶级反抗资本家剥削的基本阵地之一。",
"工会的产生，根源于资本和劳动之间不可调和的矛盾。单个工人在资本家面前力量薄弱，只能被迫接受资本规定的工资和劳动条件；工人组织成工会以后，就能够通过集体谈判、罢工、抵制、示威、互助和宣传等方式，增强对资本的斗争力量。工会使工人认识到，个人处境不是孤立问题，而是整个阶级共同受剥削、受压迫的结果。",
"工会斗争具有重要意义。它能够迫使资本家在工资、工时和劳动条件上作出让步，保护工人免受更加赤裸的压榨；它能够训练工人组织纪律，培养团结意识和阶级意识；它也能够使工人在实际斗争中认识资本主义制度的本质。没有工会和经济斗争，广大工人很难从日常生活中走向有组织的阶级行动。",
"但是，工会不能代替无产阶级政党，经济斗争也不能代替政治斗争。工会斗争如果只停留在工资、工时和福利问题上，就只能在资本主义制度内部改善雇佣奴隶的条件，不能消灭雇佣劳动制度本身。资本家可以在一定时期内让出一部分利润，但不会自动放弃生产资料私有制和资产阶级国家政权。工人阶级要真正解放，必须从工会斗争上升到推翻资产阶级统治、建立无产阶级专政的政治斗争。",
"工会内部也存在两条路线斗争。一条路线把工会作为组织群众、提高阶级觉悟、准备政治斗争的重要学校；另一条路线则把工会变成同资本家讨价还价、调和劳资矛盾、维护资本主义秩序的改良主义工具。工联主义、经济主义和工会官僚主义的共同错误，就是把工人运动限制在合法谈判和局部改良范围内，使工人阶级丧失革命目标。",
"帝国主义时代，资产阶级常常利用超额利润收买一部分工人上层，培植工人贵族和工会官僚。这些人掌握工会机关后，害怕群众斗争，迷恋合法地位，主张阶级合作，反对革命路线。他们把工会变成压制工人斗争、维持劳资秩序、替资产阶级稳定社会的工具。无产阶级必须同这种工会官僚主义和改良主义路线作坚决斗争。",
"在革命运动中，工会应当成为无产阶级政党联系群众、组织群众、发动群众的重要桥梁。革命政党不能轻视工会斗争，也不能把工会斗争绝对化。正确路线是深入工会，参加工人日常斗争，把经济要求同政治教育结合起来，把局部斗争同整个阶级解放事业结合起来，使工会成为工人阶级从自发斗争走向自觉革命的学校。",
"在社会主义社会中，工会的性质和任务也会发生变化。生产资料公有制建立以后，工会不再是单纯同私人资本家谈判的组织，而应当成为劳动群众参加国家管理、生产管理、民主监督和维护自身正当权益的重要组织。它必须监督干部和管理机关，反对官僚主义，保障劳动者参与分配、劳动保护、福利事业和企业管理，防止公有制名义下出现脱离群众的特权和压迫现象。",
"工会的根本方向，取决于它服务于哪个阶级、接受什么路线领导、同群众保持什么关系。真正的无产阶级工会，必须坚持阶级斗争立场，坚持群众路线，坚持同资本主义剥削和改良主义欺骗作斗争。它既要维护工人眼前利益，又要教育工人认识自己的历史使命，把工会斗争同无产阶级革命、社会主义建设和共产主义方向连接起来。"
]
},

{
term: "1918芬兰革命",
content: [
"<strong>1918芬兰革命</strong>是第一次世界大战末期和俄国十月革命影响下，芬兰工人阶级和贫苦群众发动的一场社会主义革命，也是1918年芬兰内战中的红色阵营一方的革命斗争。它发生在芬兰刚刚脱离俄国、国家政权尚未稳定、阶级矛盾急剧尖锐化的历史条件下。革命一方主要由芬兰社会民主党左翼、赤卫队、城市工人和一部分农村贫苦群众组成，反革命一方则以资产阶级参议院、白卫队、地主资本家势力和德国帝国主义支持力量为核心。",
"1917年俄国二月革命和十月革命深刻震动了芬兰社会。芬兰原本是俄国帝国统治下的大公国，沙皇政权崩溃后，芬兰独立问题、国家权力归属问题、土地问题、工人权利问题和社会改革问题迅速集中爆发。资产阶级希望建立由自己控制的独立国家机器，维护私有制和旧社会秩序；工人阶级和贫苦群众则要求粮食、工作、民主权利、社会改革和更彻底的政治变革。民族独立问题同阶级斗争问题交织在一起，使芬兰迅速走向革命和内战。",
"芬兰革命的直接爆发，发生在1918年1月底。赤卫队在赫尔辛基等地发动行动，控制南部工业中心，建立以工人力量为基础的革命政权机构，通常被称为芬兰社会主义工人共和国或红色芬兰。革命政权试图推进民主改革、扩大工人群众权利、限制资产阶级和旧官僚势力，并同苏俄保持联系。它的出现，表明十月革命的影响已经越出俄国国界，推动欧洲工人运动进入新的阶段。",
"革命阵营的基本力量来自城市工人、产业劳动者、铁路工人、手工业者和部分无地、少地农民。赤卫队是革命武装的主要组织形式，它同工人组织和地方革命机关相结合，承担保卫革命政权和同白卫队作战的任务。芬兰红色力量具有群众基础和革命热情，但在军事组织、统一指挥、农村动员、武器装备和政治路线成熟程度上都存在明显不足。",
"白色阵营则以资产阶级国家机器、保守派参议院、地主资本家力量和白卫队为基础。白卫队在曼纳海姆等旧军官领导下组织反革命武装，打着恢复秩序、保卫国家独立和反对混乱的旗号，实质上维护资产阶级政权和私有制秩序。德国帝国主义后来出兵支持白军，使芬兰内战不仅具有国内阶级战争性质，也具有帝国主义干涉和势力争夺的性质。",
"芬兰革命失败的重要原因，在于革命力量没有形成足够坚强、集中、成熟的无产阶级革命政党和统一领导。社会民主党长期受议会合法斗争和改良主义传统影响，对武装斗争、国家机器、革命专政和农村问题准备不足。革命爆发后，红色政权虽然拥有群众支持，却未能迅速建立强有力的政治军事领导体系，也未能充分争取广大农民和瓦解白军基础。面对白军和德国帝国主义干涉，革命最终被镇压下去。",
"1918年5月，白军取得胜利，红色芬兰失败。胜利后的白色政权对赤卫队成员、工人积极分子和革命支持者进行了残酷镇压，大批红色战士和群众被处决、关押或送入集中营，许多人死于饥饿、疾病和虐待。白色恐怖表明，资产阶级所谓秩序和法治，一旦面对工人阶级夺取政权的现实，就会露出赤裸裸的阶级暴力本质。",
"1918芬兰革命虽然失败，却具有重要国际意义。它说明十月革命不是孤立事件，而是在帝国主义战争、资本主义危机和工人阶级觉醒条件下引发的世界革命浪潮的一部分。芬兰工人阶级用自己的斗争证明，欧洲资本主义国家内部同样存在尖锐阶级矛盾，无产阶级革命不是俄国特殊现象，而是帝国主义时代资本主义基本矛盾发展的必然表现。",
"1918芬兰革命的教训十分深刻。无产阶级要取得革命胜利，不能只依靠自发斗争、议会经验和临时武装组织，必须有坚定的革命政党、明确的政治路线、统一的军事领导、巩固的工农联盟和对旧国家机器的彻底认识。资产阶级不会因为选票、道义或民族独立口号而放弃统治；无产阶级如果不能及时打碎旧国家机器、建立自己的专政机关，就会在关键时刻遭到反革命武装和帝国主义干涉的联合镇压。",
"评价1918芬兰革命，必须看到它既是一场民族独立初期的国内战争，又是一场工人阶级反对资产阶级统治的革命斗争。它不是简单的红白派系冲突，而是资本主义道路和社会主义道路之间的激烈较量。芬兰红色战士的失败不抹杀其历史意义，他们的斗争是世界无产阶级革命史的一部分，为后来革命者留下了关于政党、武装、政权、工农联盟和反帝斗争的重要经验。"
]
},

{
term: "大清洗",
content: [
"<strong>大清洗</strong>，又称大肃反、大恐怖，通常指20世纪30年代后期苏联发生的大规模政治清洗和镇压，主要集中在1936年至1938年。它包括党内清洗、国家机关清洗、军队清洗、公开审判、秘密逮捕、劳改营扩大和大量处决等内容，是苏联社会主义建设史上极其复杂、沉重和必须严肃总结的重大历史事件。",
"大清洗发生在苏联完成工业化和农业集体化、国际战争危险日益加剧、国内阶级矛盾和党内斗争长期积累的背景下。20世纪30年代，法西斯主义在欧洲崛起，帝国主义包围和战争威胁不断增强，苏联国家安全压力巨大。同时，旧剥削阶级残余、破坏活动、党内反对派问题、官僚主义和路线斗争交织在一起，使苏联领导层把政治安全问题推向极端化处理。",
"大清洗的重要标志，是一系列莫斯科审判和党政军系统的大规模清洗。季诺维也夫、加米涅夫、布哈林、李可夫等曾经的布尔什维克重要人物相继被审判和处决，许多党、政、军干部也受到牵连。1937年前后，苏联红军高级将领遭到严重打击，图哈切夫斯基等军事领导人被处决。大批干部、知识分子、基层党员和普通群众也被卷入逮捕、流放和镇压之中。",
"大清洗中确实存在对反革命、间谍、破坏分子和敌对势力的斗争问题。任何社会主义国家在帝国主义包围、战争威胁和旧阶级残余仍然存在的条件下，都不能放弃对反革命活动的警惕。无产阶级专政必须保卫新生政权，必须镇压真正破坏社会主义制度和勾结帝国主义的敌对力量。但是，保卫革命不能变成脱离事实、脱离群众、脱离法制和脱离阶级分析的扩大化镇压。",
"大清洗的严重问题，在于斗争范围被极大扩大，秘密机关权力急剧膨胀，许多案件依靠逼供、假口供和行政命令来处理，大量无辜者受到迫害。阶级斗争被简单化为机关办案，政治分歧被扩大为敌我矛盾，党内斗争和思想斗争被行政镇压取代，群众监督和正常组织生活遭到削弱。这些做法损害了社会主义法制，削弱了党同群众的联系，也给苏联革命事业留下深刻创伤。",
"大清洗不能被资产阶级反共宣传任意利用来全盘否定十月革命、社会主义工业化、苏联人民反法西斯战争和世界共产主义运动的历史功绩。苏联在极端困难条件下建立社会主义工业基础，保卫了世界上第一个社会主义国家，并在反法西斯战争中作出巨大贡献。这些历史功绩不能因为大清洗中的严重错误而被抹杀。正确态度不是把历史简单黑白化，而是坚持历史唯物主义，具体分析功绩、错误和产生错误的社会根源。",
"大清洗也不能被神圣化和辩护为完全正确。把一切错误都说成必要代价，把一切受害者都说成敌人，把国家机关的失控说成革命坚定性，都会阻碍无产阶级总结历史经验。社会主义事业需要对敌专政，但更需要群众路线、事实根据、党内民主、人民监督和正确政策界限。镇压真正敌人同保护人民、保护干部、保护革命积极性必须统一起来。",
"大清洗的深层教训，在于社会主义国家必须防止国家机关、保卫机关和干部系统脱离群众监督。无产阶级专政不是少数机关对社会的任意支配，而是劳动人民对剥削阶级和反革命势力的专政。离开群众路线，离开公开的政治教育和组织监督，专政机关就可能特殊化、神秘化、官僚化，甚至把矛头错误地指向人民内部和革命队伍内部。",
"大清洗还说明，党内路线斗争不能主要依靠行政手段解决。错误路线、机会主义倾向和反党阴谋必须揭露和斗争，但根本方法应当是政治路线斗争、理论教育、批评与自我批评、群众监督和组织原则。把复杂的思想问题、路线问题和历史问题一概归结为刑事案件，容易造成恐惧气氛，压制正常讨论，使党失去自我纠错和依靠群众改造自身的能力。",
"评价大清洗，必须同时反对两种错误倾向：一种是资产阶级借大清洗全盘否定社会主义和无产阶级革命；另一种是用保卫社会主义的名义拒绝承认扩大化镇压和官僚主义错误。真正的革命立场，是既坚持反帝反修和无产阶级专政，又坚持群众路线、社会主义法制和党内民主；既保卫社会主义历史成果，又严肃总结错误，防止革命政权中的权力脱离劳动人民监督而走向异化。"
]
},

{
term: "卡廷惨案",
content: [
"<strong>卡廷惨案</strong>是第二次世界大战初期发生的一起大规模处决事件，通常指1940年春苏联内务人民委员部对被俘和被拘押的波兰军官、警察、公务人员、知识分子及其他人员进行的秘密处决。遇害者总数通常被认为接近两万二千人，遗体分布在卡廷森林、加里宁、哈尔科夫以及其他埋葬地点。卡廷惨案是苏联历史中极其沉重的一页，也是社会主义运动史上必须严肃面对的重大历史问题。",
"卡廷惨案的背景，是1939年德国和苏联分别进入波兰后，波兰国家被军事力量撕裂，大量波兰军官、警察、官员和社会精英被苏联方面俘获或拘押。对于苏联国家安全机关来说，这些人被视为潜在的反苏力量和波兰旧国家骨干。正是在这种战争、国家安全、民族矛盾和大国政治交错的条件下，苏联最高层作出极端处置决定，导致大规模秘密处决发生。",
"卡廷惨案的主要受害者，并不是普通战斗中阵亡的士兵，而是已经被控制起来的战俘和被拘押人员。他们中有职业军官、预备役军官、警察、法官、教师、医生、工程师、知识分子和政府工作人员。处决这些人，客观上摧毁了波兰社会的一部分组织骨干和知识阶层，给波兰民族造成巨大创伤，也使苏波关系和后来东欧政治长期背负沉重阴影。",
"1943年，德国军队在卡廷森林发现并公布大规模墓地，试图利用这一事件瓦解反法西斯同盟、进行反苏宣传。纳粹德国本身是发动侵略战争和实施大屠杀的法西斯罪魁，它揭露卡廷并不是出于正义，而是出于战争宣传和政治利用。但是，纳粹对事件的利用，并不能改变卡廷惨案本身必须被查明和承担责任的事实。反法西斯立场不能成为掩盖错误和压制真相的理由。",
"苏联方面在战时和战后长期否认责任，把卡廷惨案归咎于纳粹德国。这种长期掩盖造成了更深的政治后果，使事件不仅成为一场屠杀，也成为围绕历史真相、国家责任和政治信誉的严重问题。到1990年，苏联方面正式承认内务人民委员部负有责任，后来相关档案和材料进一步确认了事件的基本责任链条。历史真相不能靠国家权威和政治需要任意改变。",
"从无产阶级立场看，卡廷惨案不能被轻描淡写，也不能被资产阶级反共宣传任意利用。它首先是一场严重违背社会主义法制、无产阶级国际主义和人民利益的错误，是国家安全机关脱离群众监督、秘密权力膨胀和大国民族矛盾尖锐化条件下产生的严重罪行。社会主义如果不能把权力置于人民监督之下，如果国家机关可以脱离群众和法律程序任意决定人的生死，就会损害无产阶级政权的政治基础。",

content: [
"<strong>批林批孔</strong>是无产阶级文化大革命后期开展的一场政治思想运动，主要发生在1973年至1974年。它把批判林彪反党集团同批判孔孟之道、儒家复古思想和尊孔复礼的意识形态结合起来，试图从历史观、阶级观和路线斗争角度揭露复辟势力的思想根源。批林批孔不是单纯的历史文化讨论，而是社会主义社会中围绕继续革命、反对复辟和批判旧意识形态展开的政治斗争。",
"批林批孔的直接背景，是林彪反党集团的败露。林彪集团表面上高喊革命口号，实际上阴谋篡夺党和国家最高权力，最后走向叛党叛国的可耻结局。对林彪集团的批判，不能只停留在个人野心和阴谋活动上，还必须进一步追究其思想根源、政治路线和阶级基础。批林批孔正是把林彪集团的复辟野心，同历史上尊孔复礼、倒退复古、维护等级秩序的思想联系起来加以批判。",
"孔孟之道在中国封建社会长期占据统治地位，其核心内容是维护君臣、父子、夫妇、尊卑、贵贱等等级秩序，把剥削阶级的统治说成天经地义，把人民群众的反抗说成犯上作乱。儒家思想中的许多内容，服务于封建地主阶级维护宗法制度、等级制度和专制统治。批孔的阶级意义，在于揭露旧思想旧文化怎样为剥削阶级统治服务，反对把封建伦理和旧秩序重新神圣化。",
"批林批孔运动强调反对复辟倒退。历史上的复古主义，往往把旧制度、旧礼教、旧权威装扮成永恒真理，用所谓传统、秩序、稳定和道德来压制人民群众的革命要求。林彪集团在政治上走向复辟，在思想上也表现出尊孔、崇古、吹捧天才论和英雄史观等倾向。批林批孔就是要说明，政治路线上的复辟倒退，常常要在思想文化领域寻找反动理论和历史根据。",
"批林批孔也涉及对儒法斗争的历史评价。运动中强调历史上法家反对分封割据、主张变革和中央集权的一面，批判儒家维护旧礼制、反对变法和复古倒退的一面。这种分析试图从阶级斗争和社会变革角度理解古代思想斗争，而不是把古代思想简单看成超阶级的道德学说。古代思想流派的历史作用，必须放在具体社会关系、阶级利益和政治斗争中加以考察。",
"批林批孔的积极意义，在于它把反对修正主义、反对复辟、反对旧思想旧文化的斗争推进到历史意识和思想文化领域。社会主义社会虽然已经建立新的制度，但旧社会留下来的封建思想、等级观念、特权思想和奴化意识仍然会影响干部和群众。只有不断批判这些旧意识形态，才能巩固无产阶级政治方向，防止剥削阶级思想借传统文化和复古口号重新滋长。",
"批林批孔在实践中也存在复杂性。对历史人物和传统文化的批判，如果脱离具体历史条件和阶级分析，就可能滑向简单化、标签化和形式主义。孔子及儒家思想本身包含复杂历史内容，既有维护封建等级秩序的反动方面，也有某些历史文化材料需要批判地分析。无产阶级对待传统文化，不能无原则崇拜，也不能文化虚无主义，而必须坚持批判继承，把人民创造的历史文化成果同剥削阶级意识形态区分开来。",
"批林批孔的根本启示是：社会主义条件下的阶级斗争，不只表现在经济和政治领域，也表现在思想文化和历史解释领域。复辟势力要夺取政治权力，往往会先在思想上制造舆论，宣扬旧秩序、旧权威和旧道德。无产阶级要巩固自己的政权，就必须坚持历史唯物主义，揭露旧意识形态的阶级本质，反对一切用传统、天才、权威和复古口号来压制群众、维护特权、否定继续革命的思想倾向。"
]
},

{
term: "破四旧",
content: [
"<strong>破四旧</strong>是无产阶级文化大革命初期提出的政治口号和群众行动内容，通常指破除旧思想、旧文化、旧风俗、旧习惯。它的基本指向，是批判封建主义、资本主义和修正主义在思想文化、社会风俗和日常生活中的残余影响，打破旧社会遗留下来的等级观念、迷信观念、特权观念、奴化思想和剥削阶级生活方式，推动社会主义新思想、新文化、新风俗、新习惯的建立。",
"破四旧产生于社会主义社会阶级斗争和思想文化斗争仍然存在的历史条件下。生产资料所有制的社会主义改造完成以后，旧社会的思想影响不会自动消失。封建宗法观念、资产阶级个人主义、崇洋媚外、等级特权、迷信习俗、旧式礼教和剥削阶级审美趣味，仍然会通过家庭、学校、文艺、风俗和日常生活继续影响群众。破四旧正是要把社会主义革命推进到思想文化和社会生活领域。",
"破四旧的阶级内容，不是单纯改变服饰、名称、礼节和外在形式，而是批判旧思想旧文化背后的阶级关系。旧思想维护剥削阶级的统治，旧文化美化旧制度，旧风俗巩固等级秩序，旧习惯使群众在日常生活中继续接受压迫者留下的观念。破四旧的目的，是使劳动人民从旧意识形态的束缚中解放出来，树立无产阶级政治、集体主义、劳动光荣、男女平等、反对特权和反对迷信的新观念。",
"破四旧同立四新密不可分。只破不立，就容易停留在表面否定和形式冲击上；只立不破，又无法清除旧社会思想文化的根基。真正的破四旧，必须同建立社会主义新思想、新文化、新风俗、新习惯结合起来，同群众学习、生产劳动、政治斗争、文艺革命、教育革命和社会改造结合起来。新的社会主义文化不是从空中产生的，而是在批判旧世界、改造旧关系和创造新生活的实践中形成的。",
"破四旧在实践中具有广泛的群众动员作用。青年学生、工人、农民和广大群众通过批判旧观念、改造旧风俗、揭露旧权威和冲击旧秩序，增强了参与政治生活和改造社会的主动性。它打击了长期压在群众头上的封建迷信、宗法礼教、旧式权威和资产阶级文化崇拜，使许多人第一次把日常生活、思想习惯和阶级斗争联系起来看待。",
"破四旧在实践中也出现过偏差。一些地方把破除旧思想同简单毁坏历史文物、文化遗产、书籍器物混同起来，把批判剥削阶级意识形态变成粗暴破坏和形式主义行动，甚至出现侵犯群众利益、伤害无辜和脱离政策界限的现象。这些问题说明，思想文化革命必须有正确路线和群众政策指导，必须区分封建迷信、反动意识形态和人民创造的历史文化遗产，不能用简单粗暴的方法代替阶级分析和思想改造。",
"对待旧文化，必须坚持批判继承的原则。封建主义和资产阶级的腐朽内容必须批判，服务于剥削阶级统治的思想体系必须打破；但劳动人民在历史中创造的优秀文化成果、科学知识、艺术成就和有价值的历史资料，不应被一概否定。无产阶级文化不是文化虚无主义，而是在批判旧文化的阶级局限中吸收有益成果，使它们为劳动人民服务，为社会主义和共产主义方向服务。",
"破四旧的历史意义，在于它提出了社会主义革命不能停留在经济制度和国家政权层面，还必须深入思想文化和社会生活领域。旧社会的残余不仅存在于所有制关系中，也存在于人的头脑、习惯、语言、审美和日常行为中。无产阶级要巩固自己的政权，就必须不断批判和改造旧思想、旧文化、旧风俗、旧习惯，防止剥削阶级意识形态通过文化和生活方式重新滋长。",
"破四旧的根本启示是：社会主义社会必须进行长期的思想文化斗争，但这种斗争必须坚持群众路线、阶级分析和正确政策。既要反对保守旧秩序、维护封建资本主义文化的倾向，也要反对脱离群众、脱离实际、简单粗暴和文化虚无主义。只有把破除旧世界的精神枷锁同建设新的社会主义文化结合起来，才能真正推动劳动人民在思想上、政治上和生活方式上成为新社会的主人。"
]
},

{
term: "五反运动",
content: [
"<strong>五反运动</strong>是中华人民共和国成立初期在私营工商业领域开展的一场反行贿、反偷税漏税、反盗骗国家财产、反偷工减料、反盗窃国家经济情报的群众性政治运动，主要发生在1952年。它是在三反运动深入发展、国家机关和国营经济内部腐败问题被揭露以后，进一步揭发和打击私营工商业者中违法行为的重要斗争，是新生人民政权巩固国家经济秩序、限制资产阶级违法活动、保卫国营经济的重要措施。",
"五反运动发生在新中国经济恢复和社会改造的关键时期。旧中国遗留下来的资本主义经营方式、投机倒把、官商勾结和贿赂腐蚀仍然影响城市经济生活。一些私营工商业者为了追逐利润，通过行贿国家工作人员、偷税漏税、偷工减料、盗骗国家财产和窃取经济情报等手段损害国家利益和人民利益。五反运动正是在这种条件下展开的，矛头主要指向资产阶级中的违法资本家和腐蚀国家机关的资本主义势力。",
"反行贿，是五反运动的重要内容。行贿表现为资本家用金钱、礼物、吃喝招待、回扣和其他利益收买国家工作人员，以取得合同、逃避监督、盗取物资或减轻税负。行贿不仅是经济违法行为，更是资产阶级用金钱腐蚀人民政权干部队伍的手段。反行贿的意义，在于切断资本势力同国家机关中腐败分子的勾结，防止公共权力被私人资本收买。",
"反偷税漏税，是为了维护国家财政和人民利益。税收是新生国家恢复经济、支援建设、保障公共事业的重要来源。偷税漏税把应归国家和人民的财富转入资本家个人腰包，削弱国家调节经济和发展建设的能力。反偷税漏税斗争揭露了资本主义经营中把私人利润置于社会责任之上的本性，也加强了国家对私营经济的管理和监督。",
"反盗骗国家财产和反偷工减料，直接关系到国营经济、国家建设和人民生活。一些资本家通过虚报价格、克扣材料、以次充好、偷换规格、减少工序等方式，在承包国家任务和供应公共产品中牟取暴利。这种行为表面上是商业欺诈，实质上是把国家财产和劳动人民创造的社会财富变成私人利润。反偷工减料不仅保护国家经济利益，也保护群众生命安全和社会公共利益。",
"反盗窃国家经济情报，是为了防止资产阶级利用内部信息破坏国家经济计划和市场管理。国家经济情报包括物资供应、价格政策、财政金融、采购计划、工程项目和商业安排等内容。资本家窃取这些信息，就能操纵市场、抢购物资、哄抬价格、投机牟利，破坏国家对经济的统一管理。反盗窃国家经济情报，体现了国家对重要经济命脉和经济秩序的保护。",
"五反运动同三反运动密切相连。三反主要针对国家机关、国营企业和人民团体内部的贪污、浪费、官僚主义；五反则主要针对私营工商业者中违法资本家的五种违法行为。二者一内一外，互相配合：三反清除国家机关内部被资产阶级腐蚀的因素，五反打击资产阶级对国家机关和国营经济的腐蚀进攻。它们共同服务于巩固人民政权、整顿城市经济秩序和加强国家经济领导。",
"五反运动采取群众揭发、工人监督、店员检举、账目清查、分类处理和政策教育相结合的方法。运动不是简单地把所有私营工商业者一概打倒，而是根据违法程度区别处理，打击严重违法资本家，教育和争取多数中小工商业者，促使私营经济服从国家法令和社会需要。它在实际过程中加强了工人和店员对企业内部剥削、欺诈和腐败行为的认识，也提高了劳动群众监督资本家的政治觉悟。",
"五反运动的历史意义，在于它揭露了资产阶级在新民主主义社会中仍然具有追逐利润、腐蚀政权、破坏国家经济秩序的倾向。新中国成立以后，资产阶级并没有立刻退出历史舞台，私营资本仍然存在，并会在利益驱动下同人民政权发生矛盾。五反运动说明，在过渡时期必须对资本主义工商业进行限制、利用和改造，不能让私人资本支配国计民生和腐蚀国家机关。",
"五反运动为后来资本主义工商业社会主义改造创造了重要条件。通过运动，国家加强了对私营企业的管理，打击了违法资本家的嚣张气焰，提高了工人群众的阶级觉悟，也推动资产阶级接受国家监督和改造。它的经验说明，社会主义方向的经济建设不能只依靠行政命令和法律条文，还必须依靠群众监督和阶级斗争，把国家管理、经济整顿和思想改造结合起来，才能逐步削弱资本主义自发势力，巩固公有制和人民政权的经济基础。"
]
},

{
term: "三反运动",
content: [
"<strong>三反运动</strong>是中华人民共和国成立初期开展的一场反贪污、反浪费、反官僚主义的群众性政治运动，主要发生在1951年底至1952年。它的斗争对象主要是国家机关、国营企业、部队和人民团体中的贪污分子、浪费现象和官僚主义作风，目的在于巩固新生的人民政权，纯洁干部队伍，保卫国家财产，反对旧社会腐朽思想对革命政权的侵蚀。",
"三反运动发生在新民主主义革命胜利后不久。当时旧中国遗留下来的官僚习气、贪污腐败、铺张浪费和脱离群众的作风仍然影响着一部分干部；同时，城市经济恢复、财政管理、国营企业建设和抗美援朝等任务十分繁重，国家需要集中有限资源支援建设和战争。贪污、浪费和官僚主义不仅损害国家财产，也削弱人民群众对新政权的信任，必须通过坚决斗争加以清除。",
"反贪污是三反运动的首要内容。贪污是干部和工作人员利用职权侵吞、盗窃、挥霍国家财产和人民财富的腐败行为。新生人民政权的干部如果把公共权力变成个人发财的工具，就会从人民公仆蜕变为骑在人民头上的特权分子。反贪污斗争的意义，不只是追回经济损失，更重要的是打击旧社会剥削阶级思想和个人发财思想在干部队伍中的滋长。",
"反浪费是三反运动的重要方面。浪费表现为不爱惜国家财产，不重视劳动成果，铺张使用物资，盲目施工，粗放管理，虚报冒领和不负责任地消耗公共资源。浪费虽然不一定都表现为个人直接侵吞，但同样损害劳动人民创造的财富，破坏国家建设和社会积累。反浪费要求干部和工作人员树立勤俭建国、艰苦奋斗、爱护公共财产的作风。",
"反官僚主义是三反运动的政治核心之一。官僚主义表现为脱离群众、脱离实际、命令主义、文牍主义、推诿扯皮、压制批评、对人民疾苦漠不关心。官僚主义使国家机关从服务人民的工具变成高高在上的衙门，使干部从群众中的一员变成脱离群众的管理者。反官僚主义就是要打破旧式官场作风，使干部重新接受群众监督，保持同劳动人民的血肉联系。",
"三反运动采取群众揭发、组织检查、批评与自我批评、清查账目和处理案件相结合的方法。广大群众和基层工作人员被发动起来，检举贪污浪费现象，批判官僚主义作风，推动机关和企业整顿管理。运动既有惩治严重腐败分子的斗争性，也有教育和挽救干部的目的。对于问题严重、触犯法律者必须严肃处理；对于一般错误，则重在教育改造和改进工作。",
"三反运动同随后开展的五反运动密切相关。三反主要针对国家机关和国营部门内部的贪污、浪费、官僚主义，五反则主要针对私营工商业者中的行贿、偷税漏税、盗骗国家财产、偷工减料、盗窃经济情报等行为。二者共同构成建国初期清理旧社会腐败关系、打击资产阶级违法活动、巩固国营经济和人民政权的重要斗争。",

content: [
"<strong>可变资本</strong>是资本家用于购买劳动力的那部分资本。它同用于购买机器、厂房、原料等生产资料的不变资本相区别，在生产过程中不仅能够再生产出自身价值，而且能够创造出超过自身价值的新价值，即剩余价值。之所以叫“可变资本”，正是因为它在资本主义生产过程中发生价值量的增殖，是资本增殖和剩余价值生产的真正源泉。",
"劳动力成为商品，是货币转化为资本的关键。资本家用工资购买工人的劳动力，看起来仿佛支付了工人的全部劳动报酬，实际上购买的只是劳动力这种特殊商品的使用权。劳动力的价值由生产和再生产劳动力所必需的生活资料价值决定，而劳动力的使用却能在劳动过程中创造出大于自身价值的新价值。这种差额就是剩余价值。",
"可变资本的特殊作用，彻底揭穿了利润来源的秘密。机器、原料、厂房等不变资本只能把原有价值转移到新产品中，不能创造新价值；只有活劳动才能创造新价值。资本家预付可变资本购买劳动力，再通过延长劳动时间、提高劳动强度、改进管理和技术控制等方式，使工人在必要劳动时间之外继续进行剩余劳动，从而无偿占有剩余价值。",
"可变资本同工资形式密切相连。工资表面上表现为劳动的价格，仿佛资本家付钱购买了工人的劳动；实际上劳动本身没有价值，成为商品的是劳动力。工资只是劳动力价值或价格的转化形式，只相当于工人必要劳动所创造的价值部分。剩余劳动所创造的价值则被资本家占有，并以利润、利息、地租、商业利润等形式分割出去。",
"可变资本的概念使资本主义剥削关系从商品交换的平等外表下暴露出来。资本家和工人在市场上似乎是自由平等的买卖双方，一个购买劳动力，一个出卖劳动力；但一进入生产过程，资本家就凭借对生产资料的占有支配工人的劳动过程。工人创造的价值一部分补偿工资，另一部分成为资本家的剩余价值。资本主义的秘密，不在流通中的欺骗，而在生产过程中对剩余劳动的无偿占有。",
"随着资本积累发展，资本有机构成不断提高，不变资本在总资本中的比重上升，可变资本的相对比重下降。资本家用机器和技术排挤活劳动，扩大相对过剩人口，压低工资，加强劳动强度。这个过程一方面推动生产力发展，另一方面加深失业、贫困和阶级对立，使资本主义基本矛盾更加尖锐。",
"可变资本不是永恒的经济范畴，而是资本主义生产关系的产物。只有在劳动力成为商品、生产资料被资本家阶级占有、劳动者被迫出卖劳动力的条件下，购买劳动力的资本才表现为可变资本。消灭资本主义私有制和雇佣劳动制度以后，劳动力不再作为商品出卖，生产资料不再作为资本同劳动相对立，可变资本这个范畴也就失去现实基础，劳动将转化为自由联合的劳动者共同建设社会的自觉活动。"
]
},

{
term: "不变资本",
content: [
"<strong>不变资本</strong>是资本中用于购买生产资料的部分，包括机器、厂房、工具、原料、燃料、辅助材料等。它在生产过程中只是把自身原有的价值转移到新产品中去，并不创造新的价值。之所以叫“不变资本”，不是说它的物质形态不发生变化，而是说它在价值增殖过程中不改变自身价值量，不产生剩余价值。",
"不变资本的作用，是作为劳动过程的物质条件参与生产。棉花被纺成纱，钢铁被制成机器，燃料在生产中被消耗，厂房和设备逐步磨损，这些生产资料的价值都按照不同方式转移到新商品中。原料和燃料的价值通常一次性转移，机器、厂房等固定设施的价值则随着磨损逐步转移。无论转移方式怎样，不变资本只能保存和转移旧价值，不能创造新价值。",
"不变资本同可变资本的区分，是揭露资本主义剥削秘密的关键。资产阶级经济学常常把利润说成全部资本共同产生的结果，仿佛机器、土地、原料和货币都会自动生出利润。这个说法彻底颠倒了事实。机器不会自己劳动，原料不会自己增殖，厂房不会自己创造价值。只有活劳动才能创造新价值，只有劳动力这种特殊商品在使用过程中能够创造超过自身价值的价值。",
"不变资本在资本主义生产中虽然不创造剩余价值，却是资本家支配雇佣劳动的重要手段。资本家占有机器、厂房、原料等生产资料，无产者失去生产资料，只能出卖劳动力。生产资料一旦掌握在资本家手中，就不再只是普通物品，而成为资本统治劳动的物质力量。工人使用机器进行生产，表面上是人支配物，实际上在资本主义制度下，机器和生产资料反过来成为资本支配工人的工具。",
"随着资本主义发展，不变资本在总资本中的比重不断上升，表现为资本有机构成提高。资本家为了在竞争中取得优势，不断采用机器和新技术，以更多不变资本代替一部分活劳动。这一过程能够提高劳动生产率，却同时造成工人被机器排挤、相对过剩人口扩大、失业和贫困加深。资本主义越是发展生产力，越是把劳动者置于资本和机器体系的压迫之下。",
"不变资本的概念粉碎了资本自行增殖的神话。资本主义利润不是机器、厂房和原料创造出来的，而是工人在生产过程中创造的剩余价值。生产资料本身并不天然是资本，只有在资本主义生产关系中，只有在它被少数资本家占有并用来剥削雇佣劳动时，才成为不变资本。消灭资本主义私有制，生产资料就会失去资本属性，转化为劳动人民共同掌握、共同使用、共同发展的社会主义生产条件。"
]
},

{
term: "劳动",
content: [
"<strong>劳动</strong>是人类有目的、有意识地改造自然、创造物质资料和社会财富的实践活动，是人类社会存在和发展的最基本条件。人通过劳动，把自己的体力和智力作用于自然物，使自然物改变形态，适合人的需要。劳动把人同动物根本区别开来，正是在劳动中，人形成了语言、意识、社会关系和历史活动能力。没有劳动，就没有人类社会，也没有任何文明、文化和历史发展。",
"劳动首先是人与自然之间的物质变换过程。人在劳动中使用劳动资料，作用于劳动对象，生产出满足需要的产品。土地、矿石、木材、棉花等是劳动对象，工具、机器、厂房、道路等是劳动资料，劳动者则是劳动过程的主体。生产力的发展，归根到底表现为劳动者、劳动资料和劳动对象结合方式的发展，表现为人类支配自然、改造自然能力的提高。",
"劳动又始终是在一定社会关系中进行的。孤立的个人劳动不能说明历史上的真实生产过程，现实劳动总是处在一定生产关系和阶级关系之中。在原始社会，劳动以氏族公社的共同劳动形式存在；在奴隶社会，奴隶劳动被奴隶主直接占有；在封建社会，农民劳动受到地主阶级地租和劳役剥削；在资本主义社会，劳动者失去生产资料，被迫出卖劳动力，劳动变成资本增殖的手段。",
"资本主义制度下，劳动发生了深刻的异化。工人创造财富，却不占有自己的产品；工人使用机器，却被机器和资本反过来支配；工人越是创造巨大的社会财富，资产阶级越是加强对劳动的统治。雇佣劳动表面上是自由契约，实质上是资本对活劳动的支配和榨取。资本家购买的是劳动力，榨取的是工人在劳动过程中创造的剩余价值。",
"劳动是价值的源泉。商品的价值不是由资本、土地或机器自动创造的，而是由凝结在商品中的人类劳动形成的。具体劳动创造不同的使用价值，抽象劳动形成商品价值。机器、原料、厂房等生产资料只能把自身已有价值转移到新产品中，只有活劳动才能创造新价值。劳动价值论正是在这里揭穿了资本主义利润的秘密：利润不是资本家的才能或资本自身的产物，而是工人剩余劳动的转化形式。",
"社会主义革命的任务，就是把劳动从资本的奴役下解放出来。生产资料公有制的建立，使劳动不再服务于少数剥削者的利润，而服务于劳动人民的共同利益和社会主义建设。劳动在社会主义条件下仍然需要同旧社会遗留下来的资产阶级法权、劳动差别和分工束缚作斗争，必须通过继续革命、群众管理、技术革新和思想改造，逐步克服劳动中的旧社会痕迹。",
"共产主义社会中，劳动将不再只是谋生手段，而将成为人的自由全面发展的第一需要。那时，劳动不再被资本、阶级和旧式分工所压迫，脑力劳动和体力劳动的对立将逐步消失，社会成员将在高度发展的生产力和共同占有生产资料的基础上，自觉地为全社会和自身全面发展而劳动。劳动从被迫的谋生负担转变为自由人的创造活动，这正是人类解放的重要标志。"
]
},

{
term: "认识论",
content: [
"<strong>认识论</strong>是关于人的认识来源、认识过程、认识能力、真理标准以及认识同实践关系的哲学理论。它回答人能不能认识世界、怎样认识世界、认识是否正确以及如何检验认识等根本问题。辩证唯物主义认识论坚持物质第一性、意识第二性，确认人的认识不是主观精神的自我产生，也不是天赋观念的展开，而是人在社会实践中对客观世界的能动反映。",
"实践是认识的来源。人们的一切正确认识，归根到底都来源于生产斗争、阶级斗争和科学实验。离开实践，人的头脑不可能凭空产生关于世界的真实知识。书本知识、理论学习和前人经验固然重要，但它们本质上也是前人实践经验的总结；如果离开新的现实实践和具体条件，书本就会变成僵死的教条，理论就会变成脱离群众的空谈。",
"认识的发展过程，是由感性认识到理性认识的飞跃。感性认识来自直接经验，表现为感觉、知觉和表象，它反映事物的外部联系和表面现象。理性认识则通过概念、判断和推理，把握事物的本质、内部矛盾和发展规律。只有从大量感性材料中进行分析、综合、抽象和概括，才能实现从现象到本质、从片面到全面、从经验到理论的提高。",
"理性认识还必须回到实践中去。认识的目的不是停留在解释世界，而是指导实践、改造世界。理论是否正确，不能靠主观感觉、权威命令、书本条文或少数人的赞成来判定，只能由社会实践来检验。凡是经不起实践检验的认识，无论口号多么响亮、形式多么严整，都不能成为真理。实践、认识、再实践、再认识，循环往复以至无穷，这是认识发展的基本道路。",
"辩证唯物主义认识论同唯心主义认识论根本对立。唯心主义把认识看成主观意识、绝对精神或天赋观念的产物，割断认识同客观世界和社会实践的联系；不可知论则怀疑或否认人能够认识客观真理。辩证唯物主义确认客观世界可以被认识，人的认识虽然受历史条件和实践水平限制，但能够在实践中不断接近和把握客观真理。",
"认识论问题从来不是抽象的书斋问题，而是同阶级斗争和革命路线紧密相连。教条主义把书本公式凌驾于实际之上，经验主义把局部经验当成普遍真理，主观主义把个人愿望代替客观分析，这些错误都会使革命遭受损失。坚持正确的认识论，就必须坚持调查研究，坚持群众路线，坚持从实际出发，把理论同具体实践结合起来。",
"无产阶级的认识论，是认识世界和改造世界的战斗方法。它要求革命者深入群众、深入实际，在实践中发现问题、总结经验、形成理论，再把正确理论带回群众实践中去检验和发展。只有坚持实践第一的观点，坚持感性认识和理性认识的辩证统一，坚持真理标准的实践性，才能反对主观主义和修正主义，掌握革命和建设的主动权。"
]
},

{
term: "主观能动性",
content: [
"<strong>主观能动性</strong>是人在实践基础上认识世界和改造世界的自觉活动能力，是意识对客观世界能动反映和反作用的集中表现。人不是被动地接受外部环境支配的消极存在，而是在一定社会关系和物质条件下，通过生产斗争、阶级斗争和科学实验，认识客观规律，制定目标和计划，并把这些认识转化为改造现实的物质力量。",
"主观能动性必须建立在承认客观规律的基础上。客观世界不依赖于人的意识而存在，事物的发展有其自身规律，人的意志不能任意创造或取消客观条件。真正的能动性，不是凭主观愿望蛮干，不是用热情代替科学分析，而是在调查研究和实践经验的基础上，正确认识矛盾、把握规律、选择时机、组织力量，从而推动事物朝着有利于革命和人民的方向发展。",
"主观能动性同唯意志论根本不同。唯意志论夸大人的主观意志，把愿望当现实，把口号当力量，轻视客观条件和群众基础，最终必然导致盲动主义和失败主义。主观能动性也同宿命论、机械论根本对立。宿命论把人看成环境和命运的奴隶，否认人民群众改造世界的力量；机械论只看到客观条件的制约，看不到人在实践中能够改变条件、创造条件、发展条件。二者一个乱动，一个不动，都违背辩证唯物主义。",
"在革命斗争中，主观能动性表现为无产阶级和劳动群众在正确路线领导下自觉组织起来，认识敌我力量对比，发动群众，创造斗争形式，争取和积累有利条件。革命不是等待客观条件自动成熟，也不是少数人凭空制造出来的事件，而是客观矛盾发展到一定阶段后，革命阶级通过自觉斗争把潜在力量变成现实力量的过程。没有主观能动性，客观矛盾不会自动转化为革命胜利。",
"毛主席极大地发挥和发展了关于主观能动性的思想。他强调一切从实际出发、没有调查没有发言权，同时又强调人是要有一点精神的，强调自力更生、艰苦奋斗、敢于斗争、敢于胜利。在中国革命的艰苦条件下，正是依靠正确路线和人民群众的主观能动性，才把农村根据地、人民军队、统一战线和群众战争发展起来，最终打破帝国主义、封建主义和官僚资本主义的统治。",
"在社会主义建设中，主观能动性同样具有重大意义。社会主义不是少数干部和专家替群众建设出来的，而必须依靠工人、农民和广大劳动人民自觉参加生产管理、技术革新、政治监督和思想改造。群众的积极性、创造性和革命觉悟，是社会主义制度优越性的重要来源。压抑群众、迷信专家、崇拜物质刺激和行政命令，只会削弱社会主义的生命力，滋长官僚主义和资本主义倾向。",
"发挥主观能动性，必须把革命热情同科学态度结合起来，把坚定意志同实事求是结合起来，把远大目标同具体条件结合起来。既要反对消极等待、悲观保守和拜倒在困难面前，也要反对脱离实际、急躁冒进和空喊口号。无产阶级的主观能动性，只有同客观规律、群众路线和革命实践相结合，才能成为改造旧世界、建设新世界的强大力量。"
]
},

{
term: "客观唯心主义",
content: [
"<strong>客观唯心主义</strong>是唯心主义的一种基本形态，它把某种脱离人和自然界的“客观精神”“绝对理念”“世界理性”“天命”或神秘意志看作世界的本原，认为现实的自然界和人类社会只是这种精神实体的外化、体现或产物。它不同于主观唯心主义把世界归结为个人感觉和个人意识，而是把一个超个人、超自然、超历史的精神原则凌驾于物质世界之上。",
"客观唯心主义在哲学史上有多种表现形式。柏拉图把现实事物看成“理念世界”的影子，黑格尔把整个自然、社会和思维的发展说成“绝对精神”的自我展开，宗教神学则把世界说成神的创造物和神意的安排。这些观点形式不同，但共同点都是把精神、理念、神灵或某种超感性的东西说成第一性的存在，把客观物质世界说成第二性的派生物。",
"客观唯心主义的根本错误，在于颠倒了物质和意识的关系。意识、理念、理性和精神并不是先于物质世界而存在的独立实体，而是物质世界长期发展的产物，是社会实践和人脑活动的反映。所谓“绝对精神”“世界理性”“天命”等，不过是人类意识被抽象化、神秘化、外在化之后的产物。客观唯心主义把人的思想产物反过来变成支配人的神秘力量，从而遮蔽了现实世界的物质根源。",

content: [
"<strong>利润挂帅</strong>是把利润指标置于社会生产和经济管理最高地位的资产阶级经济原则，是资本主义生产方式在经济运行中的集中表现。它不是单纯的企业管理方法，而是一条完整的资本主义路线：生产不是为了满足劳动人民的需要，不是为了巩固社会主义公有制和发展共同事业，而是为了追逐利润、扩大积累、强化竞争和实现资本增殖。",
"在资本主义制度下，利润挂帅是资本运动的必然规律。资本家投资、生产、雇佣工人和组织市场，并不是为了社会需要，而是为了取得利润。哪里利润高，资本就流向哪里；哪里利润低，资本就抛弃哪里。劳动者的生活、社会的长远发展、资源的合理利用、人民的基本需要，都要服从资本增殖的要求。利润挂帅必然造成生产无政府状态、周期性经济危机、失业、贫富分化和垄断资本对全社会生活的统治。",
"利润的真正来源不是资本本身，而是雇佣工人在生产过程中创造的剩余价值。机器、厂房、原料和货币不能自动产生新价值，只有活劳动才能创造超过自身价值的新价值。资本家把这种剩余价值占为己有，再以利润、利息、地租、商业收入等形式分割出去。利润挂帅的实质，就是把无产阶级的剩余劳动变成资本家和各种剥削集团的收入来源，并把这种剥削关系伪装成企业效率和经济规律。",
"在社会主义条件下，利润挂帅是资本主义复辟的重要经济表现。社会主义企业可以核算成本、讲求节约、提高劳动生产率，但绝不能把利润作为统帅一切的最高标准。一旦企业为了利润而生产，为了利润而分配，为了利润而决定劳动者待遇和资源流向，计划经济就会被市场原则侵蚀，公有制就会被企业本位和部门利益掏空，劳动人民就会重新被利润指标所支配。",
"现代修正主义上台以后，往往首先从经济领域推行利润挂帅、物质刺激和专家治厂。它们表面上说是提高效率、改善管理，实际上是把社会主义企业变成追逐利润的独立经济单位，把劳动群众变成被奖金、工资等级和行政命令驱使的雇佣劳动者。干部和专家掌握生产管理权，劳动群众被排斥在管理之外，公有制的外壳下面就会产生新的资产阶级关系。",
"利润挂帅同无产阶级政治挂帅根本对立。社会主义生产必须坚持政治统帅经济，坚持计划统帅利润，局部利益服从整体利益，当前利益服从长远利益，企业利益服从劳动人民的根本利益。衡量社会主义经济工作的标准，不能只是账面利润，而要看是否巩固公有制，是否提高群众觉悟，是否促进工农联盟，是否缩小三大差别，是否有利于无产阶级专政和共产主义方向。",
"反对利润挂帅，就是反对资本主义经济规律重新统治社会主义社会。只要利润成为最高指挥棒，资本主义自发势力就会滋长，资产阶级法权就会扩大，新的剥削关系就会产生。社会主义经济必须把劳动人民的共同利益放在第一位，把发展生产力同改造生产关系结合起来，把经济建设同阶级斗争、路线斗争结合起来，坚决防止利润原则把社会主义道路引向资本主义复辟。"
]
},

{
term: "铁托主义",
content: [
"<strong>铁托主义</strong>，又称铁托修正主义，是以南斯拉夫领导人铁托为代表的一种现代修正主义路线。它打着“独立自主”“自治社会主义”“反对教条主义”的旗号，实质上否定无产阶级专政、瓦解社会主义公有制、削弱共产党的集中统一领导，把南斯拉夫逐步引向资本主义复辟道路。铁托主义是第二次世界大战后国际共产主义运动中最早成体系出现的现代修正主义变种之一。",
"铁托主义的形成，同1948年南斯拉夫共产党同共产党情报局和联共（布）发生公开冲突直接相关。铁托集团拒绝接受批评，把国际共产主义运动的原则性斗争说成是外部干涉，进而把所谓“南斯拉夫自己的社会主义道路”同马克思列宁主义的基本原则对立起来。它利用南斯拉夫反法西斯战争胜利后的民族威望，把民族独立的正当要求歪曲为拒绝无产阶级国际主义和拒绝社会主义共同规律的政治借口。",
"铁托主义在政治上的核心，是否定无产阶级专政和民主集中制。它鼓吹分散化、非集权化和所谓“社会自治”，削弱统一的无产阶级政党和社会主义国家机关，扩大地方主义、民族主义和官僚集团的独立性。共产党一旦失去无产阶级先锋队的集中领导作用，国家一旦失去对资产阶级自发势力的专政职能，社会主义政权就会从内部被瓦解，劳动人民也会逐步失去对国家和生产的实际掌握。",
"铁托主义在经济上的主要表现，是所谓“工人自治”和“市场社会主义”。它表面上宣称把企业交给工人管理，实际上却把企业变成相互竞争的独立经济单位，让利润、价格、市场和银行信贷支配生产。企业之间为了利润互相竞争，地区之间为了资源和收入互相分裂，劳动者之间也被市场机制重新分化。所谓“自治”不是劳动人民真正掌握生产资料，而是社会主义计划经济和国家所有制被市场原则、地方集团和企业本位主义一步步侵蚀。",
"铁托主义在国际路线上的表现，是以“不结盟”和“第三条道路”为名，在帝国主义和社会主义阵营之间采取骑墙立场。它表面上反对大国控制，实际上削弱国际无产阶级团结，模糊帝国主义和社会主义、革命和反革命之间的界限。铁托集团还接受西方帝国主义的经济援助和政治拉拢，使南斯拉夫逐步陷入对国际资本主义体系的依赖之中。这种路线不是无产阶级国际主义，而是资产阶级民族主义和机会主义的结合。",
"铁托主义的危险性，在于它常常披着“创新”“自治”“民主”“反官僚”的外衣出现，容易迷惑那些只看形式、不看阶级内容的人。真正的问题不在于是否反对官僚主义，而在于由哪个阶级掌握政权；不在于是否扩大群众参与，而在于是否坚持公有制、计划经济、无产阶级专政和共产党的革命领导。脱离这些根本原则，所谓自治和民主就会变成资产阶级复辟的通道。",
"南斯拉夫后来的历史结局，充分暴露了铁托主义的破产。市场化、地方分权和民族主义不断扩大，社会主义统一的经济政治基础被逐步拆散，各共和国之间的矛盾日益尖锐，最终在内外矛盾交织下走向联邦解体和民族冲突。铁托主义不是社会主义的新道路，而是现代修正主义通向资本主义复辟的道路。它留下的教训极其明确：社会主义必须坚持无产阶级专政，坚持计划经济和公有制，坚持无产阶级国际主义，坚决反对任何披着红色外衣的修正主义路线。"
]
},

{
term: "现代修正主义",
content: [
"<strong>现代修正主义</strong>是在社会主义国家和国际共产主义运动中打着马克思列宁主义旗号、实质上背叛无产阶级革命和无产阶级专政的资产阶级思潮与政治路线。它不同于早期伯恩施坦、考茨基式的旧修正主义，其最危险之处在于往往掌握了社会主义国家的党和国家权力，能够利用红旗反红旗，利用共产党名称反对共产党原则，利用社会主义外壳复辟资本主义制度。",
"现代修正主义的集中代表，是赫鲁晓夫修正主义集团。斯大林逝世后，赫鲁晓夫一伙篡夺苏联党和国家领导权，在苏共二十大上以所谓“反对个人崇拜”为名，全盘否定斯大林，进而否定无产阶级专政和社会主义革命道路。他们抛出“全民国家”“全民党”“和平过渡”“和平竞赛”“和平共处”等一整套修正主义路线，用阶级调和代替阶级斗争，用议会幻想代替暴力革命，用同帝国主义妥协代替无产阶级国际主义，严重破坏了国际共产主义运动。",
"现代修正主义在政治上的核心，就是取消无产阶级专政。它否认社会主义社会仍然存在阶级、阶级矛盾和阶级斗争，否认党内会产生走资本主义道路的当权派，鼓吹国家已经变成所谓“全民国家”，党已经变成所谓“全民党”。这种说法表面上好像扩大了民主，实际上是抹杀无产阶级和资产阶级的对立，解除劳动人民对资产阶级复辟势力的专政，为新生资产阶级篡夺政权打开道路。",
"现代修正主义在经济上的表现，是用利润挂帅、物质刺激、专家治厂和市场原则侵蚀社会主义公有制。它把社会主义企业重新变成追逐利润的独立经济单位，把劳动人民重新置于官僚特权集团和资本主义法则支配之下。公有制一旦只剩下法律外壳，而实际支配权落入修正主义官僚集团手中，就会逐步蜕变为国家资本主义和官僚垄断资本主义，劳动人民也会重新失去对生产和分配的实际控制。",
"现代修正主义在国际路线上的表现，是背叛无产阶级国际主义，走向社会帝国主义。它口头上仍然讲社会主义，实际上同帝国主义进行交易和争霸，对兄弟党实行大国沙文主义控制，对被压迫民族革命进行出卖和压制。苏联修正主义集团后来发展成为社会帝国主义，正是现代修正主义上台后的必然结果：在国内复辟资本主义，在国际上推行霸权主义。",
"现代修正主义的历史教训极其深刻。社会主义革命胜利以后，阶级斗争并没有结束，资产阶级不会自动退出历史舞台，旧社会的思想、习惯、法权和特权关系还会不断产生新的资产阶级分子。最危险的敌人，往往不是公开打着白旗的反革命，而是混进党内、掌握权力、打着红旗反红旗的走资派。修正主义上台，就是资产阶级上台；修正主义路线占统治地位，资本主义复辟就会成为现实。",
"反对现代修正主义，必须坚持无产阶级专政下的继续革命，必须坚持阶级斗争和两条路线斗争，必须发动群众监督干部、批判资产阶级法权、限制特权和资本主义自发势力。反修防修不是枝节问题，而是社会主义能否坚持到底、无产阶级政权能否巩固、共产主义事业能否继续前进的生死问题。现代修正主义披着红色外衣，却是资产阶级复辟的政治工具，必须在理论上、政治上、组织上和实践上彻底揭露并坚决打倒。"
]
},

{
term: "市场经济",
content: [
"<strong>市场经济</strong>是以商品生产、商品交换、价值规律和市场竞争为基本运行机制的经济形式。在市场经济中，生产什么、生产多少、怎样生产以及产品如何分配，主要不是由社会统一计划决定，而是通过价格涨落、供求变化、竞争压力和利润追逐来调节。它表面上表现为商品之间、货币之间、企业之间的自由交换，实际上反映的是一定所有制关系和阶级关系支配下的社会生产关系。",
"市场经济的核心机制是价值规律。商品生产者为了在市场竞争中生存，必须不断降低个别劳动时间，追逐利润和市场份额。价格围绕价值上下波动，资本和资源不断流向利润更高的部门。这个机制能够在一定历史阶段推动生产力发展，打破封建自然经济的闭塞状态，但它同时也必然带来盲目竞争、两极分化、生产无政府状态和周期性经济危机。市场不是中立的技术工具，而是商品生产关系和私有制关系的集中表现。",
"资本主义市场经济是市场经济发展的最高形式。它以生产资料资本家私人占有制和雇佣劳动制度为基础，把劳动力也变成商品，使工人不得不把自己的劳动力卖给资本家。资本家生产商品不是为了满足人民需要，而是为了取得利润和实现资本增殖。市场竞争迫使每一个资本家不断扩大生产、压低成本、加强剥削，结果就是社会生产越来越社会化，而劳动成果却越来越集中到少数资产阶级手中。所谓“自由市场”的自由，本质上是资本支配劳动、强者吞并弱者、垄断压倒竞争的自由。",
"市场经济必然掩盖人与人之间的阶级关系。商品交换看起来是平等的，工资看起来是劳动的报酬，利润看起来是资本的自然收益，价格看起来是供求关系的结果；但是在这些表面现象背后，真正起作用的是资产阶级对生产资料的占有和对雇佣劳动的剥削。工人创造的剩余价值被资本家无偿占有，再以利润、利息、地租、商业收入等形式分割出去。市场经济越发展，商品拜物教就越深，人与人的社会关系就越被物与物的交换关系所遮蔽。",
"社会主义可以在一定范围内利用商品、货币、价格和市场形式，但绝不能让市场成为统帅社会生产的最高原则。社会主义经济的根本方向必须是公有制基础上的计划统帅，而不是利润挂帅、市场挂帅。只要市场原则扩大到支配生产资料配置、企业经营目标和劳动者命运的地位，资本主义因素就会迅速滋长，按劳分配会被资产阶级法权扩大化所侵蚀，公有制也会逐步蜕变为空壳，新的资产阶级和官僚特权集团就会从中产生。",
"市场经济不是超阶级、超历史、永恒合理的经济形式。它产生于商品生产的发展，成熟于资本主义制度，并随着资本主义基本矛盾的尖锐化而暴露出自身的历史局限。无产阶级革命和社会主义建设的方向，不是把全社会重新交给市场盲目性支配，而是在生产资料公有制和无产阶级专政基础上，有计划地组织社会生产，逐步限制和改造商品货币关系，缩小三大差别，限制资产阶级法权，使社会生产越来越直接地服务于劳动人民的共同需要和共产主义的发展方向。"
]
},

{
term: "计划经济",
content: [
"<strong>计划经济</strong>是社会主义公有制基础上的经济运行形式，是劳动人民按照社会整体利益和生产发展的客观需要，有计划、有比例地组织生产、分配、交换和消费的制度安排。它同资本主义市场经济的无政府状态根本对立，不以资本增殖和私人利润为目的，而以满足人民需要、发展社会生产力、巩固社会主义制度、逐步消灭阶级差别和旧社会遗痕为根本方向。",
"计划经济的制度基础是生产资料公有制。只有当主要生产资料掌握在劳动人民手中，社会才能把分散的生产部门、地区、企业和劳动过程组织成为统一的整体，按照国民经济发展的需要进行统筹安排。在资本主义私有制下，社会生产虽然早已高度社会化，但各个资本家仍然为了私人利润互相竞争，整个社会生产必然陷入盲目性、重复建设、周期性危机和资源浪费。计划经济正是对这种资本主义无政府状态的历史否定。",
"计划经济的核心任务，是按照社会需要和客观条件，正确处理积累和消费、工业和农业、重工业和轻工业、中央和地方、国家和集体、长远利益和当前利益之间的关系。它要求把有限的人力、物力和财力集中到最关键的建设方向上，优先发展社会主义工业化所需要的基础部门，同时保障人民生活、巩固工农联盟、促进城乡之间和各地区之间的协调发展。计划不是主观任意的命令，而是对客观经济规律的自觉运用。",
"社会主义计划经济能够集中力量办大事，能够避免资本主义生产为利润所支配造成的严重浪费和危机。在无产阶级专政条件下，计划经济可以把全社会劳动组织起来，用于发展工业、农业、国防、科学技术、文化教育和人民福利，迅速改变旧社会遗留下来的贫穷落后面貌。苏联社会主义工业化和中国社会主义建设的历史经验都证明，计划经济能够在帝国主义封锁和国内基础薄弱的条件下，集中人民力量建设独立完整的国民经济体系。",
"计划经济并不等于少数官僚脱离群众的行政命令。真正的社会主义计划，必须同群众路线结合起来，必须依靠工人、农民和广大劳动群众参加管理、监督计划、执行计划和修正计划。如果计划脱离实际、脱离群众，只由少数机关和专家关门编制，就容易产生官僚主义、命令主义和形式主义。计划经济的生命力，在于把集中统一领导同广大群众的主动性、创造性结合起来，使劳动人民真正成为经济建设的主人。",
