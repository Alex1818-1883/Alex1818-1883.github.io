 padding: 80px 20px 60px;

         animation: fadeInUp 1s ease-out 0.1s forwards;

     animation: entryFadeIn 1s ease 0.6s backwards !important;

animation: entryFadeIn 1s ease;

            .entry-title { font-size: 30px; }

           footer h3 {

        // === 🚀 2. 中枢控制逻辑 ===
        const dictInput = document.getElementById('dictInput');
        const dictBtn = document.getElementById('dictBtn');
        const entryContainer = document.getElementById('entryContainer');

        // 监听输入框：有字就让查询按钮浮现
        dictInput.addEventListener('input', function() {
            const keyword = this.value.trim();
            if (keyword.length > 0) {
                dictBtn.classList.add('show');
            } else {
                dictBtn.classList.remove('show');
            }
        });

        // 监听回车键查询
        dictInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                executeSearch();
            }
        });

        // 监听按钮点击查询
        dictBtn.addEventListener('click', executeSearch);

// 核心检索与渲染引擎 (升级版：智能多词条阵列)
        function executeSearch() {
            const keyword = dictInput.value.trim().toLowerCase();
            if (keyword === '') return;

            // 为了触发每次查询的入场动画，先隐藏容器，强迫浏览器重绘
            entryContainer.style.display = 'none';
            entryContainer.innerHTML = '';

            // 🚀 核心战术变革 1：从 find 改为 filter，把所有包含关键字的词条全捞出来！
            let results = DICTIONARY_DATA.filter(item => 
                item.term.toLowerCase().includes(keyword) || 
      (item.aliases && item.aliases.some(alias => alias.toLowerCase().includes(keyword)))
            );

// 🚀 核心战术变革 2：智能排序引擎
            results.sort((a, b) => {
                // 判断是否是完全精确匹配
                /* 🚀 同样加上 a.aliases && 和 b.aliases && 的容错装甲 */
                const exactA = a.term.toLowerCase() === keyword || (a.aliases && a.aliases.some(al => al.toLowerCase() === keyword));
                const exactB = b.term.toLowerCase() === keyword || (b.aliases && b.aliases.some(al => al.toLowerCase() === keyword));
                
                if (exactA && !exactB) return -1; 
                if (!exactA && exactB) return 1;
                
                return a.term.length - b.term.length;
            });

            // 🚀 核心战术变革 3：多卡片阵列生成
            if (results.length > 0) {
                let allCardsHtml = '';
                
                results.forEach((result, index) => {
                    const paragraphsHtml = result.content.map(p => `<p>${p}</p>`).join('');
                    // 🚀 瀑布流补丁：多张卡片同时出现时，给后面的卡片增加 0.15s 的梯次延迟，极具视觉冲击力！
                    const delay = index * 0.15; 
                    
                        allCardsHtml += `
                        <div class="entry-card" style="animation: entryFadeIn 1s ease ${delay}s backwards;">
                            <h2 class="entry-title">${result.term}</h2>
                            <div class="entry-line" aria-hidden="true">
                                <span></span>
                                <strong>★</strong>
                                <span></span>
                            </div>
                            <div class="entry-text">
                                ${paragraphsHtml}
                            </div>
                        </div>
                    `;
                });
                
                entryContainer.innerHTML = allCardsHtml;
            } else {
                // 未找到时的反馈
                entryContainer.innerHTML = `
                    <div class="not-found">
                        报告同志：辞典尚未收录“${dictInput.value.trim()}”相关条目。
                    </div>
                `;
            }

            // 重新显示容器，触发升空入场动画
            entryContainer.style.display = 'block';
            
            // 🚀 强制浏览器进行一次重绘！这是确保 CSS 动画 100% 触发的核心命令！
            void entryContainer.offsetWidth;
        }
            

        function initDefaultEntry() {

const defaultResult = DICTIONARY_DATA.find(item => item.term === "列宁");
            
   if (defaultResult) {
                const paragraphsHtml = defaultResult.content.map(p => `<p>${p}</p>`).join('');
                entryContainer.innerHTML = `
                    <div class="entry-card initial-delay">
                        <h2 class="entry-title">${defaultResult.term}</h2>
                        <div class="entry-line" aria-hidden="true">
                            <span></span>
                            <strong>★</strong>
                            <span></span>
                        </div>
                        <div class="entry-text">
                            ${paragraphsHtml}
                        </div>
                    </div>
                `;
                
                // 让卡片在开局瞬间展现，同样触发你之前写好的绝美升空动画
                entryContainer.style.display = 'block';
            }
        }

        // 🚀 引擎通电：一进页面立刻执行！
        initDefaultEntry();

    </script>
