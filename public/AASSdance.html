<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- 提前解析并连接B站播放器域名，稍微缩短初次加载时间 -->
<link rel="dns-prefetch" href="//player.bilibili.com">
<link rel="preconnect" href="https://player.bilibili.com" crossorigin>

<title>革命舞蹈</title>
    <link rel="icon" href="red.ico" type="image/x-icon">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
        scroll-behavior: auto;
            scrollbar-gutter: stable;
            overflow-y: scroll;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;

            background-color: #F9F9F9;
            color: #A80000;

            font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", "Helvetica Neue", sans-serif;
            font-size: 18px;
            line-height: 1.6;

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }

        body.modal-open {
            overflow: hidden;
        }

        button,
        a {
            font-family: inherit;
        }


        @keyframes cardRiseIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

     /* === 顶部导航：与毛主席相集完全一致 === */
header {
    position: absolute;
    top: 0;
    width: 100%;

    padding: 20px 40px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    z-index: 100;
}

.logo {
    font-size: 26px;
    font-weight: 900;
    color: #CC0000;
    text-decoration: none;
    letter-spacing: 1px;

    display: flex;
    align-items: center;

    transform: scale(1) translateZ(0);
    will-change: transform;
    backface-visibility: hidden;

    transition:
        transform 0.4s
        cubic-bezier(0.175, 0.885, 0.32, 1.275);

    transform-origin: left center;
}

.logo .star {
    display: inline-block;
    margin-right: 8px;

    transition:
        transform 0.5s
        cubic-bezier(0.175, 0.885, 0.32, 1.275),
        color 0.3s ease;
}

.logo:hover {
    transform: scale(1.15) translateZ(0);
}

.logo:hover .star {
    transform:
        scale(1.4)
        rotate(36deg)
        translateZ(0);

    color: #FFD700;
}

.nav-links {
    display: flex;
    gap: 15px;
}

/*
 * 右侧不可见占位。
 * 它不显示、不响应点击，但保留原按钮所占宽度，
 * 从而保持顶部布局和相集页面一致。
 */
.nav-placeholder::after {
    content: "革命文艺";

    display: inline-block;
    visibility: hidden;
    pointer-events: none;

    color: #CC0000;
    font-size: 18px;
    font-weight: bold;

    padding: 8px 22px;

    border: 2px solid #CC0000;
    border-radius: 30px;
}

.hero {

    height: 58vh;
    min-height: 0;

    padding: 10vh 20px 6vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    position: relative;
    overflow: hidden;
    text-align: center;

    background:
        linear-gradient(
            to bottom,
            #FFFFFF 0,
            #FFFFFF 90%,
            #F9F9F9 90%,
            #F9F9F9 100%
        );
}

/* === 首屏上半部分背景图 === */
.hero::before {
    content: "";

    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 10%;

    z-index: 0;

    background-image: url("calligraphy/gooddance.svg");
    background-repeat: no-repeat;

    background-size: 50% auto;

    background-position:
        center
        calc(50% - 45px);

    opacity: 0.1;

    pointer-events: none;
}

        .hero h1 {
            position: relative;
            z-index: 1;

            margin-bottom: 18px;

            color: #DD0000;
            font-size: 3.4rem;
            font-weight: 900;
            letter-spacing: 5px;
            line-height: 1.15;

        }

        .hero p {
            position: relative;
            z-index: 1;

            color: #A80000;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            line-height: 1.8;

        }

.hero h1,
.hero p {
    user-select: text;
    -webkit-user-select: text;
    -moz-user-select: text;
    -ms-user-select: text;

    -webkit-touch-callout: default;
}

.hero-divider {
    position: absolute;
    left: 50%;

    /*
     * 固定在首屏高度约90%的位置。
     */
    top: 90%;
    bottom: auto;

    z-index: 2;

    width: 100vw;
    margin-left: -50vw;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;

    color: #CC0000;
    font-size: 36px;
    line-height: 1;

    transform: translateY(-50%);

    pointer-events: none;
}

        .hero-divider::before,
        .hero-divider::after {
            content: "";
            flex: 1;
            height: 3px;

            background-color: #CC0000;
            border-radius: 999px;
        }

        /* === 主体 === */
        main {
            flex: 1;

            width: 100%;
            max-width: 1220px;

            margin: 14px auto 0;
            padding: 0 28px 82px;
        }

.dance-category-section {
    width: min(900px, 100%);
    margin: 10px auto 64px;
}


        .category-buttons {
            --slider-x: -4px;
            --slider-y: -4px;
            --slider-width: 0px;
            --slider-height: 0px;

            position: relative;

            display: grid;
            grid-template-columns: repeat(4, 1fr);

            width: min(820px, 100%);
            margin: 0 auto;
            padding: 5px;

            border: 2px solid #CC0000;
            border-radius: 999px;
            background-color: #FFFFFF;
        }

        .category-buttons::before {
            content: "";

            position: absolute;
            left: 0;
            top: 0;
            z-index: 0;

            width: var(--slider-width);
            height: var(--slider-height);

            border-radius: 999px;
            background-color: #CC0000;

            opacity: 0;
            transform: translate3d(var(--slider-x), var(--slider-y), 0);

            transition:
                transform 0.26s ease,
                opacity 0.18s ease;
        }

        .category-buttons.no-slider-transition::before {
            transition: none !important;
        }

        .category-buttons.has-active::before {
            opacity: 1;
        }

        .category-btn {
            position: relative;
            z-index: 1;

            height: 46px;

            border: none;
            border-radius: 999px;
            background-color: transparent;

            color: #CC0000;

            font-size: 17px;
            font-weight: 900;
            letter-spacing: 1px;

            cursor: pointer;
            isolation: isolate;

            transition: color 0.22s ease;
        }

        .category-btn::before {
            content: "";

            position: absolute;
            top: -5px;
            bottom: -5px;
            left: -5px;
            right: -5px;
            z-index: -1;

            border-radius: 999px;
            background-color: rgba(204, 0, 0, 0.08);

            opacity: 0;
            pointer-events: none;

            transition: opacity 0.22s ease;
        }

        .category-btn:hover::before {
            opacity: 1;
        }

        .category-btn.active::before,
        .category-btn.active:hover::before {
            opacity: 0;
        }

        .category-btn:hover {
            color: #FF0000;
        }

        .category-btn.active,
        .category-btn.active:hover {
            color: #FFFFFF;
        }

        /* === 双列舞蹈卡片 === */
        .dance-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 34px 32px;

            width: 100%;
            min-height: 520px;

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }

        .dance-grid.is-changing {
            opacity: 0;
            transform: translateY(12px);
        }

.dance-card {
    min-width: 0;
    overflow: hidden;

    border: 2px solid #FFE1E1;
    border-radius: 18px;
    background-color: #FFFFFF;

    opacity: 1;
    cursor: pointer;

    transition:
        border-color 0.28s ease,
        box-shadow 0.28s ease;
}

/* 只有切换分类后生成的卡片才执行渐显动画 */
.dance-card.is-entering {
    opacity: 0;
    animation: cardRiseIn 0.72s ease-out forwards;
}

        .dance-card:hover {
            border-color: rgba(204, 0, 0, 0.72);
            box-shadow: 0 12px 25px rgba(204, 0, 0, 0.065);
        }

.dance-thumb {
    display: block;
    position: relative;

    width: 100%;
    aspect-ratio: 16 / 9;

    overflow: hidden;
    line-height: 0;

    background-color: #F3E8E8;
}



.dance-poster {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: var(--poster-position, center center);


    transform-origin: 50% 50%;


    transform: translate3d(0, 0, 0) scale(1);
    will-change: transform;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    transition: transform 0.45s ease;
}

.dance-card:hover .dance-poster {
    transform: translate3d(0, 0, 0) scale(1.025);
}

      
        .dance-info {
            padding: 24px 28px 27px;
        }

.dance-title {
    margin-bottom: 16px;

    color: #CC0000;
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 1px;
    line-height: 1.35;
}


.dance-desc {
    color: #A80000;
    font-size: 16px;
    font-weight: 800;
    line-height: 1.7;

    font-style: normal;
    text-align: left;

    border-left: none;
    padding-left: 0;
    margin: 0;

    text-indent: -1em;
}



        .empty-state {
            grid-column: 1 / -1;

            padding: 70px 20px;

            color: #A80000;
            font-weight: 900;
            text-align: center;
        }

        /* === 视频弹窗：单部播放，不设左右切换 === */
        .video-modal {
            position: fixed;
            inset: 0;
            z-index: 3000;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 28px;

            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transition:
                opacity 0.25s ease,
                visibility 0s linear 0.25s;
        }

        .video-modal.is-visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;

            transition:
                opacity 0.25s ease,
                visibility 0s linear 0s;
        }

.video-panel {
    position: relative;

    width: min(1040px, 100%);
    max-height: calc(100vh - 56px);

    display: flex;
    flex-direction: column;

    overflow: hidden;
    padding: 0;

    border-left: 7px solid #CC0000;
    border-radius: 22px;
    background-color: #FFFFFF;

    box-shadow: 0 22px 60px rgba(0, 0, 0, 0.25);

    opacity: 0;
    transform: none;

    transition: opacity 0.25s ease;
}

.video-header {
    position: relative;
    z-index: 5;

    flex: 0 0 auto;


    padding: 32px 58px 32px 42px;

    background-color: #FFFFFF;
}

.video-scroll {
    position: relative;

    flex: 1 1 auto;
    min-height: 0;

    overflow-y: auto;
    overflow-x: hidden;

    margin-right: 12px;

    /*
     * 顶部不再放可滚动留白。
     * 标题到视频的32px距离全部固定在header中。
     */
    padding: 0 34px 36px 42px;

    scrollbar-gutter: stable;
    overscroll-behavior: contain;
}


.video-modal.is-visible .video-panel {
    opacity: 1;
    transform: none;
}

.video-close {
    appearance: none;
    -webkit-appearance: none;

    position: absolute;
    top: 20px;
    right: 22px;
    z-index: 6;

    width: 38px;
    height: 38px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 0 0 2px;

    border: none;
    border-radius: 50%;

    background-color: transparent;
    color: #CC0000;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 32px;
    font-weight: 900;
    line-height: 1;

    cursor: pointer;

    transition:
        background-color 0.2s ease,
        color 0.2s ease;
}

.video-close:hover {
    background-color: #CC0000;
    color: #FFFFFF;
}

.video-close:active {
    background-color: #A80000;
    color: #FFFFFF;
}

.video-title {
    padding: 0 16px;
    margin: 0;

    color: #CC0000;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1.4;
    text-align: center;
}

        .video-frame {
            position: relative;

            width: 100%;
            aspect-ratio: 16 / 9;

            overflow: hidden;

            border-radius: 14px;
            background-color: #000000;
        }

.modal-video {
    display: block;

    width: 100%;
    height: 100%;

    border: none;
    background-color: #000000;
}

/*
 * 网站自己的全屏按钮。
 * 电脑端默认隐藏；手机端覆盖B站右下角全屏图标。
 */
.site-fullscreen-btn {
    appearance: none;
    -webkit-appearance: none;

    position: absolute;
    right: 0;
    bottom: 0;
    z-index: 10;

    display: none;

    /*
     * 只覆盖B站最右侧全屏按钮区域，
     * 不影响暂停、进度条和弹幕按钮。
     */
    width: 48px;
    height: 44px;

    margin: 0;
    padding: 0;

    border: none;
    border-radius: 0;
    background: transparent;
    box-shadow: none;

    color: transparent;
    font-size: 0;
    line-height: 0;

    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

/* 视频框进入全屏后铺满整个屏幕 */
.video-frame:fullscreen,
.video-frame:-webkit-full-screen {
    width: 100vw;
    height: 100vh;
    height: 100dvh;

    aspect-ratio: auto;
    border-radius: 0;

    background-color: #000000;
}

/* 全屏后让B站iframe铺满视频框 */
.video-frame:fullscreen .modal-video,
.video-frame:-webkit-full-screen .modal-video {
    width: 100%;
    height: 100%;
}

.video-frame:fullscreen .site-fullscreen-btn,
.video-frame:-webkit-full-screen .site-fullscreen-btn {
    top: auto;
    left: auto;
    right: 0;
    bottom: 0;

    display: block;
}

/* === B站播放器载入前的网站加载画面 === */
@keyframes videoLoadingSpin {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}



.video-loading {
    position: absolute;
    inset: 0;
    z-index: 3;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            #350000 0,
            #170000 42%,
            #050505 100%
        );

    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    transition:
        opacity 0.18s ease,
        visibility 0s linear 0.18s;
}

.video-loading.is-visible {
    opacity: 1;
    visibility: visible;

    transition:
        opacity 0.18s ease,
        visibility 0s linear 0s;
}

.video-loading-mark {
    position: relative;

    width: 66px;
    height: 66px;
}

.video-loading-ring {
    position: absolute;
    inset: 0;

    border: 4px solid rgba(255, 255, 255, 0.2);
    border-top-color: #CC0000;
    border-right-color: #CC0000;
    border-radius: 50%;

    animation: videoLoadingSpin 0.9s linear infinite;
}

.video-loading-star {
    position: absolute;
    left: 50%;
    top: 50%;

    color: #FF0000;

    font-size: 27px;
    font-weight: 900;
    line-height: 1;

    opacity: 1;
    transform: translate(-50%, -50%);
}


        .video-status {
            position: absolute;
            inset: 0;
            z-index: 4;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 30px;

            background-color: #111111;
            color: #FFFFFF;

            font-size: 17px;
            font-weight: 900;
            line-height: 1.9;
            text-align: center;
        }

        .video-status.is-visible {
            display: flex;
        }

/* === 视频下方的作品资料 === */
.video-extra {
    width: min(880px, 100%);

    margin: 42px auto 0;

    color: #222222;
    text-align: left;
}

.video-extra-section {
    margin-bottom: 34px;
}

.video-extra-section:last-child {
    margin-bottom: 0;
}

.video-extra-title {
    margin: 0 0 16px;

    color: #CC0000;

    font-size: 21px;
    font-weight: 900;
    line-height: 1.4;
    letter-spacing: 1px;
}

.video-extra-text {
    margin: 0;

    color: #222222;

    font-size: 16px;
    font-weight: 500;
    line-height: 2.05;

    text-align: justify;
}

.video-extra-text + .video-extra-text {
    margin-top: 14px;
}



        /* === 页脚 === */
        footer {
            padding: 40px 20px;

            background-color: #CC0000;
            color: #FFFFFF;
            text-align: center;
        }

        footer h3 {
            color: #FFFFFF;
            font-size: 26px;
            letter-spacing: 4px;
        }


.logo,
.logo *,
.nav-links,
.nav-links *,
.hero-divider,
.hero-divider *,
.category-buttons,
.category-buttons *,
.dance-card,
.dance-card *,
.video-close,
.video-title,
footer h3 {
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;

    -webkit-touch-callout: none;
    -webkit-user-drag: none;
}


.logo::selection,
.logo *::selection,
.nav-links::selection,
.nav-links *::selection,
.hero-divider::selection,
.hero-divider *::selection,
.category-buttons::selection,
.category-buttons *::selection,
.dance-card::selection,
.dance-card *::selection,
.video-close::selection,
.video-title::selection,
footer h3::selection {
    background: transparent;
}

button:focus-visible,
a:focus-visible {
    outline: 3px solid rgba(204, 0, 0, 0.3);
    outline-offset: 3px;
}

        /* === 平板 === */
        @media (max-width: 980px) {
            main {
                padding-left: 22px;
                padding-right: 22px;
            }

            .category-buttons {
                width: min(760px, 100%);
            }

            .dance-grid {
                gap: 28px 24px;
            }

            .dance-title {
                font-size: 23px;
            }

            .dance-info {
                padding: 22px 24px 25px;
            }
        }

        /* === 手机端：单列卡片，不另设最小手机断点 === */
        @media (max-width: 768px) {

header {
    padding: 15px 20px;

    flex-direction: column;
    gap: 10px;
}

.logo {
    font-size: 22px;
    transform-origin: center center;
}

            .hero {
                min-height: 360px;
                padding-top: 96px;

                background:
                    linear-gradient(
                        to bottom,
                        #FFFFFF 0,
                        #FFFFFF calc(100% - 35px),
                        #F9F9F9 calc(100% - 35px),
                        #F9F9F9 100%
                    );
            }

.hero::before {
    bottom: 35px;

    background-size: 92% auto;
    background-position:
        center
        calc(50% + 20px);
}

            .hero h1 {
                margin-bottom: 14px;

                font-size: 2.45rem;
                letter-spacing: 3px;
            }

            .hero p {
                font-size: 18px;
                letter-spacing: 1px;
            }

.hero-divider {
    top: auto;
    bottom: 20px;

    transform: none;

    gap: 12px;
    font-size: 30px;
}

            .hero-divider::before,
            .hero-divider::after {
                height: 3px;
            }


.site-fullscreen-btn {
    display: block;
}

.video-loading-mark {
    width: 54px;
    height: 54px;
}

.video-loading-ring {
    border-width: 3px;
}

.video-loading-star {
    font-size: 23px;
}



            main {
                margin-top: 20px;
                padding: 0 16px 58px;
            }

            .dance-category-section {
                margin-bottom: 48px;
            }


/* 手机端分类胶囊 */
.category-buttons {

    grid-template-columns: repeat(2, 1fr);

    padding: 4px;

    row-gap: 8px;

    border-radius: 24px;
}

.category-btn {
    height: 42px;
    font-size: 15px;
    letter-spacing: 0;
}

            .dance-grid {
                grid-template-columns: 1fr;
                gap: 26px;
                min-height: 0;
            }

.dance-card {
    border-radius: 16px;
    cursor: pointer;
}



            .dance-info {
                padding: 20px 21px 23px;
            }

.dance-title {
    margin-bottom: 13px;
    font-size: 22px;
}

.dance-desc {
    font-size: 15px;
    line-height: 1.7;
    text-align: left;

    /* 手机端取消引号悬挂，不再向左缩进 */
    text-indent: 0;
}


            .video-modal {
                padding: 18px;
            }

.video-panel {
    max-height: calc(100vh - 36px);

    padding: 0;

    border-left-width: 6px;
    border-radius: 18px;
}

.video-header {
    padding: 26px 46px 40px 22px;
}

.video-scroll {
    flex: 1 1 auto;
    min-height: 0;

    margin-right: 8px;

    padding: 0 18px 22px 22px;
}

.video-extra {
    width: 100%;
    margin-top: 32px;
}

.video-extra-section {
    margin-bottom: 28px;
}

.video-extra-title {
    margin-bottom: 12px;

    font-size: 18px;
    letter-spacing: 1px;
}

.video-extra-text {
    font-size: 14px;
    line-height: 1.95;
    text-align: left;
}

     .video-close {

/*
 * 给当前页面中的卡片绑定图片错误处理和点击播放。
 *
 * 初始革命斗争卡片来自HTML；
 * 切换分类后的卡片来自renderCards函数。
 * 两种卡片统一使用这里的事件。
 */
function bindDanceCards() {
    /*
     * 图片载入失败时显示备用图。
     */
    danceGrid.querySelectorAll(".dance-poster").forEach(image => {
        /*
         * 防止同一张图片重复绑定错误事件。
         */
        if (image.dataset.errorBound === "true") return;

        image.dataset.errorBound = "true";

        function applyFallbackPoster() {
            /*
             * 使用一次后移除，防止备用图也失败时无限循环。
             */
            image.removeEventListener(
                "error",
                applyFallbackPoster
            );

            image.src =
                image.dataset.fallback ||
                createFallbackPoster();
        }

        image.addEventListener(
            "error",
            applyFallbackPoster
        );

        /*
         * 如果图片在JavaScript执行前就已经失败，
         * 这里也能补上备用图。
         */
        if (
            image.complete &&
            image.naturalWidth === 0
        ) {
            applyFallbackPoster();
        }
    });


    danceGrid.querySelectorAll(".dance-card").forEach(card => {
        /*
         * 防止同一张卡片重复绑定点击事件。
         */
        if (card.dataset.clickBound === "true") return;

        card.dataset.clickBound = "true";

        card.addEventListener("click", function () {
            const danceIndex = Number(this.dataset.index);
            const dance = DANCES[danceIndex];

            if (!dance) return;

            openVideoModal(dance);
        });
    });
}

const fallback = createFallbackPoster();

        : "";

return `

                ${escapeHtml(dance.desc)}

`;
            }).join("");

        function switchCategory(category) {
            if (category === activeCategory) return;

            activeCategory = category;

            document.querySelectorAll(".category-btn").forEach(button => {
                button.classList.toggle("active", button.dataset.category === category);
            });

            updateCategorySlider();

            clearTimeout(categoryTimer);
            danceGrid.classList.add("is-changing");

categoryTimer = setTimeout(() => {
    renderCards(category, true);
    danceGrid.classList.remove("is-changing");
}, 300);

}

        function updateCategorySlider() {
            const activeButton = document.querySelector(".category-btn.active");

            if (!activeButton || !categoryButtons) return;

            const isMobile = window.matchMedia("(max-width: 768px)").matches;
            const extraWidth = isMobile ? 12 : 18;
            const extraHeight = isMobile ? 12 : 18;

            const x = activeButton.offsetLeft - extraWidth / 2;
            const y = activeButton.offsetTop - extraHeight / 2;
            const width = activeButton.offsetWidth + extraWidth;
            const height = activeButton.offsetHeight + extraHeight;

            categoryButtons.style.setProperty("--slider-x", `${x}px`);
            categoryButtons.style.setProperty("--slider-y", `${y}px`);
            categoryButtons.style.setProperty("--slider-width", `${width}px`);
            categoryButtons.style.setProperty("--slider-height", `${height}px`);
            categoryButtons.classList.add("has-active");
        }

        function initCategoryButtons() {
            document.querySelectorAll(".category-btn").forEach(button => {
                button.addEventListener("click", function () {
                    switchCategory(this.dataset.category);
                });
            });

            categoryButtons.classList.add("no-slider-transition", "has-active");
            updateCategorySlider();
            categoryButtons.offsetHeight;

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    categoryButtons.classList.remove("no-slider-transition");
                });
            });
        }

function normalizeVideoParagraphs(content) {
    if (Array.isArray(content)) {
        return content.filter(item => {
            return typeof item === "string" && item.trim() !== "";
        });
    }

    if (typeof content === "string" && content.trim() !== "") {
        return [content];
    }

    return [];
}

            <section class="video-extra-section">
                <h3 class="video-extra-title">
                    ${escapeHtml(section.title)}
                </h3>

                ${paragraphs.map(paragraph => {
                    return `
                        <p class="video-extra-text">
                            ${escapeHtml(paragraph)}
                        </p>
                    `;
                }).join("")}
            </section>
        `;
    }).join("");

    videoExtra.innerHTML = html;
    videoExtra.style.display = html ? "block" : "none";
}

function openVideoModal(dance) {
    if (!dance) return;

    videoModalTitle.textContent = dance.title;
    videoPlayer.title = `${dance.title}视频播放器`;

    renderVideoExtra(dance);
    clearVideoError();

    if (videoScroll) {
        videoScroll.scrollTop = 0;
    }

    /*
     * 先打开弹窗，使加载画面立刻出现。
     */
    videoModal.classList.add("is-visible");
    videoModal.setAttribute("aria-hidden", "false");
    document.body.classList.add("modal-open");

    const embedSrc =
        typeof dance.embedSrc === "string"
            ? dance.embedSrc.trim()
            : "";

    if (embedSrc) {
        /*
         * 在B站播放器出现之前，
         * 先显示网站自己的加载动画。
         */
        showVideoLoading();

        /*
         * 下一帧再设置iframe地址，
         * 让浏览器有机会先绘制弹窗和加载动画。
         */
        requestAnimationFrame(() => {
            if (!videoModal.classList.contains("is-visible")) {
                return;
            }

            videoPlayer.src = embedSrc;
        });
    } else {
        videoPlayer.src = "about:blank";
        showVideoError();
    }
}

videoPlayer.addEventListener("load", () => {
    const currentSrc = videoPlayer.getAttribute("src");

    /*
     * about:blank载入时不处理。
     */
    if (!currentSrc || currentSrc === "about:blank") {
        return;
    }

    /*
     * 弹窗已经关闭时不处理旧的载入事件。
     */
    if (!videoModal.classList.contains("is-visible")) {
        return;
    }

    hideVideoLoading();
});

function closeVideoModal() {
    if (!videoModal.classList.contains("is-visible")) return;

    /*
     * 先关闭弹窗状态。
     */
    videoModal.classList.remove("is-visible");
    videoModal.setAttribute("aria-hidden", "true");
    document.body.classList.remove("modal-open");

    /*
     * 清理所有播放器状态。
     */
    videoLoading.classList.remove("is-visible");
    videoStatus.classList.remove("is-visible");

    videoPlayer.style.visibility = "hidden";
    videoPlayer.src = "about:blank";
}


/*
 * 网站自己的视频全屏功能
 */
async function toggleSiteVideoFullscreen() {
    if (!videoFrame || !siteFullscreenBtn) return;

    const fullscreenElement =
        document.fullscreenElement ||
        document.webkitFullscreenElement;

    try {
        /*
         * 当前没有全屏：进入全屏
         */
        if (!fullscreenElement) {
            if (videoFrame.requestFullscreen) {
                await videoFrame.requestFullscreen();
            } else if (videoFrame.webkitRequestFullscreen) {
                videoFrame.webkitRequestFullscreen();
            } else {
                throw new Error("当前浏览器不支持网页全屏");
            }

            return;
        }

        /*
         * 当前已经全屏：退出全屏
         */
        if (document.exitFullscreen) {
            await document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
        }
    } catch (error) {
        console.error("视频全屏失败：", error);

        alert(
            "浏览器拒绝了全屏请求。\n\n" +
            "fullscreenEnabled：" +
            String(document.fullscreenEnabled) +
            "\n页面协议：" +
            location.protocol +
            "\n是否为顶层页面：" +
            String(window.top === window.self)
        );
    }
}


function updateSiteFullscreenButton() {
    if (!siteFullscreenBtn) return;

    const isFullscreen = Boolean(
        document.fullscreenElement ||
        document.webkitFullscreenElement
    );

    siteFullscreenBtn.setAttribute(
        "aria-label",
        isFullscreen ? "退出全屏" : "全屏播放"
    );

    siteFullscreenBtn.setAttribute(
        "title",
        isFullscreen ? "退出全屏" : "全屏播放"
    );
}

/* 点击自己的按钮进入或退出全屏 */
siteFullscreenBtn.addEventListener(
    "click",
    toggleSiteVideoFullscreen
);

/* 监听标准全屏状态变化 */
document.addEventListener(
    "fullscreenchange",
    updateSiteFullscreenButton
);

/* 兼容部分WebKit浏览器 */
document.addEventListener(
    "webkitfullscreenchange",
    updateSiteFullscreenButton
);


        videoCloseBtn.addEventListener("click", closeVideoModal);

        videoModal.addEventListener("click", event => {
            if (event.target === videoModal) {
                closeVideoModal();
            }
        });

        window.addEventListener("keydown", event => {
            if (event.key === "Escape") {
                closeVideoModal();
            }
        });

        window.addEventListener("resize", updateCategorySlider);


bindDanceCards();

initCategoryButtons();
    </script>
