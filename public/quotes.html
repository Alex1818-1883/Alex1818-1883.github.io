
<!DOCTYPE html>
<html lang="zh-CN">
<head>

<link rel="icon" href="red.ico" type="image/x-icon">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", "Helvetica Neue", sans-serif;
            background-color: #F9F9F9;
            color: #A80000;
            line-height: 1.6;
            font-size: 18px;
-webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
        }

        /* 顶部导航栏 */
        header {
            position: absolute; top: 0; width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
       .logo {
    font-size: 26px; font-weight: 900; color: #CC0000; text-decoration: none; letter-spacing: 1px; display: flex; align-items: center;
   transform: scale(1) translateZ(0);
    will-change: transform;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    transform-origin: left center;
}
        .logo .star {
            display: inline-block;
            margin-right: 8px;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.3s ease;
        }
        .logo:hover { transform: scale(1.15) translateZ(0); }
        .logo:hover .star {transform: scale(1.4) rotate(36deg) translateZ(0); color: #FFD700; }

        .nav-links { display: flex; gap: 15px; }
        .nav-links a {
    color: #CC0000;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    padding: 8px 22px;
    border: 2px solid #CC0000;
    border-radius: 30px;
    transform: scale(1) translateZ(0);
    will-change: transform;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
        .nav-links a:hover {
            color: #FFFFFF;
            background-color: #CC0000;
           transform: scale(1.1) translateY(-3px) translateZ(0);
        }
.nav-links a:active {
   transform: scale(0.95) translateZ(0);
}

.hero {
    height: 45vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

background:
    linear-gradient(
        to bottom,
        #FFFFFF 0,
        #FFFFFF calc(100% - 4px),
        #F9F9F9 calc(100% - 4px),
        #F9F9F9 100%
    );

    position: relative;
    overflow: visible;
    z-index: 1;
}
        .hero h1 {
            font-size: 3rem;
            font-weight: 900;
            color: #DD0000;
            letter-spacing: 4px;
        }
        .hero p {
            font-size: 1.3rem;
            font-weight: bold;
            color: #A80000;
            margin-top: 10px;
            letter-spacing: 2px;
        }

.hero-divider {
    position: absolute;

    left: 0;
    right: 0;
    bottom: -14px;

    width: 100%;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;

    color: #CC0000;
    font-size: 36px;
    line-height: 1;

    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;

    z-index: 2;
}

.hero-divider::before,
.hero-divider::after {
    content: "";
    display: block;

    flex: 1;
    height: 3px;

    background-color: #CC0000;
    border-radius: 999px;
}
/* 📖 语录标题专属链接样式 */
        .book-link {
    color: #DD0000;
    text-decoration: none;
    display: inline-block;
  transform: scale(1) translateZ(0);
    will-change: transform;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
}

        /* 🌟 悬停时的高亮爆发状态：取消光晕，只让字体本身亮一点 */
        .book-link:hover {
            color: #FF1A1A; /* ⚠️ 颜色瞬间提亮，达到极其刺眼的高亮红色 */
            text-shadow: none; /* 🚀 核心排雷：彻底取消光晕效果 */
           transform: scale(1.05) translateZ(0);/* 字号微微膨胀，仿佛在呼吸 */
        }

        /* 🚀 悬浮五角星的外部装甲：尺寸整体调整大一号，并上移更多间距 */
        .book-star {
            position: absolute;
            top: -65px; /* 🚀 战术拔高：升空高度增加 20px */
            left: 50%;
            margin-left: -27.5px; /* 🚀 居中修正：宽度的一半 (55px / 2 = 27.5px) */
            width: 55px; /* 🚀 尺寸变大：从 40px 扩充到 55px */
            height: 55px; /* 🚀 尺寸变大 */
            opacity: 0; /* 初始状态：完全隐形 */
           transform: scale(0.2) translateY(20px) translateZ(0); /* 初始状态：缩小且位置偏低 */
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* 平滑的物理惯性刹车 */
            pointer-events: none; /* 绝对指令：红星是全息影像，鼠标穿透它 */
            will-change: transform, opacity;
            backface-visibility: hidden;
        }

        /* 当鼠标悬停在文字上时，外部装甲升空并显现 */
        .book-link:hover .book-star {
            opacity: 1;
           transform: scale(1) translateY(0) translateZ(0);
        }

        /* 🌟 五角星内核：负责永不停止的自转引擎 */
        .book-star svg {
            width: 100%;
            height: 100%;
            animation: infinite-spin 6s linear infinite; /* 6秒转一圈，匀速，永不停息 */
        will-change: transform;
       backface-visibility: hidden;
        }

        /* 定义自转的物理法则 */
        @keyframes infinite-spin {
            from { transform: rotate(0deg) translateZ(0); }
            to { transform: rotate(360deg) translateZ(0); }
        }

/* === 红线下方语录版块背景 === */
.quote-section {
    position: relative;
    overflow: hidden;

    background-color: #F9F9F9;
}

.quote-section::before {
    content: "";
    position: absolute;
    inset: 0;

    background-image: url("maohuishou.svg");
    background-repeat: no-repeat;
    background-position: center center;
    background-size: min(80vw, 850px) auto;

    opacity: 0.1;

    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;

    z-index: 0;
}

.quote-section .content-container {
    position: relative;
    z-index: 1;
}

        /* 主体容器 */
        .content-container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
        }

        /* === 单条大字语录舞台 === */
.quote-stage {
    height: 440px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
    overflow: hidden;
}

.quote-display {
            max-width: 900px;
            width: 100%;
            text-align: center;
            opacity: 0;
            
            /* 🚀 核心排雷 1：抛弃 translate3d 这种强制 3D 指令，回归纯正的 2D 下沉！ */
            transform: translateY(30px);
            
            transition: opacity 0.4s ease, transform 0.4s ease;
            
            /* 🚀 核心排雷 2：彻底删掉 will-change 和 backface-visibility！
               不再向显卡申请任何特殊图层！ */
        }
        
        .quote-display.visible {
            opacity: 1;
            /* 🚀 终极杀招：动画到位停稳的瞬间，立刻执行 none！
               把排版权 100% 交还给 CPU，彻底粉碎边缘的磨砂感！ */
            transform: none;
        }

.quote-text {
    font-size: 52px;
    font-weight: 900;
    color: #CC0000;
    line-height: 1.6;
    letter-spacing: 2px;
    margin-bottom: 40px;

    /* 🚀 终极排版战术：短句整体居中，长句像写文章一样完美左对齐！ */
    display: inline-block; /* 核心指令：将文字化为紧凑的实体方块 */
    text-align: left;      /* 内部指令：方块内部的文字永远从左向右排列 */
    max-width: 100%;       /* 防御指令：保证方块最大不会撑破屏幕边界 */
}

/* 🚀 新增：为长名言准备的备用口径 */
.quote-text.medium { font-size: 42px; }
.quote-text.long { font-size: 34px; }
.quote-text.super-long { font-size: 28px; } /* 🚀 战术校准：从 26px 放大到 30px 黄金口径！保证气势！ */

/* 🚩 重新部署出处与红色虚线样式 */
.quote-meta {
    text-align: right; 
    padding-top: 20px;
padding-bottom: 15px;
    margin-left: auto;
    margin-right: 40px; 
}

/* 🚀 战术降级：外层包裹器只保留对齐能力 */
.quote-source {
    display: inline-block;
    vertical-align: middle; /* 强制与左侧的红色虚线处于绝对水平中心线 */
}

/* 🚀 终极合体装甲：将颜色、形状、悬停动画全部赋予超链接本体！ */
.source-link {
    font-weight: bold;
    color: #A80000;
    font-size: 20px;
    text-decoration: none;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    line-height: 1;
    padding: 10px 20px 10px 20px;
    border-radius: 50px;

    cursor: pointer;

    transition:
        background-color 0.3s ease,
        color 0.3s ease;
}

.source-link:hover {
    color: #FFFFFF;
    background-color: #CC0000;
}

.source-link:active {
    color: #FFFFFF;
    background-color: #CC0000;
}

.quote-dash {
    display: inline-block;
    width: 60px;
    border-top: 2px dashed #CC0000;
    vertical-align: middle;
    margin-right: 12px;
}



@media (max-width: 900px) {
    .quote-text { font-size: 36px; }
    .quote-text.medium { font-size: 32px; } 
    .quote-text.long { font-size: 28px; }   
    .quote-text.super-long { font-size: 24px; } /* 🚀 移动端同步放大 */
    .quote-stage { height: 420px; }
    .quote-meta { margin-right: 20px; }
}
@media (max-width: 600px) {
    .quote-text { font-size: 28px; letter-spacing: 1px; }
    .quote-text.medium { font-size: 24px; } 
    .quote-text.long { font-size: 22px; }   
    .quote-text.super-long { font-size: 20px; } /* 🚀 极小屏幕同步放大 */
}
        /* 底部控制按钮 */
        .quote-controls {
    text-align: center;
    margin-top: 50px;
    margin-bottom: 60px;
}
       .btn-arrow {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background-color: #FFFFFF; /* 常态：白底 */
            color: #CC0000;            /* 常态：红字 */
            border: 2px solid #CC0000; /* 红框锚定 */
            width: 64px;       
            height: 64px;      
            border-radius: 50%; 
            /* 🚀 火力升级：字号从 38px 强行拔高到 48px，极其醒目！ */
            font-size: 48px;   
            font-weight: bold;
            cursor: pointer;
        transform: scale(1) translateZ(0);
            will-change: transform;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: none; 
            
            /* 🚀 准星重新校准：字号变大后，必须增加下压参数，防止图标上浮 */
            padding: 0;             
            line-height: 0;         
            padding-bottom: 8px;  /* 战术下压：从 6px 增加到 8px，抵消大字号的上浮力 */
            padding-left: 4px;    /* 保持水平视觉中心点 */
        }
        
        /* 🌟 悬停时的爆发状态 (爆发：红底、白字) */
        .btn-arrow:hover {
            background-color: #CC0000; 
            color: #FFFFFF;            
          transform: scale(1.15) translateY(-3px) translateZ(0);
            box-shadow: none; 
        }
      .btn-arrow:active {
            /* 强制覆盖 hover 的放大效果，瞬间收缩到 0.95 倍，模拟真实的机械按键下压感！ */
           transform: scale(0.95) translateZ(0);
        }

       
        .btn-red:disabled {
            background-color: #CCCCCC;
            cursor: not-allowed;
            transform: none;
        }

        .back-nav { text-align: center; margin: 50px 0 30px; }

        /* 页脚 */
        footer {
            background-color: #CC0000;
            text-align: center;
            padding: 40px 20px;
            color: white;
        }
        footer h3 {
            font-size: 26px;
            color: #FFFFFF;
            letter-spacing: 4px;
        }

/* === 交互元素禁止选中：电脑端 + 手机端 === */
.logo,
.logo *,
.nav-links a,
.book-link,
.book-link *,
.book-star,
.book-star *,
.source-link,
.source-link *,
.btn-arrow,
.btn-arrow *,
.hero-divider,
.hero-divider *,
footer h3 {
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;

    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;

    -webkit-user-drag: none;
}

/* 防止拖选时出现蓝底高亮 */
.logo::selection,
.logo *::selection,
.nav-links a::selection,
.book-link::selection,
.book-link *::selection,
.book-star::selection,
.book-star *::selection,
.source-link::selection,
.source-link *::selection,
.btn-arrow::selection,
.btn-arrow *::selection,
.hero-divider::selection,
.hero-divider *::selection,
footer h3::selection {
    background: transparent;
}



@media (max-width: 768px) {
    header {
        padding: 15px 20px;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        gap: 10px;

        transform-origin: center center;

    .nav-links {

.nav-links a {

}

    .hero h1 {

.hero {

        );
}

.hero-divider {
    bottom: 20px;
    gap: 12px;
    font-size: 30px;
}

.hero-divider::before,
.hero-divider::after {
    height: 3px;
}

/* === 手机端：放大并上移毛主席背景 SVG === */
.quote-section::before {
    background-size: min(145vw, 600px) auto;
    background-position: center -160px;
}

    footer h3 {
        font-size: 20px;
    }

    /* === 手机端：下一条按钮取消 hover 残留，点击后自动回白底红箭头 === */
    .btn-arrow:hover {
        background-color: #FFFFFF;
        color: #CC0000;
        border-color: #CC0000;
        transform: scale(1) translateZ(0);
    }

    .btn-arrow:focus,
    .btn-arrow:focus-visible {
        outline: none;
        box-shadow: none;
    }

    .btn-arrow:focus:not(:active):not(.is-tapping),
    .btn-arrow:focus-visible:not(:active):not(.is-tapping) {
        background-color: #FFFFFF;
        color: #CC0000;
        border-color: #CC0000;
        transform: scale(1) translateZ(0);
    }

    .btn-arrow:active,
    .btn-arrow.is-tapping {
        background-color: #CC0000;
        color: #FFFFFF;
        border-color: #CC0000;
        transform: scale(0.95) translateZ(0);
    }
}
    </style>
</head>

        // ======== 状态 ========
let shownIndexes = [];
let currentIdx = -1;
let transitionLock = null;

// ======== 核心函数 ========
function pickRandomUnshown() {
    const remaining = QUOTES
        .map((_, i) => i)
        .filter(i => !shownIndexes.includes(i) && i !== currentIdx);
    if (remaining.length === 0) return -1;
    return remaining[Math.floor(Math.random() * remaining.length)];
}

// ======== 核心函数 ========
function renderQuote(quote) {
    const textElement = document.getElementById('quoteText');
    textElement.innerText = quote.text;
    const href = quote.link || "#";
const target = quote.link ? ' target="_blank"' : '';
document.getElementById('quoteSource').innerHTML = `<a href="${href}"${target} class="source-link">${quote.source}</a>`;

    // 🚀 新增雷达侦测逻辑：根据字符数量自动切换火力（字号）
    textElement.classList.remove('medium', 'long', 'super-long'); 
    
    if (quote.text.length >= 82) {
        // 🚀 最高警报：超过 82 个字的极长句，启动 26px 微型口径！
        textElement.classList.add('super-long'); 
    } else if (quote.text.length >= 42) {
        // 超过 42 个字，启动 34px 小口径
        textElement.classList.add('long'); 
    } else if (quote.text.length >= 25) {
        // 25 到 39 个字，启动 42px 中口径
        textElement.classList.add('medium'); 
    }
    // 25个字以下的短句（比如“星星之火，可以燎原”），什么都不加，默认使用最震撼的 52px 大口径
}

function nextQuote() {
    if (transitionLock) return; // 只在淡出+切换的 0.4s 内锁定
    
    const idx = pickRandomUnshown();
    if (idx === -1) {
        shownIndexes = currentIdx === -1 ? [] : [currentIdx];
        return nextQuote();
    }

    const display = document.getElementById('quoteDisplay');
    
    // 第1步：立即启动淡出（可能打断了上一条正在进行的淡入，
    //        CSS transition 会自动从当前 opacity 平滑过渡）
    display.classList.remove('visible');
    
    // 第2步：0.4s 后换内容+启动淡入+立刻解锁
    transitionLock = setTimeout(() => {
        currentIdx = idx;
        shownIndexes.push(idx);
        renderQuote(QUOTES[idx]);
        
        // 强制一次同步 layout，让新内容立即落位
        void display.offsetHeight;
        
        requestAnimationFrame(() => {
            display.classList.add('visible');
            transitionLock = null; // 🚀 关键：淡入刚启动就解锁，允许下一次点击打断淡入
        });
    }, 400);
}

// ======== 初始化 ========
(function init() {
    const idx = Math.floor(Math.random() * QUOTES.length);
    currentIdx = idx;
    shownIndexes.push(idx);
    renderQuote(QUOTES[idx]);
    // 延迟一小会儿再淡入，让 DOM 就位
    requestAnimationFrame(() => {
        document.getElementById('quoteDisplay').classList.add('visible');
    });
})();
// === 手机端：下一条按钮点击反馈，防止 hover 残留 ===
(function fixMobileArrowTap() {
    const button = document.getElementById("moreBtn");

    if (!button) return;

    function isMobile() {
        return window.matchMedia("(max-width: 768px)").matches;
    }

    function pressButton() {
        if (!isMobile()) return;

        button.classList.add("is-tapping");
    }

    function releaseButton() {
        if (!isMobile()) return;

        setTimeout(() => {
            button.classList.remove("is-tapping");
            button.blur();
        }, 160);
    }

    button.addEventListener("pointerdown", pressButton);
    button.addEventListener("pointerup", releaseButton);
    button.addEventListener("pointercancel", releaseButton);
    button.addEventListener("pointerleave", releaseButton);
})();
