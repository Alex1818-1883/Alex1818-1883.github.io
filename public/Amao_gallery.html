        body {

  .logo {

.hero {

main {

        /* === 胶囊分类按钮引擎 === */
        .category-buttons {
            --slider-x: -4px; --slider-y: -4px; --slider-width: 0px; --slider-height: 0px;
            position: relative; display: grid; grid-template-columns: repeat(5, 1fr);
            width: min(880px, 100%); margin: 0 auto 52px; padding: 5px;
            border: 2px solid #CC0000; border-radius: 999px; background-color: #FFFFFF;
        }
        .category-buttons::before {
            content: ""; position: absolute; left: 0; top: 0; width: var(--slider-width); height: var(--slider-height);
            background-color: #CC0000; border-radius: 999px; opacity: 0;
            transform: translate3d(var(--slider-x), var(--slider-y), 0); transition: transform 0.26s ease, opacity 0.18s ease; z-index: 0;
        }


        .category-buttons.no-slider-transition::before { transition: none !important; }
        .category-buttons.has-active::before { opacity: 1; }

.category-btn {
            position: relative; z-index: 1; height: 46px; border: none; border-radius: 999px; background-color: transparent;
            color: #CC0000; font-family: inherit; font-size: 17px; font-weight: 900; letter-spacing: 1px; cursor: pointer;
            transition: color 0.22s ease; user-select: none;
            /* 🚀 核心战术：划定独立的渲染层，防止背景遮挡文字 */
            isolation: isolate; 
        }

        /* 🚀 新增装甲：隐形的浅粉色胶囊背景 */
        .category-btn::before {
            content: "";
            position: absolute;
            top: -5px; bottom: -5px; left: -5px; right: -5px;
            border-radius: 999px;
            background-color: rgba(204, 0, 0, 0.08); 
            opacity: 0;
            pointer-events: none;
            z-index: -1; 
            transition: opacity 0.22s ease;
        }

        .category-btn:hover::before { opacity: 1; }

        .category-btn.active::before,
        .category-btn.active:hover::before { opacity: 0; }

        .category-btn:hover { color: #FF0000; }
        .category-btn.active, .category-btn.active:hover { color: #FFFFFF; }

.category-intro {
    width: min(882px, 100%);
    margin: 0 auto 62px;
    padding: 20px 30px 20px 34px;

    background-color: #FFF7F7;

    border: none;
    border-left: 7px solid #CC0000;
    border-radius: 18px;

    color: #A80000;
    font-size: 16px;
    font-weight: 800;
    line-height: 1.9;
    text-align: justify;
}

        /* === 聚焦放映室：单卡片与箭头系统 === */
        .single-view-container {
            position: relative;
            width: 100%;
            max-width: 900px; /* 控制单张卡片的最大宽度，更加聚焦 */
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

.category-buttons {
    opacity: 0;
    animation: galleryRiseIn 0.85s ease-out 0.28s forwards;
}

.category-intro {
    opacity: 0;
    animation: galleryRiseIn 0.85s ease-out 0.42s forwards;
}

.single-view-container {
    opacity: 0;
    animation: galleryRiseIn 0.85s ease-out 0.56s forwards;
}

.carousel-arrow {
    position: absolute; 
    top: 50%; 
    transform: translateY(-50%);

    width: 54px; 
    height: 54px;
            
            /* 1. 核心还原：初始绝对透明，没有白底，没有红边 */
            background-color: transparent; 
            color: #CC0000; 
            border: 2px solid transparent; 
            border-radius: 50%;
            
            font-size: 34px; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: none; 
            
            padding: 0;             
            line-height: 0;         
            padding-bottom: 4px; 
            
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                        background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, opacity 0.25s ease;
            z-index: 10;
        }

        /* 🚀 鼠标悬停：爆发出红底白字圆圈，并严格锁定 translateY(-50%) 防偏移！ */
        .carousel-arrow:hover { 
            background-color: #CC0000; 
            color: #FFFFFF;
            border-color: #CC0000;
            transform: translateY(-50%) scale(1.15) translateZ(0); 
        }

        /* 手指按压时的火力反馈 */
        .carousel-arrow:active, .carousel-arrow.is-tapping { 
            background-color: #A80000; 
            color: #FFFFFF;
            border-color: #A80000;
            transform: translateY(-50%) scale(0.95) translateZ(0); 
        }
        
        .carousel-arrow.hidden { 
            opacity: 0; 
            pointer-events: none; 
            transform: translateY(-50%) scale(0.6) translateZ(0); 
        }
        
        .arrow-prev { left: -110px; padding-right: 2px; padding-left: 0; }
        .arrow-next { right: -110px; padding-left: 2px; padding-right: 0; }

.photo-card {
    width: 100%;
    position: relative;

    background-color: #FFFFFF;
    border: 2px solid #FFE1E1;
    border-radius: 16px;

    overflow: hidden;
    display: flex;
    flex-direction: column;

    cursor: pointer;

    transition: border-color 0.28s ease, box-shadow 0.28s ease;

animation: cardFadeIn 0.85s ease forwards;
}

@keyframes cardFadeIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: none;
    }
}


.photo-card:hover {
    border-color: rgba(204, 0, 0, 0.72);
    box-shadow: 0 10px 22px rgba(204, 0, 0, 0.055);
}


.photo-img-wrapper {
    width: 100%;
    height: 420px;

    position: relative;
    z-index: 1;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
    line-height: 0;

    background-color: #F1F1F1;
    border-bottom: none;
}

/* 横图：继续铺满卡片 */
.photo-img-wrapper.is-cover .photo-bg {
    display: none;
}

.photo-img-wrapper.is-cover .photo-main {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
 object-position: var(--photo-position, center center);

    transform: scale(1);
    transform-origin: center center;

    transition: transform 0.42s ease;

    will-change: transform;
    backface-visibility: hidden;
}

.photo-card:hover .photo-img-wrapper.is-cover .photo-main {
    transform: scale(1.03);
}

/* 竖图：模糊背景铺满，正图完整显示 */
.photo-img-wrapper.is-contain .photo-bg {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center center;

    filter: blur(22px) brightness(0.82);
    transform: scale(1.16);

    opacity: 0.82;
    z-index: 0;

    pointer-events: none;
}

.photo-img-wrapper.is-contain::after {
    content: "";
    position: absolute;
    inset: 0;

    background-color: rgba(0, 0, 0, 0.16);

    z-index: 1;
    pointer-events: none;
}

.photo-img-wrapper.is-contain .photo-main {
    position: relative;
    z-index: 2;

    display: block;

width: 100%;
height: 100%;

max-width: none;
max-height: none;

    object-fit: contain;
    object-position: center center;

    transform: scale(1);
    transform-origin: center center;

    transition: transform 0.42s ease;

    will-change: transform;
    backface-visibility: hidden;
}

.photo-card:hover .photo-img-wrapper.is-contain .photo-main {
    transform: scale(1.03);
}

        .photo-meta { padding: 30px 36px; display: flex; flex-direction: column; position: relative; z-index: 1; }
.photo-title-line {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 12px;

    margin-bottom: 18px;

    color: #CC0000;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 1px;

}

.photo-year,
.photo-desc {
    color: inherit;
    font-size: inherit;
    font-weight: inherit;
    line-height: inherit;
}

.photo-action-area {
    position: relative;
}

.photo-quote {
    color: #A80000;
    font-size: 16px;
    font-weight: 800;
    line-height: 1.7;

    font-style: normal;
    border-left: none;
    padding-left: 0;

    transition: opacity 0.26s ease, transform 0.26s ease;
}

.photo-video-btn {
    appearance: none;
    -webkit-appearance: none;

    position: absolute;
    left: 50%;
    top: 66%;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 10px 32px;

    border: none;
    border-radius: 30px;

    background-color: #CC0000;
    color: #FFFFFF;

    font-family: inherit;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 1px;

    cursor: pointer;

    opacity: 0;
    pointer-events: none;

    transform: translate(-50%, -50%) scale(0.96);
    transition:
        opacity 0.26s ease,
        transform 0.26s ease,
        background-color 0.26s ease;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}

.photo-card.has-video:hover .photo-quote {
    opacity: 0;
    transform: translateY(8px);
}

.photo-card.has-video:hover .photo-video-btn {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
}

.photo-video-btn:hover {
    background-color: #A80000;
    transform: translate(-50%, -50%) scale(1.05);
}

.photo-video-btn:active {
    background-color: #A80000;
    transform: translate(-50%, -50%) scale(0.95);
}

/* === 全屏 Lightbox 大图预览 === */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2000;

    background-color: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(4px);

    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    transition: opacity 0.25s ease, visibility 0s linear 0.25s;
}

.modal.is-visible {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;

    transition: opacity 0.25s ease;
}

.modal.is-closing {
    opacity: 0;
    visibility: visible;
    pointer-events: none;

    transition: opacity 0.25s ease;
}

#galleryVideoModal.is-closing {
    pointer-events: auto;
}

.modal-content {
    width: 100%;
    height: 100%;

    margin: 0;
    padding: 34px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: transparent;
    border-radius: 0;

    animation: none;

}

.modal-img {

 background-color: #FFFFFF;

animation: galleryVideoModalFadeIn 0.25s ease-out forwards;

    /* === 禁止交互区域选中：电脑端 + 手机端 === */
.logo,
.logo *,
.nav-links,
.nav-links *,
.hero-portrait,
.hero-portrait *,
.category-buttons,
.category-buttons *,
.category-btn,
.category-btn *,
.carousel-arrow,
.carousel-arrow *,
.photo-card,
.photo-card *,
.photo-img-wrapper,
.photo-img-wrapper *,
.modal,

.close-btn,

footer h3 {
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;

    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;

    -webkit-user-drag: none;
}

/* 防止交互区域被拖选时出现蓝底 */
.logo::selection,
.logo *::selection,
.nav-links::selection,
.nav-links *::selection,
.hero-portrait::selection,
.hero-portrait *::selection,
.category-buttons::selection,
.category-buttons *::selection,
.category-btn::selection,
.category-btn *::selection,
.carousel-arrow::selection,
.carousel-arrow *::selection,
.photo-card::selection,
.photo-card *::selection,
.photo-img-wrapper::selection,
.photo-img-wrapper *::selection,
.modal::selection,
.modal *::selection,
.close-btn::selection,
.close-btn *::selection,
footer h3::selection {
    background: transparent;
}

/* 手机端：全页面点击时不出现蓝色/灰色高亮 */
body {
    -webkit-tap-highlight-color: transparent;
}

/* 说明框这种普通文字仍然允许选中 */
.category-intro,
.category-intro * {
    user-select: text;
    -webkit-user-select: text;
    -moz-user-select: text;
    -ms-user-select: text;

    -webkit-touch-callout: default;
}

                nextBtn.classList.add("hidden");
                return;
            }

const photo = currentPhotos[currentIndex];
const fitClass = photo.fit === "contain" ? "is-contain" : "is-cover";
const photoPosition = photo.objectPosition || "center center";
const hasVideo = !!photo.videoSrc;
            
            // 每次重新渲染 HTML 会触发 CSS 的 cardFadeIn 动画，极具打击感
            container.innerHTML = `
          <div class="photo-card ${hasVideo ? "has-video" : ""}" onclick="openModal()">
            <div class="photo-img-wrapper ${fitClass}" style="--photo-position: ${photoPosition};">
    ${
        photo.imgSrc 
        ? `
     <img class="photo-bg" src="${photo.imgSrc}" alt="" aria-hidden="true" draggable="false">
<img class="photo-main" src="${photo.imgSrc}" alt="${photo.year} ${photo.desc}" draggable="false">
          `
        : `<span style="display:flex;height:100%;align-items:center;justify-content:center;color:#CCC;">[影像载入中]</span>`
    }
</div>
          <div class="photo-meta">
    <div class="photo-title-line">
        <span class="photo-year">${photo.year}</span>
        <span class="photo-desc">${photo.desc}</span>
    </div>

<div class="photo-action-area">
    <div class="photo-quote">${photo.quote}</div>

    ${
        hasVideo
            ? `<button type="button" class="photo-video-btn" onclick="openGalleryVideo(event)">观看视频</button>`
            : ""
    }
</div>
</div>
                </div>
            `;

            // 更新箭头状态（到达尽头自动隐藏）
            prevBtn.classList.toggle("hidden", currentIndex <= 0);
            nextBtn.classList.toggle("hidden", currentIndex >= currentPhotos.length - 1);
        }

        // 滑动图片逻辑
        function slidePhoto(direction) {
            const newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < currentPhotos.length) {
                currentIndex = newIndex;
                renderSinglePhoto();
            }
        }

function filterPhotos(category) {
    document.getElementById("categoryIntro").innerText = CATEGORY_INFO[category] || CATEGORY_INFO["early"];

    if (category === "revolution") {
        currentPhotos = PHOTOS_DATA.filter(p => p.category === "agrarian" || p.category === "war");
    } else {
        currentPhotos = PHOTOS_DATA.filter(p => p.category === category);
    }

    currentIndex = 0;
    renderSinglePhoto();
}

        // 胶囊引擎滑块计算 (列宁全集同款)
        function moveCategorySlider(button) {
            const group = document.getElementById("categoryButtons");
            const isMobile = window.matchMedia("(max-width: 768px)").matches;
            const extraWidth = isMobile ? 12 : 18;
            const extraHeight = isMobile ? 12 : 18;

            const x = button.offsetLeft - extraWidth / 2;
            const y = button.offsetTop - extraHeight / 2;
            const width = button.offsetWidth + extraWidth;
            const height = button.offsetHeight + extraHeight;

            group.style.setProperty("--slider-x", `${x}px`);
            group.style.setProperty("--slider-y", `${y}px`);
            group.style.setProperty("--slider-width", `${width}px`);
            group.style.setProperty("--slider-height", `${height}px`);
        }

        // 初始化分类系统
        function initCategories() {
            const group = document.getElementById("categoryButtons");
            const buttons = document.querySelectorAll(".category-btn");
            const activeButton = document.querySelector(".category-btn.active");
            
            group.classList.add("no-slider-transition", "has-active");
            moveCategorySlider(activeButton);
            group.offsetHeight; 

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    group.classList.remove("no-slider-transition");
                });
            });

            buttons.forEach(button => {
                button.addEventListener("click", function () {
                    buttons.forEach(btn => btn.classList.remove("active"));
                    this.classList.add("active");
                    group.classList.add("has-active");
                    moveCategorySlider(this);
                    filterPhotos(this.dataset.category);
                });
            });

            window.addEventListener("resize", () => {
                const current = document.querySelector(".category-btn.active");
                if (current) moveCategorySlider(current);
            });
        }

        // 手机端箭头按压防黏连 (Media 同款)
        document.querySelectorAll('.carousel-arrow').forEach(button => {
            function isMobile() { return window.matchMedia('(max-width: 768px)').matches; }
            button.addEventListener('pointerdown', () => { if(isMobile()) button.classList.add('is-tapping'); });
            button.addEventListener('pointerup', () => { if(isMobile()) setTimeout(() => button.classList.remove('is-tapping'), 160); });
            button.addEventListener('pointercancel', () => { if(isMobile()) button.classList.remove('is-tapping'); });
        });

   const modal = document.getElementById('photoModal');
const modalTitle = document.getElementById('modalTitle');
const modalImg = document.getElementById('modalImg');
let closeTimer = null;
const galleryVideoModal = document.getElementById('galleryVideoModal');
const galleryVideoPlayer = document.getElementById('galleryVideoPlayer');
const galleryVideoHeading = document.querySelector('#galleryVideoModal .gallery-video-heading');
let galleryVideoCloseTimer = null;

        function openModal() {
            const data = currentPhotos[currentIndex];
            modalTitle.innerText = data.year + " - " + data.desc;
            modalImg.src = data.imgSrc || ""; 
            modalImg.alt = data.year;
     
            
            clearTimeout(closeTimer);
            modal.style.display = "block";
            modal.classList.remove('is-closing');
            void modal.offsetWidth; 
            modal.classList.add('is-visible');
        }

      function toggleModal(show) {
    if (!show) {
        clearTimeout(closeTimer);
        modal.classList.remove('is-visible');
        modal.classList.add('is-closing');

        closeTimer = setTimeout(() => {
            modal.style.display = "none";
            modal.classList.remove('is-closing');
        }, 250);
    }
}

function openGalleryVideo(event) {
    if (event) {
        event.stopPropagation();
    }

    const data = currentPhotos[currentIndex];

    if (!data.videoSrc) {
        return;
    }

    galleryVideoHeading.innerText = data.videoTitle || "继承毛主席的遗志，把无产阶级革命事业进行到底！";

    clearTimeout(galleryVideoCloseTimer);

    galleryVideoModal.style.display = "block";
    galleryVideoModal.classList.remove('is-closing');

    if (galleryVideoPlayer.getAttribute("src") !== data.videoSrc) {
        galleryVideoPlayer.src = data.videoSrc;
        galleryVideoPlayer.load();
    }

    galleryVideoPlayer.currentTime = 0;

    void galleryVideoModal.offsetWidth;

    galleryVideoModal.classList.add('is-visible');

    requestAnimationFrame(() => {
        galleryVideoPlayer.play().catch(() => {});
    });
}

function toggleGalleryVideoModal(show) {
    if (show) {
        openGalleryVideo();
        return;
    }

    clearTimeout(galleryVideoCloseTimer);

    galleryVideoPlayer.pause();
    galleryVideoPlayer.currentTime = 0;

    galleryVideoModal.classList.remove('is-visible');
    galleryVideoModal.classList.add('is-closing');

    galleryVideoCloseTimer = setTimeout(() => {
        galleryVideoModal.style.display = "none";
        galleryVideoModal.classList.remove('is-closing');
    }, 250);
}

window.onclick = function(event) {
    if (
        event.target === modal ||
        (
            event.target.classList.contains("modal-content") &&
            event.target.closest("#photoModal")
        )
    ) {
        toggleModal(false);
    }

    if (event.target === galleryVideoModal) {
        toggleGalleryVideoModal(false);
    }
};

window.addEventListener("keydown", function(event) {
    if (event.key === "Escape" && modal.classList.contains("is-visible")) {
        toggleModal(false);
    }

    if (event.key === "Escape" && galleryVideoModal.classList.contains("is-visible")) {
        toggleGalleryVideoModal(false);
    }
});

        // 启动系统
filterPhotos("early");
        initCategories();
    </script>
</body>
</html>
