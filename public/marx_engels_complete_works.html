<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>马克思恩格斯全集 - 马列毛经典文库</title>
<link rel="icon" href="red.ico" type="image/x-icon">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", "Helvetica Neue", sans-serif;
            background-color: #F9F9F9;
            color: #A80000;
            line-height: 1.6;
            font-size: 18px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        header {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #CC0000;
            text-decoration: none;
            letter-spacing: 1px;
            display: flex;
            align-items: center;

            transform: scale(1) translateZ(0);
            will-change: transform;
            backface-visibility: hidden;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: left center;
        }

        .logo .star {
            display: inline-block;
            margin-right: 8px;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.1) translateZ(0);
        }

        .logo:hover .star {
            transform: scale(1.3) rotate(36deg) translateZ(0);
            color: #FFD700;
        }

        .logo:active {
            transform: scale(0.95) translateZ(0);
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-placeholder::after {
            content: "返回文库";
            display: inline-block;
            visibility: hidden;
            pointer-events: none;

            color: #CC0000;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;

            padding: 8px 22px;
            border: 2px solid #CC0000;
            border-radius: 30px;
        }

        /* === 首屏标题区 === */
        .hero {
            min-height: 58vh;
            padding: 130px 24px 64px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
            position: relative;
            background-color: #FFFFFF;
            overflow: visible;
        }

        .hero-inner {
            width: min(980px, 100%);
            position: relative;
            z-index: 1;
        }

        .hero h1 {
            color: #DD0000;
            font-size: 4.3rem;
            font-weight: 900;
            line-height: 1.25;
            letter-spacing: 3.5px;
            margin-bottom: 22px;
        }

        .hero-lead {
            width: min(860px, 100%);
            margin: 0 auto;

            color: #A80000;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            line-height: 1.8;

            text-align: center;
        }

        .hero-divider {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;

            height: 4px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;

            color: #CC0000;
            font-size: 48px;
            font-weight: 900;
            line-height: 1;

            overflow: visible;

            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .hero-divider::before,
        .hero-divider::after {
            content: "";
            display: block;
            flex: 1;

            height: 4px;
            background-color: #CC0000;
            border-radius: 999px;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 1240px;
            margin: 0 auto;
            padding: 54px 36px 90px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 14px;
        }

        .category-section .section-title {
            margin-bottom: 44px;
        }

        .section-title h2 {
            color: #CC0000;
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .intro-box {
            width: min(900px, 100%);
            margin: 0 auto 44px;
            padding: 24px 32px;

            background-color: #FFF7F7;
            border-left: 7px solid #CC0000;
            border-radius: 18px;

            color: #A80000;
            font-size: 17px;
            font-weight: 800;
            line-height: 2;
            text-align: justify;
        }

        .intro-box p + p {
            margin-top: 10px;
        }

        /* === 分类按钮 === */
        .category-section {
            margin-top: 0;
        }

        .category-buttons {
            --slider-x: -4px;
            --slider-y: -4px;
            --slider-width: 0px;
            --slider-height: 0px;

            position: relative;

            display: grid;
            grid-template-columns: repeat(6, 1fr);

            width: min(960px, 100%);
            margin: 0 auto 52px;

            padding: 5px;

            border: 2px solid #CC0000;
            border-radius: 999px;

            background-color: #FFFFFF;

            overflow: visible;
        }

        .category-buttons::before {
            content: "";
            position: absolute;

            left: 0;
            top: 0;

            width: var(--slider-width);
            height: var(--slider-height);

            background-color: #CC0000;
            border-radius: 999px;

            opacity: 0;

            transform: translate3d(var(--slider-x), var(--slider-y), 0);
            will-change: transform, opacity;

            transition:
                transform 0.26s ease,
                opacity 0.18s ease;

            z-index: 0;
        }

        .category-buttons.no-slider-transition::before {
            transition: none !important;
        }

        .category-buttons.no-slider-transition .category-btn {
            transition: none !important;
        }

        .category-buttons.has-active::before {
            opacity: 1;
        }

        .category-btn {
            appearance: none;
            -webkit-appearance: none;

            position: relative;
            z-index: 1;

            height: 46px;

            border: none;
            border-radius: 999px;
            background-color: transparent;
            color: #CC0000;

            font-family: inherit;
            font-size: 17px;
            font-weight: 900;
            letter-spacing: 1px;

            cursor: pointer;

            overflow: visible;
            isolation: isolate;

            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;

            transition:
                color 0.22s ease,
                background-color 0.22s ease;
        }

        .category-btn::before {
            content: "";
            position: absolute;

            top: -5px;
            bottom: -5px;
            left: -5px;
            right: -5px;

            border-radius: 999px;
            background-color: rgba(204, 0, 0, 0.10);

            opacity: 0;
            pointer-events: none;
            z-index: -1;

            transition: opacity 0.22s ease;
        }

        .category-btn:hover::before {
            opacity: 1;
        }

        .category-btn.active::before,
        .category-btn.active:hover::before {
            opacity: 0;
        }

        .category-btn:hover {
            background-color: transparent;
            color: #FF0000;
        }

        .category-btn.active {
            color: #FFFFFF;
            background-color: transparent;
        }

        .category-btn.active:hover {
            color: #FFFFFF;
            background-color: transparent;
        }

        .category-intro {
            width: min(920px, 100%);
            margin: 0 auto 52px;
            padding: 18px 26px;

            border-top: 2px dashed rgba(204, 0, 0, 0.35);
            border-bottom: 2px dashed rgba(204, 0, 0, 0.35);

            text-align: left;
            color: #A80000;
            font-weight: 800;
            line-height: 1.9;
            font-size: 16px;
        }

        /* === 卷册目录 === */
        .volume-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 18px;
            margin-top: 0;
        }

        .volume-link {
            position: relative;
            min-height: 104px;
            padding: 18px 16px;

            display: flex;
            flex-direction: column;
            justify-content: center;

            background-color: #FFFFFF;
            border: 2px solid #FFE1E1;
            border-radius: 16px;
            text-decoration: none;
            overflow: hidden;

            transform: none;
            will-change: auto;
            backface-visibility: visible;

            transition:
                border-color 0.28s ease,
                background-color 0.28s ease;
        }

        .volume-link::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(204, 0, 0, 0.08), rgba(255, 255, 255, 0));
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.28s ease;
        }

        .volume-link:hover {
            border-color: #CC0000;
            background-color: #FFF8F8;
            transform: none;
        }

        .volume-link:hover::before {
            opacity: 1;
        }

        .volume-no {
            position: relative;
            z-index: 1;
            color: #CC0000;
            font-size: 21px;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .volume-meta {
            position: relative;
            z-index: 1;
            color: #A80000;
            font-size: 14px;
            font-weight: 800;
            opacity: 0.78;
        }

        .volume-link.is-hidden {
            display: none;
        }




        footer {
            background-color: #CC0000;
            text-align: center;
            padding: 40px 20px;
            color: #FFFFFF;
        }

        footer h3 {
            font-size: 26px;
            color: #FFFFFF;
            letter-spacing: 4px;
        }

        /* === 只禁止交互区域选中：电脑端 + 手机端 === */
.logo,
.logo *,
.category-buttons,
.category-buttons *,
.category-btn,
.category-btn *,
.volume-link,
.volume-link *,
footer h3 {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;

            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;

            -webkit-user-drag: none;
        }

        .logo::selection,
        .logo *::selection,
        .category-buttons::selection,
        .category-buttons *::selection,
        .category-btn::selection,
        .category-btn *::selection,
        .volume-link::selection,
        .volume-link *::selection,
        footer h3::selection {
            background: transparent;
        }

        body {
            -webkit-tap-highlight-color: transparent;
        }

        .hero h1,
        .hero-lead,
        .section-title,
        .section-title *,
        .intro-box,
        .intro-box *,
        .category-intro,
        .category-intro * {
            user-select: text;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;

            -webkit-touch-callout: default;
        }

        @media (max-width: 900px) {
            .category-buttons {
                grid-template-columns: repeat(3, 1fr);
                border-radius: 28px;
            }
        }

        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
                flex-direction: column;
                justify-content: flex-start;
                align-items: center;
                gap: 10px;
            }

            .logo {
                font-size: 22px;
                letter-spacing: 1px;
                transform-origin: center center;
            }

            .nav-links {
                display: flex;
                justify-content: center;
                width: 100%;
            }

            .nav-placeholder::after {
                font-size: 16px;
                padding: 6px 22px;
            }

            .hero {
                min-height: 56vh;
                padding: 126px 18px 54px;
            }

            .hero h1 {
                font-size: 2.0rem;
                letter-spacing: 1px;
            }

            .hero-lead {
                font-size: 17px;
                line-height: 1.8;
                letter-spacing: 1px;
            }

            main {
                padding: 42px 16px 70px;
            }

            .section-title h2 {
                font-size: 28px;
                letter-spacing: 2px;
            }

            .category-section .section-title {
                margin-bottom: 40px;
            }

            .intro-box {
                padding: 20px 22px 20px 26px;
                border-left-width: 6px;
                border-radius: 16px;
                font-size: 16px;
                line-height: 1.9;
                margin-bottom: 40px;
            }

            .category-buttons {
                grid-template-columns: repeat(2, 1fr);
                border-radius: 24px;
                padding: 4px;
                margin-bottom: 40px;
            }

            .category-btn {
                height: 42px;
                font-size: 15px;
                letter-spacing: 0;
            }

            .category-btn::before {
                top: -5px;
                bottom: -5px;
                left: -5px;
                right: -5px;
            }

            .category-intro {
                padding: 16px 18px;
                font-size: 15px;
                line-height: 1.85;
                margin-bottom: 40px;
            }

            .volume-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .volume-link {
                min-height: 92px;
                padding: 15px 12px;
                border-radius: 14px;
            }

            .volume-no {
                font-size: 18px;
            }

            .volume-meta {
                font-size: 13px;
            }



            footer h3 {
                font-size: 20px;
                letter-spacing: 2px;
            }
        }

        @media (max-width: 380px) {
            .volume-grid {
                grid-template-columns: 1fr;
            }

            .category-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header>
        <a href="index.html" class="logo"><span class="star">★</span> 马列毛主义万岁！</a>

        <div class="nav-links nav-placeholder" aria-hidden="true"></div>
    </header>

    <section class="hero">
        <div class="hero-inner">
            <h1>《马克思恩格斯全集》</h1>
            <p class="hero-lead">科学社会主义与无产阶级革命理论的根本文献宝库</p>
        </div>

        <div class="hero-divider" aria-hidden="true">★</div>
    </section>

    <main>
        <section class="intro-section">
            <div class="intro-box">
                <p>《马克思恩格斯全集》系统收录马克思、恩格斯的著作、手稿、书信、笔记与相关文献，集中呈现马克思主义在哲学、政治经济学、科学社会主义、阶级斗争、国家理论和国际工人运动中的形成与发展。</p>
                <p>阅读全集，不是把马克思主义看作静止的结论，而是把握它在现实阶级斗争、资本主义批判和无产阶级解放实践中不断展开的理论过程。</p>
            </div>
        </section>

        <section id="volumes" class="category-section">
            <div class="section-title">
                <h2>卷册分类</h2>
            </div>

            <div class="category-buttons" id="categoryButtons">
                <button class="category-btn active" type="button" data-category="all">全部卷册</button>
                <button class="category-btn" type="button" data-category="early">早期著作</button>
                <button class="category-btn" type="button" data-category="revolution">革命斗争</button>
                <button class="category-btn" type="button" data-category="capital">资本批判</button>
                <button class="category-btn" type="button" data-category="international">国际运动</button>
                <button class="category-btn" type="button" data-category="late">晚年通信</button>
            </div>

            <div class="category-intro" id="categoryIntro">
                收录马克思、恩格斯从青年时期到晚年通信的大量著作、手稿、书信和笔记，共五十卷，展现马克思主义理论从形成、发展到深化的完整思想历程。
            </div>

            <div id="volumeGrid" class="volume-grid"></div>
        </section>
    </main>

    <footer>
        <h3>全世界无产者，联合起来！</h3>
    </footer>

    <script>
        const TOTAL_VOLUMES = 50;
        const BOOK_FOLDER = "books";

        /*
            默认普通卷文件名：
            books/马克思恩格斯全集 第四十九卷.pdf

            特殊分册文件名：
            books/马克思恩格斯全集 第一卷（上）.pdf
            books/马克思恩格斯全集 第一卷（下）.pdf
            books/马克思恩格斯全集 第二十六卷（一）.pdf
            ...
        */

        const SPLIT_VOLUMES = {
            1: ["上", "下"],
            14: ["上", "下"],
            25: ["上", "下"],
            26: ["一", "二", "三"],
            28: ["上", "下"],
            30: ["上", "下"],
            31: ["上", "下"],
            39: ["上", "下"],
            46: ["上", "下"]
        };

        const CATEGORY_INFO = {
            all: {
                intro: "收录马克思、恩格斯从青年时期到晚年通信的大量著作、手稿、书信和笔记，共五十卷，展现马克思主义理论从形成、发展到深化的完整思想历程。"
            },
            early: {
                intro: "第一至八卷，集中体现马克思、恩格斯早期思想形成过程，包括对青年黑格尔派、费尔巴哈、政治经济学和空想社会主义的批判。"
            },
            revolution: {
                intro: "第九至十八卷，围绕1848年欧洲革命、阶级斗争、国家问题和国际工人运动早期实践展开，是理解革命策略和历史唯物主义运用的重要部分。"
            },
            capital: {
                intro: "第十九至二十九卷，集中呈现政治经济学批判和资本主义生产关系分析，是理解剩余价值、资本积累、危机和现代资产阶级社会结构的核心部分。"
            },
            international: {
                intro: "第三十至三十九卷，涵盖国际工人协会的组织斗争、巴黎公社失败后的政治低潮与理论反思、欧洲工人运动的曲折发展，以及马克思恩格斯对各国革命形势的持续分析与战略研判。"
            },
            late: {
                intro: "第四十至五十卷，以晚年著作、通信、理论补充和对工人运动的策略指导为主，展现马克思主义在新的历史条件下的发展和展开。"
            }
        };

        function toChineseNumber(n) {
            const units = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九"];

            if (n === 10) return "十";
            if (n < 10) return units[n];

            if (n < 20) {
                return "十" + units[n % 10];
            }

            const ten = Math.floor(n / 10);
            const one = n % 10;

            if (one === 0) {
                return units[ten] + "十";
            }

            return units[ten] + "十" + units[one];
        }

        function getCategoryForVolume(n) {
            if (n >= 1 && n <= 8) return "early";
            if (n >= 9 && n <= 18) return "revolution";
            if (n >= 19 && n <= 29) return "capital";
            if (n >= 30 && n <= 39) return "international";
            return "late";
        }

        function buildNormalFilePath(n) {
            return `${BOOK_FOLDER}/马克思恩格斯全集 第${toChineseNumber(n)}卷.pdf`;
        }

        function buildPartFilePath(n, part) {
            return `${BOOK_FOLDER}/马克思恩格斯全集 第${toChineseNumber(n)}卷（${part}）.pdf`;
        }

function renderVolumes() {
    const grid = document.getElementById("volumeGrid");
    let html = "";

    for (let i = 1; i <= TOTAL_VOLUMES; i++) {
        const category = getCategoryForVolume(i);
        const parts = SPLIT_VOLUMES[i];

        if (parts) {
            parts.forEach(part => {
    const label = `第${toChineseNumber(i)}卷·${part}`;

                html += `
                    <a href="${buildPartFilePath(i, part)}" target="_blank" class="volume-link" data-category="${category}">
                        <span class="volume-no">${label}</span>
                        <span class="volume-meta">PDF</span>
                    </a>
                `;
            });
        } else {
            const label = `第${toChineseNumber(i)}卷`;

            html += `
                <a href="${buildNormalFilePath(i)}" target="_blank" class="volume-link" data-category="${category}">
                    <span class="volume-no">${label}</span>
                    <span class="volume-meta">PDF</span>
                </a>
            `;
        }
    }

    grid.innerHTML = html;
}

        function moveCategorySlider(button) {
            const group = document.getElementById("categoryButtons");
            const isMobile = window.matchMedia("(max-width: 768px)").matches;

            const extraWidth = isMobile ? 12 : 18;
            const extraHeight = isMobile ? 12 : 18;

            const x = button.offsetLeft - extraWidth / 2;
            const y = button.offsetTop - extraHeight / 2;

            const width = button.offsetWidth + extraWidth;
            const height = button.offsetHeight + extraHeight;

            group.style.setProperty("--slider-x", `${x}px`);
            group.style.setProperty("--slider-y", `${y}px`);
            group.style.setProperty("--slider-width", `${width}px`);
            group.style.setProperty("--slider-height", `${height}px`);
        }

        function filterVolumes(category) {
            const cards = document.querySelectorAll(".volume-link");
            const info = CATEGORY_INFO[category];

            document.getElementById("categoryIntro").innerText = info.intro;

            cards.forEach(card => {
                const cardCategory = card.dataset.category;
                const shouldShow = category === "all" || cardCategory === category;

                card.classList.toggle("is-hidden", !shouldShow);
            });
        }

     function initCategories() {
    const group = document.getElementById("categoryButtons");
    const buttons = document.querySelectorAll(".category-btn");

    const activeButton = document.querySelector(".category-btn.active");
    group.classList.add("no-slider-transition");
    group.classList.add("has-active");
    moveCategorySlider(activeButton);

    group.offsetHeight;

    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            group.classList.remove("no-slider-transition");
        });
    });

    buttons.forEach(button => {
        button.addEventListener("click", function () {
            buttons.forEach(btn => btn.classList.remove("active"));
            this.classList.add("active");

            group.classList.add("has-active");
            moveCategorySlider(this);
            filterVolumes(this.dataset.category);

        });
    });

    window.addEventListener("resize", () => {
        const current = document.querySelector(".category-btn.active");

        if (current) {
            moveCategorySlider(current);
        }
    });
}



renderVolumes();
initCategories();
    </script>
</body>
</html>
