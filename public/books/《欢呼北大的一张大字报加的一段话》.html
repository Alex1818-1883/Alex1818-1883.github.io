<p class="title1">在修改《欢呼北大的一张大字报》一文时加的一段话</p>
<p class="date">（一九六六年八月五日）</p>
<br>
<br>
　　危害革命的错误领导，不应当无条件接受，而应当坚决抵制。在这次文化大革命中，广大革命师生及革命干部对于错误的领导，就广泛地进行过抵制。<br>
<br>
