<!DOCTYPE html>

<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛主席诗词集</title>
    <link rel="icon" href="red.ico" type="image/x-icon">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
        scrollbar-gutter: stable;
        overflow-y: scroll;
    }

    body {
        font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", "Helvetica Neue", sans-serif;
        background-color: #F9F9F9;
        color: #A80000;
        line-height: 1.6;
        font-size: 18px;

        min-height: 100vh;
        display: flex;
        flex-direction: column;

        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
    }

    header {
        position: absolute;
        top: 0;
        left: 0;

        width: 100%;
        padding: 20px 40px;

        display: flex;
        justify-content: space-between;
        align-items: center;

        z-index: 100;
    }

    .logo {
        font-size: 26px;
        font-weight: 900;
        color: #CC0000;
        text-decoration: none;
        letter-spacing: 1px;

        display: flex;
        align-items: center;

        transform: scale(1) translateZ(0);
        will-change: transform;
        backface-visibility: hidden;
        transform-origin: left center;

        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .logo .star {
        display: inline-block;
        margin-right: 8px;

        transition:
            transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275),
            color 0.3s ease;
    }

    .logo:hover {
        transform: scale(1.15) translateZ(0);
    }

    .logo:hover .star {
        transform: scale(1.4) rotate(36deg) translateZ(0);
        color: #FFD700;
    }


    .nav-links {
        display: flex;
        gap: 15px;
    }

    .nav-links a {
        display: inline-block;

        color: #CC0000;
        text-decoration: none;
        font-size: 18px;
        font-weight: bold;

        padding: 8px 22px;

        border: 2px solid #CC0000;
        border-radius: 30px;

        transform: scale(1) translateZ(0);
        will-change: transform;
        backface-visibility: hidden;

        transition:
            transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275),
            background-color 0.3s ease,
            color 0.3s ease;
    }

    .nav-links a:hover {
        color: #FFFFFF;
        background-color: #CC0000;
        transform: scale(1.1) translateY(-3px) translateZ(0);
    }

    .nav-links a:active {
        transform: scale(0.95) translateZ(0);
    }

    /* === 首屏 === */
.hero {
    min-height: 420px;
    padding: 96px 20px 58px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    background:
        linear-gradient(
            to bottom,
            #FFFFFF 0,
            #FFFFFF calc(100% - 42px),
            #F9F9F9 calc(100% - 42px),
            #F9F9F9 100%
        );

    position: relative;
    overflow: hidden;
}



.hero h1 {
    color: #DD0000;
    font-size: 3.4rem;
    font-weight: 900;
    letter-spacing: 3px;
    margin-bottom: 18px;

    position: relative;
    z-index: 1;
}

.hero-title {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    gap: 10px;

    line-height: 1.1;
    min-height: 64px;
}

.mao-signature {
    display: inline-block;

    width: 178px;
    height: auto;

    flex: 0 0 auto;

    transform: translateY(3px);

    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
}

.hero p {
    color: #A80000;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 1px;
    line-height: 1.8;

    position: relative;
    z-index: 1;
}

.hero-divider {
    position: absolute;

    left: 50%;
    bottom: 24px;

    width: 100vw;
    margin-left: -50vw;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;

    color: #CC0000;
    font-size: 36px;
    line-height: 1;

    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;

    z-index: 2;
}

.hero-divider::before,
.hero-divider::after {
    content: "";
    display: block;

    flex: 1;
    height: 3px;

    background-color: #CC0000;
    border-radius: 999px;
}

.content-container {
    flex: 1;

    width: 100%;
    max-width: 1200px;

    margin: 14px auto 0;
    padding: 0 20px 64px;
}

/* === 胶囊分类按钮引擎：和 gallery 页面完全一样 === */
.poem-category-section {
    text-align: center;

    width: min(900px, 100%);
    margin: 0 auto 54px;
}

.poem-category-section h2 {
    color: #CC0000;
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 3px;
    margin-bottom: 36px;
}

.poem-index-trigger {
    appearance: none;
    -webkit-appearance: none;

    display: inline-block;

    border: none;
    border-radius: 999px;
    background-color: transparent;

    color: #CC0000;

    font-family: inherit;
    font-size: inherit;
    font-weight: inherit;
    letter-spacing: inherit;

    padding: 8px 50px;

    cursor: pointer;

    transition:
        background-color 0.25s ease,
        color 0.25s ease;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}

.poem-index-trigger:hover,
.poem-index-trigger:active {
    color: #FFFFFF;
    background-color: #CC0000;
}

.poem-index-trigger:focus,
.poem-index-trigger:focus-visible {
    outline: none;
}

.poem-index-modal {
    position: fixed;
    inset: 0;

    z-index: 3000;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 24px;

    background-color: rgba(0, 0, 0, 0.48);
    backdrop-filter: blur(5px);

    opacity: 1;
    visibility: visible;
    pointer-events: auto;

    transition:
        opacity 0.25s ease,
        visibility 0.25s ease;
}

.poem-index-modal.is-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.poem-index-panel {
    position: relative;

    width: min(760px, 100%);
    max-height: 82vh;

    background-color: #FFFFFF;

    border: none;
    border-left: 7px solid #CC0000;
    border-radius: 22px;

    overflow: hidden;

    display: flex;
    flex-direction: column;

    box-shadow: 0 18px 42px rgba(0, 0, 0, 0.12);
}

.poem-index-header {
    flex: 0 0 auto;

    position: relative;
    z-index: 2;

    padding: 32px 54px 0 42px;

    background-color: #FFFFFF;
}

.poem-index-title {
    color: #CC0000;

    font-size: 30px;
    font-weight: 900;
    letter-spacing: 3px;

    text-align: center;

    margin: 0 0 12px;
}

.poem-index-line {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 14px;
    width: 100%;

margin: 0 0 12px;
}

.poem-index-line span {
    flex: 1;
    height: 3px;

    background-color: #CC0000;
    border-radius: 999px;
}

.poem-index-line strong {
    flex: 0 0 auto;

    color: #CC0000;
    background-color: #FFFFFF;

    font-size: 30px;
    font-weight: 900;
    line-height: 1;

    padding: 0 8px;
}

.poem-index-close {
    appearance: none;
    -webkit-appearance: none;

    position: absolute;
    top: 22px;
    right: 24px;

    width: 34px;
    height: 34px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 0;
    padding-bottom: 2px;

    border: none;
    border-radius: 50%;

    background-color: transparent;
    color: #CC0000;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 30px;
    font-weight: 900;
    line-height: 1;

    cursor: pointer;

    outline: none;
    box-shadow: none;

    transition:
        background-color 0.2s ease,
        color 0.2s ease;
}

.poem-index-close:hover,
.poem-index-close:active {
    background-color: #CC0000;
    color: #FFFFFF;
}

.poem-index-close:focus,
.poem-index-close:focus-visible {
    outline: none;
    box-shadow: none;
}

.poem-index-scroll {
    flex: 1 1 auto;
    min-height: 0;

    overflow-y: auto;

    margin-right: 12px;
 padding: 12px 32px 34px 42px;

    scrollbar-gutter: stable;
}

.poem-index-group {
    margin-bottom: 28px;
}

.poem-index-group:last-child {
    margin-bottom: 0;
}

.poem-index-group-title {
     color: #CC0000;

    font-size: 20px;
    font-weight: 900;
    letter-spacing: 2px;

    margin-bottom: 14px;
    padding-bottom: 10px;

    border-bottom: 2px dashed #FFCCCC;

    text-align: left;
}

.poem-index-items {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 10px;

    margin-left: -16px;
}

.poem-index-item {
    appearance: none;
    -webkit-appearance: none;

    display: inline-block;

    border: none;
    border-radius: 999px;
    background-color: transparent;

    color: #A80000;

    font-family: inherit;
    font-size: 16px;
    font-weight: 800;
    line-height: 1.5;

    padding: 7px 16px;

    cursor: pointer;

    transition:
        background-color 0.22s ease,
        color 0.22s ease;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}

.poem-index-item:hover,
.poem-index-item:active {
    color: #FFFFFF;
    background-color: #CC0000;
}

.poem-index-item.is-current {
    color: #FFFFFF;
    background-color: #CC0000;
}

.poem-index-trigger,
.poem-index-trigger *,
.poem-index-close,
.poem-index-close *,
.poem-index-title,
.poem-index-title *,
.poem-index-line,
.poem-index-line *,
.poem-index-group-title,
.poem-index-group-title *,
.poem-index-item,
.poem-index-item * {
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-user-drag: none;
}

.poem-index-trigger::selection,
.poem-index-trigger *::selection,
.poem-index-close::selection,
.poem-index-close *::selection,
.poem-index-title::selection,
.poem-index-title *::selection,
.poem-index-line::selection,
.poem-index-line *::selection,
.poem-index-group-title::selection,
.poem-index-group-title *::selection,
.poem-index-item::selection,
.poem-index-item *::selection {
    background: transparent;
}



.category-buttons {
    --slider-x: -4px;
    --slider-y: -4px;
    --slider-width: 0px;
    --slider-height: 0px;

    position: relative;
    display: grid;
    grid-template-columns: repeat(5, 1fr);

    width: min(880px, 100%);
    margin: 0 auto 52px;
    padding: 5px;

    border: 2px solid #CC0000;
    border-radius: 999px;
    background-color: #FFFFFF;
}

.poem-category-intro {
    width: min(882px, 100%);
    margin: 0 auto 24px;
    padding: 20px 30px 20px 34px;

    background-color: #FFF7F7;

    border: none;
    border-left: 7px solid #CC0000;
    border-radius: 18px;

    color: #A80000;
    font-size: 16px;
    font-weight: 800;
    line-height: 1.9;
    text-align: justify;
}

.category-buttons::before {
    content: "";
    position: absolute;

    left: 0;
    top: 0;

    width: var(--slider-width);
    height: var(--slider-height);

    background-color: #CC0000;
    border-radius: 999px;

    opacity: 0;

    transform: translate3d(var(--slider-x), var(--slider-y), 0);

    transition:
        transform 0.26s ease,
        opacity 0.18s ease;

    z-index: 0;
}

.category-buttons.no-slider-transition::before {
    transition: none !important;
}

.category-buttons.has-active::before {
    opacity: 1;
}

.category-btn {
    position: relative;
    z-index: 1;

    height: 46px;

    border: none;
    border-radius: 999px;
    background-color: transparent;

    color: #CC0000;

    font-family: inherit;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 1px;

    cursor: pointer;

    transition: color 0.22s ease;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;

    isolation: isolate;
}

.category-btn::before {
    content: "";
    position: absolute;

    top: -5px;
    bottom: -5px;
    left: -5px;
    right: -5px;

    border-radius: 999px;
    background-color: rgba(204, 0, 0, 0.08);

    opacity: 0;
    pointer-events: none;

    z-index: -1;

    transition: opacity 0.22s ease;
}

.category-btn:hover::before {
    opacity: 1;
}

.category-btn.active::before,
.category-btn.active:hover::before {
    opacity: 0;
}

.category-btn:hover {
    color: #FF0000;
}

.category-btn.active,
.category-btn.active:hover {
    color: #FFFFFF;
}

 
.poem-stage {
    min-height: 0;

    display: flex;
    align-items: flex-start;
    justify-content: center;

    padding: 0 20px 24px;

    position: relative;
    overflow: visible;
}

.poem-view-container {
    position: relative;

    width: 100%;
    max-width: 960px;

    margin: 0 auto;

    display: flex;
    align-items: flex-start;
    justify-content: center;
}

    .poem-display {
        max-width: 960px;
        width: 100%;

        text-align: center;

        opacity: 0;
        transform: translateY(30px);

        transition:
            opacity 0.4s ease,
            transform 0.4s ease;
    }

    .poem-display.visible {
        opacity: 1;
        transform: none;
    }



.poem-title {
       color: #CC0000;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1.25;

    margin-bottom: 26px;
}

.poem-arrow {
    position: absolute;
    top: 24px;
    transform: translateY(-50%);

    width: 54px;
    height: 54px;

    background-color: transparent;
    color: #CC0000;
    border: 2px solid transparent;
    border-radius: 50%;

    font-size: 34px;
    font-weight: bold;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow: none;

    padding: 0;
    line-height: 0;
    padding-bottom: 4px;

    z-index: 10;

    transition:
        transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275),
        background-color 0.3s ease,
        color 0.3s ease,
        border-color 0.3s ease,
        opacity 0.25s ease;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}


.poem-prev {
    left: calc(50% - 450px);
    padding-right: 2px;
    padding-left: 0;
}

.poem-next {
    right: calc(50% - 450px);
    padding-left: 2px;
    padding-right: 0;
}

.poem-arrow:hover {
    background-color: #CC0000;
    color: #FFFFFF;
    border-color: #CC0000;

    transform: translateY(-50%) scale(1.15) translateZ(0);
}

.poem-arrow:active,
.poem-arrow.is-tapping {
    background-color: #A80000;
    color: #FFFFFF;
    border-color: #A80000;

    transform: translateY(-50%) scale(0.95) translateZ(0);
}

.poem-text {
    display: inline-block;

    max-width: min(856px, 100%);

    text-align: left;

    color: #CC0000;

    font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 28px;
    font-weight: 900;
    line-height: 1.9;
    letter-spacing: 0px;

    margin-bottom: 0;

    white-space: normal;
    overflow-wrap: anywhere;
    word-break: normal;
}

.poem-text p {
    max-width: 100%;
    margin-bottom: 2px;

    white-space: normal;
    overflow-wrap: anywhere;
    word-break: normal;
}

.poem-text p.poem-stanza-gap {
    height: 20px;
    margin-bottom: 0;
}

.poem-extra {
    width: min(860px, 100%);

    margin: 52px auto 0;

    color: #333333;
    text-align: left;
}


.poem-extra-section {
    margin-bottom: 34px;
}

.poem-extra-section:last-child {
    margin-bottom: 0;
}

.poem-extra-title {
    color: #CC0000;

    font-size: 21px;
    font-weight: 900;
    letter-spacing: 1px;

    margin-bottom: 16px;
}

.poem-background-text,
.poem-translation-text {
    color: #222222;

    font-size: 16px;
    font-weight: 500;
    line-height: 2.05;
    text-align: justify;

    margin: 0;
}

.poem-background-text + .poem-background-text,
.poem-translation-text + .poem-translation-text {
    margin-top: 14px;
}

.poem-notes {
    display: flex;
    flex-direction: column;

}

.poem-note-item {
    color: #222222;

    font-size: 16px;
    line-height: 2.05;
    text-align: justify;
}

.poem-note-term {
    color: #CC0000;
    font-weight: 900;
}

.poem-text.large {
    font-size: 30px;
}

.poem-text.small {
    font-size: 26px;
}

.poem-text.mini {
    font-size: 24px;
}

.poem-text.extramini {
    font-size: 22px;
}


    footer {
        background-color: #CC0000;
        text-align: center;
        padding: 40px 20px;
        color: #FFFFFF;
    }

    footer h3 {
        font-size: 26px;
        color: #FFFFFF;
        letter-spacing: 4px;
    }

    /* === 禁止选中：电脑端 + 手机端 === */
    .logo,
    .logo *,
    .nav-links a,
    .poem-category-section h2,
.hero-divider,
.hero-divider *,
.category-buttons,
.category-buttons *,
.category-btn,
.category-btn *,
.poem-arrow,
.poem-arrow *,
    footer h3 {
        user-select: none;

        -moz-user-select: none;
        -ms-user-select: none;

        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;

        -webkit-user-drag: none;
    }

    .logo::selection,
    .logo *::selection,
    .nav-links a::selection,
    .poem-category-section h2::selection,
.hero-divider::selection,
.hero-divider *::selection,
.category-buttons::selection,
.category-buttons *::selection,
.category-btn::selection,
.category-btn *::selection,
.poem-arrow::selection,
.poem-arrow *::selection,
    footer h3::selection {
        background: transparent;
    }

.poem-category-intro,
.poem-category-intro * {
    user-select: text;
    -webkit-user-select: text;
    -moz-user-select: text;
    -ms-user-select: text;

    -webkit-touch-callout: default;
}

    "身染疟疾，缺乏科学的医治，并且在上杭县苏家坡养病期间差一点儿被捕；红四军第八次代表大会召开，他被担架抬到上杭县城继续养病，却没有恢复前委书记的职务。当时，毛泽东在上杭县城的临江楼上养病，重阳佳节来到，院子里的黄花如散金般盛开。重阳，一个秋高气爽、登高壮观天地间的日子，一个把酒临风、月下赏菊、遍插茱萸怀念先人的节日，毛泽东的梦想和现实再一次发生了位移，因而作了此词。"

    let currentList = [];
    let currentPosition = 0;
    let transitionLock = null;

const categoryButtons = document.getElementById("categoryButtons");
const poemDisplay = document.getElementById("poemDisplay");

const poemExtra = document.getElementById("poemExtra");
const poemCategoryIntro = document.getElementById("poemCategoryIntro");
const poemIndexModal = document.getElementById("poemIndexModal");
const poemIndexList = document.getElementById("poemIndexList");

const CATEGORY_INTROS = {
    early: "青年时代与大革命前后的诗词。从“问苍茫大地，谁主沉浮”的浩叹到“霹雳一声暴动”，展现早年的革命抱负、深沉的历史意识和改造旧世界的壮阔胸襟。",

    socialist: "新中国成立后的诗词。“萧瑟秋风今又是，换了人间”，展现社会主义建设、人民改造山河的壮志豪情与新时代历史气象中自强不息、改天换地的豪迈精神。"
};


function getPrimaryCategory(poem) {
    return Array.isArray(poem.category) ? poem.category[0] : poem.category;
}

function poemBelongsToCategory(poem, category) {
    return Array.isArray(poem.category)
        ? poem.category.includes(category)
        : poem.category === category;
}

function renderPoemIndexModal() {
    if (!poemIndexList) return;

    const categoryOrder = ["early", "jinggang", "longmarch", "reply", "socialist"];

    poemIndexList.innerHTML = categoryOrder.map(category => {
        const poemsInCategory = POEMS
            .map((poem, index) => ({ poem, index }))
            .filter(item => poemBelongsToCategory(item.poem, category));

        if (poemsInCategory.length === 0) return "";

        return `
            <section class="poem-index-group">
                <h3 class="poem-index-group-title">${getCategoryName(category)}</h3>

                <div class="poem-index-items">
                    ${poemsInCategory.map(item => {
                        const isCurrent = currentList[currentPosition] === item.index;

                        return `
                            <button
                                class="poem-index-item${isCurrent ? " is-current" : ""}"
                                type="button"
                                onclick="jumpToPoem(${item.index})"
                            >
                                ${item.poem.title}
                            </button>
                        `;
                    }).join("")}
                </div>
            </section>
        `;
    }).join("");
}

function openPoemIndexModal() {
    if (!poemIndexModal) return;

    renderPoemIndexModal();

    poemIndexModal.classList.remove("is-hidden");
}

function closePoemIndexModal() {
    if (!poemIndexModal) return;

    poemIndexModal.classList.add("is-hidden");
}

function closePoemIndexModalByOverlay(event) {
    if (event.target === poemIndexModal) {
        closePoemIndexModal();
    }
}

function jumpToPoem(index) {
    const poem = POEMS[index];

    if (!poem) return;

    const category = getPrimaryCategory(poem);

    closePoemIndexModal();

    setTimeout(() => {
        activeCategory = category;

        document.querySelectorAll(".category-btn").forEach(button => {
            button.classList.toggle("active", button.dataset.category === category);
        });

        updateSlider();
        updateCategoryIntro();

        switchPoemWithFade(() => {
            buildCurrentList();

            const position = currentList.indexOf(index);
            currentPosition = position >= 0 ? position : 0;

            showCurrentPoem();
        });
    }, 250);
}

function getCategoryName(category) {
    const names = {
        early: "恰同学少年",
        jinggang: "星火燎原",
        longmarch: "雄关漫道",
        reply: "人间正道",
        socialist: "换了人间"
    };

    return names[category] || "恰同学少年";
}

function updateCategoryIntro() {
    if (!poemCategoryIntro) return;

    poemCategoryIntro.innerText = CATEGORY_INTROS[activeCategory] || CATEGORY_INTROS.early;
}

function buildCurrentList() {
    currentList = POEMS
        .map((poem, index) => ({ poem, index }))
        .filter(item => {
            const category = item.poem.category;

            return Array.isArray(category)
                ? category.includes(activeCategory)
                : category === activeCategory;
        })
        .map(item => item.index);

    currentPosition = 0;
}

function setPoemTextSize(poem) {
    poemText.classList.remove("large", "small", "mini", "extramini");

    if (poem.textSize) {
        poemText.classList.add(poem.textSize);
    }
}

function renderPoemByIndex(index) {
    const poem = POEMS[index];

    poemTitle.innerText = poem.title;

    poemText.innerHTML = poem.lines.map(line => {
        if (line === "") {
            return `<p class="poem-stanza-gap" aria-hidden="true"></p>`;
        }

        return `<p>${line}</p>`;
    }).join("");

    renderPoemExtra(poem);

    setPoemTextSize(poem);
}

function renderPoemExtra(poem) {
    if (!poemExtra) return;

    const buildParagraphs = content => {
        return Array.isArray(content)
            ? content.filter(paragraph => paragraph && paragraph.trim() !== "")
            : content && content.trim() !== ""
                ? [content]
                : [];
    };

    const backgroundParagraphs = buildParagraphs(poem.background);
    const translationParagraphs = buildParagraphs(poem.translation);

    const hasBackground = backgroundParagraphs.length > 0;
    const hasTranslation = translationParagraphs.length > 0;
    const hasNotes = Array.isArray(poem.notes) && poem.notes.length > 0;

    if (!hasBackground && !hasTranslation && !hasNotes) {
        poemExtra.innerHTML = "";
        poemExtra.style.display = "none";
        return;
    }

    poemExtra.style.display = "block";

    let html = "";

    if (hasBackground) {
        html += `
            <section class="poem-extra-section">
                <h3 class="poem-extra-title">创作背景</h3>
                ${backgroundParagraphs.map(paragraph => {
                    return `<p class="poem-background-text">${paragraph}</p>`;
                }).join("")}
            </section>
        `;
    }

    if (hasTranslation) {
        html += `
            <section class="poem-extra-section">
                <h3 class="poem-extra-title">白话译文</h3>
                ${translationParagraphs.map(paragraph => {
                    return `<p class="poem-translation-text">${paragraph}</p>`;
                }).join("")}
            </section>
        `;
    }

    if (hasNotes) {
        html += `
            <section class="poem-extra-section">
                <h3 class="poem-extra-title">内容注释</h3>
                <div class="poem-notes">
                    ${poem.notes.map(note => {
                        return `
                            <p class="poem-note-item">
                                <span class="poem-note-term">${note.term}：</span>${note.text}
                            </p>
                        `;
                    }).join("")}
                </div>
            </section>
        `;
    }

    poemExtra.innerHTML = html;
}

    function showCurrentPoem() {
        if (currentList.length === 0) return;

        const index = currentList[currentPosition];
        renderPoemByIndex(index);
    }

    function switchPoemWithFade(callback) {
        if (transitionLock) return;

        poemDisplay.classList.remove("visible");

        transitionLock = setTimeout(() => {
            callback();

            void poemDisplay.offsetHeight;

            requestAnimationFrame(() => {
                poemDisplay.classList.add("visible");
                transitionLock = null;
            });
        }, 400);
    }

function slidePoem(direction) {
    if (currentList.length === 0) return;

    switchPoemWithFade(() => {
        currentPosition = (currentPosition + direction + currentList.length) % currentList.length;
        showCurrentPoem();
    });
}

function prevPoem() {
    slidePoem(-1);
}

function nextPoem() {
    slidePoem(1);
}

function switchCategory(category) {
    if (activeCategory === category) return;

    activeCategory = category;

    document.querySelectorAll(".category-btn").forEach(button => {
        button.classList.toggle("active", button.dataset.category === category);
    });

    updateSlider();
    updateCategoryIntro();

    switchPoemWithFade(() => {
        buildCurrentList();
        showCurrentPoem();
    });
}

function updateSlider() {
    const activeButton = document.querySelector(".category-btn.active");

    if (!activeButton || !categoryButtons) return;

    const isMobile = window.matchMedia("(max-width: 768px)").matches;
    const extraWidth = isMobile ? 12 : 18;
    const extraHeight = isMobile ? 12 : 18;

    const x = activeButton.offsetLeft - extraWidth / 2;
    const y = activeButton.offsetTop - extraHeight / 2;
    const width = activeButton.offsetWidth + extraWidth;
    const height = activeButton.offsetHeight + extraHeight;

    categoryButtons.style.setProperty("--slider-x", `${x}px`);
    categoryButtons.style.setProperty("--slider-y", `${y}px`);
    categoryButtons.style.setProperty("--slider-width", `${width}px`);
    categoryButtons.style.setProperty("--slider-height", `${height}px`);

    categoryButtons.classList.add("has-active");
}

function initCategoryButtons() {
    document.querySelectorAll(".category-btn").forEach(button => {
        button.addEventListener("click", function () {
            switchCategory(this.dataset.category);
        });
    });
}

function initFirstPoem() {
    buildCurrentList();
    updateCategoryIntro();
    showCurrentPoem();

    requestAnimationFrame(() => {
        poemDisplay.classList.add("visible");
    });
}

function initSliderPosition() {
    categoryButtons.classList.add("no-slider-transition", "has-active");
    updateSlider();

    categoryButtons.offsetHeight;

    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            categoryButtons.classList.remove("no-slider-transition");
        });
    });
}

function fixMobileArrowTap() {
    const buttons = document.querySelectorAll(".poem-arrow");

    if (!buttons.length) return;

    function isMobile() {
        return window.matchMedia("(max-width: 768px)").matches;
    }

    buttons.forEach(button => {
        function pressButton() {
            if (!isMobile()) return;

            button.classList.add("is-tapping");
        }

        function releaseButton() {
            if (!isMobile()) return;

            setTimeout(() => {
                button.classList.remove("is-tapping");
                button.blur();
            }, 160);
        }

        button.addEventListener("pointerdown", pressButton);
        button.addEventListener("pointerup", releaseButton);
        button.addEventListener("pointercancel", releaseButton);
        button.addEventListener("pointerleave", releaseButton);
    });
}

    window.addEventListener("resize", () => {
        updateSlider();
    });

    window.addEventListener("load", () => {
        initSliderPosition();
    });

document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
        closePoemIndexModal();
    }
});

    initCategoryButtons();
    initFirstPoem();
    initSliderPosition();
    fixMobileArrowTap();
</script>

</body>
</html>
