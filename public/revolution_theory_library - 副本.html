        body {

            font-size: 18px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;

        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;

            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background-color: transparent;
            z-index: 100;

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #CC0000;
            text-decoration: none;
            letter-spacing: 1px;

            display: flex;
            align-items: center;

            transform: scale(1) translateZ(0);
            will-change: transform;
            backface-visibility: hidden;
            transform-origin: left center;

            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .logo .star {
            display: inline-block;
            margin-right: 8px;

            transition:
                transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                color 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.1) translateZ(0);
        }

        .logo:hover .star {
            transform: scale(1.3) rotate(36deg) translateZ(0);
            color: #FFD700;
        }

        .logo:active {
            transform: scale(0.95) translateZ(0);
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-links a {
            display: inline-block;

            color: #CC0000;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;

            padding: 8px 22px;

            border: 2px solid #CC0000;
            border-radius: 30px;

            transform: scale(1) translateZ(0);
            will-change: transform;
            backface-visibility: hidden;

            transition:
                transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                background-color 0.3s ease,
                color 0.3s ease;
        }

        .nav-links a:hover {
            color: #FFFFFF;
            background-color: #CC0000;
            transform: scale(1.1) translateY(-3px) translateZ(0);
        }

        .nav-links a:active {
            transform: scale(0.95) translateZ(0);
        }

/* === 搜索弹窗 === */
.search-modal {
    display: none;
    position: fixed;
    z-index: 2000;
    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    background-color: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(10px);

    opacity: 0;
    transition: opacity 0.3s ease;
}

.search-modal.show {
    display: block;
    opacity: 1;
}

.search-box-wrapper {
    position: absolute;
    top: 20%;
    left: 50%;

    transform: translateX(-50%);

    width: 90%;
    max-width: 650px;
}

.search-input {
    width: 100%;

    padding: 20px 30px;

    font-size: 20px;
    font-weight: bold;
    color: #CC0000;

    background-color: #FFFFFF;
    border: 2px solid #CC0000;
    border-radius: 40px;

    outline: none;
    box-shadow: none;

    transition: border-color 0.3s ease;

    font-family: inherit;
}

.search-input:focus {
    border-color: #FF0000;
    box-shadow: none;
}

.search-input::placeholder {
    color: #FFCCCC;
    font-weight: normal;
}

.search-results {
    margin-top: 15px;

    background-color: #FFFFFF;
    border: 1px solid #FFEEEE;
    border-radius: 20px;

    overflow: hidden;
    display: none;

    max-height: 50vh;
    overflow-y: auto;

    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
}

.search-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;

    padding: 18px 25px;

    text-decoration: none;
    color: #333333;

    border-bottom: 1px solid #FFF0F0;

    transition: background-color 0.2s ease;
}

.search-item:last-child {
    border-bottom: none;
}

.search-item:hover {
    background-color: #FFF5F5;
}

.search-item-title {
    font-weight: bold;
    color: #CC0000;
    font-size: 18px;
    line-height: 1.5;
}

.search-item-author {
    flex: 0 0 auto;

    font-size: 14px;
    color: #A80000;
    opacity: 0.8;

    white-space: nowrap;
}

/* === 分类目录框：哥达批判目录式 === */
.category-filter {
    width: min(820px, 100%);
    margin: 0 auto 58px;
    padding: 28px 42px 28px 46px;

    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 42px;
    row-gap: 16px;

    background-color: #FFFFFF;

    border: none;
    border-left: 7px solid #CC0000;
    border-radius: 18px;

    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.045);
    overflow: hidden;
}

.category-btn {
    appearance: none;
    -webkit-appearance: none;

    position: relative;

display: inline-block;
width: fit-content;
max-width: 100%;
justify-self: start;
    padding: 0 0 0 18px;

    border: none;
    background-color: transparent;

    color: #333333;

    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.7;
    letter-spacing: 0;

    text-align: left;
    cursor: pointer;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-drag: none;

    touch-action: manipulation;

    transition: color 0.2s ease;
}

.category-btn::before {
    content: "·";
    position: absolute;
    left: 0;
    top: 0;

    color: #CC0000;
    font-weight: 900;
}

.category-btn:hover {
    color: #CC0000;
}

.category-btn.active {
    color: #CC0000;
    font-weight: 900;
}

.category-btn.active::before {
    content: "➤";
    font-size: 14px;
    top: 2px;
}

        /* === 书籍卡片 === */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
        }

        .book-card {
            background: #FFFFFF;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);

            display: flex;
            flex-direction: column;
            overflow: hidden;

            border: 1px solid #EEEEEE;
            position: relative;
            contain: layout style paint;

            transform: translateY(0);

            transition:
                transform 0.4s ease,
                box-shadow 0.4s ease,
                border-color 0.4s ease;
        }

        .book-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(204,0,0,0.06);
            border-color: #FFCCCC;
        }

        .book-card.is-hidden {
            display: none;
        }

        @keyframes bookCardFadeUp {
            from {
                opacity: 0;
                translate: 0 18px;
            }

            to {
                opacity: 1;
                translate: 0 0;
            }
        }

        .book-card.card-enter {
            animation: bookCardFadeUp 1.1s ease-out both;
        }

        .book-cover {
            height: 180px;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
            text-align: center;

            background: linear-gradient(135deg, #A80000 0%, #CC0000 100%);
            border-left: 12px solid #730000;

            color: #FFD700;
            font-size: 31px;
            font-family: "楷体", "STKaiti", serif;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);

            overflow: hidden;
            transform: translateZ(0);
        }

        .book-cover.long-title {
            font-size: 25px;
            line-height: 1.45;
        }

        .book-info {
            padding: 30px;

            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .book-title {
            font-size: 22px;
            color: #CC0000;
            font-weight: bold;
            margin-bottom: 8px;
            margin-left: -10px;
            line-height: 1.45;
        }

        .book-title-long {
            font-size: 20px;
        }
.book-title-extra-long {

}

        .book-author {

        }


.btn-read-group {

function renderBooks() {
    const grid = document.getElementById("booksGrid");

    grid.innerHTML = BOOKS.map(book => {
        const coverClass = book.longCover ? "book-cover long-title" : "book-cover";
const titleClass = book.extraLongTitle
    ? "book-title book-title-extra-long"
    : book.longTitle
        ? "book-title book-title-long"
        : "book-title";

        const readButtons = book.parts
            ? `
                <div class="btn-read-group">
                    ${book.parts.map(part => `
                        <a href="${part.link}" target="_blank" class="btn-read-part">${part.label}</a>
                    `).join("")}
                </div>
            `
            : `<a href="${book.link}" target="_blank" class="btn-read">阅读</a>`;

        return `
            <div class="book-card" data-category="${book.category}">
                <div class="${coverClass}">${book.cover}</div>

                <div class="book-info">
                    <div class="${titleClass}">${book.title}</div>
                    <div class="book-author">${book.author}</div>
                    <div class="book-desc">${book.desc}</div>
                    ${readButtons}
                </div>
            </div>
        `;
    }).join("");
}

        function animateBookCard(card) {
            card.classList.remove("card-enter");
            card.offsetHeight;
            card.classList.add("card-enter");

            card.addEventListener("animationend", () => {
                card.classList.remove("card-enter");
            }, { once: true });
        }

        function filterBooks(category) {
            const cards = document.querySelectorAll(".book-card");

            cards.forEach(card => {
                const shouldShow = category === "all" || card.dataset.category === category;

                card.classList.toggle("is-hidden", !shouldShow);

                if (shouldShow) {
                    animateBookCard(card);
                }
            });
        }

        function initCategories() {
            const buttons = document.querySelectorAll(".category-btn");

            buttons.forEach(button => {
                button.addEventListener("click", function () {
                    buttons.forEach(btn => btn.classList.remove("active"));
                    this.classList.add("active");

                    filterBooks(this.dataset.category);
                });
            });
        }

        renderBooks();
        initCategories();

// === 搜索数据库：自动从 BOOKS 生成 ===
function buildLibraryData() {
    return BOOKS.flatMap(book => {
        if (book.parts) {
            return book.parts.map(part => ({
                title: `${book.title}·${part.label}`,
                author: book.author,
                desc: book.desc || "",
                link: part.link
            }));
        }

        return [{
            title: book.title,
            author: book.author,
            desc: book.desc || "",
            link: book.link
        }];
    });
}

const LIBRARY_DATA = buildLibraryData();

const searchModal = document.getElementById("searchModal");
const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");

function toggleSearchModal(show) {
    if (show) {
        searchModal.classList.add("show");
        searchInput.value = "";
        searchResults.style.display = "none";
        searchResults.innerHTML = "";

        setTimeout(() => {
            searchInput.focus();
        }, 100);
    } else {
        searchModal.classList.remove("show");
        searchInput.blur();
    }
}

function closeSearch(event) {
    if (event.target.id === "searchModal") {
        toggleSearchModal(false);
    }
}

searchInput.addEventListener("input", function (event) {
    const keyword = event.target.value.trim();

    if (keyword === "") {
        searchResults.style.display = "none";
        searchResults.innerHTML = "";
        return;
    }

    const keywordLower = keyword.toLowerCase();

const matches = LIBRARY_DATA.filter(book => {
    const searchableText = `${book.title} ${book.author}`.toLowerCase();
    return searchableText.includes(keywordLower);
});

    searchResults.style.display = "block";

    if (matches.length > 0) {
        searchResults.innerHTML = matches.map(book => `
            <a href="${book.link}" class="search-item" target="_blank">
                <span class="search-item-title">${book.title}</span>
                <span class="search-item-author">${book.author}</span>
            </a>
        `).join("");
    } else {
        searchResults.innerHTML = `
            <div style="padding: 25px; text-align: center; color: #A80000; font-weight: bold;">
                报告：未侦测到相关文献
            </div>
        `;
    }
});

document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
        toggleSearchModal(false);
    }
});
