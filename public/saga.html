/* === 顶部导航栏（完美对齐版） === */
header {

    top: 0;

.logo {

    letter-spacing: 1px;

    align-items: center;

.logo .star {

/* 🚀 坐标校准核心：注入 Flex 引擎，彻底歼灭 4px 的幽灵空格！ */
.nav-links {
    display: flex;
    gap: 15px;
}

.nav-links a {
    color: #CC0000;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    padding: 8px 22px;
    border: 2px solid #CC0000;
    border-radius: 30px;
    /* 🚀 删除了错误的 display: inline-block，交由外层 Flex 指挥 */
    transform: scale(1) translateZ(0);
    will-change: transform;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.nav-links a:hover {
    color: #FFFFFF;
    background-color: #CC0000;
    /* 🚀 核心同步：换上 1.1 倍放大 + 向上悬浮 3px 的主页同款引擎！ */
    transform: scale(1.1) translateY(-3px) translateZ(0);
}
.nav-links a:active {

}





/* === 🚀 核心动效：三态流体引擎 === */
/* 【状态 1：后台候场】 */
.saga-stage > * {
    opacity: 0;
    transform: translateY(20px); 
    transition: none; 
}
.saga-board.active .saga-stage > * {
    opacity: 1;
    transform: translateY(0); 
    transition: all 0.4s ease;
}

.saga-board.exiting .saga-stage > * {
    opacity: 0;
    transform: translateY(20px); 
    transition: all 0.4s ease; 
}

/* === 🚀 历史阵地：纯净阅读模式 === */
.saga-board {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center; 
    background-color: #FFFFFF; 
    position: relative;
    padding: 80px 100px 120px 40px; /* 留出底部和右侧导航空间 */
    overflow: hidden;
    contain: layout style paint;
}

/* === 🚀 伟人图腾：全屏史诗级水印背景 === */
.saga-board::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    
    background-image: url('Mao_Zedong.svg');
    background-repeat: no-repeat;
    
    background-position: center;
    background-size: min(85vw, 75vh); 
    
    opacity: 0.02; 
    
    pointer-events: none; 
    
    z-index: 0; 
}

/* 📜 史诗档案舞台：纯净居中，彻底删除左侧红线 */
.saga-stage {
    max-width: 760px; /* 🚀 文章的黄金阅读宽度 */
    width: 100%;
    margin: 0 auto;   /* 🚀 绝对水平居中 */

    z-index: 2; 
    /* 彻底移除了左边距和左边框 */
}

/* 🏛️ 年份主标题：由原来的暗淡水印蜕变而来！ */
.year-article-title {
    font-family: "Microsoft YaHei", sans-serif;

}

/* 📌 地点副标题：对标 article 的红杠修饰 */
.location-display {
    font-family: "Microsoft YaHei", sans-serif;

    font-weight: bold;
    color: #A80000;

/* 📖 正文段落：沉浸式舒适阅读 */
.narrative {
    font-size: 1.15rem; /* 极其舒适的阅读字号 */
    color: #333333;     /* 深灰护眼 */
    line-height: 2.1;

}
        
/* 🚀 史诗引言：克制而庄重，作为高潮结尾 */

.quote {
    font-size: 1.2rem; 
    font-weight: bold; 
    color: #CC0000;
    line-height: 1.8;
    letter-spacing: 2px; 
    margin-top: 40px;
    text-align: center; 
    
    /* 🚀 绝杀排雷：已彻底删除 transform 和 will-change！
       引言现在终于可以和上面的正文一样，呼吸最高清的 2D 矢量空气了！ */
}

/* === 🚀 史诗导航胶囊：由 JS 智能状态机精确指挥 === */
        .timeline-rail {
            position: absolute;
            right: 60px;
            top: 50%;
            transform: translateY(-50%) translateZ(0);
            width: 50px; 
            height: 240px; /* 初始修长状态 */
            background-color: #FFFFFF;
            border: 2px solid #CC0000;
            border-radius: 40px; 
            z-index: 100;
            box-shadow: none !important;
            overflow: visible;
            /* 核心：1.2s 弹性引擎，无论是 JS 触发还是 CSS 触发都共用此动力 */
            transition: height 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        background-color 1.2s ease;
        }

        /* 展开状态：只有当 JS 注入 .is-expanded 类时才点火拉长！ */
        .timeline-rail.is-expanded {
            height: 480px; 
            background-color: #FFF5F5;
        }

/* === 🚀 史诗导航胶囊：视窗与履带系统（终极脱钩版） === */
        .nodes-container {
            position: absolute;
            top: 50%;
            
            /* 🚀 核心防抖 1：强制开启 3D 硬件加速！
               加上 translateZ(0)，直接将容器提拔进显卡的独立图层。
               从此免受 CPU 像素取整的干扰，在弹性计算中稳如泰山！ */
            transform: translateY(-50%) translateZ(0);
            
            height: 380px; 
            left: -150px; 
            right: 0;
            overflow: hidden; 
            pointer-events: none; 
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            
            /* 🚀 提前告知渲染引擎，锁定资源 */
            will-change: transform;
        }

        /* 2. 内层履带：负责挂载红圈并上下滑动 */
        .nodes-track {
            position: absolute; 
            right: 0;
            top: 0;
            width: 50px; 
            
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px; 
            padding: 20px 0; 
            
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            
            /* 🚀 核心修复 2：实体恢复！
               外层虽然穿透了，但里面的履带和红圈必须恢复“实体”，否则红圈就点不到了。 */
            pointer-events: auto; 
        }

   /* === 🚀 史诗导航胶囊：原子级对齐引擎（最终修正版） === */
        .capsule-arrow {
            position: absolute;
            
            /* 🚀 核心修正：双向锚点锁定，强制左右边框与时间轴完全重合 */
            left: -2px;
            right: -2px;
            width: auto; /* 必须设为 auto，让它根据 left/right 自动拉伸 */

            height: 60px;
            border-radius: 40px;
            
            /* 背景裁剪黑科技：防止背景渗色加粗边框 */
            border: 2px solid #CC0000;
            background-clip: padding-box; 

            /* 硬件加速渲染：修正 0.5px 的抗锯齿渲染偏差 */
            transform: translateZ(0);
            -webkit-font-smoothing: antialiased;

            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
          
            transition: 
    transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
    background-color 0.3s ease,
    color 0.3s ease;
            z-index: 10;
        }

        /* 🏛️ 顶部按钮（回溯）：常态为“浅红底+红箭”，低调内敛 */
        .capsule-arrow:first-of-type { 
            top: -2px; 
            transform-origin: center top; 
            background-color: #FFF5F5; /* 🚀 拒绝惨白，注入淡红 */
            color: #CC0000; 
        }

        /* 🚩 底部按钮（前进）：改为与顶部一致的“浅红底+红箭”，追求极致的对称统一 */
        .capsule-arrow:last-of-type { 
            bottom: -2px; 
            transform-origin: center bottom; 
            background-color: #FFF5F5; /* 🚀 改为浅红底 */
            color: #CC0000;            /* 🚀 改为红箭 */
        }

      /* 🌟 悬停爆发：上下按钮悬停时，全部爆发出红底白箭的革命力量！ */
        .capsule-arrow:first-of-type:hover, 
        .capsule-arrow:last-of-type:hover { 
            background-color: #CC0000; /* 瞬间变为革命红底色 */
            color: #FFFFFF;            /* 内部的机械箭头瞬间反转为纯白 */
           transform: scale(1.05) translateZ(0);   /* 物理膨胀反馈 */
        }

        /* 🌟 机械按压反馈 */
        .capsule-arrow:first-of-type:active, 
        .capsule-arrow:last-of-type:active { 
           transform: scale(0.95) translateZ(0);
        }

        /* 🚀 胶囊内专属 SVG 机械箭头（保持 26px 黄金口径） */
        .capsule-arrow svg {
            width: 26px;  
            height: 26px;
            /* 确保箭头颜色的切换也伴随丝滑过渡 */
            transition: fill 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 顶部箭头翻转 180 度 */
        .capsule-arrow:first-of-type svg {
            transform: rotate(180deg) translateZ(0);
        }
        
     /* === 🚀 史诗时间轴：独立红圈系统 === */
        .timeline-node {
            width: 12px;
            height: 12px;
            background-color: #FFCCCC;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            
            /* 🚀 核心脱钩：红圈默认隐藏。只有在胶囊展开时，或作为激活态时才显示 */
            opacity: 0;
            pointer-events: none;
       transform: scale(1) translateZ(0);
        will-change: transform;
            
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
        }
        
        .timeline-rail.is-expanded .timeline-node {
            opacity: 1; 
            pointer-events: auto; 
        }
        
      .timeline-node:hover { transform: scale(1.8) translateZ(0); background-color: #CC0000; }
        
        .timeline-node:active {
           transform: scale(1.35) translateZ(0) !important;
            transition: transform 0.1s ease-out !important; 
        }
        
    .timeline-node.active { 
            background-color: #CC0000; 
           transform: scale(1.65) translateZ(0);
            
            /* 🚀 致命修复：彻底删除了 opacity: 1 !important 和 pointer-events: auto !important; 
               把显示和点击的控制权，统统交还给胶囊的展开状态 (.is-expanded)。
               这样胶囊一收缩，它就会立刻隐身，把中央位置完美让给五角星！ */
        }
        
     /* === 🚀 年份提示文字系统：终极纯净版引擎 === */
        .timeline-node::after {
            content: attr(data-year);
            position: absolute;
            right: 0; 
            top: 50%;
            /* 🚀 防抖 2：基础状态加入 translateZ(0) */
            transform: translate(-80px, -50%) translateZ(0); 
            font-size: 14px;
            font-weight: 900;
            color: #A80000;
            opacity: 0;
            white-space: nowrap;
            pointer-events: none;
            transition: transform 0.6s ease-out, opacity 0.6s ease-out;

            /* 🚀 防抖 3：锁定文字抗锯齿与背面隐藏！
               防止文字在动画期间因重新光栅化而产生边缘发虚和抖动 */
            -webkit-font-smoothing: antialiased;
            backface-visibility: hidden;
        }

        /* 🚀 专属退场锁（原地渐隐） */
        .timeline-node.active::after {
            /* 加入 translateZ(0) */
            transform: translate(-32px, -50%) translateZ(0);
            opacity: 0;
            transition: transform 0s, opacity 0.8s ease-out;
        }

        /* 🌟 胶囊展开，但在不同圆圈间移动时的“滑行退场” */
        .timeline-rail.is-expanded .timeline-node::after {
            transition: transform 0.8s ease-out, opacity 0.5s ease;
        }

        /* 🌟 鼠标悬停或激活时的“滑行进场” */
        .timeline-rail.is-expanded .timeline-node:hover::after, 
        .timeline-rail.is-expanded .timeline-node.active::after { 
            opacity: 1; 
            /* 加入 translateZ(0) */
            transform: translate(-32px, -50%) translateZ(0); 
            transition: transform 0.4s cubic-bezier(0, 0.9, 0.1, 1), opacity 0.4s ease-out;
        }

        /* 🌟 长按避让（维持完美手感） */
        .timeline-node:active::after {
            opacity: 0 !important;     
            /* 加入 translateZ(0) */
            transform: translate(-28px, -50%) translateZ(0) !important;    
            transition: transform 0.35s ease-out, opacity 0.2s ease-out !important; 
        }
        /* 移除旧的进度条样式，因为胶囊模式不需要连线进度 */
        .timeline-progress { display: none; }

/* === 🌟 史诗导航胶囊：中央红星引擎（毫秒级接力版） === */
        .timeline-center-star {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1) translateZ(0);
            width: 22px;  
            height: 22px;
            opacity: 1;
            pointer-events: none; 
            z-index: 5;
            
            /* 🚀 终极修复 1：黑夜降临（收缩退场）时的“接力等待”！
               我们在时间参数后面加上了 0.3s 的延迟 (delay)。
               这意味着：当鼠标移开，红星会先在暗处静静等待 0.3 秒，
               看着红圈彻底消散后，它才开始花 0.5 秒缓缓亮起、放大。
               绝对不再有一丝一毫的视觉重叠！ */
            transition: transform 0.6s 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s 0.3s ease;
        }

        .timeline-rail.is-expanded .timeline-center-star {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.2) translateZ(0);
            
            /* 🚀 终极修复 2：白天到来（展开进场）时的“光速让路”！
               没有延迟！鼠标一放上去，红星在 0.2s 内瞬间隐身、收缩，
               极其干脆地把中央的王座让给即将浮现的红圈阵列！ */
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease;
        }
/* === 🚀 专属图腾装甲：红卫兵书法 (实心版) === */

}

    const board = document.querySelector('.saga-board');
    const nodesContainer = document.getElementById('nodesContainer'); 
 
    
    // 🚀 【升维指挥部】：垂直时间轴与横向事件轴双重定位！
    let currentEraIndex = 0;   // 当前处于哪个年代 (如 1893)
    let currentEventIndex = 0; // 当前处于该年代的第几件事 (如 韶山=0, 湘乡=1)
    let switchTimeout; 

   // 2. 自动铸造时间轴节点 (注入履带)
    const nodesTrack = document.getElementById('nodesTrack'); 
    SAGA_DATA.forEach((data, index) => {
        const node = document.createElement('div');
        node.className = 'timeline-node';
        node.setAttribute('data-year', data.year);
        node.onclick = (e) => {
            e.stopPropagation(); 
            switchEra(index);
        };
        nodesTrack.appendChild(node); 
    });
    const nodes = document.querySelectorAll('.timeline-node');


    
    


// 🚀 上下箭头：切换年份
    window.navSaga = function(dir) {
        const nextIndex = currentEraIndex + dir;
        if (nextIndex >= 0 && nextIndex < SAGA_DATA.length) {
            switchEra(nextIndex);
        }
    };

   // 4. 🚀 全息切换核心引擎 (支持双轴坐标)
 // 4. 🚀 全息切换核心引擎 (支持双轴坐标)
   // 4. 🚀 全息切换核心引擎 (支持双轴坐标)
    function switchEra(index, isFirstLoad = false) {
        if (index === currentEraIndex && !isFirstLoad) return;

        currentEventIndex = 0;
        currentEraIndex = index;

        // 【前线部队：履带和红圈位移】
        nodes.forEach(n => n.classList.remove('active'));
        nodes[index].classList.add('active');

        const activeNode = nodes[index];
        const viewportCenter = 190; 
        const nodeCenter = activeNode.offsetTop + (activeNode.offsetHeight / 2);
        const trackTranslateY = viewportCenter - nodeCenter;
        
        document.getElementById('nodesTrack').style.transform = `translateY(${trackTranslateY}px)`;

        // 🚀 【后方部队：三态流体呼吸切换】（你刚才不小心删掉的就是这里！）
        if (isFirstLoad) {
            updateContent(index, 0);
            board.classList.add('active');
        } else {
            board.classList.remove('active');
            board.classList.add('exiting');
            
            clearTimeout(switchTimeout);
switchTimeout = setTimeout(() => {
    updateContent(index, 0);
    board.classList.remove('exiting');
    board.classList.add('active');
}, 400); // 等待淡出动画结束
        }
    } 


    function updateContent(eraIdx, eventIdx) {
        const data = SAGA_DATA[eraIdx];
        const event = data.events[eventIdx]; 
        
        // 截获 1966 年，填装红色 SVG 书法水印
        const watermark = document.getElementById('displayWatermark');
        if (data.year === 1966) {
            watermark.innerHTML = `<img src="Red_Guards_Armband_Calligraphy.svg" class="watermark-emblem" alt="红卫兵" draggable="false">`;
        } else {
            watermark.innerText = data.year;
        }

        // 🚀 填装地点
        document.getElementById('displayLoc').innerText = event.loc;
        
        // 🚀 核心改造 2：段落自动切割引擎！
        // 侦测文本里的 \n\n，自动将其切割为多个独立的 <p class="narrative"> 标签！
        const paragraphs = event.text.split('\n\n');
        const formattedHtml = paragraphs.map(p => `<p class="narrative">${p}</p>`).join('');
        document.getElementById('displayNarrative').innerHTML = formattedHtml;
    }

    // 6. 🚀 开局直接点火：一进页面直接触发 1893 年的入场动画！
    setTimeout(() => {
        switchEra(0, true);
    }, 100);



// 7. 🚀 史诗导航胶囊：智能防误触状态机（几何雷达版）
    const timelineRail = document.getElementById('timelineRail');
    if (timelineRail) {
        
        // 🚀 核心修复：把 mouseover 换成 mousemove，持续探测鼠标的绝对物理坐标！
        timelineRail.addEventListener('mousemove', function(e) {
            
            // 如果已经展开了，就不用再算了，维持展开状态即可
            if (!timelineRail.classList.contains('is-expanded')) {
                
                // 获取胶囊在屏幕上的真实物理坐标和尺寸
                const rect = timelineRail.getBoundingClientRect();
                // 计算鼠标在胶囊内部的 Y 坐标（从顶部 0 开始往下算）
                const mouseY = e.clientY - rect.top;
                
                // 🎯 划定“绝对安全触发区”：
                // 胶囊收缩时高度是 240px，上下箭头各占约 60px。
                // 只有当鼠标深入到中间 65px 到 175px 的核心地带时，才允许展开！
                // 这样你在上下箭头周围怎么滑、怎么点，哪怕碰到边框，也绝对不会误触展开！
                if (mouseY > 65 && mouseY < (rect.height - 65)) {
                    timelineRail.classList.add('is-expanded');
                }
            }
        });

        // 【安全撤退】：只有当鼠标彻底离开这台操纵杆时，才优雅收缩
        timelineRail.addEventListener('mouseleave', function() {
            timelineRail.classList.remove('is-expanded');
        });
    }
})();
