    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", "Helvetica Neue", sans-serif;
            background-color: #FDFDFD;
            color: #333333;
            line-height: 1.6;
            font-size: 18px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

::selection {
            background-color: #CC0000;
            color: #FFFFFF;           
        }
        ::-moz-selection { 
            background-color: #CC0000;
            color: #FFFFFF;
        }

        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;

            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background-color: transparent;
            z-index: 100;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #CC0000;
            text-decoration: none;
            letter-spacing: 1px;

            display: flex;
            align-items: center;

            transform: scale(1) translateZ(0);
            will-change: transform;
            backface-visibility: hidden;
            transform-origin: left center;

            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .logo .star {
            display: inline-block;
            margin-right: 8px;

            transition:
                transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                color 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.15) translateZ(0);
        }

        .logo:hover .star {
            transform: scale(1.4) rotate(36deg) translateZ(0);
            color: #FFD700;
        }


        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-links a {
            display: inline-block;

            color: #CC0000;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;

            padding: 8px 22px;

            border: 2px solid #CC0000;
            border-radius: 30px;

            transform: scale(1) translateZ(0);
            will-change: transform;
            backface-visibility: hidden;

            transition:
                transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                background-color 0.3s ease,
                color 0.3s ease;
        }

        .nav-links a:hover {
            color: #FFFFFF;
            background-color: #CC0000;
            transform: scale(1.1) translateY(-3px) translateZ(0);
        }

        .nav-links a:active {
            transform: scale(0.95) translateZ(0);
        }

/* === 搜索弹窗：白幕渐显 + 搜索框轻微下落 === */
.search-modal {
    display: none;

    position: fixed;
    z-index: 2000;
    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    background-color: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(10px);

    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    transition:
        opacity 0.25s ease,
        visibility 0s linear 0.25s;
}

.search-modal.is-visible {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;

    transition:
        opacity 0.25s ease;
}

.search-modal.is-closing {
    opacity: 0;
    visibility: visible;
    pointer-events: none;

    transition:
        opacity 0.25s ease;
}

.search-box-wrapper {
    position: absolute;
    top: 20%;
    left: 50%;

    width: 90%;
    max-width: 650px;

    opacity: 0;
    transform: translate(-50%, -14px);

    transition:
        opacity 0.28s ease,
        transform 0.28s ease;
}

.search-modal.is-visible .search-box-wrapper {
    opacity: 1;
    transform: translate(-50%, 0);
}

.search-modal.is-closing .search-box-wrapper {
    opacity: 0;
    transform: translate(-50%, -10px);
}

.search-input {
    width: 100%;

    padding: 20px 30px;

    font-size: 20px;
    font-weight: bold;
    color: #CC0000;

    background-color: #FFFFFF;
    border: 2px solid #CC0000;
    border-radius: 40px;

    outline: none;
    box-shadow: none;


    font-family: inherit;
}

.search-input:focus {
    border-color: #CC0000; 
    box-shadow: none;
}

.search-input::placeholder {
    color: #FFCCCC;
    font-weight: normal;
}

.search-results {
    margin-top: 15px;

    background-color: #FFFFFF;
    border: 1px solid #FFEEEE;
    border-radius: 20px;

    overflow: hidden;
    display: none;

    max-height: 50vh;
    overflow-y: auto;

    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
}

.search-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;

    padding: 18px 25px;

    text-decoration: none;
    color: #333333;

    border-bottom: 1px solid #FFF0F0;

    transition: background-color 0.2s ease;
}

.search-item:last-child {
    border-bottom: none;
}

.search-item:hover {
    background-color: #FFF5F5;
}

.search-item-title {
    font-weight: bold;
    color: #CC0000;
    font-size: 18px;
    line-height: 1.5;
}

.search-item-author {
    flex: 0 0 auto;

    font-size: 14px;
    color: #A80000;
    opacity: 0.8;

    white-space: nowrap;
}

        /* === 首屏标题区 === */
        .library-hero {
            min-height: 58vh;
            padding: 130px 24px 64px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
            text-align: center;
            background-color: #FFFFFF;
            overflow: visible;
        }

        .hero-inner {
            width: min(980px, 100%);
            position: relative;
            z-index: 1;
        }

        .library-hero h1 {
            color: #DD0000;
            font-size: 4.3rem;
            font-weight: 900;
            line-height: 1.25;
            letter-spacing: 3.5px;
            margin-bottom: 22px;
        }

        .hero-lead {
            width: min(860px, 100%);
            margin: 0 auto;

            color: #A80000;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            line-height: 1.8;
        }

        .hero-divider {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;

            height: 4px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;

            color: #CC0000;
            font-size: 48px;
            font-weight: 900;
            line-height: 1;

            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .hero-divider::before,
        .hero-divider::after {
            content: "";
            display: block;
            flex: 1;

            height: 4px;
            background-color: #CC0000;
            border-radius: 999px;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 58px 50px 90px;
        }

/* === 分类目录框：哥达批判目录式 === */
.category-filter {
    width: min(820px, 100%);
    margin: 0 auto 58px;
    padding: 28px 42px 28px 46px;

    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 42px;
    row-gap: 16px;

    background-color: #FFFFFF;

    border: none;
    border-left: 7px solid #CC0000;
    border-radius: 18px;

    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.045);
    overflow: hidden;
}

.category-btn {
    appearance: none;
    -webkit-appearance: none;

    position: relative;

display: inline-block;
width: fit-content;
max-width: 100%;
justify-self: start;
    padding: 0 0 0 18px;

    border: none;
    background-color: transparent;

    color: #333333;

    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.7;
    letter-spacing: 0;

    text-align: left;
    cursor: pointer;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-drag: none;

    touch-action: manipulation;

    transition: color 0.2s ease;
}

.category-btn::before {
    content: "·";
    position: absolute;
    left: 0;
    top: 0;

    color: #CC0000;
    font-weight: 900;
}

.category-btn:hover {
    color: #CC0000;
}

.category-btn.active {
    color: #CC0000;
    font-weight: 900;
}

.category-btn.active::before {
    content: "➤";
    font-size: 14px;
    top: 2px;
}

        /* === 书籍卡片 === */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
        }

.book-card {
    background: #FFFFFF;
    border-radius: 8px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.05);

    display: flex;
    flex-direction: column;
    overflow: hidden;

    border: 1px solid #EEEEEE;
    position: relative;
    contain: layout style paint;

    transition:
        box-shadow 0.35s ease,
        border-color 0.35s ease;
}

.book-card:hover {
    box-shadow: 0 12px 24px rgba(204,0,0,0.07);
    border-color: #FFCCCC;
}

        .book-card.is-hidden {
            display: none;
        }

@keyframes bookCardFadeUp {
            from {
                opacity: 0;
                transform: translateY(18px); 
            }

            to {
                opacity: 1;
                transform: none; 
            }
        }

        .book-card.card-enter {
            animation: bookCardFadeUp 0.6s ease-out both;
           pointer-events: none;
        }

        .book-cover {
            height: 180px;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
            text-align: center;

            background: linear-gradient(135deg, #A80000 0%, #CC0000 100%);
            border-left: 12px solid #730000;

            color: #FFD700;
            font-size: 31px;
            font-family: "楷体", "STKaiti", serif;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);

            overflow: hidden;
            transform: translateZ(0);
        }

        .book-cover.long-title {
            font-size: 25px;
            line-height: 1.45;
        }

        .book-info {
            padding: 30px;

            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .book-title {
            font-size: 22px;
            color: #CC0000;
            font-weight: bold;
            margin-bottom: 8px;
            margin-left: -10px;
            line-height: 1.45;
        }

        .book-title-long {
            font-size: 20px;
        }
.book-title-extra-long {
    font-size: 18px;
    line-height: 1.45;
}

.book-author {
    position: relative;

    font-size: 14px;
    color: #666666;

    margin-bottom: 24px;
    padding-bottom: 15px;

    border-bottom: 1px solid #EEEEEE;

    transition:
        color 0.35s ease,
        border-bottom-color 0.42s ease;
}

/* 悬停时出现的红线 + 红星整体 */
.author-red-divider {
    position: absolute;

    left: 0;
    right: 0;
    bottom: -8px;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;

    opacity: 0;
    pointer-events: none;

    transition:
        opacity 0.42s ease;
}

/* 左右两段红线 */
.author-red-divider span {
    flex: 1;
    height: 3px;

    background-color: #CC0000;
    border-radius: 999px;
}

/* 中间红星 */
.author-red-divider strong {
    flex: 0 0 auto;

    color: #CC0000;
    background-color: #FFFFFF;

    font-size: 20px;
    font-weight: 900;
    line-height: 1;

    padding: 0 8px;

    transform: scale(0.76);

    transition:
        transform 0.42s ease;
}

/* 鼠标悬停卡片时：作者文字略变红，灰线渐隐 */
.book-card:hover .book-author {
    color: #A80000;
    border-bottom-color: transparent;
}

/* 鼠标悬停卡片时：红线和红星一起渐显 */
.book-card:hover .author-red-divider {
    opacity: 1;
}

.book-card:hover .author-red-divider strong {
    transform: scale(1);
}

  .book-desc {
    position: relative;

    flex: 1;

    color: #555555;
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 25px;

    text-align: left;
}

/* 灰色原文：默认显示，悬停时渐隐 */
.desc-gray {
    display: block;

    color: #555555;
    font-weight: 400;

 padding-left: 0;
text-indent: 0;

    opacity: 1;

    transition:
        opacity 0.4s ease;
}

/* 红色加粗原文：默认隐藏，悬停时渐显 */
.desc-red {
    position: absolute;
    inset: 0;

    display: block;

    color: #A80000;
    font-weight: 600;

padding-left: 0;
text-indent: 0;

    box-sizing: border-box;

    opacity: 0;
    pointer-events: none;

    user-select: text;
    -webkit-user-select: text;

    transition:
        opacity 0.4s ease;
}

/* 鼠标悬停卡片时：灰色文字渐隐 */
.book-card:hover .desc-gray {
    opacity: 0;

    user-select: none;
    -webkit-user-select: none;
}

/* 鼠标悬停卡片时：红色加粗文字渐显 */
.book-card:hover .desc-red {
    opacity: 1;
    pointer-events: auto;

    user-select: text;
    -webkit-user-select: text;
}

/* === 🚀 全局搜索枢纽弹窗 (完美对标 classics) === */
        .library-modal {
            position: fixed; inset: 0; z-index: 3500;
            display: flex; align-items: center; justify-content: center;
            padding: 24px; background-color: rgba(0, 0, 0, 0.55); backdrop-filter: blur(5px);
            opacity: 1; visibility: visible; pointer-events: auto;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }
        .library-modal.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .library-panel {
            width: min(520px, 100%); padding: 42px 40px 38px; position: relative;
            background-color: #FFF5F5; border-left: 7px solid #CC0000; border-radius: 20px;
            text-align: center; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.15); 
        }
        @keyframes libraryModalIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: none; }
        }
        .library-modal:not(.is-hidden) .library-panel { animation: libraryModalIn 0.32s ease-out forwards; }
        .library-close-btn {
            appearance: none; -webkit-appearance: none;
            position: absolute; right: 18px; top: 14px; width: 34px; height: 34px;
            display: inline-flex; align-items: center; justify-content: center;
            border: none; border-radius: 50%; background-color: transparent; color: #CC0000;
            font-size: 24px; font-weight: 900; line-height: 1; cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .library-close-btn:hover { background-color: #CC0000; color: #FFFFFF; }
        .library-title { color: #CC0000; font-size: 30px; font-weight: 900; letter-spacing: 3px; margin-bottom: 28px; }
        .library-star-title {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: calc(100% + 140px); margin-left: -70px; margin-right: -70px; margin-bottom: 28px; line-height: 1;
        }
        .library-star-title::before, .library-star-title::after {
            content: ""; display: block; flex: 1; height: 3px; background-color: #CC0000; border-radius: 999px;
        }
        .library-star-title img { width: 64px; height: 64px; display: block; }
        .library-choice-box { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .library-choice-btn {
            display: flex; align-items: center; justify-content: center; font-family: inherit;

            transition: background-color 0.2s ease, color 0.2s ease;

        .library-choice-btn:hover { background-color: #CC0000; color: #FFFFFF; }

function getBookCategories(book) {
    return Array.isArray(book.category) ? book.category : [book.category];
}

function getBookOrder(book, category, fallbackIndex) {
    if (book.order && book.order[category] !== undefined) {
        return book.order[category];
    }

    return fallbackIndex;
}

function renderBooks() {
    const grid = document.getElementById("booksGrid");

grid.innerHTML = BOOKS.map((book, index) => {
    const categories = getBookCategories(book).join(" ");
    const coverClass = book.longCover ? "book-cover long-title" : "book-cover";
const titleClass = book.extraLongTitle
    ? "book-title book-title-extra-long"
    : book.longTitle
        ? "book-title book-title-long"
        : "book-title";

        const readButtons = book.parts
            ? `
                <div class="btn-read-group">
                    ${book.parts.map(part => `
                        <a href="${part.link}" target="_blank" class="btn-read-part">${part.label}</a>
                    `).join("")}
                </div>
            `
            : `<a href="${book.link}" target="_blank" class="btn-read">阅读</a>`;

        return `
 <div class="book-card" data-category="${categories}" data-index="${index}">
                <div class="${coverClass}">${book.cover}</div>

                <div class="book-info">
                    <div class="${titleClass}">${book.title}</div>
                    <div class="book-author">${book.author}</div>
                    <div class="book-desc">${book.desc}</div>
                    ${readButtons}
                </div>
            </div>
        `;
    }).join("");
}

        function animateBookCard(card) {
            card.classList.remove("card-enter");
            card.offsetHeight;
            card.classList.add("card-enter");

            card.addEventListener("animationend", () => {
                card.classList.remove("card-enter");
            }, { once: true });
        }

function filterBooks(category) {
    const grid = document.getElementById("booksGrid");
    const cards = Array.from(document.querySelectorAll(".book-card"));

    cards.sort((cardA, cardB) => {
        const indexA = Number(cardA.dataset.index);
        const indexB = Number(cardB.dataset.index);

        const bookA = BOOKS[indexA];
        const bookB = BOOKS[indexB];

        const orderA = getBookOrder(bookA, category, indexA);
        const orderB = getBookOrder(bookB, category, indexB);

        return orderA - orderB;
    });

    cards.forEach(card => {
        grid.appendChild(card);

        const cardCategories = card.dataset.category.split(" ");
        const shouldShow = category === "all" || cardCategories.includes(category);

        card.classList.toggle("is-hidden", !shouldShow);

        if (shouldShow) {
            animateBookCard(card);
        }
    });
}

        function initCategories() {
            const buttons = document.querySelectorAll(".category-btn");

            buttons.forEach(button => {
                button.addEventListener("click", function () {
                    buttons.forEach(btn => btn.classList.remove("active"));
                    this.classList.add("active");

                    filterBooks(this.dataset.category);
                });
            });
        }

     function initBookCardHoverEffects() {
    document.querySelectorAll('.book-author').forEach(function(author) {
        if (author.querySelector('.author-red-divider')) return;

        const divider = document.createElement('span');
        divider.className = 'author-red-divider';
        divider.setAttribute('aria-hidden', 'true');

        divider.innerHTML = '<span></span><strong>★</strong><span></span>';

        author.appendChild(divider);
    });

    document.querySelectorAll('.book-desc').forEach(function(desc) {
        if (desc.querySelector('.desc-gray')) return;

        const text = desc.textContent.trim();

        desc.textContent = '';

        const grayText = document.createElement('span');
        grayText.className = 'desc-gray';
        grayText.textContent = text;

        const redText = document.createElement('span');
        redText.className = 'desc-red';
        redText.textContent = text;

        desc.appendChild(grayText);
        desc.appendChild(redText);
    });
}

renderBooks();
initBookCardHoverEffects();
initCategories();

// === 搜索数据库：自动从 BOOKS 生成 ===
function buildLibraryData() {
    return BOOKS.flatMap(book => {
        if (book.parts) {
            return book.parts.map(part => ({
                title: `${book.title}·${part.label}`,
                author: book.author,
                desc: book.desc || "",
                link: part.link
            }));
        }

        return [{
            title: book.title,
            author: book.author,
            desc: book.desc || "",
            link: book.link
        }];
    });
}

const LIBRARY_DATA = buildLibraryData();

const searchModal = document.getElementById("searchModal");
const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");

// === 🚀 搜索分支枢纽控制系统 ===
const searchChoiceModal = document.getElementById('searchChoiceModal');

function toggleSearchChoiceModal(show) {
    if (show) {
        searchChoiceModal.classList.remove('is-hidden');
        searchChoiceModal.setAttribute('aria-hidden', 'false');
    } else {
        searchChoiceModal.classList.add('is-hidden');
        searchChoiceModal.setAttribute('aria-hidden', 'true');
    }
}

function openLiteratureSearch() {
    toggleSearchChoiceModal(false);
    setTimeout(() => { toggleSearchModal(true); }, 250); 
}

searchChoiceModal.addEventListener('click', event => {
    if (event.target === searchChoiceModal) {
        toggleSearchChoiceModal(false);
    }
});

const SEARCH_FADE_DURATION = 250;
let searchCloseTimer = null;
let searchFocusTimer = null;

function toggleSearchModal(show) {
    if (show) {
        clearTimeout(searchCloseTimer);
        clearTimeout(searchFocusTimer);

        searchInput.value = "";
        searchResults.innerHTML = "";
        searchResults.style.display = "none";

        searchModal.style.display = "block";
        searchModal.classList.remove("is-closing");

        // 让浏览器先确认 display:block，再启动 opacity / transform 过渡
        void searchModal.offsetWidth;

        searchModal.classList.add("is-visible");

        searchFocusTimer = setTimeout(() => {
            searchInput.focus();
        }, 280);

    } else {
        clearTimeout(searchCloseTimer);
        clearTimeout(searchFocusTimer);

        searchInput.blur();

        searchModal.classList.remove("is-visible");
        searchModal.classList.add("is-closing");

        searchCloseTimer = setTimeout(() => {
            searchModal.style.display = "none";
            searchModal.classList.remove("is-closing");

            searchInput.value = "";
            searchResults.innerHTML = "";
            searchResults.style.display = "none";
        }, SEARCH_FADE_DURATION);
    }
}

function closeSearch(event) {
    if (event.target.id === "searchModal") {
        toggleSearchModal(false);
    }
}

searchInput.addEventListener("input", function (event) {
    const keyword = event.target.value.trim();

    if (keyword === "") {
        searchResults.style.display = "none";
        searchResults.innerHTML = "";
        return;
    }

    const keywordLower = keyword.toLowerCase();

const matches = LIBRARY_DATA.filter(book => {
    const searchableText = `${book.title} ${book.author}`.toLowerCase();
    return searchableText.includes(keywordLower);
});

    searchResults.style.display = "block";

    if (matches.length > 0) {
        searchResults.innerHTML = matches.map(book => `
            <a href="${book.link}" class="search-item" target="_blank">
                <span class="search-item-title">${book.title}</span>
                <span class="search-item-author">${book.author}</span>
            </a>
        `).join("");
    } else {
        searchResults.innerHTML = `
            <div style="padding: 25px; text-align: center; color: #A80000; font-weight: bold;">
                报告：未侦测到相关文献
            </div>
        `;
    }
});

document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
        if (!searchChoiceModal.classList.contains("is-hidden")) {
            toggleSearchChoiceModal(false);
        }
        if (searchModal.classList.contains("is-visible")) {
            toggleSearchModal(false);
        }
    }
});
