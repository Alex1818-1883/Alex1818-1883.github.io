        /* === 分类按钮 === */
.category-section {
    margin-top: 0;
}

.category-buttons {
    --slider-x: -4px;
    --slider-y: -4px;
    --slider-width: 0px;
    --slider-height: 0px;

    position: relative;

    display: grid;
    grid-template-columns: repeat(6, 1fr);

    width: min(960px, 100%);
margin: 0 auto 52px;

    padding: 5px;

    border: 2px solid #CC0000;
    border-radius: 999px;

    background-color: #FFFFFF;

    overflow: visible;
}

.category-buttons::before {
    content: "";
    position: absolute;

    left: 0;
    top: 0;

    width: var(--slider-width);
    height: var(--slider-height);

    background-color: #CC0000;
    border-radius: 999px;

    opacity: 0;

    transform: translate3d(var(--slider-x), var(--slider-y), 0);
    will-change: transform, opacity;

    transition:
        transform 0.26s ease,
        opacity 0.18s ease;

    z-index: 0;
}

.category-buttons.no-slider-transition::before {
    transition: none !important;
}

.category-buttons.no-slider-transition .category-btn {
    transition: none !important;
}

.category-buttons.has-active::before {
    opacity: 1;
}

.category-btn {
    appearance: none;
    -webkit-appearance: none;

    position: relative;
    z-index: 1;

    height: 46px;

    border: none;
    border-radius: 999px;
    background-color: transparent;
    color: #CC0000;

    font-family: inherit;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 1px;

    cursor: pointer;

    overflow: visible;
    isolation: isolate;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;

    transition:
        color 0.22s ease,
        background-color 0.22s ease;
}

.category-btn::before {
    content: "";
    position: absolute;

    top: -5px;
    bottom: -5px;
    left: -5px;
    right: -5px;

    border-radius: 999px;
    background-color: rgba(204, 0, 0, 0.10);

    opacity: 0;
    pointer-events: none;
    z-index: -1;

    transition: opacity 0.22s ease;
}

.category-btn:hover::before {
    opacity: 1;
}

.category-btn.active::before,
.category-btn.active:hover::before {
    opacity: 0;
}

.category-btn:hover {
    background-color: transparent;
    color: #FF0000;
}

.category-btn.active {
    color: #FFFFFF;
    background-color: transparent;
}

.category-btn.active:hover {
    color: #FFFFFF;
    background-color: transparent;
}

.category-intro {
    width: min(920px, 100%);
    margin: 0 auto 52px;
    padding: 18px 26px;

            border-top: 2px dashed rgba(204, 0, 0, 0.35);

        /* === 卷册目录 === */
.volume-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 18px;
    margin-top: 0;
}

.volume-link {
    position: relative;
    min-height: 104px;
    padding: 18px 16px;

    display: flex;
    flex-direction: column;
    justify-content: center;

    background-color: #FFFFFF;
    border: 2px solid #FFE1E1;
    border-radius: 16px;
    text-decoration: none;
    overflow: hidden;

    transform: none;
    will-change: auto;
    backface-visibility: visible;

    transition:
        border-color 0.28s ease,
        background-color 0.28s ease;
}

        .volume-link::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(204, 0, 0, 0.08), rgba(255, 255, 255, 0));
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.28s ease;
        }

.volume-link:hover {
    border-color: #CC0000;
    background-color: #FFF8F8;
    transform: none;
}

        .volume-link:hover::before {
            opacity: 1;
        }

        .volume-no {
            position: relative;
            z-index: 1;
            color: #CC0000;
            font-size: 21px;

    <script>
        const TOTAL_VOLUMES = 54;

        /*
            你现在说有 53 个 PDF，所以这里先默认第 54 卷为“整理中”。
            如果你缺的不是第 54 卷，比如缺第 27 卷，就改成：
            const DISABLED_VOLUMES = [27];

            如果以后 54 卷齐了，就改成：
            const DISABLED_VOLUMES = [];
        */
        const DISABLED_VOLUMES = [54];

        const BOOK_FOLDER = "books";

        /*
            当前默认文件名：
            books/列宁全集第1卷.pdf
            books/列宁全集第2卷.pdf
            ...
            books/列宁全集第54卷.pdf

            如果你的文件名是：列宁全集 第1卷.pdf
            就改成：
            return `${BOOK_FOLDER}/列宁全集 第${n}卷.pdf`;

            如果你的文件名是：列宁全集[第1卷].pdf
            就改成：
            return `${BOOK_FOLDER}/列宁全集[第${n}卷].pdf`;

            如果你的文件名是：lenin-01.pdf
            就改成：
            return `${BOOK_FOLDER}/lenin-${String(n).padStart(2, "0")}.pdf`;
        */
        function buildFilePath(n) {
            return `${BOOK_FOLDER}/列宁全集第${n}卷.pdf`;
        }

        const CATEGORY_INFO = {
            all: {
                intro: "收录列宁1893至1923年间著作、演说、书信与批注共六十卷，涵盖从早年论战、建党理论、帝国主义批判，到十月革命与苏维埃建设的完整思想历程。",
                range: [1, 54]
            },
            early: {
                intro: "第一至八卷，1893—1904年。批判民粹主义与经济主义，以《俄国资本主义的发展》奠定分析框架，以《怎么办？》确立先锋队建党路线。",
                range: [1, 8]
            },
            party: {
                intro: "第九至十八卷，1905—1913年。横跨1905年革命与斯托雷平反动时期，以《唯物主义和经验批判主义》肃清党内哲学混乱，持续与孟什维主义论战。",
                range: [9, 18]
            },
            war: {
                intro: "第十九至二十九卷，1913—1919年。以《帝国主义论》揭示战争根源，以《四月提纲》扭转策略方向，以《国家与革命》奠定十月革命的理论基础。",
                range: [19, 29]
            },
            state: {
                intro: "第三十至四十卷，1919—1921年。苏维埃政权抵御武装干涉、巩固专政的关键年份，《左派幼稚病》批判极左主义，战时共产主义走向终结。",
                range: [30, 40]
            },
            late: {
                intro: "第四十一至五十三卷，1921—1923年。新经济政策的理论阐发，晚年政治遗嘱对党内官僚主义与大俄罗斯沙文主义的批判，是研究苏联历史走向的第一手文献。",
                range: [41, 54]
            }
        };

        function toChineseNumber(n) {
            const units = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九"];

            if (n === 10) return "十";
            if (n < 10) return units[n];

            if (n < 20) {
                return "十" + units[n % 10];
            }

            const ten = Math.floor(n / 10);
            const one = n % 10;

            if (one === 0) {
                return units[ten] + "十";
            }

            return units[ten] + "十" + units[one];
        }

        function getCategoryForVolume(n) {
            if (n >= 1 && n <= 8) return "early";
            if (n >= 9 && n <= 18) return "party";
            if (n >= 19 && n <= 29) return "war";
            if (n >= 30 && n <= 40) return "state";
            return "late";
        }

        function renderVolumes() {
            const grid = document.getElementById("volumeGrid");
            let html = "";

            for (let i = 1; i <= TOTAL_VOLUMES; i++) {
                const isDisabled = DISABLED_VOLUMES.includes(i);
                const label = `第${toChineseNumber(i)}卷`;
                const href = buildFilePath(i);
                const category = getCategoryForVolume(i);

                if (isDisabled) {
                    html += `
                        <a class="volume-link disabled" data-category="${category}" aria-disabled="true">
                            <span class="volume-no">${label}</span>
                            <span class="volume-meta">PDF </span>
                        </a>
                    `;
                } else {
                    html += `
                        <a href="${href}" target="_blank" class="volume-link" data-category="${category}">
                            <span class="volume-no">${label}</span>
                            <span class="volume-meta">PDF </span>
                        </a>
                    `;
                }
            }

            grid.innerHTML = html;
        }

function moveCategorySlider(button) {
    const group = document.getElementById("categoryButtons");
    const isMobile = window.matchMedia("(max-width: 768px)").matches;

    const extraWidth = isMobile ? 12 : 18;
    const extraHeight = isMobile ? 12 : 18;

    const x = button.offsetLeft - extraWidth / 2;
    const y = button.offsetTop - extraHeight / 2;

    const width = button.offsetWidth + extraWidth;
    const height = button.offsetHeight + extraHeight;

    group.style.setProperty("--slider-x", `${x}px`);
    group.style.setProperty("--slider-y", `${y}px`);
    group.style.setProperty("--slider-width", `${width}px`);
    group.style.setProperty("--slider-height", `${height}px`);
}

        function filterVolumes(category) {
            const cards = document.querySelectorAll(".volume-link");
            const info = CATEGORY_INFO[category];

            document.getElementById("categoryIntro").innerText = info.intro;

            cards.forEach(card => {
                const cardCategory = card.dataset.category;
                const shouldShow = category === "all" || cardCategory === category;

                card.classList.toggle("is-hidden", !shouldShow);
            });
        }

        function initCategories() {
            const group = document.getElementById("categoryButtons");
            const buttons = document.querySelectorAll(".category-btn");

            const activeButton = document.querySelector(".category-btn.active");
            group.classList.add("no-slider-transition");
            group.classList.add("has-active");
            moveCategorySlider(activeButton);

            group.offsetHeight;

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    group.classList.remove("no-slider-transition");
                });
            });

            buttons.forEach(button => {
                button.addEventListener("click", function () {
                    buttons.forEach(btn => btn.classList.remove("active"));
                    this.classList.add("active");

                    group.classList.add("has-active");
                    moveCategorySlider(this);
                    filterVolumes(this.dataset.category);
                });
            });

            window.addEventListener("resize", () => {
                const current = document.querySelector(".category-btn.active");
                if (current) {
                    moveCategorySlider(current);
                }
            });
        }

        renderVolumes();
        initCategories();
    </script>
</body>
</html>
