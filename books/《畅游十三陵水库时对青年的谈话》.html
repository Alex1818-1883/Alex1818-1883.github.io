<p class="title1">畅游十三陵水库时对青年的谈话</p>
<p class="date">（一九六四年六月）</p>
<br>
<br>
　　毛主席问大家：“在七级大风里，你们游过吗？”<br>
<br>
　　“一人高的浪，你们游过吗？”<br>
<br>
　　“游泳是同大自然作斗争的一种运动，你们应该到大江大海去锻炼。”<br>
<br>
　　“这很好，部队要学会游泳。”<br>
<br>
　　“会休息，才会持久。”<br>
<br>
　　“时代不同了，男女都一样，男同志能办到的事情，女同志也能办得到。”<br>
<br>
　　“将来打仗还是要靠两条腿。”<br>
<br>
　　“有许多地方通不过去，看起来只有两只脚有用。”<br>
<br>
